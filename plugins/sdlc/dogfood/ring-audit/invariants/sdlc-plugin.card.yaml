    why_empty: "Packaging / repository hygiene. dos.yaml scope.out_of_scope names plugin packaging; neither escaped defects nor waivers move. The fix is a one-off task → also listed as DW-sdlc-plugin-016."
  - obstacle_ref: "gate.json fix_list ×10: 'classify the inherited phase-map order into the six cells or rewrite as φ/γ (skillwise §3)'"
    why_empty: "Skill-authoring style under the skillwise evaluation frame; dos.yaml scope.out_of_scope: 'the skillwise evaluation tiers of skills'. No lifecycle artifact is checked differently."
  - obstacle_ref: "design-notes.md 第二次整理 #3 (naming: keep imported skill names, name new skills by artifact)"
    why_empty: "Ontology / ubiquitous language — dos-extract's column (dos.yaml anti_patterns[7], [8]; Q001, Q002). Not a correctness or reversibility property of a Run."
  - obstacle_ref: "loop-graph-engineering.md §0 row 2 (loop triggers were bash sleep polling, not L3 event-driven)"
    why_empty: "Operability / latency aspect. Under correctness + reversibility a polling trigger produces the same verdicts, later."
  - obstacle_ref: "loop-graph-engineering.md §6 bullet 5 (vocabulary drift: graph engineering has three meanings)"
    why_empty: "Ontology; handled by the proposal's own §1 definitions and dos.yaml Q002."
  - obstacle_ref: "skill-issues.md I-16 part (routing pseudo-layers exception / g3 / human_attribution / next_outer not on the five-layer ladder)"
