# —— Conflicts (two statements that cannot both be true as written) → legislation ——
conflicts_for_legislation:
  - a: "PSL-003 (plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md): the auditor never touches the audited tree."
    b: "INV-sdlc-plugin-001: a gating verifier may be changed in-run if a deviation Event precedes the Gate and the fix ships as its own commit."
    note: "Two Runs today (ev-0005, ev-0008) needed b; a as written forbids it and would have left the U3 gate blocked by a buggy ruler. Legislation picks: amend PSL-003 with the deviation clause, or keep PSL-003 and route verifier defects to a separate fix Run before the gate re-runs."
  - a: "INV-sdlc-plugin-002: no caller flag or default lowers a verifier's standing hard floor."
    b: "DEF-sdlc-plugin-005: a heuristic reject offers a recorded waiver path (decisions.md entry or --waive reading one)."
    note: "A --waive is a caller lowering a line. Proposed boundary: INV-002 governs calibrated numeric floors (α, mutation score); DEF-005 governs heuristic classifiers (suffix / word lists), and its waiver is a recorded human decision with a name, never a bare flag. Legislation confirms or redraws."
  - a: "dos.yaml agent_guidelines.should[1]: keep imported vocabulary (Territory, Run, MemoryAsset, R001/R002) in the 术语映射 tables, not in state or graph declarations."
    b: "Closure checks (verify_issue.py --dos, lint_cards.py --dos) must resolve every noun a card or issue cites against dos.yaml objects / rules (INV-sdlc-plugin-004 spirit; dos.yaml success_criteria (1))."
    note: "skill-issues.md I-15: the mapped terms live only in prose tables, so closure cannot see them. Either dos.yaml gains synonyms that closure honours, or the 接线 sections declare the terms 不参与闭包."

