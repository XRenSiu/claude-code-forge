# —— Hard invariants (□, not overridable; territory altitude, not R00x; propose-only) ——
hard_invariants:
  - id: INV-sdlc-plugin-001
    statement: "WHILE a Run is open, THE SYSTEM SHALL NOT change the content of any verify_*.py / lint_*.py / validate_*.py under plugins/sdlc/skills/*/scripts whose verdict feeds one of that Run's Gates, UNLESS a deviation Event naming the script is appended before the Gate Event and the fix is committed on its own, outside the Run's diff."
    ears_type: unwanted
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: abductive
    provenance:
      execution_point: "plugins/sdlc/skills/sdlc/scripts/lock_done_when.py:1-24 (the sha256 lock mechanism exists for Contract files; it is not applied to the verifier scripts)"
      obstacle_ref: ".sdlc/sdlc-ring-audit/trace.jsonl#ev-0005 (in-run fix of verify_derived.py, I-04/I-05, blocked U3 gate) and #ev-0008 (in-run fix of verify_issue.py, I-07); both recorded as PSL-003 deviations"
    narrowest_rule_note: "PSL-003 as written ('the auditor never touches the audited tree') is wider: it would have left the U3 gate blocked by a buggy ruler (I-05). 'Never patch a verifier' also kills the legitimate fix. The narrowest rule that prevents a silently self-modified ruler while allowing the fix is: hash-stable during the Run, or a recorded deviation before the gate plus a separate commit. Today's two deviations satisfied the clause by hand; nothing compiles it."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-002
    statement: "THE SYSTEM SHALL NEVER let a caller flag or a default lower a verifier's standing hard floor (today: verify_calibration.py Krippendorff α floor and mutation-score floor); a floor moves only through a human-merged change to the script itself — lines only ratchet tighter."
    ears_type: ubiquitous
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/calibrate/scripts/verify_calibration.py:76,79 (--min-alpha / --min-mutation below the standing hard line → reject)"
      obstacle_ref: "dos.yaml anti_patterns[6] — 2026-06-24 round-1 blocker: HARD_MUTATION_FLOOR absent while the α floor was hard ('lower the line to pass'); closed in round 2"
    narrowest_rule_note: "Not 'no flag may change any threshold' (routing budgets are legitimately proposed by /tune under R016) and not 'floors never change' (calibration evidence may move them). Only: the party being gated cannot move the line downward at call time."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-003
    statement: "WHILE a plugin declaration has more than one writable source (today: the stage list in assets/graph.yaml stages and sdlc_state.py ORDER), THE smoke suite SHALL assert the sources equal and reject on any difference."
    ears_type: state
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/sdlc/scripts/verify_graph.py:197,205 (stages list ≠ --stages / sequential chain ≠ stages → reject); sdlc_state.py graph check"
      obstacle_ref: "dos.yaml anti_patterns[2] (graph in ARCHITECTURE ASCII while ORDER hard-coded; drifted silently); loop-graph-engineering.md §0 row 5 and §6 bullet 2; dos.yaml Q003; skill-issues.md I-16 (docs say 3 gates / 5 agents, graph.yaml has 5 human / 4 agent nodes — the same drift where one side is prose and cannot be asserted)"
    narrowest_rule_note: "Not 'one source only' — that is Q003, a pending human decision; when it is made this rule becomes vacuous, not violated. Not 'docs never drift' — unmeasurable. Only: while two machine-readable sources exist, equality is asserted mechanically on every smoke run."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-004
    statement: "WHEN a plugin declaration or Run artifact references another by id or path (loop_back.loop → loops.yaml; Loop.stop.budget.ref and impossible.reporters → routing.yaml; WorkUnit.dos_slice → dos.yaml objects / rules; Event.refs.target → event id, contract anchor, routing rule, graph node or path; AC.paired_with → AC id), THE verifier SHALL resolve the target and reject a dangling one; matching the reference as a string is not resolution."
    ears_type: event
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/sdlc/scripts/verify_graph.py:155; verify_loop.py:107,123; plugins/sdlc/skills/plan-cards/scripts/lint_cards.py:181,184; plugins/sdlc/skills/sdlc/scripts/trace.py:246,250,259; plugins/sdlc/skills/donewhen-extract/scripts/verify_done_when.py:116,167"
      obstacle_ref: "dos.yaml anti_patterns[6] — 2026-06-24: donewhen-extract paired_with was string-checked, never resolved (纪律②); the fix line is verify_done_when.py:116"
    narrowest_rule_note: "Bound to the enumerated reference kinds the plugin declares today; new reference kinds join the list by amendment. Not 'all names must be in dos.yaml' (that is closure, a plan-cards / issue rule on Run artifacts) — only that a reference that exists resolves."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-005
    statement: "THE SYSTEM SHALL NEVER rewrite pushed history (amend, rebase or force-push of pushed commits) or overwrite an existing tag; a branch behind its base catches up by merge, and a release tag that already exists is a reject."
    ears_type: ubiquitous
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: reversibility
    channel: deductive
    provenance:
      execution_point: "plugins/sdlc/skills/pr/scripts/verify_pr.py:187 (behind origin/base → merge first, no rebase); plugins/sdlc/skills/release/scripts/verify_release.py:146 (tag exists → never overwrite); plugins/sdlc/skills/commit/SKILL.md:34,89 (已推送的永不 amend / rebase / force-push)"
      obstacle_ref: ""
    narrowest_rule_note: "Deductive only: three independent guards declare the same prohibition; no failure has yet been paid for it in this repo. Not 'never rebase' (local, unpushed history is free)."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-006
    statement: "WHEN release notes are verified before tagging, THE SYSTEM SHALL reject notes whose Rollback section carries no concrete `how:` line."
    ears_type: event
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: reversibility
    channel: deductive
    provenance:
      execution_point: "plugins/sdlc/skills/release/scripts/verify_release.py:114"
      obstacle_ref: ""
    narrowest_rule_note: "The reversibility □ of the delivery closing edge: no release without a stated way back. R015 requires release verification to be green before archive but does not name rollback as its content."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-007
    statement: "WHEN a PR body carries a Known issues section, THE SYSTEM SHALL NEVER accept a P0 or A-tier finding listed there; such a finding is fixed before the PR is created."
    ears_type: unwanted
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: deductive
    provenance:
      execution_point: "plugins/sdlc/skills/pr/scripts/verify_pr.py:113 (--pre-review: Known issues carries a P0 / A-tier finding → reject)"
      obstacle_ref: ""
    narrowest_rule_note: "Direct carrier of the kpi 'escaped defects per merged feature'. Not 'Known issues must be empty' (agentpatterns: 2–3 self-review rounds plateau; survivors are legitimately handed to a human) — only that the top tier never ships."
    confidence: high
    disposition: propose
    golden_regression: true

  - id: INV-sdlc-plugin-008
    statement: "WHEN a verifier rejects on a property of an artifact produced by a different Node (today: verify_derived.py rejects a PSL that carries no PSL-NNN rule ids), THAT property SHALL be declared in the producer Node's output contract (its SKILL.md φ) and checked by the producer's own verifier, as a reject or a flag."
    ears_type: event
    survival_test: pass
    strength: hard
    altitude: territory
    aspect: correctness
    channel: abductive
    provenance:
      execution_point: "plugins/sdlc/skills/psl-derive/scripts/verify_derived.py:68 (the downstream reject) versus plugins/sdlc/skills/psl/scripts/verify_psl.py (no PSL-NNN check anywhere — confirmed by grep)"
      obstacle_ref: "skill-issues.md I-02 — /psl PASSed a PSL with no rule ids; /psl-derive rejected the whole derivation on exactly that; neither /psl SKILL.md nor EXAMPLE.md mentions the id convention"
    narrowest_rule_note: "Not 'upstream and downstream verifiers check the same things' — downstream legitimately rejects on properties of its own artifact (a form-draft citing a non-existent PSL id). Only properties OF THE UPSTREAM ARTIFACT that downstream rejects on: an artifact must not be able to pass its own gate and then fail the next on a property it was never told about."
    confidence: high
    disposition: propose
    golden_regression: true

# —— Overridable defaults (authority level named; a task may override inside the guardrail) ——
# `aspect` is added to every entry although the template omits it — verify_card.py rejects entries
# without it (template ↔ verifier mismatch, reported in decisions.md).
overridable_defaults:
  - id: DEF-sdlc-plugin-001
    statement: "WHEN a verify_*.py emits a flag (a non-reject finding) or counts unfilled load-bearing slots (Open Questions / seams) on an artifact that a human Gate will sign, THE Gate record template SHALL carry each as an agenda item naming the decision the signer must make."
    authority_level: "The Gate's human signer may sign without the agenda item if the record states they read the artifact directly; skill authors own the templates (g1_record.md, g3-record.md)."
    aspect: correctness
    survival_test: pass
    strength: overridable
    channel: abductive
    provenance:
      execution_point: ""
      obstacle_ref: "skill-issues.md I-03 (G1 record has no place for seam count — signer cannot see how empty the world is) and I-06 (verify_derived.py flags three unreferenced PSL rules but does not tell G1 whether to delete the rule or add a decision)"
    confidence: high
    disposition: carded

  - id: DEF-sdlc-plugin-002
    statement: "WHEN a skill ships a verifier together with a template or asset that the verifier reads, THE skill's eval fixtures SHALL include at least one passing artifact produced from that template (not a hand-minimal one) and one fixture per declared enum branch the verifier switches on (e.g. track psl | task)."
    authority_level: "Skill author; waivable when the skill has no template or no enum branch, recorded in eval/gate.json fix_list."
    aspect: correctness
    survival_test: pass
    strength: overridable
    channel: abductive
    provenance:
      execution_point: "plugins/sdlc/skills/psl-derive/scripts/verify_derived.py:90-91 (post-fix blockquote skip — the template's own guidance quoted the banned tokens)"
      obstacle_ref: "skill-issues.md I-04 (template tokens counted as named steps), I-05 (greedy regex under re.S emptied the vocabulary; fixture PSL never mentioned 'Domain Model' twice), I-07 (one-line Links parsed as one key; fixture was task-track only, psl branch never ran)"
    confidence: high
    disposition: carded

  - id: DEF-sdlc-plugin-003
    statement: "WHEN a SKILL.md or its references states a criterion as binding (must run before delivery, must not exceed, must include), THE criterion SHALL be compiled — a sdlc_state.py prerequisite, a hook, or a verify_*.py reject / flag — or the sentence SHALL be labelled `declarative (not compiled)` in the same SKILL.md and in eval/gate.json."
    authority_level: "Plugin author; design-notes.md 有意不做的 records the standing waiver for PreToolUse hooks, so labelling is the expected form there."
    aspect: correctness
    survival_test: pass
    strength: overridable
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/sdlc/scripts/sdlc_state.py:250-259 (the g2 prerequisite runs validate_done_when_v2.py — the compiled form of 'the contract must validate')"
      obstacle_ref: "psl/eval/gate.json fix_list[0] ('交付前必须跑 verify_psl.py' is declarative only, judge A round-1 A'-1); commit/eval/gate.json fix_list[1] (red-green evidence is manual, no script); skill-issues.md I-14 (methodology says 300–500 lines, >800 bloat; verify_dos.py has no flag)"
    confidence: high
    disposition: carded

  - id: DEF-sdlc-plugin-004
    statement: "WHEN an Event of kind fail, reflow, waiver, gate or escape is appended, IT SHALL carry at least one decided_by or caused_by edge; edge-less Events are permitted only for kinds init, set, advance and custom `ledger --kind` notes."
    authority_level: "The engine may append edge-less custom notes; any new decision kind added to sdlc_state.py must emit its edge (plugin author, by PR)."
    aspect: reversibility
    survival_test: pass
    strength: overridable
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/sdlc/scripts/sdlc_state.py:370-372 (waiver Event carries decided_by human:waiver); plugins/sdlc/skills/sdlc/scripts/trace.py:224-259 (lint validates edge types and targets — but not presence for decision kinds)"
      obstacle_ref: "dos.yaml anti_patterns[5] (flat ledger: 'why did AC-003 change' was archaeology); loop-graph-engineering.md §0 row 4"
    confidence: high
    disposition: carded

  - id: DEF-sdlc-plugin-005
    statement: "WHEN a verifier hard-rejects on a heuristic classifier (a suffix blacklist, a word list) rather than a structural property, THE verifier SHALL offer a recorded waiver path — a decisions.md waiver entry with a human name, or a --waive that reads one — so the reject can be overridden with provenance instead of by editing the artifact to dodge the heuristic."
    authority_level: "A named human in decisions.md; never a bare flag. Structural rejects (missing required field, dangling reference) carry no waiver."
    aspect: correctness
    survival_test: pass
    strength: overridable
    channel: both
    provenance:
      execution_point: "plugins/sdlc/skills/dos-extract/scripts/verify_dos.py:67 (message says 'exceed only with a human waiver in decisions.md' but the script reads no waiver — exit 1 regardless); verify_dos.py:73 (UI/impl suffix → reject, no whole-word exemption)"
      obstacle_ref: "skill-issues.md I-10 — the canonical object 卡 / Card was renamed WorkUnit in the as-is dos.yaml because the suffix check could not be waived (影响产物: 是); dos.yaml Q001"
    confidence: high
    disposition: carded

