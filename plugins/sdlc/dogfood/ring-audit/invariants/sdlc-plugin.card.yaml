# invariant-extract output — resident-invariant card for Territory "sdlc-plugin" (candidates + proposals)
# Schema: plugins/sdlc/skills/invariant-extract/assets/invariant_card.yaml
# Companion audit trail: decisions.md (same directory)
# This card is NOT a constitution. Every hard invariant is disposition: propose and enters
# Territory.invariants only after a human signs (sdlc R008 / qanat R002). dos.yaml R001–R017 were
# treated as already-legislated and deduplicated against, never re-legislated.
#
# Reading "Run" for a plugin-as-Territory (see decisions.md 运行元信息): a Run is any invocation of
# the sdlc plugin — a delivery Run through the fifteen stages AND a dogfood / self-change of the plugin.
# The failure memory read today is almost entirely of the second kind (the plugin's own verifiers
# misjudging), so the invariants below are mostly about how the plugin's rulers are built and kept.
#
# Provenance line numbers are as of the 2026-09-05T14:20Z working tree. sdlc_state.py was being edited
# by another agent during this run (uncommitted); every citation therefore also carries the grep-able
# message text so it survives line drift.

territory_id: "sdlc-plugin"
dos_ref: "plugins/sdlc/dogfood/ring-audit/dos.yaml"
purpose:
  name: "a self-closing product-engineering lifecycle whose every artifact is either script-checked or human-gated"
  kpi: "escaped defects per merged feature, and waiver count"
  aspect: "correctness + reversibility"
  scope_ref: "plugins/sdlc/dogfood/ring-audit/dos.yaml#scope — in_scope: one Run through fifteen stages, Contract frozen by human Gates, WorkUnits, Layers, append-only Events, declared Nodes and Loops (R2–R8, X2/X3/X4); out_of_scope: PSL/DOS content, GitHub object model, finding/verdict schemas, plugin packaging, skillwise tiers"
extracted_at: "2026-09-05T14:11:47Z"
mode: auto

# Channel 2 (abduction) had real input. The template offers only a count; the breakdown is added
# because 52 of the 84 entries are registrations of unknowns (gate.json fix_list), not violations,
# and a bare integer would overstate the abductive signal.
channel_2_input:
  failure_memory_count: 84
  dry: false
  sources:
    - ref: "plugins/sdlc/dogfood/ring-audit/skill-issues.md"
      entries: 16
      kind: "skill defects found in today's dogfood, I-01..I-16 (snapshot 2026-09-05T14:11:47Z; the file grew from 6 to 16 rows during this run)"
    - ref: ".sdlc/sdlc-ring-audit/trace.jsonl#ev-0005, #ev-0008 (ledger.md deviation rows)"
      entries: 2
      kind: "the auditor patched an audited verifier in-run (verify_derived.py, verify_issue.py) — deviation from PSL-003, recorded"
    - ref: "plugins/sdlc/skills/*/eval/gate.json fix_list (28 files)"
      entries: 52
      kind: "known gaps / false positives; 34 distinct strings; ~20 are the same 'L2 never run' registration"
    - ref: "plugins/sdlc/docs/design-notes.md — 2026-09-05 第二次整理 三类不自洽"
      entries: 3
      kind: "inconsistencies found by reasoning the lifecycle through"
    - ref: "plugins/sdlc/docs/design-notes.md — 2026-09-05 第三次整理 dogfooding 发现"
      entries: 1
      kind: "first graph.yaml caught by its own lint with two unowned cycles"
    - ref: "plugins/sdlc/docs/proposals/loop-graph-engineering.md §0"
      entries: 5
      kind: "five gaps (convergence, trigger, hill-climb, flat ledger, graph-as-ASCII)"
    - ref: "plugins/sdlc/docs/proposals/loop-graph-engineering.md §6"
      entries: 5
      kind: "named risks — not realized failures; used only as corroboration"
  corroboration_read:
    - "git log --oneline -20 (f629e22 feat P1–P4, 4d3057a chore v0.6.0)"
    - "git show --stat f629e22 — what the v0.6.0 commits fixed"

