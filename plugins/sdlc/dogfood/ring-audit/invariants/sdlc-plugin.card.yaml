# —— Layer probe: purpose-independent suspects (flagged, NOT promoted; routed to legislation) ——
# The territory-narrowed form of each is carded above (INV-001, INV-002) so this Territory is
# protected now; the general form below is what a --cross-territory pass would test. SKILL.md does
# not say whether both may coexist — see decisions.md dogfood findings.
constitution_promotion_suspects:
  - statement: "A Run never modifies the evaluator (verifier script, test, benchmark) that gates it, unless a deviation Event precedes the gate and the fix is committed separately."
    why_purpose_independent: "Holds for a correctness Territory (the ruler), a latency Territory (the benchmark harness), a cost Territory (the meter). It is R004 / R014 (generator ≠ verifier; tests locked before implementation) lifted from the delivery Run to the plugin's own scripts — the same rule at one altitude higher."
    routed_to: legislation
  - statement: "A verifier's hard floor is never lowered by the party being gated at call time; lines move only through legislation (a human-merged change)."
    why_purpose_independent: "Model Spec chain of command: the evaluated party cannot redraw the line. True regardless of which aspect the floor measures (α, mutation score, P95, cost cap)."
    routed_to: legislation
