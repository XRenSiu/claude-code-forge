  findings:
    - id: F-1
      tier: A
      file: plugins/sdlc/dogfood/ring-audit/check_anchors.py
      line: 101
      claim: >-
        506 个行号锚点里有 78 个写成不带文件名的裸 `#Lnnn`，ANCHOR 正则匹配不到，
        既不入锁也不校验也不报——静默放过；而 ad13fe0 刚写下的自证「432/432 SAME」读起来像全覆盖。
      mechanism: >-
        ANCHOR 要求锚点自带带扩展名的文件名。审计正文大量使用「先在句中点名文件、
        随后括号里只写行号」的写法：`verify_dos.py --decisions 解析它的 ## Naming waivers 节（#L73-L96）`、
        `降级成 FLAG（#L182-L185）`、`>7 objects 那条拒绝（#L167-L189）`、`（#L980 required）`、
        `恒 exit 0（#L288-L291）`。这些串不进 walk_anchors 的回调，连 UNRESOLVED 都不算，
        problems 里一条不出现。7f4a897 修的是**另一种**写法（冒号式 `file.py:12`，3 处），
        裸 #L 这一类原封未动。
      reproduction: |
        # 覆盖率（在 9a1e93b 上）
        python3 - <<'PY'
        import re
        raw=open('plugins/sdlc/dogfood/ring-audit/audit.yaml',encoding='utf-8').read()
        A=re.compile(r"([A-Za-z0-9_./<>*-]+\.(?:py|sh|yaml|json|md))"
                     r"(?:#L(\d+)(?:([-–])L?(\d+))?|:(\d+)(?:([-–])(\d+))?(?![\d/]))")
        cov=[(m.start(),m.end()) for m in A.finditer(raw)]
        miss=[m for m in re.finditer(r'#L\d+',raw) if not any(s<=m.start()<e for s,e in cov)]
        print("total #L:",len(re.findall(r'#L\d+',raw))," matched:",len(cov)," bare #L missed:",len(miss))
        PY
        # 端到端（镜像树）：给 verify_dos.py 顶部插 3 行，再抹掉该文件唯一那个全限定锚点
        python3 - <<'PY'
        p='plugins/sdlc/skills/dos-extract/scripts/verify_dos.py'
        L=open(p,encoding='utf-8').read().splitlines(keepends=True)
        L[5:5]=["# MUTANT A\n","# MUTANT B\n","# MUTANT C\n"]
        open(p,'w',encoding='utf-8').writelines(L)
        p='plugins/sdlc/dogfood/ring-audit/audit.yaml'
        s=open(p,encoding='utf-8').read()
        open(p,'w',encoding='utf-8').write(
            s.replace('plugins/sdlc/skills/dos-extract/scripts/verify_dos.py#L169','verify_dos.py(REDACTED)'))
        PY
        python3 plugins/sdlc/dogfood/ring-audit/check_anchors.py verify; echo "EXIT=$?"
      evidence: |
        total #L: 506  matched by ANCHOR: 431  bare #L still missed: 78
        check_anchors verify: 431 个行号锚点 · 锁 plugins/sdlc/dogfood/ring-audit/anchors.lock
          SAME        431
        EXIT=0
        # 与此同时 sed -n '182,185p' verify_dos.py 已变成 compound-reject 分支，
        # 而 audit.yaml 仍写 #L182-L185 是「豁免降级成 FLAG」。绿灯，锚点指错。
      fix: >-
        (a) 加一条裸锚点规则 `(?<![\w./-])#L(\d+)(?:[-–]L?(\d+))?`，按同一标量内最近一次出现的
        文件名归属，解析不出记 UNRESOLVED 并计入 exit 1——宁可吵也不要静默；
        (b) verify 汇总行打印「已锁 N / 文件内行号锚点总数 M」，M>N 时明写差额，让覆盖率自己可见；
        (c) 把 run_evidence 的「432/432 SAME」补成「432/506，其余 78 处为裸写形式暂不在保护范围」，
        并写进 gap 的 deletion_test（它现在把 429 当总量，实际 506）。
      why_a_tier: >-
        P-RA-07 一旦落地把 verify 并进 check_audit.py，这 78 处会被一道**不可跳过**的绿灯背书，
        比现在更坏。且 ad13fe0 的提交信息已经准确说出这个失效模式
        （「一份看起来全绿的检查，可能只检了它认得的那部分」），却只应用到 3 处冒号式就停了。

    - id: F-2
      tier: B
      file: plugins/sdlc/dogfood/ring-audit/check_anchors.py
      line: 258
      claim: AMBIGUOUS 是已证实的漂移，却与 SAME 一样 exit 0。
      mechanism: >-
        判定顺序：当前行 sha 对不上 → 全文搜锁住的原文 → 命中 1 处 MOVED、0 处 GONE、≥2 处 AMBIGUOUS。
        走到 AMBIGUOUS 时「当前行号不再指着锁住的那段字」已经成立，不确定的只是它移到哪儿。
        收尾 `return 1 if (stats["MOVED"] or stats["GONE"]) else 0` 把「不能自动改」等同于「没问题」。
      reproduction: |
        # 镜像树 @9a1e93b：把 tune.py#L302 锁住的那行下移一行，并在文件尾复制一份
        python3 - <<'PY'
        p='plugins/sdlc/skills/tune/scripts/tune.py'
        L=open(p,encoding='utf-8').read().splitlines(keepends=True)
        blk=L[301:302]; L=L[:301]+["# pad\n"]+L[301:]+["\n"]+blk
        open(p,'w',encoding='utf-8').writelines(L)
        PY
        python3 plugins/sdlc/dogfood/ring-audit/check_anchors.py verify; echo "EXIT=$?"
      evidence: |
        check_anchors verify: 432 个行号锚点 · 锁 plugins/sdlc/dogfood/ring-audit/anchors.lock
          SAME        430
          AMBIGUOUS   2
          AMBIGUOUS  …/tune.py#L302（tune） — 锁住的原文在当前文件里出现 2 次，机器不替人选
        EXIT=0
        # 另：graph.yaml#L273 在我做的每一组插行变异里都稳定判 AMBIGUOUS，
        # 说明当前文件里已有天然重复块，不是构造出来的边角。
      fix: >-
        AMBIGUOUS 返回 1（或独立退出码 3），文案保持「机器不替人选、不自动改」，--fix 继续只动 MOVED。
        docstring 退出码表同步：现在把 AMBIGUOUS 与 UNLOCKED 并列为 warn，但 UNLOCKED 是「还没锁」，
        AMBIGUOUS 是「锁了且已确认对不上」，两者不同性质，不该同码。

    - id: F-3
      tier: B
      file: plugins/sdlc/skills/review-loop/scripts/pr-poll.sh
      line: 387
      claim: >-
        selfreview 校验器会拒掉 `mergeable: no`——也就是「有 A 档阻塞」这个结论本身——
        并报出「review 块缺 mergeable」这个假错。抬档 R7/agent.pr-reviewer 所倚的正是这条校验器。
      mechanism: >-
        `missing = [k for k in ("target","mergeable") if not r.get(k)]` 用真值判断。
        PyYAML 按 YAML 1.1 把裸 `no` / `off` 解析成 False → falsy → 判为「缺 mergeable」。
        agents/pr-reviewer.md:33 写的取值是 `yes | no (A-tier) | with-warnings (B-tier)`。
        后果两层：报错指向错误方向（字段明明在）；solo 模式下这一轮登记不上，
        最省力的出路是把结论改写成校验器收得下的形态——压力方向朝着更宽松的判词，
        而这正是 I-87 想堵的自证。本文件的 mergeable 之所以写成带引号的 "no (A-tier)"，就是为了绕开它。
      reproduction: |
        for v in 'no' '"no"' 'with-warnings' 'yes' 'off'; do
          printf 'review:\n  target: PR#2\n  mergeable: %s\n  findings:\n    - {tier: A}\n' "$v" > /tmp/m.yaml
          bash plugins/sdlc/skills/review-loop/scripts/pr-poll.sh selfreview 2 /tmp/m.yaml >/dev/null 2>&1
          echo "$v -> $?"
        done
      evidence: |
        no -> 1        # 唯一失败的取值，恰是表示「有阻塞」的那个
        "no" -> 0
        with-warnings -> 0
        yes -> 0       # 恰好 truthy，所以通过
        off -> 1
        # 缓解事实：仓库自己的 pre-review/pr3-round-1.findings.yaml 写的是带引号的
        # `mergeable: "no (A-tier)"`，实测 exit 0。所以这是潜伏陷阱，不是正在发作的故障。
      fix: >-
        改存在性判断：`missing = [k for k in ("target","mergeable") if r.get(k) in (None, "")]`
        （必要时对 bool 单独归一）。并把这条缺陷记进 R7/agent.pr-reviewer 的 not_reached ——
        重审的 reaudit_note 逐条列举了这个校验器的拒绝路径当作承重证据，唯独漏了这一条。

