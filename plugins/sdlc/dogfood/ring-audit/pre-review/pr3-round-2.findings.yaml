        实际 gap id 集差是新增 7、移除 0，73+7=80——total_after 对，closed 与它并列就不对。
        closed:1 指 R1/lifecycle_blank/control/dos-proposal-reconcile（reaudit_note 写「已填」），
        但它仍留在 gaps[] 里（disposition: issue，编排半边未完）。closed 是判断词，
        被排版成计数项。首审时是 closed:1/added:6/79（73-1+6=78≠79），同一处偏移已跟着走了一轮。
      reproduction: |
        python3 -c "
        import yaml;d=yaml.safe_load(open('plugins/sdlc/dogfood/ring-audit/audit.yaml',encoding='utf-8'))
        print('len(gaps)=',len(d['gaps']))"
        grep -n 'gaps: {closed' plugins/sdlc/dogfood/ring-audit/audit.yaml
        grep -n '^| 缺口 ' plugins/sdlc/dogfood/ring-audit/AUDIT.md
      evidence: |
        len(gaps)= 80
        3799:    gaps: {closed: 1, added: 7, total_before: 73, total_after: 80, note: '六条来自四份 delta…'}
        999:| 缺口 | 73 → **80**（闭合 1，新增 7） |
        # 首审时同一处：closed: 1, added: 6, total_after: 79
      fix: >-
        closed 改 0，把「dos-proposal-reconcile 的机械半边已填、缺口因编排半边保留」并进 gaps.note；
        或保留 closed:1 但改写为「新增 7（另有 1 条判为已填、因编排半边未完仍在表内）」。
        倾向前者——让表里每个数都能从 audit.yaml 现算得出，与本文件其余部分的纪律一致。

