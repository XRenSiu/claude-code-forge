# =============================================================================
# Artifact：一条 = 一个 (产物, 生产者) 对
# checked_by 是**机械视图**——写在这里的必须是真会拒绝的脚本或真有输入前置的门。
# 设计上"应该被 G3 复核"的那一层写在 gates[] 里，两者不一致本身是 gap
# R6/newly_identified/control/g3-pass-has-no-input-precondition。
# =============================================================================
artifacts:
- {id: ratchet-log/iteration-NNN/**, producer: acceptance-fleet, checked_by: []}
- {id: ratchet-log/iteration-NNN/final-state.json, producer: acceptance-fleet, checked_by: []}
- {id: ratchet-log/iteration-NNN/code-review-*.yaml, producer: code-reviewer, checked_by: []}
- {id: ratchet-log/iteration-NNN/qa-review.yaml, producer: qa-reviewer, checked_by: []}
- {id: ratchet-log/iteration-NNN/pm-review.yaml, producer: pm-reviewer, checked_by: []}
- {id: ratchet-log/iteration-NNN/drift.yaml, producer: spec-drift-detector, checked_by: []}
- {id: ratchet-log/iteration-NNN/gaming.yaml, producer: spec-gaming-detector, checked_by: []}
- {id: ratchet-log/iteration-NNN/final-verdict.yaml, producer: meta-judge, checked_by: []}
- {id: .sdlc/review/*.yaml, producer: pr-review, checked_by: [post_review.py]}
- {id: 'github:review', producer: pr-review, checked_by: [post_review.py]}
- {id: g3-record.md, producer: human_gate.G3, checked_by: []}
- {id: triage.yaml, producer: agent.review-triager, checked_by: []}
- {id: verify.yaml, producer: agent.fix-verifier, checked_by: []}

# =============================================================================
# Gate：设计视图——门谁签、闸谁跑
# 人门只有 G1 / G2 / G3；merge 与 harness-review 是 human_gate 类的 Part，不写在这里。
# script 类的 label 只能是「闸」：代签不得渲染为人签（PSL-006）。
# =============================================================================
gates:
- id: G3
  kind: human
  label: 门
  checks: [ratchet-log/iteration-NNN/final-state.json]
  note: '这是设计视图。机械上 cmd_gate 对 G3 pass 不检任何输入（sdlc_state.py#L384-L392 只给 G1/G2 写了前置），所以 artifacts[] 里 final-state.json 的 checked_by 是空的——两张视图的差就是 gap R6/newly_identified/control/g3-pass-has-no-input-precondition。'
- id: post_review.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/pr-review/scripts/post_review.py
  load_bearing: true
  note: '真会拒绝：APPROVE 事件退 1（#L79，approval is a human act）、P0/P1 缺 reproduction_scenario 或 suggested_change 退 1（#L97）、未知档位退 1。是 R6 唯一一条承重的脚本闸。'
- id: compute_confidence.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/meta-judge/scripts/compute_confidence.py
  load_bearing: false
  note: '登记为闸是形状，不是承重：它是确定性加权原语，把 sources 折成一个 confidence 数，除 IO / JSON 解析错误外没有非零退出路径，不拒绝任何输入。据此 meta-judge 的 implemented 停在 declared 而不是 compiled。'
- id: compute_score.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/spec-gaming-detector/scripts/compute_score.py
  load_bearing: false
  note: '同上：算 gaming_risk_score 并打印，阈值判断留给消费者（脚本自己的收尾行：thresholds ≥7 = GAMING_RISK are the consumer''s call）。不拒绝任何输入，故 spec-gaming-detector 的 implemented 停在 declared。'

# =============================================================================
# Proposal：只能从一个已识别的 Gap 或 Assessment 长出来（DP-2）
# =============================================================================
proposals:
- id: P-R6-01
  source: R6/newly_identified/control/g3-pass-has-no-input-precondition
  destination: new_issue
  text: '给 cmd_gate 的 G3 pass 补输入前置，与 G1 / G2 对齐：pass 前要求 acceptance.evaluation_result 指向一个存在的文件（或显式 skipped_reason），reject / waived 要求 pending.failure_report 存在。现状是三道门里唯一一道盖章不看纸的门。'
- id: P-R6-02
  source: R6/lifecycle_blank/capability+control/meets-done-when-compare-script
  destination: new_issue
  text: '补 meets_done_when 比对脚本（ARCHITECTURE §7 L7 行与 lifecycle.md 制品映射表都把它记为空白）：读 done_when.yaml 的 thresholds 与本轮实测数字并排比，退出码即结论，写进 final-state.json。在它落地前，R6 的"达标"只有自然语言形态。'
- id: P-R6-03
  source: R6/unenforced_rule/control/evaluator-may-declare-meets-done-when
  destination: new_issue
  text: '把 acceptance.meets_done_when 移出 sdlc_state.py 的 SETTABLE 白名单（#L67），改为只能由 P-R6-02 那个比对脚本写入。否则即便脚本落地，任何 agent 仍可一句 set 直接宣布达标——dos.yaml R010 的 not_enforced 说的就是这个。'
- id: P-R6-04
  source: R6/newly_identified/control/ratchet-log-shape-unchecked
  destination: new_issue
  text: 'advance pr 对 acceptance.evaluation_result 补 os.path.isfile（对齐同文件 #L262 对 lock.path 的写法），并加一个 verify_ratchet_log.py 按 ratchet-log-format.md 检目录形状。现状是一个指向不存在路径的字符串就能把流水线放行到 merge。'
- id: P-R6-05
  source: A-meta-judge
  destination: skill_fix_list
  text: 'meta-judge 的产物有两个名字：graph.yaml#L189 写 final-verdict.yaml，SKILL.md 的 --output 默认值（#L75）与 M5 步（#L87）、ratchet-log-format.md#L39 与 acceptance-fleet SKILL.md#L157/#L254 都写 meta-judge-output.yaml；连 SKILL.md 内部都不一致（description 与 M0 播报说 final-verdict.yaml）。定一个名并全线改齐。附注：meta-judge 节点没有 loop 键，而它是 acceptance_ratchet 的 verifier 兼 loop_back 源，环归属只能从边反推——顺带补上。'
- id: P-R6-06
  source: A-acceptance-fleet
  destination: skill_fix_list
  text: '五个评审者的产物路径两处不一致：graph.yaml#L179-L183 写扁平的 ratchet-log/iteration-NNN/{code-review-*,qa-review,pm-review,drift,gaming}.yaml，acceptance-fleet SKILL.md#L122 与 #L237-L256、ratchet-log-format.md#L39 写 ratchet-log/iteration-NNN/fleet-outputs/{code-reviewer-security,qa-reviewer,pm-reviewer,spec-drift-detector,spec-gaming-detector}.yaml——目录层级与文件基名都不同。任何按 graph.yaml 找文件的下游都会扑空。'
- id: P-R6-07
  source: A-fix-verifier
  destination: new_issue
  text: '收编即改名与 PSL-014「收编保留上游名」的分歧：design-notes#L56-L57 记的这批 agent 里 quality-sentinel → fix-verifier、issue-fixer → comment-fixer、code-reviewer → pr-reviewer 三处都改了名，而同一份文档 #L70 的命名规则只说"保留导入 skill 的原名"。要么把规则改成"skill 保留上游名、agent 按产物重命名"，要么把这三处记成显式例外。不改名（新名更贴合），改的是规则的说法。'
- id: P-R6-08
  source: A-code-reviewer
  destination: skill_fix_list
  text: 'code-reviewer 的 gate.json residual 自述"overlaps /pr-review"，而 pr-review 正是它的改编（design-notes#L50-L51）。两个配件读同一种输入（diff）、出同一种产物（发现列表），只是一个进 ratchet-log 一个进 .sdlc/review。写清边界：谁在 fleet 里跑、谁给单 PR 手审用，或者合并成一个带模式开关的配件。'
- id: P-R6-09
  source: R6/unenforced_rule/control/one-artifact-one-producer-in-ratchet-log
  destination: new_issue
  text: '给 verify_graph.py 加一条 lint：skill / agent 节点的 writes 之间不得相互包含。现有 lint ①（#L131-L139）只挡裸 ** / * / / / .，挡不住 ratchet-log/iteration-NNN/** 覆盖同目录下六个具体文件这种包含关系——dos.yaml R001 的 user_workflow 就落在这个缺口上。'
- id: P-R6-10
  source: A-review-triager
  destination: new_issue
  text: 'plugins/sdlc/agents/ 下的五个 agent 都只有 .md 提示，没有 eval/gate.json——每个 skill 都有的证据档位纪律（tier / evaluated_layers / gate_pass / fix_list）整体不覆盖 agent。至少给每个 agent 补一份 gate.json 记它停在哪一档，否则 dos.yaml R017「有效性主张不得超过证据档位」对这一半配件没有落点。'
- id: P-R6-11
  source: R6/unenforced_rule/control/gate-signer-must-be-human
  destination: new_issue
  text: 'cmd_gate 收 signer_kind = delegated_agent 只要带一句 --authorization 自由文本（sdlc_state.py#L394-L395），没有任何一处核对授权是否真来自人。要么把 authorization 收成一个引用（指向一份人写的授权记录文件并检存在），要么让 G3 只接受 signer_kind = human。dos.yaml R008 现在是 user_workflow。'
