# audit.yaml 片段 — Ring R6 验收（CARD-04）
#
# 形状见 ../audit.schema.md（CARD-01 产物）。本片段只含 rings[R6] 与它牵出的
# gaps / artifacts / gates / proposals；run_evidence 由 CARD-06 装配时填，本文件不写。
#
# 证据源（只读）：
#   plugins/sdlc/skills/sdlc/assets/{graph,loops}.yaml
#   plugins/sdlc/docs/{ARCHITECTURE.md,lifecycle.md,design-notes.md}
#   plugins/sdlc/skills/{acceptance-fleet,code-reviewer,qa-reviewer,pm-reviewer,
#                        spec-drift-detector,spec-gaming-detector,meta-judge,pr-review}/**
#   plugins/sdlc/agents/{review-triager,fix-verifier}.md
#   plugins/sdlc/skills/sdlc/scripts/sdlc_state.py（门与阶段前置的唯一执行处）
#   plugins/sdlc/dogfood/ring-audit/dos.yaml（enforced_by 列）
#
# 自检：
#   python3 plugins/sdlc/dogfood/ring-audit/check_audit.py \
#     plugins/sdlc/dogfood/ring-audit/audit/rings-R6.yaml \
#     --psl plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md --rings R6 \
#     --required-parts "acceptance-fleet, code-reviewer, qa-reviewer, pm-reviewer, spec-drift-detector, spec-gaming-detector, meta-judge, pr-review, human_gate.G3"

schema: audit/1
feature: sdlc-ring-audit
psl: PSL-sdlc-ring-audit.md
check: check_audit.py

rings:
- id: R6
  question: 三档验收，谁一票否决
  parts:

  # ---------------------------------------------------------------- 编排者
  - id: acceptance-fleet
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L171-L178
    provenance: adopted
    loop: loops.yaml#acceptance_ratchet
    loop_reason: 'acceptance_ratchet 的 loop_back 端点：接 meta-judge 的 iteration_complete 回交（graph.yaml#L339），并按四态向 stage.implement / stage.contract 发回流（graph.yaml#L340-L342）。它本身既不是该环的 generator（implement，loops.yaml#L58）也不是 verifier（meta-judge，loops.yaml#L59）——但它是另一个环 card_retry 的 verifier（loops.yaml#L25），两个身份同时成立。'
    artifact: ratchet-log/iteration-NNN/final-state.json
    role: orchestrator
    gates: [G3]
    fills:
    - R6/newly_identified/control+judgment/six-evaluator-dispatch-and-ratchet
    assessment:
      id: A-acceptance-fleet
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003, PSL-011]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/acceptance-fleet/SKILL.md#L68}
        - {kind: file, ref: plugins/sdlc/skills/acceptance-fleet/references/evaluation-isolation-levels.md}
        - {kind: file, ref: plugins/sdlc/skills/sdlc/assets/graph.yaml#L337-L343}
        deletion_test: '撤掉后没有任何配件把六份评审输出收成一次可对比的迭代并落盘。引擎会在实现它的同一个 session 里自问自答跑完"验收"，产出一段口头结论：ratchet-log/iteration-NNN/ 不存在，于是 acceptance.evaluation_result 指不到文件，四态（FIX / SPEC_DRIFT / GAMING_RISK / NEEDS_HUMAN）塌缩成一句"再改改"——契约层的错被当成实现层的错发回去重写代码。更具体的漏检：没有 impl-diff.patch 与上一轮快照，spec-gaming-detector 的 diff 模式（"实现者看过上一轮评审后才改的那一处"，它自述置信度最高的模式）永久失效。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/acceptance-fleet/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/acceptance-fleet/eval/gate.json#scripts_run（空对象）'}
        - {kind: file, ref: plugins/sdlc/skills/sdlc/scripts/sdlc_state.py#L271-L273}
        not_reached:
          compiled: '无 verify 脚本检 ratchet-log/iteration-NNN/ 的形状（skills/acceptance-fleet/ 下无 scripts/）。唯一沾边的机械前置是 sdlc_state.py#L271-L273 的 advance pr，它只要求 acceptance.evaluation_result 是个非空串——与 lock.path 不同，没有 os.path.isfile（对比 sdlc_state.py#L262），指向不存在的路径也放行。G3 的 pass 也不检任何输入（sdlc_state.py#L384-L392 只给 G1/G2 写了输入前置）。'
          verified: 'gate.json evaluated_layers 只有 structural，scripts_run 为空，provenance 自述 NOT a decorrelated read, NOT an L2 run；本次审计也没有在真实 specs/<feature>/ 上跑过它。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/（final-state.json 是它的收口文件）
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        - {kind: file, ref: plugins/sdlc/skills/acceptance-fleet/SKILL.md#L1-L20}
        rename_reason: '保留 done-when-pipeline v1.1.0 的上游名，符合 PSL-014「收编保留上游名」；名字指的是"一队评审者"，与它 v1.0.0 重构后"只调度不评审"的职责仍然贴合。'
      disposition: issue
      adjudications: []

  # ---------------------------------------------------------------- 五个并行评审者
  - id: code-reviewer
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L179
    provenance: adopted
    loop: null
    loop_note: 'graph.yaml 节点未带 loop 键；它经 fan_out / fan_in 参与 acceptance_ratchet 的一次迭代（graph.yaml#L337-L338），不是回边端点，故按 PSL-011「不要求每个配件属于某个环」不强行归环。'
    artifact: ratchet-log/iteration-NNN/code-review-*.yaml
    gates: []
    fills:
    - R6/newly_identified/judgment/diff-bug-findings-with-reproduction
    assessment:
      id: A-code-reviewer
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/code-reviewer/SKILL.md#L1-L20}
        - {kind: file, ref: plugins/sdlc/skills/code-reviewer/references/finding-schema.yaml}
        - {kind: file, ref: plugins/sdlc/skills/sdlc/assets/graph.yaml#L179}
        deletion_test: '撤掉后 diff 层的缺陷只剩 qa-reviewer 的"测试红不红"。测试没覆盖到的路径——没有断言的分支、错误处理、并发窗口、被吞掉的异常——不再有人读，ARCHITECTURE §3.5 A 档里"有复现的缺陷"那一栏结构性地永远为空，一个可复现的空指针能带着全绿测试合入。同时失去按 focus 并行的多次独立读（security / logic / perf 各一遍），单次"全都看一眼"的读法把同源盲区留在原地。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/code-reviewer/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/code-reviewer/eval/gate.json#residual=no bundled script'}
        not_reached:
          compiled: 'skills/code-reviewer/ 下无 scripts/ 目录；输出 code-review-*.yaml 的形状（references/finding-schema.yaml）无任何脚本校验，也不被门挡——它经 meta-judge 汇入 final-verdict.yaml，而 G3 的 pass 不检任何输入。'
          verified: 'gate.json evaluated_layers 只有 structural，provenance 自述 NOT an L2 run；无行为层运行记录。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/code-review-*.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/code-reviewer/eval/gate.json#residual=overlaps /pr-review'}
        rename_reason: '保留上游名（PSL-014）。但 gate.json 的 residual 自述"overlaps /pr-review"：同一个仓库里有两个读 diff 出发现的配件，判据几乎同源（pr-review 是它的改编，design-notes#L50-L51）。这不是命名不贴合，是两个配件的边界待裁——记入提案 P-R6-08，不改名。'
      disposition: issue
      adjudications: []

  - id: qa-reviewer
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L180
    provenance: adopted
    loop: null
    loop_note: '同 code-reviewer：fan_out / fan_in 成员（graph.yaml#L337-L338），非回边端点。它另被 loops.yaml#L22 记为 card_retry 的 goal 检查处之一。'
    artifact: ratchet-log/iteration-NNN/qa-review.yaml
    gates: []
    fills:
    - R6/newly_identified/capability+judgment/test-execution-and-failure-classification
    assessment:
      id: A-qa-reviewer
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-010]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/qa-reviewer/SKILL.md#L1-L20}
        - {kind: file, ref: plugins/sdlc/skills/qa-reviewer/references/maintenance-vs-genuine.md}
        - {kind: file, ref: plugins/sdlc/skills/qa-reviewer/references/test-layer-protocol.md}
        deletion_test: '撤掉后没有配件真的去执行测试：引擎读一遍测试文件然后声称"这些应该会过"，用 LLM 的阅读取代进程的退出码——这正是 PSL-010「静态过审 ≠ 有效」点名的那次替换。具体错误产物：一份 qa-review.yaml 里写着 go，而套件从未运行；失败分类（测试自己腐烂 vs 代码真错）消失，一条改了断言的旧测试与一个真 bug 不可分辨；mutation 一栏空着，行覆盖率成为唯一且可刷的指标。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/qa-reviewer/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/qa-reviewer/eval/gate.json#residual=no bundled script'}
        not_reached:
          compiled: 'skills/qa-reviewer/ 下无 scripts/；它自己"真跑测试"这条铁律没有任何脚本兜底——没有一个执行器包装（thresholds 比对、退出码采集）可以证明套件确实跑过。qa-review.yaml 无脚本校验，不被门挡。'
          verified: 'gate.json evaluated_layers 只有 structural，scripts_run 为空；无行为层运行记录。这一条尤其刺眼：一个以"真跑"为定义性差异的配件，自身停在静态过审。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/qa-review.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        rename_reason: 保留上游名（PSL-014）；qa 与它的产物 qa-review.yaml 同词干，按 F-03 判 fits。
      disposition: issue
      adjudications: []

  - id: pm-reviewer
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L181
    provenance: adopted
    loop: null
    loop_note: 同 code-reviewer：fan_out / fan_in 成员（graph.yaml#L337-L338），非回边端点。
    artifact: ratchet-log/iteration-NNN/pm-review.yaml
    gates: []
    fills:
    - R6/newly_identified/judgment/per-requirement-compliance-verdict
    assessment:
      id: A-pm-reviewer
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/pm-reviewer/SKILL.md#L1-L22}
        - {kind: file, ref: plugins/sdlc/skills/pm-reviewer/references/requirement-normalization.md}
        - {kind: file, ref: plugins/sdlc/skills/pm-reviewer/references/agent-as-judge-protocol.md}
        deletion_test: '撤掉后没有配件逐条把 REQ 对回代码。验收退化成"测试绿即合规"，于是契约里没被写成测试的 SHALL 条款——尤其那些只能由人判的 UI/UX 意图——无人认领：pm-review.yaml 里的 requires_human_verification 清单不存在，ARCHITECTURE §3.5 C 档"请求人工"的输入为空，G3 拿到的是一份没有待人判条目的报告，于是签得很轻松。REQ 覆盖率这个 A 档检查项失去数据源。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/pm-reviewer/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/pm-reviewer/eval/gate.json#residual=no bundled script'}
        not_reached:
          compiled: 'skills/pm-reviewer/ 下无 scripts/；四态判决（fully / partially / not_compliant / requires_human_verification）与 REQ 覆盖率都无脚本核对，pm-review.yaml 不被门挡。'
          verified: 'gate.json evaluated_layers 只有 structural，scripts_run 为空；无行为层运行记录。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/pm-review.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        rename_reason: 保留上游名（PSL-014）；pm 与产物 pm-review.yaml 同词干，按 F-03 判 fits。
      disposition: none
      adjudications: []

  - id: spec-drift-detector
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L182
    provenance: adopted
    loop: null
    loop_note: 同 code-reviewer：fan_out / fan_in 成员（graph.yaml#L337-L338），非回边端点。
    artifact: ratchet-log/iteration-NNN/drift.yaml
    gates: []
    fills:
    - R6/newly_identified/knowledge+judgment/spec-code-divergence-archaeology
    assessment:
      id: A-spec-drift-detector
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-008]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/spec-drift-detector/SKILL.md#L1-L19}
        - {kind: file, ref: plugins/sdlc/skills/spec-drift-detector/references/divergence-types.md}
        - {kind: file, ref: plugins/sdlc/skills/sdlc/assets/graph.yaml#L341}
        deletion_test: '撤掉后 spec 与代码的分叉只会在下一次有人读文档时偶然发现。没有配件回答"它们何时分的岔、那个 commit 看起来是有意的吗"，于是四态里的 SPEC_DRIFT 永远不会被触发——graph.yaml#L341 那条 acceptance-fleet → stage.contract 的回边成为死边。后果不是少一份报告，是回流全部落到 card / plan 层（改代码），而真正该改的是契约：世界层与契约层的错在实现层被反复重试，正是 routing.yaml 存在要防的那件事。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/spec-drift-detector/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/spec-drift-detector/eval/gate.json#residual=no bundled script'}
        not_reached:
          compiled: 'skills/spec-drift-detector/ 下无 scripts/；git archaeology 全靠提示里的 git log / blame / show 约定，没有脚本固定它，drift.yaml 不被脚本校验也不被门挡。'
          verified: 'gate.json evaluated_layers 只有 structural，scripts_run 为空；无行为层运行记录。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/drift.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        - {kind: file, ref: plugins/sdlc/docs/lifecycle.md#L62}
        rename_reason: '保留上游名（PSL-014）。lifecycle.md#L62 记了一个同名不同层的对照：spec-drift（任务层）vs ontology-drift（本体层，空白）——名字带 spec- 前缀恰好把这条层次差别标出来了，判 fits。'
      disposition: none
      adjudications: []

  - id: spec-gaming-detector
    kind: skill
    ring: R6
    ring_evidence: plugins/sdlc/skills/sdlc/assets/graph.yaml#L183
    provenance: adopted
    loop: null
    loop_note: 同 code-reviewer：fan_out / fan_in 成员（graph.yaml#L337-L338），非回边端点。
    artifact: ratchet-log/iteration-NNN/gaming.yaml
    gates: [compute_score.py]
    fills:
