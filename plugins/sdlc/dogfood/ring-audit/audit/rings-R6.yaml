    assessment:
      id: A-spec-gaming-detector
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003, PSL-010]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/spec-gaming-detector/SKILL.md#L1-L21}
        - {kind: file, ref: plugins/sdlc/skills/spec-gaming-detector/references/rhd-patterns.md}
        - {kind: file, ref: plugins/sdlc/skills/spec-gaming-detector/references/diff-mode-protocol.md}
        deletion_test: '撤掉后没有配件以"作者在作弊"为默认假设读产物——其余五个评审者的默认假设都是"作者在努力做对"。于是这几类产物会以 A 档全绿的形态通过：把测试断言改松让它变绿、只对着测试用例硬编码期望值的分支、为覆盖率写的空断言测试。更远的后果在契约侧：gaming.yaml 的 spec_robustness_gaps 段不再回流给契约作者，下一轮 done_when.yaml 仍然同样好骗，四态里的 GAMING_RISK 从状态机里消失。'
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: plugins/sdlc/skills/spec-gaming-detector/eval/gate.json#gate_pass=static_only}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/spec-gaming-detector/eval/gate.json#scripts_run.compute_score.py'}
        - {kind: file, ref: plugins/sdlc/skills/spec-gaming-detector/scripts/compute_score.py#L68-L101}
        not_reached:
          compiled: 'scripts/compute_score.py 存在，但它是确定性计算原语，不是 verify 脚本：它把 severity 折成一个 0-10 的分数并打印，除 IO / JSON 解析错误外没有任何非零退出路径，也不拒绝任何输入——它自己的收尾行写着"thresholds（≥7 = GAMING_RISK）are the consumer''s call"。判据在消费者手里，脚本不承重，所以不构成 PSL-010 意义上的"有 verify 脚本"。gaming.yaml 也不被门挡。'
          verified: 'gate.json evaluated_layers 只有 structural，provenance 自述 NOT an L2 run；scripts_run 记录的是 compute_score.py 在 fixture 上的一次算术演练（P0+P1+P3 → 5.5），那是原语的行为层证据，不是配件的。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: ratchet-log/iteration-NNN/gaming.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: plugins/sdlc/docs/design-notes.md#L39-L42}
        rename_reason: 保留上游名（PSL-014）；gaming 与产物 gaming.yaml 同词干，判 fits。
      disposition: issue
      adjudications: []

  # ---------------------------------------------------------------- 合成者
