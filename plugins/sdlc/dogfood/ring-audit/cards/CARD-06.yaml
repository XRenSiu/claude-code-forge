notes: '上下文自包含：只读 (1) 本卡；(2) sdlc_state.py show 的摘要；(3) 本卡 ac_ids 对应的 AC（done_when.yaml 只读）；(4) 形态草案 derived/form-draft.md（签字版 746c56ef…；F-13/F-17 是检查脚本接口，F-01…F-09 是记录形状）；(5) PSL-sdlc-ring-audit.md 的 Domain
  Model / 规律索引；(6) allowed_files 内源码。不得读：ratchet-log/**、spec-robustness、评审 skill 的提示、其他卡、.sdlc/ 账本里评审者的发现。 交付：(1) audit.yaml = 四个片段的合并（rings 顺序 R0..R8, spine），顶层加 artifacts[]（每个 Artifact 一条 producer + alternatives_of?
  + checked_by[]）、gates[]（G1/G2/G3 三道 kind=human 设计视图 + 片段汇总的 script 闸；signer 三元组不在这里——见下方规则 3，写进 run_evidence.gates[]：G1/G2 的 signer 与授权从 g1-record.md / g2-record.md / .done_when.lock 抄，G3 本次未发生写 verdict pending 且三元组 null）、proposals[]（{id, source: Assessment-id | Gap-id, destination: skill_fix_list|new_issue|no_action, text}，无 source 不许有；naming misfit 的 disposition 只能 issue|none）、run_evidence{run:
  {slug: sdlc-ring-audit, state: .sdlc/sdlc-ring-audit/state.json, ledger: .sdlc/sdlc-ring-audit/ledger.md}, gates: [...], external_evidence: {kind: substitute, what: ''check-audit 机械检查 + 代签 agent 独立读'',
  valid_for: ''this dogfood only''}, check_runs: [{cmd, exit} 对完整 audit.yaml exit 0；{cmd --variant delete-ring:R6, exit 1}——缺变体记录则标 uncalibrated], skill_issues: plugins/sdlc/dogfood/ring-audit/skill-issues.md,
  audited_dirs_diff: ''git diff --stat 对 plugins/sdlc/skills agents docs 只看 Card 提交 → 为空''}。(2) render_audit.py audit.yaml → AUDIT.md：按 Ring 分节（R0..R8 + spine），每环一表、每 Part 一行、三列（needed / implemented / naming），PSL-ID
  做脚注不挤格内；表末尾 missing 行标''（缺少）''带来源标签；implemented 只出现三态之一；script Gate 渲染''闸''，human 渲染''门''，delegated_agent 不渲染为''人签''；末尾 proposals 分组视图 + run_evidence 节；页首写 audit.yaml 与 check_audit.py 路径。(3) 自检：check_audit.py
  audit.yaml --psl PSL --required-parts ''agent.card-implementer, agent.comment-fixer, agent.fix-verifier, agent.pr-reviewer, agent.review-triager'' exit 0 且 parts_total 42；--variant delete-ring:R6 exit
  1；两次输出写进 run_evidence。AC-005-a / AC-006-a 是 human AC，由 G3 代签裁决，本卡只保证报告呈现其 statement 要求的内容。不得修改被审目录任何文件。　G1 签字版解释规则（2026-09-05，g1-record.md ## 签字版解释规则）覆盖本卡以下读法，以规则与 audit.schema.md 为准：(规则 1) 同一 Artifact 的双生产者若无 alternatives_of，则每个生产者的 needed.verdict 必须是 merge_candidate 并写 merge_candidate_with；不是双生产者的 Part 不得标 merge_candidate（spurious_merge_candidate）。(规则 2) 顶层 gaps[] 注册表每项 {id: <ring>/<source>/<atoms>/<slug>, ring, atoms, source, necessity, deletion_test, evidence[], disposition}；parts[].fills[] 与 rings[].missing[] 只放 gap id（同环）；fills == [] 的 Part 其 needed.verdict 必须是 overfill；无人填的 Gap 必在其环 missing[]。(规则 3) 顶层 gates[] 里 kind=human 的只有 G1/G2/G3；merge / harness-review 是 kind=human_gate 的 Part，不进 gates[]、不带 exercised；signer/signer_kind/authorization_ref 三元组不在 gates[]，随判决落在 run_evidence.gates[]（verdict ∈ pending|pass|reject|waived；非 pending 必有 signer 与 signer_kind；delegated_agent 必有 authorization_ref）。片段的 Part.gates 只写检该 Part 产物的 Gate id（脚本闸 = verify 脚本文件名；门 = G1|G2|G3）。'
