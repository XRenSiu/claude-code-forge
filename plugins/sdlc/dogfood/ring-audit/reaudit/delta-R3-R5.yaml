# 底稿：audit.yaml 的 R3/R4/R5 三环共 9 个 Part。判定在 ab67052 的源码上逐条复核。
# 结论先说：**没有一个 Part 的三维判定改变**。R3-R5 这一轮的修复全部落在"闸更严"上，
# 没有一条把 static_only 抬成行为层记录，也没有给 ratchet 的 experiment_dir/** 装上第一道闸。
