- id: test-suite-generator
  ring: R3
  artifacts:
  - id: tests/<f>/**
    checked_by_from: [gen_existence.py, check_verbatim_names.py, lock_done_when.py]
    checked_by_to: [check_verbatim_names.py, lock_done_when.py, capture_red_baseline.py]
    why: >-
      两处改动，性质不同，分开读：
      (加) capture_red_baseline.py 是本轮新增的脚本（I-62），检的正是 tests/<f>/RED_BASELINE.txt。
      它有两条真正的非零退出路径——`--verify` 在基线不带 clean-checkout 证据时 exit 1（#L81），
      采集时新检出不干净则 exit 1（#L120）——所以按"存在非零退出路径"的定义它是闸，不是报告工具。
      (减) gen_existence.py 逐行读下来**没有任何拒绝路径**：它是生成器，把 done_when.yaml 的
      existence 条目铺成一份 fail-fast 的 existence.sh。全文三处 sys.exit 分别是 PyYAML 缺席（#L49）、
      `--cli/--ui` 参数不是 KEY=VALUE（#L191）、以及同一处的用法错误；畸形的 existence 条目走的是
      `sys.stderr.write(f"skipping malformed…"); continue`（#L228-L230），跳过而不是拒绝；
      全文无 raise、无 assert。承重的是它**生成的** existence.sh（`set -euo pipefail` + 首个缺失符号即退），
      不是它自己。这是复核旧判定得出的更正，不是本轮代码变化——gen_existence.py 这一轮加了 cli:/ui:
      两种 v2 观察边界（I-54），但没有加任何拒绝路径。
    note: >-
      去掉 gen_existence.py 不触发 F-06 封顶：tests/<f>/** 的 checked_by 仍有
      check_verbatim_names.py（空契约名集 exit 2 #L125、缺名 exit 1 #L146）与 lock_done_when.py
      （verify 不匹配 exit 1 #L148），test-suite-generator 的 implemented 稳在 compiled。

- id: commit
  ring: R5
  artifacts:
  - id: 'git:commit'
    checked_by_from: [verify_commit.py]
    checked_by_to: [verify_commit.py, commit.sh]
    why: >-
      commit.sh 是本轮新增的脚本（I-50），把"预门 exit 0 才 commit"从调用方的自觉编译成一条命令：
      退出码用赋值捕获而不经管道（#L66），非 0 直接 exit "$rc" 且不提交（#L68）；另有 --amend 未带
      --expect-subject 或 HEAD 主题对不上时 exit 2（#L50 / #L59）、门过但 git commit 自身失败 exit 3（#L87）。
      它决定 git:commit 这件产物到底落不落地，是这个产物上比 verify_commit.py 更外层的那道闸。
      SKILL.md v0.2.0 已把它写成"落地的默认入口"，并把 done_when 从 "verify_commit.py exit 0"
      改写为 "commit.sh exit 0"。

