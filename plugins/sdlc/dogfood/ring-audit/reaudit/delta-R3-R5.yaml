notes: >-
  一、为什么 R3-R5 一条 implemented 都没上移。逐条读过，不是省事：

  ratchet 仍是唯一停在 declared 的 Part，因为 F-06 只看独占产物：experiment_dir/** 的 checked_by
  依旧为空，skills/ratchet/ 下依旧没有 scripts/ 目录，gate.json 的 provenance.scripts_run 依旧是 {}。
  gap R5/newly_identified/control/experiment-dir-unchecked 未被填。

  其余八个 Part 想上移只有 compiled → verified 一条路，而 verified 要行为层运行记录。
  九个 Part 涉及的七份 eval/gate.json 全部仍是 gate_pass: static_only（逐份读过），
  spec-compile 与 calibrate 的 tier2_status 仍逐字写着 NOT RUN。按 skillwise 的 effect-gate.md，
  verified 对应的是带 / 不带两臂的 delta_exist，本轮一次都没跑。本 feature 自己的 dogfood 里
  card-implementer 确实真跑过 14 条卡提交（run_evidence.audited_dirs_diff），但那是**只有 with 臂**
  的一次使用记录，不是 L2 对比，不足以把 agent.card-implementer 抬到 verified。

  二、本轮真正的增量集中在"闸更严"这一层，且都在既有 checked_by 之内：
  check_verbatim_names.py / derive_counts.py 把「空契约名集打 0/0 ✓」改成 exit 2（I-54 / I-59）；
  lint_cards.py 多了投影 ↔ 数据源同卡的第 7 项（I-73）；verify_commit.py 堵掉了三扇 --range
  fail-open 门（I-75 / I-78 / I-81）并加了集合级 lock_detail（I-63）。这些让闸更承重，
  但不改变"这件产物有没有闸"这个 F-06 只关心的事实，所以 implemented 不动。

  三、gen_existence.py 的判定我改了，理由写在 parts[].artifacts[].why 里，这里只标性质：
  这是**复核旧判定**，不是代码变了。它与 R6 的 compute_confidence.py / compute_score.py 是同一类——
  形状是脚本、实况是无拒绝路径。建议 audit.yaml 的 gates[] 给它补
  `load_bearing: false` 与一条 note（照抄 compute_confidence.py 那条的写法），
  否则去掉 checked_by 之后 gates[] 仍标它为「闸」，两张视图会对不上。
  同理，gates[] 应新增两条：commit.sh（kind: script, label: 闸,
  ref: plugins/sdlc/skills/commit/scripts/commit.sh）与 capture_red_baseline.py
  （ref: plugins/sdlc/skills/test-suite-generator/scripts/capture_red_baseline.py）。
  已确认 check_audit.py 不做 checked_by → gates[] 的反向校验（F-06 只读 checked_by 非空与否），
  所以这三处不同步不会让检查脚本变红——这本身也是一处没人守的接缝。

  四、两条 missing 缺口的现状，都没到"填了"，所以 closed_gaps 是空的：

  R3/lifecycle_blank/control/red-green-evidence-script —— **部分填上，不算关闭**。
  capture_red_baseline.py 把"红"那一半机械化了：clean checkout 采集 + `--verify` 拒绝不带
  clean-checkout 证据的基线。但缺口的 deletion_test 问的是「一个从来没有红过的测试照样被写进
  tests-manifest」，而没有任何脚本把 RED_BASELINE.txt 与 tests-manifest.yaml 对账、
  据此拒绝一条从未红过的测试。verify_commit.py 的 tests_unlocked_at_green（#L359）碰到了"绿"那一半，
  但它是 flag 不是 reject。缺口的核心仍开着。
  附带：这条缺口的 evidence 引的 `ARCHITECTURE.md#L285` 行号已漂移（本轮在 #L110 处插入 5 行），
  「红-绿脚本**空白**」那句现在在 #L290，而这句话本身也已过时（红那一半已有脚本）。

  R4/newly_identified/control/card-depends-on-unchecked —— **缺口仍开，但它的 evidence 已过时**。
  原文写「lint_cards.py 的五项检查里没有一条读它——全文无 depends_on」，这句现在不成立：
  第 7 项检查确实读 depends_on（#L290、#L300、#L304），用它判定跨卡投影的接缝是否被声明。
  但缺口真正要的东西没有：仍然没有任何一处检查 depends_on 的环（CARD-A ↔ CARD-B 互指）
  或悬空卡号（depends_on 指向一个不存在的 CARD-NN）。deletion_test 照旧成立，
  只有 evidence 那一句要改写成「lint_cards.py 只在第 7 项里把 depends_on 当作接缝声明来读，
  不检环、不检悬空卡号」。

  R3/unenforced_rule/control/uncalibrated-standard-used-as-evidence —— 未动。
  全仓库除 skills/calibrate/ 自身外，没有任何 .py / .sh 读 calibration_report。
  sdlc_state.py 里新出现的 `contract.calibration_report` 只是一个可 set 的状态槽，
  且只被 CONTRACT_FILES（#L89）用在 archive 时拷文件（#L944），不参与任何判定；
  cmd_gate（#L483-L497）对 G2 pass 只要求 lock.path 存在，没有校准前置。dos.yaml 的 R010
  依旧 enforced_by: not_enforced。

  R5/unenforced_rule/control/one-producer-per-artifact-unlinted —— 未动。
  verify_graph.py 本轮零改动；card.allowed_files 在 graph.yaml 里依旧挂在三个节点下
  （implement #L144、agent.card-implementer #L152、agent.comment-fixer #L230），图 lint 照旧全绿。

  R5/newly_identified/control/agent-parts-without-gate-json —— 未动。
  plugins/sdlc/agents/ 下仍是五份 .md、零份 eval/gate.json。

  五、我不确定 / 没做的：

  没有跑 plugins/sdlc/eval/smoke.sh。387 这个数是 `grep -cE "^\s*expect "` 数出来的静态计数
  （skill-issues.md 的跟进节自报 378 passed / 0 failed），不是我这次跑出来的。
  这不影响本份 delta 的任何判定——没有一条判定依赖 smoke 的通过与否，
  只依赖"某个脚本有没有非零退出路径"，那是读源码定的。

  graph.yaml 的 +10 行漂移我只核了 R3-R5 引到的四个锚点（#L320 / #L321 / #L349，
  以及确认 #L29 / #L110-L168 / #L225-L231 不受影响）。R6-R8 引的 edges 段锚点大概率同样 +10，
  但那不在我的范围，没有逐条核，交给对应的人。

  ARCHITECTURE.md 的 +5 行漂移同理：我只核了 R3 两条缺口引的 #L285 / #L287，
  以及确认 §1 表的 #L37 / #L39 / #L41 / #L42 在插入点之前、不受影响。
