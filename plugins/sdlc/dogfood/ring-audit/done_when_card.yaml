issue_ref: (pending — created after G1)
territory_id: sdlc-plugin
purpose:
  name: ring audit of the sdlc plugin
  kpi: rings == 10; parts_total == 42; dims_with_psl_id_ratio >= 1.0; card_commits_touching_audited_dirs == 0
  aspect_focus:
  - correctness
  - reversibility
mode: auto
