- id: DW-009
  source_ac: AC-005-a
  statement: 'WHEN the report is read THE SYSTEM SHALL show: 每个 Part 行给出 Gap 原子集合、独占 Artifact（或 role gate | orchestrator）、检它的 Gate（script 写"闸"、human 写"门"）与 Loop；
    needed 判定的 deletion 测试写出撤掉它后流水线会产出的具体错误产物或漏检（不接受"流程会断"一类泛语）； naming 判定先写来路（authored | adopted）再写贴合，misfit 时给建议名且建议名比原名更贴产物或位置并标"不重命名"； 疑似重复的 Part 对（至少 pr-review
    vs code-reviewer、donewhen-extract vs acceptance-spec）带 Artifact 对照与 distinct_exits | merge_candidate | alternatives_of 裁决； 每环表末尾的 missing 行带来源标签（lifecycle_blank
    | newly_identified | unenforced_rule）、necessity 与 deletion 一句'
  ears_type: ubiquitous
  given: ui:AUDIT.md#ring-tables
  when: report read
  then: 每个 Part 行给出 Gap 原子集合、独占 Artifact（或 role gate | orchestrator）、检它的 Gate（script 写"闸"、human 写"门"）与 Loop； needed 判定的 deletion 测试写出撤掉它后流水线会产出的具体错误产物或漏检（不接受"流程会断"一类泛语）；
    naming 判定先写来路（authored | adopted）再写贴合，misfit 时给建议名且建议名比原名更贴产物或位置并标"不重命名"； 疑似重复的 Part 对（至少 pr-review vs code-reviewer、donewhen-extract vs acceptance-spec）带 Artifact
    对照与 distinct_exits | merge_candidate | alternatives_of 裁决； 每环表末尾的 missing 行带来源标签（lifecycle_blank | newly_identified | unenforced_rule）、necessity 与 deletion 一句
  threshold: checklist all items ticked (== 100%)
  threshold_source: kpi
  paired_with: ''
  verify: checklist
  based_on: ''
  disposition: draft
- id: DW-010
  source_ac: AC-006-a
  statement: 'WHEN the report is read THE SYSTEM SHALL show: run_evidence 节列出 G1 / G2 / G3 的签字人、signer_kind 与授权引用，signer_kind = delegated_agent 的门不渲染为"人签"； 列出 check-audit
    对 audit.yaml 的 exit 0 与对删环变体的 exit 1 两次运行记录（缺变体记录时 exit 0 标 uncalibrated，A6 的回答如实带出该标记）； 列出 Card-footer 提交对三个被审目录的 git diff --stat 记录（为空）与 skill-issues.md 的路径；外部证据的替代品标
    substitute，不渲染为用户验证'
  ears_type: ubiquitous
  given: ui:AUDIT.md#run-evidence
  when: report read
  then: run_evidence 节列出 G1 / G2 / G3 的签字人、signer_kind 与授权引用，signer_kind = delegated_agent 的门不渲染为"人签"； 列出 check-audit 对 audit.yaml 的 exit 0 与对删环变体的 exit 1 两次运行记录（缺变体记录时
    exit 0 标 uncalibrated，A6 的回答如实带出该标记）； 列出 Card-footer 提交对三个被审目录的 git diff --stat 记录（为空）与 skill-issues.md 的路径；外部证据的替代品标 substitute，不渲染为用户验证
  threshold: checklist all items ticked (== 100%)
  threshold_source: kpi
  paired_with: ''
  verify: checklist
  based_on: ''
  disposition: draft
