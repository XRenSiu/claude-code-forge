  given: '{''input'': ''complete audit.yaml'', ''psl'': ''PSL-sdlc-ring-audit index 001..017'', ''required_parts'': ''agent.card-implementer, agent.comment-fixer,
    agent.fix-verifier, agent.pr-reviewer, agent.review-triage'
  when: complete audit.yaml
  then: exit 0, rings 10, parts_total 42, parts_without_assessment 0, required_parts_missing 0
  threshold: exit == 0, rings == 10, parts_total == 42, parts_without_assessment == 0, required_parts_missing == 0
  threshold_source: kpi
  paired_with: DW-002
  verify: command
  based_on: ''
  disposition: draft
