            context and check survivors land in Known issues" 未做 —— 隔离预审从未真跑过。
        calibrated: false
        reaudit_note: >-
          declared → compiled（重审 2026-09-06，编排者裁）。原判被 G3 的 mf-009 用 F-06 封在 declared，
          理由是"verify_pr.py --pre-review 检的是下游 PR 正文的 Known issues 段，不是本 agent 的 findings
