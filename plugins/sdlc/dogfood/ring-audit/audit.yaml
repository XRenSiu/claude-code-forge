# audit.yaml — 九环审计的机器可读半边（CARD-06 装配产物）
#
# 形状见 audit.schema.md，判定在 check_audit.py（AUDIT.md 是本文件的投影，F-12：不一致时以本文件为准）。
# 本文件由四个片段合并而成，rings 按 R0..R8, spine 排；片段正文逐字保留，只改顺序、去重、补 run_evidence：
#   audit/rings-R0-R2-spine.yaml (CARD-02) · audit/rings-R3-R5.yaml (CARD-03)
#   audit/rings-R6.yaml (CARD-04)          · audit/rings-R7-R8.yaml (CARD-05)
# 装配时的每一处改动列在 AUDIT.md 末尾的 "assembly notes"。
#
# 自检（两条都写在 run_evidence.check_runs 里，F-14 的校准孪生）：
#   python3 plugins/sdlc/dogfood/ring-audit/check_audit.py plugins/sdlc/dogfood/ring-audit/audit.yaml \
#     --psl plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md \
#     --required-parts "agent.card-implementer, agent.comment-fixer, agent.fix-verifier, agent.pr-reviewer, agent.review-triager"
#   同上 + --variant delete-ring:R6   → 必须 exit 1

schema: audit/1
feature: sdlc-ring-audit
psl: PSL-sdlc-ring-audit.md
check: check_audit.py

# =============================================================================
# 环 → 配件 → 三维判定（R0..R8, spine）
# =============================================================================
rings:

# =============================================================================
# R0 世界
# =============================================================================
- id: R0
  question: 这个产品为什么这样运转
  parts:

  - id: psl
    kind: skill
    ring: R0
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L48-L53（Node.role=world → R0）'
    provenance: adopted
    loop: loops.yaml#lifecycle
    loop_reason: 'graph.yaml#L311 的 loop_back（signal counterexample_cites_psl_rule）以 psl 为落点，环归属 lifecycle'
    artifact: PSL-<feature>.md
    gates: [verify_psl.py]
    fills: [R0/newly_identified/knowledge+judgment/world-before-form]
    assessment:
      id: A-psl
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/psl/SKILL.md#缺口'}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#1-九环与一根脊柱'}
        deletion_test: 撤掉后引擎按字面实现需求——"按时间搜索记忆"交出一个 created_at 字段加日历筛选器，产物技术正确、产品错误；且这类世界层错误一路漏到 R6 验收才暴露，回流要走 routing 的 world 层（无自动上限）。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/psl/scripts/verify_psl.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/psl/eval/gate.json#gate_pass'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md}
        reaudit_note: >-
          重审补记（2026-09-06）：gate_caveat 保持原判，并有一条现场核实——plugins/sdlc/ 下至今没有任何
          plugin 级 hooks.json，skills/sdlc/assets/hooks/stop-clean-state.json 仍是未安装的模板，
          所以「声明式预门、未挂 hooks」这句在 HEAD 上仍逐字为真，不是过期结论。
          verify_psl.py 的检查面则变了（本轮 +177 行）：#L311-L321 拒绝无 PSL-NNN id 与重复 id
          （I-02，与 verify_derived.py 那条拒绝对齐，两道闸说同一句话），并按 form / content 分层输出 info，
          决定下游 verify_derived.py 对哪些规律做未被引用 flag。
        not_reached:
          verified: 无带 / 不带 skill 的对比运行（gate.json tier2_status NOT RUN，T1–T5 未跑）；本 Run 产出了 PSL-sdlc-ring-audit.md，但产物存在不等于对比跑过，也没有 verify_psl.py 对它的运行记录。
        gate_caveat: 'verify_psl.py 是"交付前必须跑"的声明式预门，未挂 hooks.json——gate.json fix_list 第一条即此（A''-1）。它构成 compiled，不构成不可跳过。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: PSL-<feature>.md
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/psl/eval/gate.json#imported_into_sdlc.from'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#直接收编整-skill-复制进本插件正文保留加术语映射--接线'}
        fit_reason: 收编自 looper v0.2.0，保留上游名；名字与独占产物 PSL-*.md 同词干，按 F-03 判 fits（收编不是免检，此处是真判过）。
      disposition: none
      adjudications: []

  - id: psl-derive
    kind: skill
    ring: R0
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L54-L59（Node.role=world → R0）'
    provenance: authored
    loop: null
    artifact: derived/**
    gates: [verify_derived.py, G1]
    fills: [R0/newly_identified/judgment+control+capability/derivation-traceability]
    assessment:
      id: A-psl-derive
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/psl-derive/SKILL.md#缺口judgment--control--capability'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#直接收编整-skill-复制进本插件正文保留加术语映射--接线'}
        deletion_test: 撤掉后 derived/ 四文件不存在，形态在实现里"顺手"定；G1 拿不到可裁之物，门空转——验收时出现"AC 全绿但交付的不是要的形态"，且无法归因"推错了 vs 规律错了"（每条决策 ← PSL-ID 的锚消失）。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/psl-derive/scripts/verify_derived.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/psl-derive/eval/gate.json#gate_pass'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/derived/form-draft.md}
        reaudit_note: >-
          重审补记（2026-09-06）：判定不变（fix_list 的 "run N=3 isolated derivations and hold a real G1" 仍在），
          但"三轮修订不受任何机械约束"这层背景已不成立：verify_derived.py 本轮 +227 行，多轮推导现在有闸——
          --round N 起，上一轮必须归档在 round{N-1}/ 且四件产物齐全、必须有 round-diff.md 且真的引用 round{N-1}/、
          divergence.md 必须自报 round: N 且从第 2 轮起带「裁决 → 落点」表，缺一即 REJECT。
          并更正一处容易误记的因果：「form-draft 引用不存在的 PSL id」这条拒绝**不是**本轮新增，
          装配前就在；本轮新增的是 UI-n / A-n / DP-n 三类锚与 F-<digits> id 格式的拒绝。
        not_reached:
          verified: gate.json fix_list 明写 "L2：run N=3 isolated derivations on one real PSL and hold a real G1" 未做；本 Run 的 derived/ 有 v1/v2/v3 三稿，但那是同一推导者的三轮修订，不是 N 次隔离推导的分歧集，也不是带 / 不带 skill 的对比。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: derived/**
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#直接收编整-skill-复制进本插件正文保留加术语映射--接线'}
        - {kind: file, ref: plugins/sdlc/skills/psl-derive/SKILL.md}
        fit_reason: 新写（gate.json 无 imported_into_sdlc 块），按产物命名；derive 与产物目录 derived/ 同词干，F-03 判 fits。
      disposition: none
      adjudications: []

  - id: human_gate.G1
    kind: human_gate
    ring: R0
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L60-L66（Node.role=gate，非环角色；按 F-08 归其所检产物 derived/** 所在环 R0，并与 ARCHITECTURE.md §1 表 R0 门闸列的 G1 一致，两源不冲突）'
    provenance: authored
    loop: loops.yaml#lifecycle
    loop_reason: 'graph.yaml#L311 的 loop_back 由 human.g1 出发，环归属 lifecycle'
    artifact: g1-record.md
    role: gate
    gates: [sdlc_state.py]
    fills: [R0/newly_identified/control/world-verdict-door]
    assessment:
      id: A-G1
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-006, PSL-003]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#32-三道门只能人签'}
        - {kind: file, ref: plugins/sdlc/skills/sdlc/assets/g1_record.md}
        deletion_test: 撤掉后形态草案由生产它的引擎自评通过（评估者 = 被评估者），PSL 与形态之间的分歧集无人裁；一次错误的形态推导直接进 issue 与契约，R2 之后每一件产物都建在它上面，返工要退回 world 层。
      implemented:
        verdict: compiled
        psl_ids: [PSL-006, PSL-010]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/sdlc/assets/g1_record.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/sdlc/eval/gate.json#provenance.scripts_run.sdlc_state.py'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/g1-record.md}
        not_reached:
          verified: '门本身在本 Run 走过两轮（第一轮否决），但签字人是 delegated_agent 代签，不是人签；PSL-006 下代签不得渲染为人签，因此"人签的门跑通了"这一层没有证据。重审补记（2026-09-06）：结论不变，但"代签与人签在机器一侧无差别"这层事实没了——sdlc_state.py 现在要求 --signer-kind human|delegated_agent（#L980 required），代签缺 --authorization 即 die（sdlc_state.py#L497），signer_kind 与 authorization 进 state.gates.<g> 与 ledger，trace 的 decided_by 也分 human: / agent: 前缀。代签因此是被记录且被约束的一等状态，但脚本从不拒绝一次代签本身，所以"只能人签"这条宪法仍未编译（见 spine/unenforced_rule/control/r008-human-signer）。'
        gate_caveat: 'sdlc_state.py gate g1 检的是状态字段（pass 要求 world.derived_dir、reject 要求 attribution），不是 g1-record.md 的内容——是部分检，不是对产物的完整闸。'
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: G1（世界裁决门，ARCHITECTURE §1 R0 门闸列）
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#32-三道门只能人签'}
        fit_reason: 名字是位置名（三道门里的第一道，裁世界），F-03 的"位置名"分支判 fits。
      disposition: none
      adjudications: []

  missing:
  - R0/lifecycle_blank/capability/psl-reference-lint
  - R0/lifecycle_blank/control/g1-external-evidence

# =============================================================================
# R1 本体
# =============================================================================
- id: R1
  question: 系统里有什么、叫什么、什么不可违反
  parts:

  - id: dos-extract
    kind: skill
    ring: R1
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L69-L74（Node.role=knowledge → R1）'
    provenance: adopted
    loop: null
    artifact: dos.yaml
    gates: [verify_dos.py]
    fills: [R1/newly_identified/knowledge+capability+judgment/shared-ontology, R1/lifecycle_blank/control/dos-proposal-reconcile]
    assessment:
      id: A-dos-extract
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/dos-extract/SKILL.md#the-gap-why-a-scan-is-not-an-ontology'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L314-L315'}
        deletion_test: 撤掉后 issue 的 DOS 词表闭包没有解析源、卡的 dos_slice 没有来源，verify_issue.py --dos 与 lint_cards.py --dos 退化成不检；产出的 issue 与卡里同一个对象带三个名字，且"该转 PSL 轨"的客观触发（闭包失败）永远不会触发。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/dos-extract/scripts/verify_dos.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/dos-extract/eval/gate.json#gate_pass'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/dos.yaml}
        not_reached:
          verified: gate.json tier2_status NOT RUN——需要 held-out repo 上带 / 不带 delta_exist 的对比；本 Run 产出了 dos.yaml 与 decisions.md，但没有对比臂。
        no_gate_note: 'decisions.md（graph.yaml#L73 的第二个 writes）仍无闸，但重审更正（2026-09-06）：它不再是无人读。verify_dos.py --decisions 解析它的 `## Naming waivers` 节（#L73-L96），整词 UI/impl 名的 REJECT 由那里的一条豁免降级成 FLAG（#L182-L185），smoke 有一对孪生期望盯着这条路。检的仍然是 dos.yaml——decisions.md 自身为空、内容与 dos.yaml 矛盾、或豁免写错格式，都只表现为"没豁免成功"，没有任何非零退出路径指向 decisions.md 本身。而且同一个文件里两条豁免路径只通了一条：>7 objects 那条拒绝（verify_dos.py#L167-L189）的措辞仍写着 "exceed only with a human waiver in decisions.md"，代码里却是无条件 reject、从不查 waivers。Gap R1/newly_identified/control/decisions-md-no-gate 仍开着；按独占产物 dos.yaml 有闸，不把本 Part 压回 declared。'
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: dos.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/dos-extract/eval/gate.json#imported_into_sdlc.from'}
        fit_reason: 收编自 looper v0.2.0，保留上游名；名字与独占产物 dos.yaml 同词干，F-03 判 fits。
      disposition: none
      adjudications: []

  - id: invariant-extract
    kind: skill
    ring: R1
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L75-L80（Node.role=knowledge → R1）'
    provenance: adopted
    loop: null
    artifact: invariants/*.yaml
    gates: [verify_card.py]
    fills: [R1/newly_identified/judgment+control+capability/resident-invariants]
    assessment:
      id: A-invariant-extract
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-005]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/invariant-extract/SKILL.md#the-gap-why-the-engine-cant-just-read-them-off-the-code'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L316'}
        deletion_test: 撤掉后从失败里学到的 □ 不变量没有落点，spec-compile 只剩 done_when 一个编译源；同一类事故第二次发生时账本里没有可引用的不变量卡，routing 把它当一次新失败在 card 层重跑——付过学费的知识不进制品。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/invariant-extract/scripts/verify_card.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/invariant-extract/eval/gate.json#gate_pass'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/invariants/sdlc-plugin.card.yaml}
        reaudit_note: >-
          重审补记（2026-09-06）：verify_card.py 本轮 +212 行，检查面宽了一大截，旧 evidence 会低估它的承重——
          新增拒绝：hard 不变量必须 disposition: propose、低置信必须 propose、carded 条目的 altitude 必须是
          territory 级、◊ 候选不得同时以 □ 入卡、channel_2_input.failure_memory_count 有数无 sources、
          registered_gaps 条目缺 destination；新增 flag：与 dos.yaml 规则的近重复检测（--near-duplicate，默认 0.6）、
          缺 narrowest_rule_note。gate.json dogfood_fixes 记 I-24…I-29 六条，13 条新 smoke 期望，
          每条都跑过变异证明。tier2_status 仍是 NOT RUN，implemented 维持 compiled。
        not_reached:
          verified: gate.json tier2_status NOT RUN——需要一个带真实 failure.memory 的 Territory 上的带 / 不带对比；本 Run 产出了一张不变量卡，无对比臂。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: invariants/*.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/invariant-extract/eval/gate.json#imported_into_sdlc.from'}
        fit_reason: 收编自 looper v0.2.0，保留上游名；名字与独占产物 invariants/*.yaml 同词干，F-03 判 fits。
      disposition: none
      adjudications: []

  missing:
  - R1/lifecycle_blank/knowledge+control/ontology-drift
  - R1/lifecycle_blank/knowledge/dos-candidate-namespace
  - R1/newly_identified/control/decisions-md-no-gate

# =============================================================================
# R2 契约
# =============================================================================
- id: R2
  question: 什么算做完
  parts:

  - id: issue
    kind: skill
    ring: R2
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L83-L88（Node.role=contract → R2）'
    provenance: authored
    loop: null
    artifact: 'github:issue'
    gates: [verify_issue.py]
    fills: [R2/newly_identified/judgment+capability+control/falsifiable-task-seed]
    assessment:
      id: A-issue
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/issue/SKILL.md#缺口judgment--capability--control'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/issue/eval/gate.json#provenance.scripts_run.verify_issue.py'}
        deletion_test: 撤掉后需求原文直接当 issue body——"让搜索更快"这种任何实现都能通过的 issue 进入流水线；donewhen-extract 没有可证伪的源头，pr 的 AC→证据映射无基准，review 判"越界"也无基准。产出的是一条永远不会失败的验收线。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/issue/scripts/verify_issue.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/issue/eval/gate.json#gate_pass'}
        - {kind: run_record, ref: plugins/sdlc/dogfood/ring-audit/issue-body.md}
        reaudit_note: >-
          重审补记（2026-09-06）：verify_issue.py 本轮 +86 行，两处结构性变化——DOS 闭包改为 import
          dos-extract/scripts/dos_closure.py 这一个共享 resolver（lint_cards.py import 同一个），闭包现在认
          objects.synonyms / rules.aliases；新增 --g1 读 g1-record.md 与 g1-interpretations.md 的「明确不做」节。
          要点是这两条都**不构成闸**：--g1 的交叉核对只产 flag 不产 reject，按"闸 = 存在非零退出路径"的定义
          它不构成对 g1-record.md 的闸，g1-record.md 的 checked_by 不因此改变；dos_closure import 失败时
          降级为 flag，--dos 在邻居 skill 缺席时是 fail-open 的。implemented 维持 compiled，
          因为正文里 20 余条 rejects.append 是真拒绝。
        not_reached:
          verified: gate.json fix_list 明写 gh issue create / edit 路径未跑（需要 live repo），DOS 闭包触发 PSL 轨这件事也只在 fixture 上验过，没有带 / 不带 skill 的对比。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'github:issue'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/issue/eval/gate.json#provenance'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#直接改编'}
        fit_reason: 新写（gate.json 无 imported_into_sdlc 块；design-notes 把它列在"直接改编"——借的是 qanat 三纪律与 looper 双轨判据，不是整 skill 收编），按产物命名，F-03 判 fits。
