# "把 pr 与 harness-review 合并"，是荒谬的）。故按两个 Artifact 登记，图里的同名登记为源码问题（P-R8-06）。
- {id: 'github:pr (harness 提案)', producer: human_gate.harness-review, checked_by: []}

# =============================================================================
# Gate 设计视图（门 / 闸）—— 签字三元组住在 run_evidence，不在这里
# =============================================================================
gates:
- {id: G1, kind: human, label: 门, checks: [derived/**]}
- {id: G2, kind: human, label: 门, checks: [done_when.yaml, .done_when.lock]}
- {id: verify_psl.py, kind: script, label: 闸, ref: plugins/sdlc/skills/psl/scripts/verify_psl.py}
- {id: verify_derived.py, kind: script, label: 闸, ref: plugins/sdlc/skills/psl-derive/scripts/verify_derived.py}
- {id: verify_dos.py, kind: script, label: 闸, ref: plugins/sdlc/skills/dos-extract/scripts/verify_dos.py}
- {id: verify_card.py, kind: script, label: 闸, ref: plugins/sdlc/skills/invariant-extract/scripts/verify_card.py}
- {id: verify_issue.py, kind: script, label: 闸, ref: plugins/sdlc/skills/issue/scripts/verify_issue.py}
- {id: verify_done_when.py, kind: script, label: 闸, ref: plugins/sdlc/skills/donewhen-extract/scripts/verify_done_when.py}
- {id: validate_done_when_v2.py, kind: script, label: 闸, ref: plugins/sdlc/skills/donewhen-extract/scripts/validate_done_when_v2.py}
- {id: validate_done_when.py, kind: script, label: 闸, ref: plugins/sdlc/skills/acceptance-spec/scripts/validate_done_when.py}
- {id: lock_done_when.py, kind: script, label: 闸, ref: plugins/sdlc/skills/sdlc/scripts/lock_done_when.py}
- {id: sdlc_state.py, kind: script, label: 闸, ref: plugins/sdlc/skills/sdlc/scripts/sdlc_state.py}
- {id: trace.py, kind: script, label: 闸, ref: plugins/sdlc/skills/sdlc/scripts/trace.py}
- {id: verify_graph.py, kind: script, label: 闸, ref: plugins/sdlc/skills/sdlc/scripts/verify_graph.py}
- {id: verify_loop.py, kind: script, label: 闸, ref: plugins/sdlc/skills/sdlc/scripts/verify_loop.py}
- {id: derive_counts.py, kind: script, label: 闸, ref: plugins/sdlc/skills/test-suite-generator/scripts/derive_counts.py}
- {id: gen_existence.py, kind: script, label: 闸, ref: plugins/sdlc/skills/test-suite-generator/scripts/gen_existence.py}
- {id: check_verbatim_names.py, kind: script, label: 闸, ref: plugins/sdlc/skills/test-suite-generator/scripts/check_verbatim_names.py}
- {id: verify_compile.py, kind: script, label: 闸, ref: plugins/sdlc/skills/spec-compile/scripts/verify_compile.py}
- {id: verify_calibration.py, kind: script, label: 闸, ref: plugins/sdlc/skills/calibrate/scripts/verify_calibration.py}
- {id: lint_cards.py, kind: script, label: 闸, ref: plugins/sdlc/skills/plan-cards/scripts/lint_cards.py}
- {id: verify_commit.py, kind: script, label: 闸, ref: plugins/sdlc/skills/commit/scripts/verify_commit.py}
- id: G3
  kind: human
  label: 门
  checks: [ratchet-log/iteration-NNN/final-state.json]
  note: '这是设计视图。机械上 cmd_gate 对 G3 pass 不检任何输入（sdlc_state.py#L486-L494 只给 G1/G2 写了前置），所以 artifacts[] 里 final-state.json 的 checked_by 是空的——两张视图的差就是 gap R6/newly_identified/control/g3-pass-has-no-input-precondition。'
- id: post_review.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/pr-review/scripts/post_review.py
  load_bearing: true
  note: '真会拒绝：APPROVE 事件退 1（post_review.py#L79，approval is a human act）、P0/P1 缺 reproduction_scenario 或 suggested_change 退 1（post_review.py#L97）、未知档位退 1。是 R6 唯一一条承重的脚本闸。'
- id: compute_confidence.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/meta-judge/scripts/compute_confidence.py
  load_bearing: false
  note: '登记为闸是形状，不是承重：它是确定性加权原语，把 sources 折成一个 confidence 数，除 IO / JSON 解析错误外没有非零退出路径，不拒绝任何输入。据此 meta-judge 的 implemented 停在 declared 而不是 compiled。'
- id: compute_score.py
  kind: script
  label: 闸
  ref: plugins/sdlc/skills/spec-gaming-detector/scripts/compute_score.py
  load_bearing: false
  note: '同上：算 gaming_risk_score 并打印，阈值判断留给消费者（脚本自己的收尾行：thresholds ≥7 = GAMING_RISK are the consumer''s call）。不拒绝任何输入，故 spec-gaming-detector 的 implemented 停在 declared。'
- {id: verify_pr.py, kind: script, label: 闸, ref: plugins/sdlc/skills/pr/scripts/verify_pr.py}
- {id: pr-poll.sh, kind: script, label: 闸, ref: plugins/sdlc/skills/review-loop/scripts/pr-poll.sh}
- {id: verify_release.py, kind: script, label: 闸, ref: plugins/sdlc/skills/release/scripts/verify_release.py}
- {id: metrics.py, kind: script, label: 闸, ref: plugins/sdlc/skills/retro/scripts/metrics.py,
   note: '按 ARCHITECTURE.md#L42 §1 R8「门 / 闸」列登记；实况是导出器 —— 无非零退出路径，不拒任何东西。见 R8/newly_identified/control/retro-output-no-rejecting-gate'}
- {id: tune.py, kind: script, label: 闸, ref: plugins/sdlc/skills/tune/scripts/tune.py,
   note: '同上；tune/SKILL.md#L69 自述 "exit 0 恒成立（报告工具）"，真正的控制在 apply_proposal.py（只出 diff，从不写目标文件）'}

# =============================================================================
# 提案（每条必有 source：一个 Assessment id 或 Gap id）
# =============================================================================
proposals:
- id: P-02-01
  source: A-acceptance-spec
  destination: new_issue
  text: 'done_when.yaml 有两个非豁免生产者（donewhen-extract / acceptance-spec，F-05 三条件只满足 (a)）。建议以 done_when.yaml v2 为唯一契约，acceptance-spec 的契约出口收敛为"产 spec.md + 经 convert_v1_to_v2.py 交棒"，或反向合并。审计不当场裁，交 G3 与一次 G2 变更提案。'
- id: P-02-02
  source: R2/newly_identified/control/spec-md-no-gate
  destination: new_issue
  text: 'specs/<f>/spec.md 与 spec-robustness.md 无任何闸。建议加 verify_spec.py（EARS 句型 + REQ-ID 稳定性 + 与 done_when.yaml 的 REQ 覆盖对账），或在 §1 表里显式登记"无闸"并把其生产者的 implemented 钉在 declared。'
- id: P-02-03
  source: spine/newly_identified/control/routing-yaml-no-verifier
  destination: new_issue
  text: 'routing.yaml 无自身验证器。建议加 verify_routing.py：rules 行的 signal / layer / handler / action 在封闭集内、layers 与 budgets 键对齐、impossible_reporters 全部是图里存在的节点、每个 signal 被 loops.yaml 的某个环声明。'
- id: P-02-04
  source: spine/newly_identified/control/triggers-yaml-no-verifier
  destination: new_issue
  text: 'triggers.yaml 无自身验证器。建议扩 verify_loop.py 或新增 verify_triggers.py：每个 loop 在 loops.yaml 内、kind 与该环的 trigger 一致、predicate_scripts 指向存在的文件、每个 unattended 绑定含 "or stop after" 预算子句。'
- id: P-02-05
  source: R1/newly_identified/control/decisions-md-no-gate
  destination: new_issue
  text: 'decisions.md 无闸，而 verify_dos.py 的 ">7 objects" 拒绝把豁免路径指向它。建议 verify_dos.py 增加一项：objects > 7 时要求同目录 decisions.md 存在且含对应豁免条目，否则拒——否则这是一条指向空气的豁免路径。'
- id: P-02-06
  source: spine/unenforced_rule/control/r008-human-signer
  destination: new_issue
  text: 'R008（三道门只能人签，enforced_by user_workflow）在机器一侧无承载。建议 sdlc_state.py gate 记录 signer_kind 并对 delegated_agent 强制 authorization_ref（与 check_audit.py 的 delegated_without_authorization_ref 谓词同形），至少让代签留下不可省略的痕迹。'
- id: P-02-07
  source: A-psl
  destination: skill_fix_list
  text: 'verify_psl.py 是声明式预门（SKILL.md 写"交付前必须跑"，无 hooks.json 绑定），gate.json fix_list 已自列为 A''-1。本次审计只据此判 compiled，不判"被门挡"。'
- id: P-02-08
  source: R0/lifecycle_blank/capability/psl-reference-lint
  destination: new_issue
  text: 'PSL 引用完整性 lint 未实现（lifecycle.md 自列）。它是 psl-derive 的 PSL-ID 追溯校验的前提：一份自身引用残缺的 PSL 会让"每条决策 ← PSL-ID"的锚看似成立实则指空。'
- id: P-R3-01
  source: R3/lifecycle_blank/control/red-green-evidence-script
  destination: new_issue
  text: >-
    L5 的红-绿证据脚本在 ARCHITECTURE §7 与 lifecycle.md 制品映射表里都登记为空白。开一条 issue：
    定义「一个测试在实现前红过」的机器可读证据形状，并把它编进 lock --stage l5 的前置条件。
- id: P-R3-02
  source: R3/unenforced_rule/control/uncalibrated-standard-used-as-evidence
  destination: new_issue
  text: >-
    dos.yaml R010 的 calibrate 那一半 enforced_by=not_enforced。开一条 issue：在下游读标准之前加一道检查，
    要求 calibration_report.yaml 存在且 mutation / agreement 双线过底线，否则标记 calibration_pending 并拒绝当证据。
- id: P-R4-01
  source: R4/newly_identified/control/card-depends-on-unchecked
  destination: skill_fix_list
  text: >-
    lint_cards.py 加第六项：depends_on 里的每个卡号必须存在，且卡之间的 depends_on 图无环；违反 REJECT。
    现状是 SKILL.md 用 depends_on 决定并行而 lint 完全不读它。
- id: P-R5-01
  source: A-implement
  destination: new_issue
  text: >-
    card.allowed_files 有三个 writer，其中 implement 与 agent.comment-fixer 不构成 F-05 同阶段条件替代，
    两者都记 merge_candidate。请人裁：是把 comment-fixer 的写范围改成一个独立的产物名（它写的是被接受线程的最小修复），
    还是把 R001 降级为文档规则。审计不当场裁掉一个。
- id: P-R5-02
  source: A-agent.comment-fixer
  destination: new_issue
  text: >-
    role_conflict：graph.yaml 的 Node.role=implementer 把 comment-fixer 推到 R5，而 ARCHITECTURE §1 表把它所属的
    review-loop 归在 R7，loops.yaml 又把它写成 review_loop 的 generator（graph.yaml 那个节点却没有 loop 键）。
    请人裁归属并让两份数据一致；本审计并列两源，不调和。
- id: P-R5-03
  source: R5/newly_identified/control/experiment-dir-unchecked
  destination: skill_fix_list
  text: >-
    ratchet 的 experiment_dir/** 无闸无门，按 F-06 把 ratchet 的 implemented 压在 declared。
    fix_list 加一条：给 experiment_dir 写一个形状 + 预算 + generator≠verifier 的 verify 脚本，或明确记为不检并说明理由。
- id: P-R5-04
  source: R5/unenforced_rule/control/one-producer-per-artifact-unlinted
  destination: new_issue
  text: >-
    R001 无机械检查。开一条 issue：给 verify_graph.py 加一条唯一生产者 lint（同阶段条件替代显式豁免），
    否则「条件替代」与「真的在争」在 graph.yaml 里长得一样。
- id: P-R5-05
  source: A-ratchet
  destination: skill_fix_list
  text: >-
    loops.yaml#ratchet 的 generator 写 ratchet.worker、verifier 写 ratchet.master，这两个 id 在 graph.yaml 的
    nodes 里都不存在（只有节点 ratchet）。verify_loop.py 只检 generator ≠ verifier，不检两者可解析成图节点，
    所以这条悬空引用一直绿着。fix_list 加一条：环契约的 generator / verifier 必须解析到 graph.yaml 的节点 id。
- id: P-R5-06
  source: R5/newly_identified/control/agent-parts-without-gate-json
  destination: skill_fix_list
  text: >-
    plugins/sdlc/agents/ 下五个 agent 都没有 eval/gate.json，效力档位无处可查。
    fix_list 加一条：给 agent 定义与 skill 同形的证据档，或在 ARCHITECTURE 里明确写「agent 的效力随其宿主 skill 记」。
- id: P-R6-01
  source: R6/newly_identified/control/g3-pass-has-no-input-precondition
  destination: new_issue
  text: '给 cmd_gate 的 G3 pass 补输入前置，与 G1 / G2 对齐：pass 前要求 acceptance.evaluation_result 指向一个存在的文件（或显式 skipped_reason），reject / waived 要求 pending.failure_report 存在。现状是三道门里唯一一道盖章不看纸的门。'
- id: P-R6-02
  source: R6/lifecycle_blank/capability+control/meets-done-when-compare-script
  destination: new_issue
  text: '补 meets_done_when 比对脚本（ARCHITECTURE §7 L7 行与 lifecycle.md 制品映射表都把它记为空白）：读 done_when.yaml 的 thresholds 与本轮实测数字并排比，退出码即结论，写进 final-state.json。在它落地前，R6 的"达标"只有自然语言形态。'
- id: P-R6-03
  source: R6/unenforced_rule/control/evaluator-may-declare-meets-done-when
  destination: new_issue
  text: '把 acceptance.meets_done_when 移出 sdlc_state.py 的 SETTABLE 白名单（sdlc_state.py#L75），改为只能由 P-R6-02 那个比对脚本写入。否则即便脚本落地，任何 agent 仍可一句 set 直接宣布达标——dos.yaml R010 的 not_enforced 说的就是这个。'
- id: P-R6-04
  source: R6/newly_identified/control/ratchet-log-shape-unchecked
  destination: new_issue
  text: 'advance pr 对 acceptance.evaluation_result 补 os.path.isfile（对齐 sdlc_state.py#L262 对 lock.path 的写法），并加一个 verify_ratchet_log.py 按 ratchet-log-format.md 检目录形状。现状是一个指向不存在路径的字符串就能把流水线放行到 merge。'
- id: P-R6-05
  source: A-meta-judge
  destination: skill_fix_list
  text: 'meta-judge 的产物有两个名字：graph.yaml#L189 写 final-verdict.yaml，meta-judge/SKILL.md 的 --output 默认值（plugins/sdlc/skills/meta-judge/SKILL.md#L75）与 M5 步（plugins/sdlc/skills/meta-judge/SKILL.md#L87）、ratchet-log-format.md#L41 与 plugins/sdlc/skills/acceptance-fleet/SKILL.md#L187/#L311 都写 meta-judge-output.yaml；连 SKILL.md 内部都不一致（description 与 M0 播报说 final-verdict.yaml）。定一个名并全线改齐。附注：meta-judge 节点没有 loop 键，而它是 acceptance_ratchet 的 verifier 兼 loop_back 源，环归属只能从边反推——顺带补上。'
- id: P-R6-06
  source: A-acceptance-fleet
  destination: skill_fix_list
  text: '五个评审者的产物路径两处不一致：graph.yaml#L179-L183 写扁平的 ratchet-log/iteration-NNN/{code-review-*,qa-review,pm-review,drift,gaming}.yaml，plugins/sdlc/skills/acceptance-fleet/SKILL.md#L122 与 plugins/sdlc/skills/acceptance-fleet/SKILL.md#L237-L256、ratchet-log-format.md#L41 写 ratchet-log/iteration-NNN/fleet-outputs/{code-reviewer-security,qa-reviewer,pm-reviewer,spec-drift-detector,spec-gaming-detector}.yaml——目录层级与文件基名都不同。任何按 graph.yaml 找文件的下游都会扑空。'
- id: P-R6-07
  source: A-fix-verifier
  destination: new_issue
  text: '收编即改名与 PSL-014「收编保留上游名」的分歧：design-notes.md#L56-L57 记的这批 agent 里 quality-sentinel → fix-verifier、issue-fixer → comment-fixer、code-reviewer → pr-reviewer 三处都改了名，而同一份文档 design-notes.md#L70 的命名规则只说"保留导入 skill 的原名"。要么把规则改成"skill 保留上游名、agent 按产物重命名"，要么把这三处记成显式例外。不改名（新名更贴合），改的是规则的说法。'
- id: P-R6-08
  source: A-code-reviewer
  destination: skill_fix_list
  text: 'code-reviewer 的 gate.json residual 自述"overlaps /pr-review"，而 pr-review 正是它的改编（design-notes.md#L50-L51）。两个配件读同一种输入（diff）、出同一种产物（发现列表），只是一个进 ratchet-log 一个进 .sdlc/review。写清边界：谁在 fleet 里跑、谁给单 PR 手审用，或者合并成一个带模式开关的配件。'
- id: P-R6-09
  source: R6/unenforced_rule/control/one-artifact-one-producer-in-ratchet-log
  destination: new_issue
  text: '给 verify_graph.py 加一条 lint：skill / agent 节点的 writes 之间不得相互包含。现有 lint ①（#L131-L139）只挡裸 ** / * / / / .，挡不住 ratchet-log/iteration-NNN/** 覆盖同目录下六个具体文件这种包含关系——dos.yaml R001 的 user_workflow 就落在这个缺口上。'
- id: P-R6-10
  source: A-review-triager
  destination: new_issue
  text: 'plugins/sdlc/agents/ 下的五个 agent 都只有 .md 提示，没有 eval/gate.json——每个 skill 都有的证据档位纪律（tier / evaluated_layers / gate_pass / fix_list）整体不覆盖 agent。至少给每个 agent 补一份 gate.json 记它停在哪一档，否则 dos.yaml R017「有效性主张不得超过证据档位」对这一半配件没有落点。'
- id: P-R6-11
  source: R6/unenforced_rule/control/gate-signer-must-be-human
  destination: new_issue
  text: 'cmd_gate 收 signer_kind = delegated_agent 只要带一句 --authorization 自由文本（sdlc_state.py#L502-L503），没有任何一处核对授权是否真来自人。要么把 authorization 收成一个引用（指向一份人写的授权记录文件并检存在），要么让 G3 只接受 signer_kind = human。dos.yaml R008 现在是 user_workflow。'
- {id: P-R7-01, source: A-agent.pr-reviewer, destination: skill_fix_list,
   text: 'agents/pr-reviewer.md 在 graph.yaml 无节点（R6 的 /pr-review 与 R7 的 /pr --pre-review 都调它），环归属只能靠 ARCHITECTURE §1 与两份 SKILL.md 推；建议在 graph.yaml 补节点并显式标环，否则 §1 与图对不上。另记：收编时上游名 code-reviewer 未保留（撞 R6 同名 skill），是 PSL-014 的一处受迫偏离。'}
- {id: P-R7-02, source: R7/newly_identified/control/merged-sha-vs-approved-head, destination: new_issue,
   text: '合入的 sha 与 review / G3 批准过的 head 无脚本核对；建议在 advance release 的前置条件里加一条 merge.sha 与 review.approved_head 的比对，或由 verify_release.py 检。'}
- {id: P-R7-03, source: R7/newly_identified/control/reply-resolve-order-unchecked, destination: skill_fix_list,
   text: 'pr-poll.sh resolve 不核对该线程上是否已有落地回帖，"回帖先于 resolve"只活在 SKILL.md 的判据里；建议 resolve 子命令先查一次该线程的 comments，无自己的回帖则 exit 22。收件人：review-loop 的 eval/gate.json fix_list。'}
- {id: P-R7-04, source: R7/unenforced_rule/control/merge-signer-not-enforced, destination: new_issue,
   text: 'dos.yaml R008 的 enforced_by 是 user_workflow：没有脚本阻止 agent 记录 merge 这道人门的结论。要么把它编译（记录签字人与 signer_kind），要么把 R008 的 enforced_by 诚实降级并在 §1 写明。'}
- {id: P-R7-05, source: R7/unenforced_rule/judgment/static-only-claim-not-enforced, destination: new_issue,
   text: 'dos.yaml R017 的 enforced_by 是 user_workflow：流水线里没有脚本拒绝一份把 static_only 说成 verified 的报告。本次审计用 check_audit.py 的 boolean_implemented / implemented_outside_enum 编译了这条规则，但只在审计文档内生效 —— 建议推广到验收侧。'}
- {id: P-R8-01, source: A-tune, destination: new_issue,
   text: 'naming misfit: tune → suggested_name harness-tune（产物是 harness-proposals，位置是 hill_climb 环，"调什么"是这个名字唯一没说的东西，而 target 恰是封闭集）；不重命名，另开 G2 变更提案 —— 改名要同时动 graph.yaml / loops.yaml / triggers.yaml / ARCHITECTURE §1 / retro 接线段。'}
- {id: P-R8-02, source: A-retro, destination: skill_fix_list,
   text: 'ARCHITECTURE.md#L42 §1 R8 的「门 / 闸」列把 metrics.py 与 tune.py 渲染成闸，但两者都无非零退出路径（tune/SKILL.md#L69 自述"报告工具"）。建议把该列改写为「导出：metrics.py / tune.py；控制：apply_proposal.py 只出 diff + human.harness-review」，否则设计视图高于实况（R017）。'}
- {id: P-R8-03, source: R8/newly_identified/control/retro-output-no-rejecting-gate, destination: new_issue,
   text: 'retro 的产物无拒绝型闸也无门，PSL-015 在 R8 断掉；建议补一个 verify_retro.py（检基线表存在、每条提案有 target ∈ 封闭集 / change / verify_by、数字来自 metrics.json 而非手抄）。'}
- {id: P-R8-04, source: 'R8/newly_identified/knowledge+judgment/harness-change-effect-unmeasured', destination: new_issue,
   text: 'hill_climb 的 success 谓词只到 merged | rejected，没有"上期 expected_delta 是否兑现"的回读；建议在 loops.yaml#hill_climb 的 goal 里加一条效果谓词，并让 tune.py 下一期先核对上期提案的 verify_by。'}
- {id: P-R8-05, source: R8/unenforced_rule/judgment/uncalibrated-tune-thresholds, destination: skill_fix_list,
   text: 'tune 的 40% / 50% / 0.95 是文献先验、未在本仓库校准（gate.json fix_list 已自述），但产出的提案没有携带"未校准"的标记；建议 tune.py 在每条提案里带 calibrated: false，让人在 review 时看得见（PSL-007）。'}
- {id: P-R8-06, source: A-human_gate.harness-review, destination: skill_fix_list,
