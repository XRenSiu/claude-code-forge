# =============================================================================
# 疑似重复的 Part 对 —— 装配层（CARD-06）新增的对照表，片段里没有这一节。
# 每条只登记「哪两个配件被怀疑重复」与「这条裁决落在哪份记录上」。
# Artifact 对照与 verdict 由 render_audit.py 从 artifacts[] 与两个 Part 的
# needed.verdict 现算，并与这里记的 verdict 比对——不一致会在 AUDIT.md 里标出来，
# 所以这一节不承重，它只是「该看哪几对」的索引。
# 判据（G1 规则 1 + F-05）：争同一个 Artifact 且记了 alternatives_of → alternatives_of；
# 争同一个 Artifact 且两边都标 merge_candidate → merge_candidate；产物各不相同 → distinct_exits。
# =============================================================================
- id: P-RA-01
  source: R2/newly_identified/control/gaming-band-unvalidated-at-r2
  destination: skill_fix_list
  text: 'done_when.yaml 新增的 gaming_risk_threshold（done_below / block_at_or_above）在 R2 无人校验：acceptance-spec 的 validate_done_when.py 与 donewhen-extract 的 validate_done_when_v2.py 都不认识这个字段，唯一校验它的是 R6 的 next_iteration.py。后果是一份倒挂的阈值（done_below=7 / block_at_or_above=3）在 R2 判 clean、被 G2 冻进锁，直到 R6 第一次 ratchet 才炸——那时改契约的代价从"写契约时改一行"变成"解冻一份已签字的契约"。建议把这条校验前移到 v2 校验器。收件人：donewhen-extract 的 eval/gate.json fix_list。'
- id: P-RA-02
  source: R5/newly_identified/control/gate-json-stale-after-script-lands
  destination: new_issue
  text: '没有任何机械物要求「skill 的脚本变了，它的 eval/gate.json 必须一起变」。本轮 commit 长出承重脚本 commit.sh、verify_commit.py 加了六类新拒绝，而 commit/eval/gate.json 一个字节没动；plan-cards 同样。后果是效力档位失去对账基础——R017「效力声明不得超过证据档」在证据档比代码旧的时候形同虚设。建议：给 verify_commit.py 加一条检查，skills/<s>/scripts/ 有改动而 skills/<s>/eval/gate.json 的 provenance.date 未动即 flag（不是 reject，因为文档改动也算改动）。'
- id: P-RA-03
  source: R6/newly_identified/control/drift-consumer-flag-not-updated
  destination: skill_fix_list
  text: 'spec-drift-detector 的输入契约被单边改了而它自己不知道：acceptance-fleet 现在按 skill-dispatch-matrix.md 传 --qa-measurements 并明令禁止 --qa-report，而 spec-drift-detector/SKILL.md 的参数表仍只定义 --qa-report、铁律 8 仍指导用它。调度方与被调度方对同一个 flag 说两件事。建议改齐 SKILL.md，或让调度矩阵与参数表同源。收件人：spec-drift-detector 的 eval/gate.json fix_list。'
- id: P-RA-04
  source: R6/newly_identified/knowledge+control/ratchet-log-filenames-diverge-from-graph
  destination: new_issue
  text: 'ratchet-log 的文件名两处不一致，已被三轮真实 run 坐实：落地的是 fleet-outputs/{code-reviewer-security,qa-reviewer,pm-reviewer,…}.yaml 与 meta-judge-output.yaml，而 graph.yaml 写的是 ratchet-log/iteration-NNN/{code-review-*,qa-review,…}.yaml 与 final-verdict.yaml——目录层级、文件基名都不同。任何按 graph.yaml 找文件的下游都会扑空。定一个名并全线改齐（与 P-R6-05 是同一件事的两半）。'
- id: P-RA-05
  source: R6/newly_identified/control/gate-json-not-synced-with-smoke-coverage
  destination: skill_fix_list
  text: 'acceptance-fleet 长出了两个真闸（next_iteration.py / qa_facts.py）并有 smoke 覆盖，而它的 eval/gate.json 仍写 gate_pass=static_only、scripts_run 为空对象。证据档比代码旧，读 gate.json 的人会低估它的承重。收件人：acceptance-fleet 的 eval/gate.json。'
- id: P-RA-08
  source: spine/unenforced_rule/control/r008-human-signer
  destination: skill_fix_list
  text: '`lock_done_when.py verify` 在被锁文件有改动时判 changed_with_proposal 放行，而它认的"提案"是目录下存在任何一份 change-proposal-*.md，不核对它是否针对本次改动——两份历史提案足以让今后任何一次锁内改动过闸。建议：提案里写明本次覆盖的文件清单，verify 比对改动集是否被某一份提案完全覆盖；或要求提案文件本身在同一 diff 里是新增/修改。登记为 I-100，本轮不改：改它要动 change-proposal-003 赖以生效的那条判据，同一提交里既改判据又用判据放行自己，是把裁判和运动员合一。'
- id: P-RA-07
  source: spine/newly_identified/control/evidence-anchors-unprotected
  destination: skill_fix_list
  text: '把 check_anchors.py 的 verify 并进 check_audit.py，让"锚点还指着同一段字"和 orphan_gap / gate_cap 一样成为报告自身的判定条件之一（新增失败谓词 anchor_drift）。要走变更提案 + l5 重签，因为 check_audit.py 是 role=gate 的冻结脚本。并进去之前，anchors.lock 的刷新要跟 audit.yaml 的改动同一个提交，否则锁自己就是过期证据。收件人：ring-audit 的 tests-manifest 与 check_audit.py 的变更提案。'
- id: P-RA-06
  source: R7/newly_identified/judgment/solo-a-tier-count-not-from-the-contract
  destination: new_issue
  text: '单人仓库替代谓词把「该轮 A 档存活 = 0」当作 APPROVED 的替代必要条件，但 A 档的数怎么来没有契约：脚本取 findings 文件里显式的 a_tier_survivors，没有就数 tier: A / severity: P0 的条目——两种数法可能给出不同的数，而写 findings 的是被审方自己的预审 agent。建议把 A 档判据写进 done_when 或 agents/pr-reviewer.md 的输出契约，让这个数有来源。'

