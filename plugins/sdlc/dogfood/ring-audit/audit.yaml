          文件缺失或为空 exit 1；#L374-L395 的内嵌校验器逐条拒 —— PyYAML 缺席 exit 1（fail closed）、
          不是合法 YAML、没有 `review:` 块、review 块缺 target / mergeable、没有 findings 键、
          findings 为空列表又没有 rationale，全部 exit 1。它是承重的：单人仓库的终止谓词
          （done --solo）把"≥1 轮 selfreview 记录"当作 APPROVED 的替代必要条件
          （pr-poll.sh#L222-L228、review-loop/SKILL.md#L56-L75），产不出合格的 findings 文件就登记不了那一轮。
          封顶的前提（独占产物无闸）因此消失，两种读法现在都落在 compiled。
          **这条闸薄在哪里，与 qa-reviewer 那条一视同仁地写明**：它校验的是 findings 文件的**形状**
          （有 review 块、有 target / mergeable / findings、空 findings 要 rationale），不校验这一轮
          是不是真由隔离上下文做的。出处不可校验 —— I-95 实测：两个进程各自试跑一次 selfreview，
          `self_review.rounds` 就到了 2，而谁都没做过一轮真正的预审。这不推翻 compiled
          （compiled 的定义是"有 verify 脚本或被门挡"，不是"这道闸不可绕"），
          但它正是 verified 仍然遥远的原因之一，也是本 Part 的 not_reached.verified 该读的那一条。
          还有一条要并列写下：重审第一次列举这条校验器的拒绝路径当作承重证据时，**漏了它的一处假拒**——
          `mergeable: no`（YAML 1.1 的 False）会被判成"缺 mergeable"，也就是说"有 A 档、别合"
          这个结论本身过不了闸，而 `no (A-tier)` 能过。压力朝着更宽松的判词。由隔离预审抓出（I-98），
          已修并配孪生期望与变异证明。一条闸的承重证据里漏掉它自己的假拒，
          和只数它认得的那部分锚点是同一种错。
