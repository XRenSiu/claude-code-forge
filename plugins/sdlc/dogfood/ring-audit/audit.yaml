      instrument: plugins/sdlc/dogfood/ring-audit/check_anchors.py
      lock: plugins/sdlc/dogfood/ring-audit/anchors.lock
      verified: 'check_anchors.py verify → 505/505 SAME, exit 0。对账现在是闭合的：文件里 `#L数字` 原始出现 506 次，减去 4 次 dos_anchors 模式（那是 render_audit.py 用来现算归属的匹配串，不是指向某文件某行的引用）得 502 个 #L 锚点，加 3 个冒号式共 505，与走到的数逐个对上。工具自己做这条对账并在对不上时 exit 1 —— 因为「走到 N · 锁里比对了 M」只能量走到的那部分，**结构上看不见从未进过扫描的写法**，而那正是这一族栽了四次的地方（I-103）。变异的**不依赖插入点的表述**：往被引文件任意位置插一行 → 插入点之前的锚点仍判 SAME，之后的判 MOVED，跨越插入点的区间判 GONE，**exit 1**。要留具体数字就必须写明插在第几行：插 graph.yaml 第 5 / 240 / 300 行后，MOVED 分别 137 / 59 / 43，GONE 2 / 1 / 0。把 MOVED 写成一个不带插入点的定值就是不可复现的断言（PR #3 预审 F-1 / F-5 指出，原文曾写死 123 MOVED + 1 GONE）。'
