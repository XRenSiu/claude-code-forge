    spec_says: >-
      AUDIT.md L976 (from render_audit.py L533): "无 Card footer 的提交（只记录，不进判定） | 自第一个 Card 提交起扫了 20 个，
      其中 4 个碰了被审目录" — the footer-less scan starts at the first Card commit.
    code_does: >-
