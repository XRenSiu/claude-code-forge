# ------------------------------------------------------------------------------------------------------------
# D3-D6 — drift signals (ordered by severity; each anchored, reproduced, traced)
# ------------------------------------------------------------------------------------------------------------
summary:
  signals: 11
  by_type: {timing_mismatch: 0, behavior_mismatch: 7, contract_mismatch: 4}
  by_recommendation: {update_spec: 3, fix_code: 2, needs_human: 6}
  by_severity: {high: 0, medium: 3, low: 8}
  headline: >-
    Both check_runs and the PSL-003 replay reproduce exactly at 4ddb362 (modulo the recording commit itself), AUDIT.md
    is a byte-identical projection of audit.yaml, and the three places audit.schema.md "supersedes" the CARD-01 notes
    are honoured by check_audit.py. The drift that remains is doc-vs-code: one rendered sentence describes a scan
    window the script no longer uses (and the data on the same page contradicts it); the schema document lists six
    top-level registries where the data and renderer use eight; the replay instrument's two footer matchers disagree
    on case so a mixed-case footer commit escapes both passes; --rings silently disables ring_unexpected against a
    "narrows no other predicate" claim; plus six low-severity enum / count / wording divergences.

