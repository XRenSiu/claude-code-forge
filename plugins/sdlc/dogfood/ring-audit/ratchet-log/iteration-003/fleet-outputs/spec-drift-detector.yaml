  evaluated_at_head: 4ddb362          # per COMMON.md. HEAD advanced to f11f0e2 (a footer-less docs commit) while this
                                      # run was in progress; `git diff --quiet 4ddb362 -- <all impl files>` is clean,
                                      # so every impl/spec line cited below is byte-identical at 4ddb362 and f11f0e2.
  impl_root: plugins/sdlc/dogfood/ring-audit/
  impl_diff: "git diff 57ebf2b..4ddb362 -- plugins/sdlc/dogfood/ring-audit (25 commits; incremental ba7d5e2..4ddb362 = a2deb83 + 4ddb362)"
  history_depth: 100                  # 25 commits touch impl_root in 57ebf2b..4ddb362, so nothing is pre_history
  spec_robustness: absent             # plugins/sdlc/dogfood/ring-audit/spec-robustness.md does not exist (recorded, not judged)
  qa_report: read                     # ratchet-log/iteration-003/fleet-outputs/qa-reviewer.yaml existed on the final re-read;
                                      # used only as corroboration (it independently reproduced card_commits 15 / touching 0 at
                                      # 4ddb362 and check_audit ok:true). The spec carries no measurable non-functional
                                      # threshold, so iron rule 8 never triggered and no signal depends on it.
