# drift-signals.yaml — /spec-drift-detector, acceptance-fleet iteration-003 (sdlc-ring-audit)
# Shape: references/finding-schema.yaml does not exist in plugins/sdlc/skills/spec-drift-detector/, so the fields
# below are the ones SKILL.md D1-D7 name (claim_id / spec_location / code_location / spec_says / code_does /
# divergence_type / divergence_severity / confidence / commit_introducing_drift / drift_age / likely_intentional /
# recommendation / drift_notes / additional_contributing_commits / drift_origin / related_signal_id).
# Epistemological stance (iron rule 1): every signal says "spec says X, code does Y, diverged at Z". Nothing here says
# which side is right. `recommendation` is the D6 heuristic, not a verdict.

