qa_report:
  # ====== META BLOCK ======
  agent_role: qa-reviewer
  model: claude-sonnet-5
  classifier_model: n/a (no failures occurred; classifier not invoked)
  vendor: claude
  isolation: medium
  inputs_read:
    - plugins/sdlc/skills/qa-reviewer/SKILL.md
    - plugins/sdlc/skills/qa-reviewer/references/finding-schema.yaml
    - plugins/sdlc/skills/qa-reviewer/references/test-layer-protocol.md
    - plugins/sdlc/skills/qa-reviewer/references/thresholds-format.md
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/run_tests.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/existence.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/mutation.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/mutation.config.yaml
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/RED_BASELINE.txt
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/tests-manifest.yaml
    - plugins/sdlc/dogfood/ring-audit/done_when.yaml (thresholds source)
    - plugins/sdlc/dogfood/ring-audit/calibration_report.yaml
    - plugins/sdlc/dogfood/ring-audit/calibration/instrument_mutants.py
    - plugins/sdlc/dogfood/ring-audit/calibration/instrument_mutation.json
    - plugins/sdlc/dogfood/ring-audit/check_audit.py (executed directly against audit.yaml)
    - plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh (executed)
    - git log/diff 57ebf2b..843c3ee (read-only, to trace provenance of the one commit that touches tests/ring-audit)
  test_source: plugins/sdlc/dogfood/ring-audit/tests/ring-audit
  thresholds_source: plugins/sdlc/dogfood/ring-audit/done_when.yaml (behavior.thresholds block)
  baseline_source: null   # iteration 1, no baseline
  layers_run: [existence, unit, integration, mutation]
  layers_skipped:
    - {name: e2e, reason: "not_applicable — CLI/file-output feature (check_audit.py, AUDIT.md render), no UI or API surface to drive; done_when.yaml does not set e2e_required"}
  duration_seconds: 12   # existence(~0) + run_tests.sh(~6s) + mutation.sh(~5s) + real-audit.yaml run + replay_card_commits.sh, wall time this session
  auto_fix_maintenance: false

  # ====== DECISION ======
  decision: GO
  decision_reasons:
    - "existence.sh: exit 0, all 4 declared observation boundaries (cli:check-audit, cli:verify-commit, ui:AUDIT.md#ring-tables, ui:AUDIT.md#run-evidence) present, 15/15 underlying assertions passed"
    - "run_tests.sh: 34/34 unit+integration tests pass (python3 -m unittest discover), 0 failed, 0 errored — reproduced verbatim, matches tests-manifest.yaml's 34 verbatim test names"
    - "mutation.sh (fixture-level L5 gate): kill_rate 1.0 (24/24) >= threshold 0.70 declared in mutation.config.yaml and done_when.yaml behavior.thresholds.mutation_kill_rate"
    - "check_audit.py run directly against the real audit.yaml (not just the fixture) also exits 0, ok:true, rings:10, parts_total:42, every *_missing/*_without_* count 0 — the fixture-level pass is not merely testing a synthetic copy"
    - "replay_card_commits.sh: 11 card commits replayed, card_commits_touching_audited_dirs: 0, 0 rejected — reproduces AC-007-a's claimed exit 0 independently"
    - "no genuine or maintenance failures occurred in any layer, so no findings and no classifier run"
  conditional_caveats: []

  # ====== SCOPE ======
  scope:
    tests_executed: 34
    tests_passed: 34
    tests_failed: 0
    tests_skipped: 0
    tests_errored: 0

  # ====== RESULTS PER LAYER ======
  results:
    existence:
      exit_code: 0
      checks_passed: 4          # the 4 boundaries declared in done_when.yaml's existence: block (15 underlying test/grep assertions inside existence.sh, all passed)
      checks_failed: 0
      failure_details: []
      duration_seconds: 0

    unit:
      passed: 32                # 34 total minus the 2 classified integration-style tests below, per tests-manifest.yaml's own split
      failed: 0
      skipped: 0
      errored: 0
      line_coverage: null       # suite is pure functional/assertion-based (fixture in -> exit code + JSON counts out); no coverage tool configured, not required by done_when.yaml
      branch_coverage: null
      duration_seconds: 6

    integration:
      passed: 2                 # test_AC_007_a_replay_card_commits_exit0_touching_zero, test_AC_007_b_card_commit_touching_skills_exit1_whitelist_overflow
      failed: 0
      line_coverage: null
      duration_seconds: 6       # runs inside the same run_tests.sh unittest discover pass; real git history replay, no mocks (mock_allowlist is empty per done_when.yaml)
      containers_used: []       # no testcontainers — this project's "integration" layer replays real git commits against a real repo checkout, not a service dependency

    e2e:
      passed: 0
      failed: 0
      duration_seconds: 0
      browser_used: null

  # ====== MUTATION (special) ======
  mutation:
    tool: "hand-rolled fixture mutants — tests/ring-audit/mutation.sh + mutation.config.yaml (mutmut/stryker not installed for this language mix)"
    qualified: true
    mutants_generated: 24
    mutants_killed: 24
    kill_rate: 1.0
    surviving_mutants: []
    duration_seconds: 5
    secondary_mirror:
      # Not part of the qa-reviewer L5 gate itself — this is /calibrate's separate "instrument mutation" mirror
      # (calibration_report.yaml). Reproduced independently on request; recorded here as corroborating evidence only.
      tool: "calibration/instrument_mutants.py — mutates check_audit.py source in a worktree, reruns the 34 L5 tests"
      total_mutants: 30
      killed: 23
      mutation_score: 0.767
      threshold: 0.70
      reproduced: true
      reproduction_note: >-
        Did not rerun instrument_mutants.py itself (it requires a throwaway worktree per its own docstring/argv[1]
        contract and mutates check_audit.py in place — unsafe to run against the primary checkout as instructed).
        Instead verified self-consistency of the committed calibration/instrument_mutation.json: killed=23,
        total_mutants=30, mutation_score round(23/30,3)=0.767 matches the file's own arithmetic; the "survived"
        list [M03, M04, M07, M14, M22, M23, M28] (7 items) matches calibration_report.yaml's surviving_mutants
        list exactly (same 7 mutant ids, same descriptions). No inconsistency found between the JSON and the
        report's prose or RED_BASELINE.txt's rev-2 numbers (19 ok / 15 FAIL at 57ebf2b, matching RED_BASELINE.txt
        head verbatim).
      status: "self-consistent; both mirrors clear the 0.70 floor (0.767 instrument-level, 1.0 fixture-level)"

  # ====== FINDINGS (only genuine failures) ======
  num_findings: 0
  findings: []

  # ====== MAINTENANCE ISSUES (non-blocking) ======
  maintenance_issues: []

  # ====== BASELINE REGRESSIONS ======
  regressions: []   # no --baseline for iteration 1

  # ====== CAVEATS ======
  caveats:
    runtime_gaps: []
    unknown_threshold_keys:
      - "done_when.yaml behavior.thresholds uses a bespoke key set (rings, dims_with_psl_id_ratio, card_commits_touching_audited_dirs, parts_total, required_parts_by_ring_group, mutation_kill_rate) rather than thresholds-format.md's canonical keys (unit_coverage_min, failures_allowed_max, severity_policy, etc.). Most of these values are not independently computed by qa-reviewer from generic runner output — they are literal assertions embedded inside the AC-named unittest methods themselves (e.g. rings==10, parts_total==42 asserted in test_AC_001_a_complete_...). This is a valid but non-standard use of the thresholds file for this contract; treated as informative, not blocking, since the embedded assertions did in fact all pass (see results.unit)."
    slow_layers: []
    decision_qualifier: null
    other:
      - "spec-robustness.md does not exist for this Run (confirmed absent, per task brief) — out of scope for qa-reviewer (that gap is spec-gaming-detector's / acceptance-fleet's to weigh), noted here only so the fleet doesn't lose the fact."
      - "AC-005-a and AC-006-a are human-judged ACs (done_when.yaml rules: 'human ACs AC-005-a / AC-006-a route to G3; they are never auto-passed'). qa-reviewer did not and should not auto-pass them; existence.sh only checks that the AUDIT.md sections they reference (#ring-tables, #run-evidence) exist and are structurally shaped (headers/table columns present), not that their content satisfies the human judge's rubric. This run reports evidence, not a verdict, for those two ACs — consistent with SKILL.md's routing rule."
      - "One commit in the reviewed range (e217d10, 'test(sdlc): ring-audit L5 re-encoded under G1 interpretation rules 1-3') modifies tests/ring-audit/** and .done_when.lock, which are both in done_when.yaml's constraints.forbidden_paths. Traced this because forbidden_paths nominally bars touching the test suite. Findings: e217d10 carries no 'Card:' footer, predates the first Card commit (08238cd) in commit order, and its message documents an explicit 'change proposal 001' (task-layer reflow) re-signing the l5 lock via g2-judge (delegated_agent) before any implementer began work — RED_BASELINE.txt revision 2 in that commit records the resulting 19-ok/15-FAIL baseline, which is exactly what tests/ring-audit/RED_BASELINE.txt shows today. This reads as the test-authoring role legitimately revising its own not-yet-implemented contract, not a Card implementer softening tests post hoc. Flagging for the fleet's record since it's adjacent to forbidden_paths and spec-gaming concerns, but treating it as qa-reviewer-out-of-scope (spec-gaming-detector owns the gaming judgment) rather than as a finding here — no test that was ever green was made to pass by editing it after the fact, which is the failure mode qa-reviewer's iron rules actually guard against."
