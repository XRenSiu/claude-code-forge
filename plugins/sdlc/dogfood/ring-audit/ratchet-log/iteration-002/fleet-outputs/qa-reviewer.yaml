qa_report:
  # ====== META BLOCK ======
  agent_role: qa-reviewer
  model: claude-sonnet-5
  classifier_model: n/a (no failures occurred; classifier not invoked)
  vendor: claude
  isolation: medium
  inputs_read:
    - plugins/sdlc/skills/qa-reviewer/SKILL.md
    - plugins/sdlc/skills/qa-reviewer/references/finding-schema.yaml
    - plugins/sdlc/skills/qa-reviewer/references/test-layer-protocol.md
    - plugins/sdlc/skills/qa-reviewer/references/thresholds-format.md
    - plugins/sdlc/skills/qa-reviewer/references/maintenance-vs-genuine.md
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/existence.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/run_tests.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/mutation.sh (executed)
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/mutation.config.yaml
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/tests-manifest.yaml
    - plugins/sdlc/dogfood/ring-audit/tests/ring-audit/test_check_audit.py
    - plugins/sdlc/dogfood/ring-audit/done_when.yaml (thresholds source, behavior.thresholds block)
    - plugins/sdlc/dogfood/ring-audit/calibration_report.yaml
    - plugins/sdlc/dogfood/ring-audit/calibration/instrument_mutation.json (self-consistency check only, not re-run)
    - plugins/sdlc/dogfood/ring-audit/check_audit.py (executed directly against real audit.yaml)
    - plugins/sdlc/dogfood/ring-audit/render_audit.py (read + executed to regenerate AUDIT.md)
    - plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh (executed against real repo)
    - plugins/sdlc/dogfood/ring-audit/audit.yaml (read, incl. run_evidence.audited_dirs_diff)
    - plugins/sdlc/dogfood/ring-audit/AUDIT.md (read + diffed against a fresh render)
    - plugins/sdlc/dogfood/ring-audit/ratchet-log/iteration-001/fleet-outputs/qa-reviewer.yaml (--baseline, this file ONLY)
    - git diff 843c3ee..ba7d5e2 -- plugins/sdlc/dogfood/ring-audit (incremental fix diff, read-only)
  test_source: plugins/sdlc/dogfood/ring-audit/tests/ring-audit
  thresholds_source: plugins/sdlc/dogfood/ring-audit/done_when.yaml (behavior.thresholds block)
  baseline_source: plugins/sdlc/dogfood/ring-audit/ratchet-log/iteration-001/fleet-outputs/qa-reviewer.yaml
  layers_run: [existence, unit, integration, mutation]
  layers_skipped:
    - {name: e2e, reason: "not_applicable — CLI/file-output feature (check_audit.py, AUDIT.md render), no UI or API surface to drive; done_when.yaml does not set e2e_required. Unchanged from baseline."}
  duration_seconds: 14   # existence + run_tests.sh(6.1s) + mutation.sh + real check_audit.py run + render_audit.py regen-diff + replay_card_commits.sh, wall time this session
  auto_fix_maintenance: false

  # ====== DECISION ======
  decision: GO
  decision_reasons:
    - "existence.sh: exit 0, all 4 declared observation boundaries present — identical to baseline (iteration-001), no regression"
    - "run_tests.sh: 34/34 unit+integration tests pass (python3 -m unittest discover, 6.114s), 0 failed/errored — identical count and test names to baseline; tests/ring-audit/** is untouched in the 843c3ee..ba7d5e2 diff (l5 lock held), so this is the same locked suite, re-verified green on the fixed head"
    - "mutation.sh (fixture-level L5 gate): kill_rate 1.0 (24/24) >= threshold 0.70 — identical to baseline"
    - "check_audit.py run directly against the real audit.yaml (not just the fixture) exits 0, ok:true, rings:10, parts_total:42, every *_missing/*_without_* count 0 — reproduced independently this iteration"
    - "replay_card_commits.sh run directly against the real repo (branch docs/1-sdlc-ring-audit, HEAD ba7d5e2): ok:true, card_commits:13, card_commits_touching_audited_dirs:0, card_commits_rejected:0, non_card_commits_scanned:8, non_card_commits_touching_audited_dirs:0 — the incremental fix ('replay reports footer-less commits additively' + '--no-renames') is present in the script and runs cleanly against real history, not just a fixture"
    - "render_audit.py regenerated from audit.yaml is byte-identical to the committed AUDIT.md (1091 lines) — no rendering drift; spot-checked the two content fixes named in the fix set (artifact 闸/checked_by column, closed signer_kind map 人签/代签(delegated)) are present and rendered as claimed"
    - "calibration_report.yaml's two mutation numbers reproduce: fixture-level 24/24 (1.0) reproduced live via mutation.sh above; instrument-level 23/30 (0.767) verified self-consistent in calibration/instrument_mutation.json (30 results, 23 with killed_by set, survived list has exactly the 7 ids [M03,M04,M07,M14,M22,M23,M28] that both the JSON and calibration_report.yaml's prose list, 23+7=30, round(23/30,3)=0.767) — did not re-run instrument_mutants.py itself per task instruction (it requires a disposable worktree argument and mutates check_audit.py in place; unsafe on the primary checkout)"
    - "no genuine or maintenance failures occurred in any layer this iteration; no regression vs iteration-001 baseline (same 34/34, same 24/24, same existence 4/4)"
  conditional_caveats: []

  # ====== SCOPE ======
  scope:
    tests_executed: 34
    tests_passed: 34
    tests_failed: 0
    tests_skipped: 0
    tests_errored: 0

  # ====== RESULTS PER LAYER ======
  results:
    existence:
      exit_code: 0
      checks_passed: 4          # the 4 boundaries declared in done_when.yaml's existence: block; identical to baseline
      checks_failed: 0
      failure_details: []
      duration_seconds: 0

    unit:
      passed: 32                # 34 total minus the 2 REQ-007 replay tests classed as integration below, per tests-manifest.yaml's own split — unchanged from baseline
      failed: 0
      skipped: 0
      errored: 0
      line_coverage: null       # no coverage tool configured; suite is pure functional/assertion-based (fixture in -> exit code + JSON counts out); not required by done_when.yaml
      branch_coverage: null
      duration_seconds: 6

    integration:
      passed: 2                 # test_AC_007_a_replay_card_commits_exit0_touching_zero, test_AC_007_b_card_commit_touching_skills_exit1_whitelist_overflow
      failed: 0
      line_coverage: null
      duration_seconds: 6       # runs inside the same run_tests.sh unittest discover pass; real git history replay against a scratch worktree, no mocks (mock_allowlist is empty per done_when.yaml)
      containers_used: []       # no testcontainers — this project's "integration" layer replays real git commits, not a service dependency

    e2e:
      passed: 0
      failed: 0
      duration_seconds: 0
      browser_used: null

  # ====== MUTATION (special) ======
  mutation:
    tool: "hand-rolled fixture mutants — tests/ring-audit/mutation.sh + mutation.config.yaml (mutmut/stryker not installed for this language mix)"
    qualified: true
    mutants_generated: 24
    mutants_killed: 24
    kill_rate: 1.0
    surviving_mutants: []
    duration_seconds: 5
    secondary_mirror:
      # /calibrate's separate "instrument mutation" mirror (calibration_report.yaml) — not part of the qa-reviewer
      # L5 gate itself, recorded here as corroborating evidence per the task brief's instruction to cross-check it.
      tool: "calibration/instrument_mutants.py — mutates check_audit.py source in a disposable worktree, reruns the 34 L5 tests"
      total_mutants: 30
      killed: 23
      mutation_score: 0.767
      threshold: 0.70
      reproduced: true
      reproduction_note: >-
        Did not execute instrument_mutants.py this iteration (its own docstring/argv contract requires a
        throwaway worktree path and it mutates check_audit.py in place — unsafe against the primary checkout,
        and the task brief explicitly says not to run it there). Instead re-verified self-consistency of the
        committed calibration/instrument_mutation.json independently: total_mutants=30, killed=23,
        len(survived)=7, 23+7=30, round(23/30,3)=0.767 matches the file's own mutation_score field; the 7
        survived ids [M03, M04, M07, M14, M22, M23, M28] match calibration_report.yaml's surviving_mutants list
        exactly (same ids, same order). No inconsistency found. Unchanged from baseline iteration's finding.
      status: "self-consistent; both mirrors clear the 0.70 floor (0.767 instrument-level, 1.0 fixture-level)"

  # ====== FINDINGS (only genuine failures) ======
  num_findings: 0
  findings: []

  # ====== MAINTENANCE ISSUES (non-blocking) ======
  maintenance_issues: []

  # ====== BASELINE REGRESSIONS ======
  regressions: []   # baseline (iteration-001) was decision:GO, 34/34, 24/24 fixture kill rate, existence 4/4 — this iteration matches on every axis; no test that passed at baseline now fails, no coverage/kill-rate drop

  # ====== CAVEATS ======
  caveats:
    runtime_gaps: []
    unknown_threshold_keys:
      - "done_when.yaml behavior.thresholds uses a bespoke key set (rings, dims_with_psl_id_ratio, card_commits_touching_audited_dirs, parts_total, required_parts_by_ring_group, mutation_kill_rate) rather than thresholds-format.md's canonical keys. Unchanged from baseline: these values are literal assertions embedded inside the AC-named unittest methods themselves, not independently computed by qa-reviewer from generic runner output. Treated as informative, not blocking — the embedded assertions all passed."
    slow_layers: []
    decision_qualifier: null
    other:
      - "TEST-COVERAGE GAP (new this iteration, not present in baseline because the code didn't exist yet): the incremental fix diff (843c3ee..ba7d5e2) rewrites substantial render_audit.py logic — cell()/code() markdown-escaping (pipe/backtick/newline handling), the closed SIGNER_KIND_RENDER map (human -> 人签, delegated_agent -> 代签(delegated), anything else falls through to str() rather than erroring), and the new checked_by_cell() method — but tests/ring-audit/test_check_audit.py exercises only check_audit.py, never render_audit.py, and it is unchanged/untouched in this diff (l5 lock held, correctly — render_audit.py is presentation, not an AC predicate). existence.sh's AUDIT.md check is structural only (section headers, table header row present), not content-correct (it would not catch a broken escape or a mis-rendered signer_kind). I closed this gap manually this iteration by regenerating AUDIT.md from audit.yaml with render_audit.py and diffing byte-for-byte against the committed file (identical, 1091 lines) plus spot-reading the checked_by and signer_kind cells in the output — both correct. Flagging so the fleet's record shows this was human/agent-verified-by-inspection, not machine-gated; a future regression in render_audit.py's escaping would not be caught by any layer qa-reviewer runs today. Recommend routing to /calibrate or /test-suite-generator as a gap for the next test-suite ratchet (a golden-file byte-diff check for AUDIT.md would close it cheaply), not blocking this run."
      - "DATA-INTEGRITY OBSERVATION in audit.yaml (not a test failure, so not filed as a finding; surfacing because it feeds AC-006-a's human/G3 evidence): run_evidence.audited_dirs_diff carries a top-level `exit: 1` field alongside `ok: true`, `card_commits_touching_audited_dirs: 0`, `card_commits_rejected: 0`, and all 12 rows of touches_audited_dirs_per_commit showing `exit: 0` / `touches_audited_dirs: false`. Read replay_card_commits.sh's own exit-code logic (tail of the script): `status=0` unless `rejected>0` or `overflow>0`, and `ok` is printed as `$([ status -eq 0 ] && true || false)` — i.e. `exit` and `ok` are definitionally the same value in every real invocation of this script; they cannot legitimately disagree given touching=0 and rejected=0. So the recorded `exit: 1` is inconsistent with the rest of the same block and with the script's own contract — most likely a stale value carried over from an earlier run on the `fix/iter-002` branch (head 9ad5b9c, per the block's own branch/head fields) that was not corrected when `ok: true` and the per-commit table were re-recorded. Practical impact is limited: I confirmed render_audit.py does NOT surface the raw `exit` field into AUDIT.md's human-facing '回放结论' row — it only renders `ok: true` — so the AC-006-a human reviewer does not actually see this contradiction; only the underlying audit.yaml source data carries it. I independently reran replay_card_commits.sh against the current branch (docs/1-sdlc-ring-audit, HEAD ba7d5e2) and got a fully consistent ok:true/exit:0 result (card_commits:13, non_card_commits_scanned:8, both touching counts 0), so the live claim (no card commit touched the audited dirs) is verified true regardless of this stale field. Recommend the next iteration correct or drop the stray `exit: 1` key in audit.yaml's audited_dirs_diff block for evidentiary hygiene."
      - "spec-robustness.md does not exist for this Run (confirmed absent again this iteration) — out of scope for qa-reviewer (spec-gaming-detector's / acceptance-fleet's to weigh), noted only so the fleet doesn't lose the fact. Unchanged from baseline."
      - "AC-005-a and AC-006-a remain human-judged ACs routed to G3 per done_when.yaml's rules block; qa-reviewer did not and should not auto-pass them. existence.sh only checks structural presence of the AUDIT.md sections they reference, not that content satisfies the human judge's rubric. This run reports evidence, not a verdict, for those two ACs — unchanged from baseline."
