      target_artifact: done_when.yaml
      proposed_diff: null
    - gap_id: srg-005
      pattern_that_exploited_it: "unclassified:gate_scoped_to_footer_carrying_commits"
      finding_id_reference: null            # no finding scored: PSL γ (L122-L123) sanctions in-run verifier deviations; disclosed in commit-table.md / pr-body.md
      contract_weakness: "REQ-007 / AC-007-a gate only commits carrying a `Card:` footer, and the new second pass scans only from the first Card commit forward. Three same-Run commits before that window (587f371, ebe270d, c729f76) edited plugins/sdlc/skills/** — c729f76 edited verify_commit.py, the very oracle the replay calls — and are structurally invisible to both passes; AUDIT.md's PSL-003 section (自第一个 Card 提交起 … 0 行) is true but the user's A8 question '审计动过被审目录吗' is answered only for the Card window. A footer omitted on purpose would evade the gate the same way."
      suggested_mitigation: "AC-006-a: run_evidence must list every same-Run commit (Card or not, from the branch base) that touched the audited dirs, with its ledger deviation ref; replay_card_commits.sh second pass should start at the merge-base with main, not at the first Card commit, and any hit without a ledger deviation row should fail (deviation_undeclared)."
      target_artifact: done_when.yaml
      proposed_diff: null
    - gap_id: srg-006
      pattern_that_exploited_it: "unclassified:presence_check_satisfiable_by_irrelevant_evidence"
      finding_id_reference: null            # no finding scored: content is currently honest (0 verified; 1 unresolvable ref); the ruler just cannot see either
      contract_weakness: "AC-002-a requires ≥1 psl_id and ≥1 evidence per dimension but nothing about relevance or resolvability. Crafted variants confirm: evidence.ref to a nonexistent file exits 0; implemented.verdict verified with only kind=file evidence exits 0. In the shipped content 40/42 naming dims cite exactly [PSL-014] and 33/42 implemented dims exactly [PSL-010, PSL-015] (lawful but constant — the predicate would pass a document that cited the same id everywhere), and one ref (spine/sdlc.implemented smoke 'plugins/sdlc/eval/smoke.sh（…）') does not resolve as written."
      suggested_mitigation: "Add evidence_ref_unresolvable (path must exist; #Lnn-Lmm within file length; gate_json anchor key must be present with the stated value) and verified_without_run_record (verdict verified ⇒ ≥1 evidence kind ∈ {run_record, smoke}); consider a per-dimension psl_id diversity floor in spec-robustness.md verifier_hints."
