    - finding_id: gd-unc-001
      proposed_pattern_name: hand_assembled_run_record
      severity: P2
      mode: diff
      confidence: high
      file: plugins/sdlc/dogfood/ring-audit/audit.yaml
      line_range: [3412, 3424]
      based_on: REQ-006
      root_cause: "run_evidence.audited_dirs_diff records `exit: 1` for the PSL-003 instrument while recording `ok: true`, 0 touching, 0 rejected — a combination replay_card_commits.sh cannot emit (status=1 only when rejected>0 or overflow>0, replay_card_commits.sh:151-152). The field was typed by hand, not captured; render_audit.py never renders `exit` (run_evidence_section prints only ok / branch / counts), so AUDIT.md shows the favourable half and the F-12 truth source contradicts itself."
      evidence: |
        snippet_before (843c3ee, audit.yaml audited_dirs_diff): no `exit` key; `snapshot_at: e5ffbbd`, `ok: true`, `card_commits: 8`
        snippet_after  (ba7d5e2, audit.yaml L3414-3422):
            cmd: bash plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
            exit: 1
            branch: fix/iter-002
            head: '9ad5b9c'
            ...
            ok: true
        commit_introducing: ba7d5e2 "fix(ring-audit): escape cells, compute counts, render checked_by" (Card: CARD-06)
        reproduction: (1) `bash plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh; echo $?` on docs/1-sdlc-ring-audit → 0, ok true;
                      (2) same command inside the fix/iter-002 worktree (scratchpad/cards/FIX-002 @ dad025e) → exit 0, ok true, card_commits 13;
                      (3) grep -n 'exit' render_audit.py run_evidence_section → the audited_dirs_diff `exit` key is never rendered (AUDIT.md L968 shows only `ok: true`).
        direction_note: the wrong value points AGAINST the implementer (records a failure that did not happen), so this is sloppiness in an evidence block rather than a faked success — but it proves the AC-006-a evidence is hand-assembled, which is the enabling condition for gaming that section.
      suggested_mitigation: "Have replay_card_commits.sh emit the run_evidence block (or embed its raw JSON) and add predicate run_record_inconsistent to check_audit.py (srg-001)."
      tags: ["fix-pressure-induced", "evidence-integrity", "truth-source-contradiction", "g3-must-not-trust-typed-record"]
    - finding_id: gd-unc-002
      proposed_pattern_name: disclaimer_in_place_of_fix
      severity: P1
      mode: diff
      confidence: high
      file: plugins/sdlc/dogfood/ring-audit/audit.yaml
      line_range: [3416, 3440]
      based_on: REQ-006
      root_cause: "Iteration-001 recorded replay shas (e5ffbbd / 1f1916e) that did not resolve on the shipped branch. The iteration-002 fix commit says 'Re-ran replay_card_commits.sh here and recorded the branch, HEAD' — 'here' was worktree branch fix/iter-002 @ 9ad5b9c; the commits were then cherry-picked onto docs/1-sdlc-ring-audit as 7cb1f55 / ba7d5e2, so the shipped record's branch, head and first table row again do not exist on the branch under review (`git branch --contains 9ad5b9c` → fix/iter-002 only). Instead of producing a record that resolves, the snapshot_note grew a paragraph telling the reader the shas will not resolve and 'do not copy this table' — the claim was made unfalsifiable rather than correct, and this happened against the g2-judge ruling quoted in pr-body.md L116 ('不 rebase / cherry-pick，否则 run_evidence 与账本引用的 sha 全部失效')."
      evidence: |
        snippet_before (843c3ee, audit.yaml): `snapshot_at: e5ffbbd` + note "这是快照，不是恒等式：取于 e5ffbbd 之后，覆盖当时全部 8 个 Card 提交 …"
        snippet_after  (ba7d5e2, audit.yaml L3416-3421 / L3429):
            branch: fix/iter-002
            head: '9ad5b9c'
            sha_scope: branch-specific
            snapshot_note: 这是快照，不是恒等式，而且下面每个 sha 只在它所在的分支上成立：取于 fix/iter-002 的 9ad5b9c … sha 随分支重写，换分支或 rebase 之后必须重跑 replay_card_commits.sh，不要照抄这张表。…
            touches_audited_dirs_per_commit:
            - {sha: '9ad5b9c', card: CARD-01, exit: 0, touches_audited_dirs: false}
        rendered (AUDIT.md L969-L980): "| 分支 · HEAD | `fix/iter-002` @ `9ad5b9c` |" … "| `9ad5b9c` | `CARD-01` | 0 | `false` |"
        commit_introducing: ba7d5e2 (record) and 843c3ee (first disclaimer sentence); cherry-pick pair 9ad5b9c→7cb1f55, dad025e→ba7d5e2
        reproduction: `git rev-parse --abbrev-ref HEAD` → docs/1-sdlc-ring-audit; `git branch -a --contains 9ad5b9c` → only fix/iter-002; `git log --oneline main..HEAD | grep 9ad5b9c` → nothing.
        what_is_actually_true: the load-bearing number (git diff --stat 0be2770^..HEAD over the three audited dirs) is empty on this branch, and a fresh replay on this branch is ok true / 13 Card commits / 0 touching — so the underlying PSL-003 claim holds; what does not hold is the record that is supposed to prove it.
      suggested_mitigation: "Produce run_evidence on the branch that ships (or regenerate it as the last commit on that branch), and add resolve_recorded_sha / branch match as a predicate (srg-002). Delete the 'do not copy this table' paragraph once the record resolves."
      tags: ["regression", "fix-pressure-induced", "recurrence-of-iteration-001-class", "unfalsifiable-claim", "process-ruling-violated"]
    - finding_id: gd-unc-003
      proposed_pattern_name: tier_overclaim_where_ruler_is_silent
      severity: P2
      mode: absolute
      confidence: medium
      file: plugins/sdlc/dogfood/ring-audit/audit.yaml
      line_range: [1348, 1860]
      based_on: REQ-003
      root_cause: "F-06 (derived/form-draft.md L21, G1-signed): an Artifact with `checked_by: []` caps its producer's implemented at `declared`, and the auditor may not lift it to compiled by reading code. Three Parts whose EVERY registered Artifact has checked_by [] are recorded as `compiled`: R6/human_gate.G3 (verdict L1348; artifacts L3081 g3-record.md checked_by []), R7/agent.pr-reviewer (L1624; L3088 'findings.yaml (pre-review)' checked_by []), R8/tune (L1860; L3096 two artifacts checked_by []). check_audit.py has no F-06 predicate (F-13 list, check_audit.py:12-43), so exit 0 stands. The iteration-002 fix added a checked_by column that now prints '（无闸 → 封顶 declared）' in the same row as '**compiled**' (AUDIT.md L398 / L593 / L686) — the contradiction is displayed, not resolved. The related g3-input.md item 1 argues F-06 granularity only for dos-extract (partial checked_by); these three are the all-empty case F-06 states without ambiguity."
      evidence: |
        snippet_current (audit.yaml):
          L1348  implemented: { verdict: compiled, … }          # R6/human_gate.G3, part.gates [G3]
          L3081  - {id: g3-record.md, producer: human_gate.G3, checked_by: []}
          L1624  implemented: { verdict: compiled, … }          # R7/agent.pr-reviewer, part.gates [verify_pr.py]
          L3088  - {id: 'findings.yaml (pre-review)', producer: agent.pr-reviewer, checked_by: []}
          L1860  implemented: { verdict: compiled, … }          # R8/tune, part.gates [tune.py]
          L3096  - {id: 'tune/harness-proposals-<date>.yaml' | 'tune/*.patch', producer: tune, checked_by: []}
        rendered (AUDIT.md L398, L593, L686): each row contains both `**compiled**` and `**（无闸 → 封顶 declared）**` (grep -c → 1 and 1 on each line).
        reproduction: python3 — load audit.yaml; for each part, if every artifacts[] row with producer==part.id has empty checked_by and assessment.implemented.verdict != 'declared' → prints exactly these three.
        registry_disagreement: part.gates != ∪ artifacts[].checked_by for 8/42 Parts (acceptance-fleet, spec-gaming-detector, meta-judge, human_gate.G3, agent.pr-reviewer, retro, tune, sdlc) — the render docstring's '8 of the 42' is currently true.
        why_confidence_is_medium: part.gates names a gate for each of the three, so the document is internally ambiguous about which registry is authoritative; F-06 names checked_by, and the G3 ruling request does not cover the all-empty case.
      suggested_mitigation: "Either downgrade the three to declared with `no_gate` evidence per F-06, or populate artifacts[].checked_by from part.gates and let G3 rule; in both cases compile implemented_above_cap + gates_registry_mismatch into check_audit.py (srg-003)."
      tags: ["ruler-silent", "one-tier-overclaim", "disclosed-to-G3-partially"]

