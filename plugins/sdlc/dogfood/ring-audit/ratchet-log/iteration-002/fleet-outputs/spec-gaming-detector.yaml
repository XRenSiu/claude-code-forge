    - gap_id: srg-001
      pattern_that_exploited_it: "unclassified:hand_assembled_run_record"
      finding_id_reference: gd-unc-001
      contract_weakness: "AC-006-a accepts run_evidence as free-form hand-typed YAML: nothing requires the recorded exit code of the PSL-003 instrument to be the instrument's actual exit code, and nothing checks exit ⇔ ok consistency. F-12 makes audit.yaml the truth source, so a wrong hand-typed field IS the truth."
      suggested_mitigation: "Add a mechanical twin AC-006-b (observe cli:check-audit): run_evidence.audited_dirs_diff and check_runs[] must embed the instrument's raw stdout JSON (or its sha256) and check_audit.py gains predicate run_record_inconsistent (exit != 0 ⇔ ok == false; exit 0 ⇒ errors == []). Alternatively have replay_card_commits.sh write the record block itself so no human types it."
      target_artifact: done_when.yaml
      proposed_diff: |
        acceptance:
        +  - id: AC-006-b
        +    req: REQ-006
        +    kind: mechanical
        +    ears_type: unwanted
        +    observe: "cli:check-audit"
        +    given: { input: "audit.yaml whose run_evidence.audited_dirs_diff records exit 1 with ok true" }
        +    expect: { exit: 1, error: run_record_inconsistent }
        +    paired_with: AC-006-a
    - gap_id: srg-002
      pattern_that_exploited_it: "unclassified:disclaimer_in_place_of_fix"
      finding_id_reference: gd-unc-002
      contract_weakness: "AC-006-a / AC-007-a never require the replay record to resolve in the repository that ships it. A sha table produced in another worktree, invalidated by cherry-pick, and prefaced with 'do not copy this table' satisfies the letter of 'lists the git diff --stat record'. The g2-judge no-rebase/no-cherry-pick ruling lives only in pr-body.md, not in the contract."
      suggested_mitigation: "check_audit.py takes --repo and fails resolve_recorded_sha when any sha in run_evidence.audited_dirs_diff.touches_audited_dirs_per_commit[] or .head does not `git cat-file -e` in that repo, or when .branch != the branch under review; record staleness must be a predicate, not a paragraph. Add to AC-006-a statement: '回放记录的 head 与 sha 必须在被评分支上可解析'."
      target_artifact: done_when.yaml
      proposed_diff: |
        - id: AC-006-a
          statement: >-
            … 列出 Card-footer 提交对三个被审目录的 git diff --stat 记录（为空）与 skill-issues.md 的路径；
        +   回放记录的 branch / head / 每条 sha 必须在被评分支上 git cat-file -e 可解析，否则整块标 stale 且不当证据；
    - gap_id: srg-003
      pattern_that_exploited_it: "unclassified:tier_overclaim_where_ruler_is_silent"
      finding_id_reference: gd-unc-003
      contract_weakness: "F-06 (signed form) says a producer whose Artifact has checked_by: [] may not be above `declared`, but F-13's predicate list (and therefore AC-003-a's expect keys and the l5 fixtures) has no token for it. The content can carry `compiled` beside an empty checked_by and exit 0. audit.yaml also holds two registries for the same fact (part.gates vs artifacts[].checked_by) with no consistency predicate — 8/42 disagree."
      suggested_mitigation: "Add predicates implemented_above_cap (all artifacts of producer have checked_by == [] ⇒ implemented.verdict == declared) and gates_registry_mismatch (part.gates ⊄ ∪ artifacts[producer].checked_by) to AC-003-a expect and to mutation.config.yaml families; or have G3 rule F-06 granularity and encode the ruling as a predicate before the next Run."
      target_artifact: done_when.yaml
      proposed_diff: |
        - id: AC-003-a
        -   expect: { boolean_implemented: 0, implemented_outside_enum: 0, rename_true: 0 }
        +   expect: { boolean_implemented: 0, implemented_outside_enum: 0, rename_true: 0, implemented_above_cap: 0, gates_registry_mismatch: 0 }
    - gap_id: srg-004
      pattern_that_exploited_it: "unclassified:ruler_compiles_only_fixture_named_predicates"
      finding_id_reference: null            # no finding scored: the Run disclosed these itself as KG-01..04; re-confirmed here, unchanged since iteration-001
      contract_weakness: "Four spec-named predicates still have no token in check_audit.py (unchanged since iteration-001; all four crafted variants exit 0 today): KG-01 waived without waiver_ref (g1 rule 3c), KG-02 proposal.source dangling (AC-004-b says 'lacking a source assessment or gap id'; check_audit.py:399 tests non-empty only), KG-03 duplicate ring id → rings 11 exits 0 (AC-001-a expect rings 10 is count-only; check_rings checks set membership), KG-04 signer_kind outside {human, delegated_agent} (F-07). The contract names them in prose but has no -b twin, so the l5 suite never compels them."
