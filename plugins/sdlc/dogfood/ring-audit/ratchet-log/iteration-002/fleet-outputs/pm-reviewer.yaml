      bulleted: "Every Card-footer commit on the feature branch replays clean through verify_commit.py under its own card and none touches plugins/sdlc/skills|agents|docs; a Card commit editing an audited skill exits 1 with whitelist_overflow."
      bulleted_source: direct_quote
