  # Unchanged from iteration-001: the contract (done_when.yaml, G2-frozen) did not move between 843c3ee and ba7d5e2.
  normalized_requirements:
    - req_id: REQ-001
      original_text: |
        AC-001-a given {input: complete audit.yaml, psl: PSL-sdlc-ring-audit index 001..017, required_parts: agent.card-implementer, agent.comment-fixer, agent.fix-verifier, agent.pr-reviewer, agent.review-triager}
        expect {exit: 0, rings: 10, parts_total: 42, parts_without_assessment: 0, required_parts_missing: 0}
        AC-001-b given {input: audit.yaml with one ring entry removed} expect {exit: 1, error: ring_missing}
        hard_constraint: audit.yaml 顶层 rings 恰为 10 项（R0–R8 + spine）
      bulleted: "check-audit exits 0 on the complete audit.yaml with exactly 10 rings, 42 parts, every part assessed and the 5 agents present; exits 1 with ring_missing when a ring is removed."
      bulleted_source: direct_quote
      criticality: critical
      category: functional
    - req_id: REQ-002
      original_text: |
        AC-002-a expect {dims_without_psl_id: 0, dims_with_unknown_psl_id: 0, dims_without_evidence: 0}
        AC-002-b given {audit.yaml with one assessment dimension whose psl_ids is empty} expect {exit: 1, error: psl_id_missing}
        hard_constraint: Assessment 每维 ≥ 1 PSL-ID 与 ≥ 1 Evidence
      bulleted: "Every assessment dimension of every part cites ≥1 PSL-ID that exists in the PSL 规律索引 and carries ≥1 evidence entry; an empty psl_ids exits 1 with psl_id_missing."
      bulleted_source: direct_quote
      criticality: critical
      category: functional
    - req_id: REQ-003
      original_text: |
        AC-003-a expect {boolean_implemented: 0, implemented_outside_enum: 0, rename_true: 0}
        AC-003-b given {audit.yaml with implemented set to a boolean on one part} expect {exit: 1, error: boolean_implemented}
      bulleted: "implemented.verdict is one of declared|compiled|verified (never a boolean) and naming.rename is constant false on every part; a boolean implemented exits 1 with boolean_implemented."
      bulleted_source: direct_quote
      criticality: normal
      category: functional
    - req_id: REQ-004
      original_text: |
        AC-004-a expect {rings_without_missing_key: 0, orphan_gaps: 0, proposals_without_source: 0}
        AC-004-b given {audit.yaml with one proposal lacking a source assessment or gap id} expect {exit: 1, error: proposal_without_source}
        Scope do: 每环的 missing（缺少）；提案清单（每条有去向）
      bulleted: "Every ring carries a missing key, no gap is left orphaned, and every proposal names a source Assessment or Gap id; a proposal lacking such a source exits 1 with proposal_without_source."
      bulleted_source: direct_quote
      criticality: normal
      category: functional
    - req_id: REQ-005
      original_text: |
        AC-005-a kind: human, observe: ui:AUDIT.md#ring-tables, judge: tech, evidence: checklist — 每个 Part 行给出 Gap 原子集合、独占 Artifact（或 role gate | orchestrator）、检它的 Gate（script 写"闸"、human 写"门"）与 Loop；needed 判定的 deletion 测试写出撤掉它后流水线会产出的具体错误产物或漏检（不接受"流程会断"一类泛语）；naming 判定先写来路（authored | adopted）再写贴合，misfit 时给建议名且建议名比原名更贴产物或位置并标"不重命名"；疑似重复的 Part 对（至少 pr-review vs code-reviewer、donewhen-extract vs acceptance-spec）带 Artifact 对照与 distinct_exits | merge_candidate | alternatives_of 裁决；每环表末尾的 missing 行带来源标签（lifecycle_blank | newly_identified | unenforced_rule）、necessity 与 deletion 一句
      bulleted: "AUDIT.md ring tables carry, per Part row, gap atoms / exclusive artifact or role / 闸-vs-门 gate / loop, a concrete deletion test, provenance-then-fit naming with suggested name + 不重命名 on misfit, the two named duplicate pairs with artifact comparison and verdict, and per-ring missing rows with source label, necessity and deletion."
      bulleted_source: direct_quote
      criticality: normal
      category: functional
    - req_id: REQ-006
      original_text: |
        AC-006-a kind: human, observe: ui:AUDIT.md#run-evidence, judge: product, evidence: checklist — run_evidence 节列出 G1 / G2 / G3 的签字人、signer_kind 与授权引用，signer_kind = delegated_agent 的门不渲染为"人签"；列出 check-audit 对 audit.yaml 的 exit 0 与对删环变体的 exit 1 两次运行记录（缺变体记录时 exit 0 标 uncalibrated，A6 的回答如实带出该标记）；列出 Card-footer 提交对三个被审目录的 git diff --stat 记录（为空）与 skill-issues.md 的路径；外部证据的替代品标 substitute，不渲染为用户验证
      bulleted: "AUDIT.md run_evidence lists the G1/G2/G3 signer triplets with delegated never rendered as 人签, the exit-0 + delete-ring exit-1 twin (or an uncalibrated flag), the empty git diff --stat of Card commits over the three audited dirs, the skill-issues.md path, and the external-evidence substitute labelled as such."
      bulleted_source: direct_quote
      criticality: normal
      category: functional
    - req_id: REQ-007
