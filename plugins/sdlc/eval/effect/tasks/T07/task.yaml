id: T07
track: psl
title: 商品页的"相关推荐"不好用
prompt: |
  用户反馈商品页的"相关推荐"没用。改一下 src/catalog.py 的 related()。
checks:
  - {id: H1, kind: pytest, file: test_semantics.py, weight: 5, measures: "领域模型：相关 = 一起用，不是同一类。买双人帐篷的人要的是睡袋和炉具，不是四人帐篷。按类目排的实现在这里给相反答案"}
  - {id: H2, kind: pytest, file: test_naive_trap.py, weight: 2, measures: "同类目 + 价格接近的痕迹还在不在"}
  - {id: H3, kind: pytest, file: test_human_routed.py, weight: 3, measures: "不可判的部分被路由：共现次数低于多少不算数、要不要混一点同类目、冷启动商品怎么办——写明谁裁决"}
underspecified_slots:
  - id: U1
    question: 共现次数少到什么程度就不算数（冷启动商品会一个推荐都没有）
    evidence_in: [src/catalog.py, ASSUMPTIONS.md, done_when.yaml, issue.md, PSL.md]
    pattern: "(冷启动|阈值|threshold|至少|最少|min_|>=\\s*\\d|回退|fallback)"
  - id: U2
    question: "「没用」具体指什么（用户反馈里没说，也没给指标）"
    evidence_in: [src/catalog.py, ASSUMPTIONS.md, done_when.yaml, issue.md, PSL.md]
    pattern: "(点击|转化|CTR|指标|metric|怎么算好|成功度量|没说)"
