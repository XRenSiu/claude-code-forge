# invariant-extract 输出:一块领地的不变量卡(候选)
# 这是落卡阶段的主产物。每条候选都带溯源、置信度、□/◊ 裁断、强度分类。
# 注意:本卡是「候选 + 提案」,不是已生效的宪法 —— 硬不变量要经**人签的门**才落地:
#   在 sdlc 里那道门是 **G2 判据冻结**(`lock_done_when.py sign` / `sdlc_state.py gate g2`),
#   写法是 `assets/change_proposal.md` 变更提案 + 人签。
# 本卡里出现的 `R00x` 一律指 **dos.yaml `rules` 段的规则 id**(sdlc 的 R001 = 单生产者、
# R002 = 单 schema …),不是任何外部项目的同名编号。去重、dedup 都按这个读。

territory_id: ""                 # 领地锁定时绑定的唯一领地
dos_ref: ""                      # 该领地 dos.yaml 的引用(统一语言来源)
purpose:                         # 取景框 = name + kpi + dos.scope;贯穿全程的透镜,非一次性输入
  name: ""                       # 一句话责任(Territory.name)
  kpi: ""                        # Territory.kpi —— aspect 轴的直接载体
  aspect: ""                     # 由 kpi 推出的主维度:correctness | latency | cost | safety | reversibility …
  scope_ref: ""                  # dos.yaml scope / 统一语言引用
extracted_at: ""                 # 由 skill 运行时间戳填(运行后回填,不在脚本里取时间)
mode: interactive                # interactive | auto

# 通道二(溯因)的输入。一个整数是不可核对的:同一个 84 可以是真读了 84 条,也可以是拍的。
# 所以 count > 0 时 `sources` 必填(verify_card.py reject),各源的 entries 之和应等于 count(不等则 flag)。
channel_2_input:
  failure_memory_count: 0
  dry: false                     # true = 这块领地确实没有失败记忆,显式记录而不是假装跑过
  snapshot_at: ""                # ISO 时间戳:失败记忆在一次运行里会增长(dogfood 当天从 6 行涨到 16 行),
                                 # 不写快照点,别人重跑会得到不同的 count 却无法判断是漂移还是错
  sources:                       # count 的分解。sdlc 里真正有料的源(按产出量排序):
                                 #   - `<skill>/dogfood/**/skill-issues.md` —— 自审出的缺陷清单
                                 #   - `.sdlc/<slug>/ledger.md` 的 `deviation` 行 + trace.jsonl 对应事件
                                 #   - `.sdlc/<slug>/ledger.md` 的 `fail` 行
                                 #   - `escape-defects.md` / G3 记录 —— 逃逸缺陷,最可靠的"有不变量"信号
                                 #   - `docs/**` 里推演出的不自洽(corroboration,不是失败本身)
    - ref: ""                    # 文件路径 / trace 事件 id
      entries: 0                 # 这个源贡献了几条
      kind: ""                   # 这些条目是什么(一句话)
  corroboration_read: []         # 读过但不计入 count 的旁证(git log、设计稿里的风险清单……)

# 按目的投影为 ∅ 而跳过的 obstacle(非排他:可被别的领地接走) —— 显式记录,不假装处理过
projected_out_obstacles:
  - obstacle_ref: ""
    why_empty: ""                # 为什么在本领地目的下投影为 ∅

# —— 登记的缺口:读失败记忆时捞到的、但**不是违反**的东西 ——
# gate.json 的 fix_list、"L2 从未跑过"这类条目登记的是**还没做**,不是**做错了**。
# 取反一条没做过的事得不到不变量,只能得到一句"应该去做" —— 那是 ◊,归 done_when 管。
# 混进 hard_invariants 会造出一批永远无法证伪的"□"。每条必须有去处。
registered_gaps:
  - ref: ""                      # 从哪读到的
    gap: ""                      # 缺什么
    destination: done_when       # done_when | issue | backlog —— 三选一,不许空
                                 #   done_when: 本次交付就该补上 → /donewhen-extract
                                 #   issue:     值得单独立项 → /issue
                                 #   backlog:   知道了,现在不做(写明为什么现在不做)
    note: ""

# —— 硬不变量栏(□,不可覆盖,默认责任级、非 R00x) ——
hard_invariants:
  - id: INV-<territory>-001
    statement: ""                # EARS 形态:WHEN/WHILE … THE SYSTEM SHALL (NEVER) …
    ears_type: unwanted          # ubiquitous | event | state | unwanted | optional
    survival_test: pass          # 存活测试:必须 pass(活得过揭示它的那次 Run)
    strength: hard               # 强度分类:hard(不能被任务合法违反)
    altitude: territory          # 只能是 territory。想说"这条像宪法"就写进底部的
                                 # constitution_promotion_suspects —— 一处表达,别两处。
                                 # (verify_card.py 对条目上的 proposed_to_constitution 直接 reject)
    aspect: ""                   # 该 □ 投在哪个维度(correctness/latency/…),来自目的投影
    channel: abductive           # deductive | abductive | both
    provenance:                  # 铁律:无溯源不许进卡
      execution_point: ""        # 通道一:file:line(若来自演绎)
      obstacle_ref: ""           # 通道二:失败记忆 id —— ledger fail/deviation 行、trace 事件 id、
                                 # skill-issues 的 I-nn、escape-defect id
    narrowest_rule_note: ""      # 通道二:为什么这是覆盖该 obstacle 的最窄规则
                                 # (留空 → verify_card.py 挂"确认最窄性"的复审 flag;写了就不挂)
    confidence: high             # high | low
    disposition: propose         # 硬不变量恒走立法(propose);低置信条目也只能 propose
    golden_regression: true      # 同时登记为回归守卫(棘轮)

# —— 可覆盖默认栏(带 authority level,任务级可在护栏内覆盖) ——
overridable_defaults:
  - id: DEF-<territory>-001
    statement: ""
    authority_level: ""          # 谁能覆盖、在什么护栏内(Model Spec 指挥链)
    survival_test: pass
    strength: overridable
    altitude: territory
    aspect: ""                   # 必填,和硬不变量栏同规则:目的投影记在这里,脚本硬检
    channel: deductive
    provenance: { execution_point: "", obstacle_ref: "" }
    narrowest_rule_note: ""
    confidence: high             # low 置信 ⇒ disposition 必须是 propose(abduction.md 第 5 条),
                                 # 即使它只是可覆盖默认;verify_card.py 检这一条
    disposition: carded          # 可作为候选落卡,但仍提交复审

# —— 踢回任务级的 ◊ 候选(不进本卡,移交 done_when 生成器) ——
kicked_to_done_when:
  - id: DW-<territory>-001       # 必填:◊ 泄漏检查按 id 比对两栏,无 id 的条目检查空转
    statement: ""
    why_diamond: ""              # 为什么只对某任务成立 = ◊
    handoff_to: donewhen-extract # donewhen-extract(本插件) / acceptance-spec

# —— 待立法的冲突(两条不能同真) ——
conflicts_for_legislation:
  - a: ""
    b: ""
    note: ""

# —— 与 dos.yaml.rules 去重的记录(已升宪法的不重复立法) ——
deduped_against_constitution:
  - candidate: ""
    matched_rule: ""             # dos.yaml `rules` 里的哪条 id,故合并掉

# —— 分层探针:purpose-independent 嫌疑(送立法,不复制进每张卡) ——
# 嫌疑非判决:单领地绑定下本刀无权认定为宪法级,只标记 + NEEDS_HUMAN 送立法上浮。
# 裁决(survival-test.md §2.5):嫌疑的**领地窄化形式**照常落上面的栏 —— 它是本领地的 □;
# 只有**通用形式**写在这里。两者不是重复,差的是作用域。
constitution_promotion_suspects:
  - statement: ""                # 通用形式(不带领地限定)
    narrowed_card_id: ""         # 上面哪条是它的领地窄化形式(没有就留空)
    why_purpose_independent: ""  # 代入哪块领地的目的都成立的理由
    routed_to: legislation
