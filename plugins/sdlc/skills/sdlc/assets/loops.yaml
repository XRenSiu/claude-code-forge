# loops.yaml — sdlc 六个环的统一契约
#
# 谁读它：scripts/verify_loop.py（generator ≠ verifier · stop 四键齐 · budget.ref 可解析 · memory 在归档布局内）
#        scripts/sdlc_state.py loops（读 state / pr-watch / ratchet 计数，按环打印预算消耗）
#        assets/graph.yaml 的 loop_back 边通过 loop: <id> 引用这里
# 为什么存在：六个环原来各说各话（retries / rounds / strikes / iterations / MAX_ROUNDS），没有一处能回答
# "现在哪个环在烧预算、烧到几成"。LangChain 2026 报告把 >60% 生产事故归于状态管理失败；统一契约是对策的一半。
#
# 字段（封闭集）：
#   level     ∈ agent | verification | event | hill_climbing   （LangChain 四层）
#   timescale ∈ minutes | hours | days                          （Ng 三尺度）
#   trigger   ∈ turn_end | event | interval | cron | after | manual
#   stop      四键必须显式（值可为 null）：success · convergence · budget · impossible
#   budget.ref 形如 routing:<dotted path>（在 routing.yaml 解析，<track> 占位符两轨都查）或 literal
#   memory    每项落在归档 / 状态布局内（.sdlc/ specs/ ratchet-log/ cards/ tests/ 或 state.json ledger.md trace.jsonl learnings.md dead-ends.md results.tsv）

version: 1

loops:
  - id: card_retry
    level: agent
    timescale: minutes
    goal: {predicate: ac_subset_green, checked_by: "qa-reviewer 或测试入口（implement/references/executors.md）"}
    generator: implement
    verifier: acceptance-fleet
    stop:
      success: "卡的 ac_ids 测试全绿 ∧ 每个 commit verify_commit.py exit 0 ∧ card --status done"
      convergence: {fingerprint_repeat: 2, oscillation_periods: [2, 3], plateau_rounds: null}
      budget: {ref: "routing:budgets.<track>.card_retries"}
      impossible: {signal: impossible_under_contract, reporters: "routing:impossible_reporters"}
    memory: [state.json#cards.items, ledger.md, trace.jsonl]
    fresh_context: true
    trigger: turn_end
    escalate_to: plan
    signals: [card_test_fail, same_card_same_fingerprint, oscillation_detected, plateau, whitelist_overflow]

  - id: ratchet
    level: verification
    timescale: hours
    goal: {predicate: p0_criteria_all_pass, checked_by: "evaluate.sh（模式 A）或独立评估 subagent（模式 B）"}
    generator: ratchet.worker
    verifier: ratchet.master
    stop:
      success: "所有 P0 criteria 通过"
      convergence: {fingerprint_repeat: null, oscillation_periods: [2, 3], plateau_rounds: "ratchet.md done_when.convergence（连续 N 轮无改善；收敛前允许一次探索性重写）"}
      budget: {ref: "routing:budgets.<track>.card_retries", note: "ratchet 的 done_when.budget = 该卡的 budget.retries"}
      impossible: {signal: impossible_under_contract, reporters: "routing:impossible_reporters"}
    memory: [results.tsv, learnings.md, dead-ends.md, ledger.md]
    fresh_context: true          # kill & restart：进程一次性，教训不是
    trigger: turn_end
    escalate_to: plan
    signals: [same_card_same_fingerprint, plateau]

  - id: acceptance_ratchet
    level: verification
    timescale: hours
    goal: {predicate: meets_done_when, checked_by: "acceptance-fleet → meta-judge final-verdict.yaml（meets_done_when 由脚本比对阈值，不由评估 agent 宣布）"}
    generator: implement
    verifier: meta-judge
    stop:
      success: "四态 = DONE（final-state.json）"
      convergence: {fingerprint_repeat: 2, oscillation_periods: [2, 3], plateau_rounds: null}
      budget: {ref: "routing:budgets.<track>.task_reflows", note: "FIX 计 card/plan；SPEC_DRIFT / GAMING_RISK 计 task"}
      impossible: {signal: impossible_under_contract, reporters: "routing:impossible_reporters"}
    memory: [ratchet-log/iteration-NNN/final-state.json, ledger.md, trace.jsonl]
    fresh_context: true
    trigger: after            # 所有卡 done 之后
    escalate_to: task
    signals: [card_test_fail, pbt_fail_n3_consistent_with_req, hidden_variant_fail, impossible_under_contract, human_ac_pending]

  - id: review_loop
    level: verification
    timescale: hours
    goal: {predicate: pr_converged, checked_by: "pr-poll.sh done → exit 0（APPROVED ∧ 未解决=0 ∧ checks 绿 ∧ 未截断）或 exit 10（merged/closed）"}
    generator: agent.comment-fixer
    verifier: human_reviewer          # 人当 grader；fix-verifier 是可选的机器 verifier
    stop:
      success: "pr-poll.sh done exit 0 | 10；合法不收敛 = 有 REJECT 悬而未决时停在 exit 20 并汇报"
      convergence: {fingerprint_repeat: null, oscillation_periods: null, plateau_rounds: null, empty_watches: 4, no_new_threads_streak: 2}
      budget: {ref: literal, rounds: 10, thread_strikes: 3, bot_thread_strikes: 1, source: "review-loop/scripts/pr-poll.sh 环境变量默认值"}
      impossible: {signal: review_thread_strike_limit, reporters: [pr-poll.sh]}
    memory: [.sdlc/pr-watch/pr-N.json, .sdlc/pr-watch/pr-N.counters.json, .sdlc/pr-watch/pr-N.watermark]
    fresh_context: false
    note: "会话绑定的环：水位线与计数器在 .sdlc/pr-watch 跨 session 延续，重进监听即恢复；修复者可选新上下文（agent.comment-fixer）"
    trigger: event            # PR 活动；见 triggers.yaml 的三种绑定
    escalate_to: task
    signals: [review_round, review_thread_strike_limit, b_tier_warning_over_threshold]

  - id: lifecycle
    level: event
    timescale: days
    goal: {predicate: archived, checked_by: "sdlc_state.py advance archive（release.done ∨ skipped_reason）"}
    generator: sdlc
    verifier: human.g3
    stop:
      success: "stage == archive"
      convergence: {fingerprint_repeat: 2, oscillation_periods: [2, 3], plateau_rounds: null}
      budget: {ref: "routing:budgets.<track>", note: "各层预算之和；world 层无上限——本来就该停下来交人"}
      impossible: {signal: counterexample_cites_psl_rule, reporters: "routing:impossible_reporters"}
    memory: [state.json, ledger.md, trace.jsonl, specs/<slug>/**]
    fresh_context: true       # --resume 从 state.json 续，不靠会话记忆
    trigger: manual           # 只能由人显式启动（disable-model-invocation）
    escalate_to: world
    signals: [lock_hash_mismatch, counterexample_cites_dos_invariant, counterexample_cites_psl_rule, escape_defect, budget_exhausted]

  - id: hill_climb
    level: hill_climbing
    timescale: days
    goal: {predicate: harness_proposal_merged_or_rejected, checked_by: "human.harness-review 对 tune 产出的 PR 的裁决"}
    generator: tune
    verifier: human.harness-review
    stop:
      success: "每条提案 merged | rejected（有理由）"
      convergence: {fingerprint_repeat: null, oscillation_periods: null, plateau_rounds: "同一 target 连续两期提案方向相反 → 停止提案，交人"}
      budget: {ref: literal, proposals_per_run: 10, min_features: 2}
      impossible: {signal: insufficient_samples, reporters: [tune.py]}
    memory: [tune/harness-proposals-<date>.yaml, specs/*/**, .sdlc/pr-watch/**]
    fresh_context: true
    trigger: cron
    escalate_to: human
    signals: [harness_change_merged, insufficient_samples]
