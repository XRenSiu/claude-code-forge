# sizing.yaml — 体量分档与阶段网格（数据，不是 prompt 里的一段话）
#
# 谁读它：scripts/sdlc_state.py（size 推导档位 · plan 算有效阶段 · next_allowed / prereqs 按网格放行）
#        scripts/verify_sizing.py（lint：网格与 ORDER / prereqs 互相断言）
# 为什么存在：一套流程不分任务大小是 spec 工具的通病（Böckeler 2026 对 Kiro / spec-kit 的批评）。
# 三行 bug 修复走完 issue → 契约 → G2 → 卡 → 六审，成本高到没人愿意用，于是整条流水线被绕过——
# 一条被绕过的流水线抬不高任何人的下限。
#
# 极性（不可反转）：**缺省不给豁免。** init 时 size = M / size_source = default；
# S 档的豁免必须由 `size --commit` 用证据换来（改动文件数、AC 数、human AC 数都记进 state）。
# 漏填得到的是较严的路径，不是较松的路径——一个靠遗漏就能打开的门不是门。
#
# v0.12.0 的两处改动（AI-DLC 2.0 的 scope-grid 借鉴，见 docs/reports/aidlc-gap-2026-09-07.md）：
#   ① `stages:` 网格取代了原来只有散文的 `exempt:`。原来 S 档声明 exempt 两项、代码只实现一项
#      （整体验收），plan-cards 那半从来没生效过——数据承诺的轻量路径引擎没兑现。现在网格是
#      唯一的源，`verify_sizing.py` 让它与 sdlc_state.py 的 ORDER / prereqs 互相断言（同 graph check）。
#   ② `never_skippable` 把"哪些阶段任何档都不能跳"写成数据。三道门在里面。广度旋钮不许拧掉门。

version: 2

# ---------------------------------------------------------------------------------------------
# 阶段网格：每档在 ORDER 的 15 个阶段上跑还是跳
# ---------------------------------------------------------------------------------------------
# 语义：列在某档 `skip:` 里的阶段，该档可以从它的前一个阶段直接 advance 过去，且它的 prereqs
# 不再要求被跳阶段的产物。**跳过必须用证据换**：只有 size_source ∈ {derived, derived_early}
# 的档位能拿到自己的 skip；default / manual 拿不到（`set intake.size=S` 打不开任何一扇门）。
#
# 每条 skip 都要写 `why`。一个没有理由的跳过在复盘时无法被质疑，也就无法被撤销。

never_skippable:
  # 三道门 + 不可逆动作 + 没有它下游就没有输入的阶段。任何档、任何证据都不能跳。
  # 注意 g1 不在 ORDER 里（它是 issue 的前置条件，不是阶段），它的不可跳性由 prereqs(issue) 保证。
  stages: [intake, track, issue, branch, contract, g2, implement, pr, review, g3, merge]
  why: >-
    契约与 G2 是"判据先于代码"的全部；跳掉它 S 档就变成"没有判据的快速通道"，
    而快速通道正是逃逸缺陷最爱走的路。issue / branch / pr / review / merge 要么不可逆，
    要么是下游的唯一输入。三道门只能人签（不变量 6），广度旋钮拧不掉它们。

stages:
  S:
    skip:
      - stage: cards
        why: >-
          三行修复拆不出两张卡。卡的价值是"无上下文子 agent 的 prompt 载荷"，
          单点修复没有第二个实现者要交接，卡是纯开销。契约的 AC 直接当实现输入。
      - stage: acceptance
        why: >-
          整体验收（六审 + meta-judge + 四态棘轮）的成本按需求面算，不按 diff 算。
          AC ≤ 2 且改动 ≤ 3 文件时它比被审的代码贵。仍要过 verify_commit.py 与 /pr-review。
  M:
    skip: []          # 默认档跳过零个阶段。缺省得到的是最严的完整路径。
  L:
    skip: []

# ---------------------------------------------------------------------------------------------
# 三档（label / 说明 / 该档的深度与测试量缺省）
# ---------------------------------------------------------------------------------------------
# 广度（跑哪些阶段）= 上面的网格，脚本强制。
# 深度（每个阶段产出多细）与测试量（验多少）是另外两个**正交**旋钮：AI-DLC 2.0 把它们拆开的
# 理由是"完整文档 + 最少测试"是合法组合，测试量不该被文档详细度绑架。这里照抄那个正交性，
# 但**诚实标注强制力不同**：广度由 next_allowed / prereqs 强制，深度只是声明给 skill 读的输入，
# 没有脚本能判"这份文档够不够细"。测试量介于两者之间——它是下界，由 derive_counts.py 检。

tiers:
  S:
    label: 单点修复
    depth: minimal
    test_strategy: minimal
    note: 三行以内的 bug 修复、文案改动、单文件配置。仍要过 verify_commit.py 与 pr-review。
  M:
    label: 常规特性
    depth: standard
    test_strategy: standard
    fleet_subset: [qa-reviewer, spec-gaming-detector]
    note: 默认档。六审只跑"真跑测试"与"假设作者在作弊"两个——其余四个按需加。
  L:
    label: 全流程
    depth: comprehensive
    test_strategy: standard
    note: 契约面宽、跨模块、有 human AC、或 PSL 轨。测试量缺省 standard 而不是 comprehensive——面宽不等于每条都要金字塔顶层。

# ---------------------------------------------------------------------------------------------
# 推导规则（封闭集，按顺序求值，第一条命中即定档）
# ---------------------------------------------------------------------------------------------
# 输入只有四个可数的量：改动文件数、AC 条数、human AC 条数、轨道。没有形容词。
#
# 早定档的极性（v0.12.0）：`needs` 声明一条规则要哪些量才能求值。intake / issue 阶段拿不到
# files（还没有 diff），所以任何 `needs: [files]` 的规则在早期都不会命中——而 S 档唯一的入口
# SZ-05 正好需要 files。**结论：早定档只能把你推向 L 或留在 M，永远给不出 S 的豁免。**
# 这不是巧合，是这组规则本来的形状；写成 `needs` 只是让脚本能证明它。

rules:
  - id: SZ-01
    when: {track: psl}
    needs: []
    tier: L
    why: PSL 轨的形态是新建的，没有"小"的版本——世界错了就全错。
  - id: SZ-02
    when: {human_acs_min: 1}
    needs: [human_acs]
    tier: L
    why: 有一条判断档（human）AC 就必然要走 G3，走 G3 就不是小改动。
  - id: SZ-03
    when: {acs_min: 8}
    needs: [acs]
    tier: L
    why: 判据条目多 = 契约面宽。
  - id: SZ-04
    when: {files_min: 15}
    needs: [files]
    tier: L
    why: 改动面宽，卡间写冲突与结构退化的风险都在这里。
  - id: SZ-05
    when: {acs_max: 2, files_max: 3, track: task}
    needs: [acs, files]
    tier: S
    why: 单点修复：判据两条以内、改动三个文件以内、形态已定。
  - id: SZ-06
    when: {}
    needs: []
    tier: M
    why: 兜底。不确定就是 M——默认档是较严的那一档。

# ---------------------------------------------------------------------------------------------
# 飞行中重定档（AI-DLC 的 in-flight recompose，加了它那条约束）
# ---------------------------------------------------------------------------------------------
# 允许在流程跑到一半重新 `size --commit`（契约写完 AC 才数得准，diff 出来 files 才数得准）。
# 约束：**只能改尚未开始的阶段**。已经走过的阶段冻结——一次已经付过的 G2 不会因为重定档
# 变成"其实不用签"，一次已经跑过的验收也不会被追认为跳过。
# 脚本实现：重定档时把新档的 skip 与当前 stage 在 ORDER 里的位置比对，落在身后的 skip 一律丢弃
# 并记一条 ledger（`size_recompose`），不是静默生效。

recompose:
  allowed: true
  frozen_before_current_stage: true
  why: >-
    跑动中改流程形状会让已经批准过的门失去意义——你当时批准的是另一套前提。
    与"学习下轮生效"（不变量 13）同一条理由：可复现优先于立刻变聪明。

# ---------------------------------------------------------------------------------------------
# 每档的回流预算覆盖（缺省取 routing.yaml 的按轨道预算）
# ---------------------------------------------------------------------------------------------
budget_overrides:
  S: {card_retries: 2, plan_reflows: 1}
  M: {}
  L: {}
