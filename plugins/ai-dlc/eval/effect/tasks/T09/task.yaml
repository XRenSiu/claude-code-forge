id: T09
track: psl
title: 通讯录里的重复联系人清不干净
prompt: |
  用户说通讯录里同一个人有好几条，清重清不掉。改 src/contacts.py。
checks:
  - {id: H1, kind: pytest, file: test_semantics.py, weight: 5, measures: "领域模型：重复 = 同一个人的多个身份（换号、改名、公私两个邮箱），不是「字段完全相同」。全等模型在这里给相反答案"}
  - {id: H2, kind: pytest, file: test_naive_trap.py, weight: 2, measures: "手机号有没有归一化再比；名字全等这个键还在不在"}
  - {id: H3, kind: pytest, file: test_human_routed.py, weight: 3, measures: "不可判的部分被路由：合并谁保留、同名不同人怎么办——写明谁裁决"}
underspecified_slots:
  - id: U1
    question: 同名同公司但号码不同——是一个人还是两个（有真实歧义）
    evidence_in: [src/contacts.py, ASSUMPTIONS.md, done_when.yaml, issue.md, PSL.md]
    pattern: "(歧义|不确定|人工|确认|同名|误合|false positive|置信)"
  - id: U2
    question: 合并后哪条信息保留（需求只说清重，没说合并规则）
    evidence_in: [src/contacts.py, ASSUMPTIONS.md, done_when.yaml, issue.md, PSL.md]
    pattern: "(合并|merge|保留|最新|优先|主记录|primary)"
