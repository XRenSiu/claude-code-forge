# fv-policy：哪些代码改动需要哪一级证据。模块由 git diff 推出（fv impact），不由作者声明。
schema_version: 1
kind: fv-policy
unclassified: review
modules:
  - id: ticket-ordering
    risk: concurrency                    # concurrency/consistency/permission/retry → 默认 E3、core 层
    paths: ["impl/**"]
    contract: contract.yaml
    model: model.yaml
    source_map: source-map.yaml
    vectors: vectors.json                # fv gen-tests 的产物，入库；模型变了必须重新生成
    trace_command: ["python3", "impl/harness.py", "--vectors", "vectors.json", "--out", "{out}"]
    approvals: approvals.jsonl           # 契约被削弱时，这里要有对新摘要的显式批准
    entrance: spec-first                 # code-first 还要 calibration：as-is 模型在当前代码轨迹上的一致性回执
    rules_divergence: rules-divergence.json   # AI 生成规则的证据：≥2 个隔离候选的分歧与裁决
    rules_review: rules-review.yaml           # 全新上下文审阅者的发现与裁决
    model_divergence: model-divergence.json   # AI 生成模型的证据：≥2 个隔离候选在观察者眼里的分歧与裁决
