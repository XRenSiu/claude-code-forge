# fv-impl-review（步骤 07 的审阅部分）：formal-reviewer（impl 模式）在全新上下文里写出，
# 只读 impl-contract.yaml、model.yaml、contract.yaml 与被映射的代码，不读实现者的会话。
#   Spec Kit analyze：每个操作的覆盖行、问题分级 CRITICAL / HIGH / MEDIUM / LOW；
#   Quint quint-execute-spec Phase 1 第 3、4 问：模型有而代码没有的行为、代码有而模型没有的行为；
#   Specula harness / reproduction：只认真实代码路径，不认手写的轨迹或绕过公开接口的触发；
#   pstack maintain：代码变了，审阅就失效（source.files 钉住被审的字节）。
# 机器部分（代码证据锚点、测试与负对照、轨迹一致性、反例重放）由 `fv impl-verify` 自己跑，不由审阅者填写。
