state:
- variable: phase
  code: requests 行：没有行 = idle；status = 'pending' 且 seen 为 NULL = requested；status = 'pending' 且 seen 非空 = read；status 为 success / sold_out = done
- variable: remaining
  code: tickets.remaining（event_id = EVENT 的那一行）
- variable: result
  code: requests.status（success / sold_out）
- variable: seen
  code: requests.seen：页面展示过的剩余数量，不参与购买判定
- variable: sold
  code: orders 表里 status = 'success' 的行数
observables:
- observable: outcome
  read: TicketService.observe()：SELECT user, status FROM requests（没有行 = none；pending = pending）
- observable: remaining
  read: TicketService.observe()：SELECT remaining FROM tickets WHERE event_id = ?
- observable: sold
  read: TicketService.observe()：SELECT COUNT(*) FROM orders WHERE status = 'success'
operations:
- action: buy
  code:
    file: impl/tickets.py
    symbol: TicketService.purchase
  atomicity:
    mechanism: transaction
    scope: BEGIN IMMEDIATE 到 COMMIT：请求状态检查、条件扣减、订单写入、请求状态更新
    evidence: self.db.execute("BEGIN IMMEDIATE")
  idempotency:
    required: true
    key: requests.user + requests.status = 'pending'
    evidence: 'if row is None or row[0] != "pending":'
  failures:
    error:
      behavior: ROLLBACK：库存、订单、请求状态都不变，请求仍是 pending
      model_effect: no_change
    timeout:
      behavior: BEGIN IMMEDIATE 等写锁超过 30 秒抛错，事务没有开始
      model_effect: no_change
    conflict:
      behavior: 写锁让并发购买依次执行；后到者在事务里看到更新后的库存
      model_effect: no_change
    retry:
      behavior: 重复购买返回第一次的答复，不再扣库存
      model_effect: no_change
  trace:
    event: buy
    trigger: COMMIT 之后
    fields:
    - outcome
    - remaining
    - sold
- action: read
  code:
    file: impl/tickets.py
    symbol: TicketService.read
  atomicity:
    mechanism: single statement
    scope: seen 由一条 UPDATE 写入；读到的库存只用于展示，与购买并发时可能是旧值（模型允许）
    evidence: UPDATE requests SET seen = ? WHERE user = ?
  idempotency:
    required: false
    reason: 重复读取只覆盖展示值 seen，不改变任何观测量
  failures:
    error:
      behavior: 抛错，seen 不变
      model_effect: no_change
    timeout:
      behavior: 等锁超时抛错，seen 不变
      model_effect: no_change
    conflict:
      behavior: 与购买并发时读到旧库存：只影响展示
      model_effect: no_change
    retry:
      behavior: 可以随时重读
      model_effect: no_change
  trace:
    event: read
    trigger: UPDATE seen 之后
    fields:
    - outcome
    - remaining
- action: reject
  code:
    file: impl/tickets.py
    symbol: TicketService.purchase
  atomicity:
    mechanism: transaction
    scope: 同一事务里条件 UPDATE 返回 0 行，请求记为 sold_out
    evidence: self.db.execute("BEGIN IMMEDIATE")
  idempotency:
    required: true
    key: requests.user + requests.status = 'pending'
    evidence: 'if row is None or row[0] != "pending":'
  failures:
    error:
      behavior: ROLLBACK：库存、订单、请求状态都不变，请求仍是 pending
      model_effect: no_change
    timeout:
      behavior: BEGIN IMMEDIATE 等写锁超过 30 秒抛错，事务没有开始
      model_effect: no_change
    conflict:
      behavior: 写锁让并发购买依次执行；后到者在事务里看到更新后的库存
      model_effect: no_change
    retry:
      behavior: 重复购买返回第一次的答复，不再扣库存
      model_effect: no_change
  trace:
    event: reject
    trigger: COMMIT 之后
    fields:
    - outcome
    - remaining
    - sold
- action: request
  code:
    file: impl/tickets.py
    symbol: TicketService.request
  atomicity:
    mechanism: single statement
    scope: 一条 INSERT OR IGNORE；同一用户的并发提交由主键 requests.user 串行化
    evidence: INSERT OR IGNORE INTO requests (user, status, seen) VALUES (?, 'pending', NULL)
  idempotency:
    required: true
    key: requests.user（主键）
    evidence: INSERT OR IGNORE INTO requests
  failures:
    error:
      behavior: 抛出数据库异常，没有写入；调用方可以重试
      model_effect: no_change
    timeout:
      behavior: 等锁超过 30 秒抛错，没有写入
      model_effect: no_change
    conflict:
      behavior: 同一用户已经提交过：OR IGNORE 不做任何事
      model_effect: no_change
    retry:
      behavior: 重复提交是空操作
      model_effect: no_change
  trace:
    event: request
    trigger: INSERT 之后
    fields:
    - outcome
