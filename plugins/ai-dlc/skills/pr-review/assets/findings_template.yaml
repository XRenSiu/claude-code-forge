        - { kind: read, file: src/billing/cancel.ts, lines: [40, 60] }
        - { kind: grep, query: "verifyOwnership|assertOwner", matches: 0 }
      needs_codebase_check: false
      suggested_change: "在第 47 行前加 `if (sub.user_id !== currentUser.id) throw new ForbiddenError()`。"
      tags: ["owasp:A01", "cwe-639"]
    - id: cr-002
      tier: B
      severity: P2
      file: src/billing/cancel.ts
      line_range: [12, 88]
      category: complexity
      root_cause: "cancel() 76 行、嵌套 5 层，超过 B 档阈值（50 行 / 4 层）。"
      reproduction_scenario: null    # B/C 档可空
      confidence: high
      evidence:
        - { kind: read, file: src/billing/cancel.ts, lines: [12, 88] }
      needs_codebase_check: false
