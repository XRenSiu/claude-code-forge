# findings.yaml — pr-review 的产物形状。严格：缺字段的 P0/P1 会被 post_review.py 拒发。
review:
  target: "#123"                     # PR# | A..B | path
  focus: logic                       # security | logic | perf | style | all
  model: claude-fable-5-1
  vendor: claude                     # claude | openai | google
  adversarial_mode: false
  rules_loaded: ["CLAUDE.md"]
