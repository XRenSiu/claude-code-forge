  max_findings: 5
  mergeable: "no (A-tier)"           # yes | no (A-tier) | with-warnings (B-tier)
  tier_summary: { A: 1, B: 1, C: 0 }
  findings:
    - id: cr-001
      tier: A                        # A mechanical (一票否决) | B structural (告警) | C judgment (请求人工)
      severity: P0                   # P0 | P1 | P2 | P3
      file: src/billing/cancel.ts    # 新文件坐标
      line_range: [47, 49]
      category: authorization
      root_cause: "sub_id 来自请求体，未校验 current_user 拥有该订阅即执行取消。"
