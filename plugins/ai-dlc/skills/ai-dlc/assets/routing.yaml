# verification 的环境/检查器/未决/obsolete 结果走独立失败域，不能作为 card_test_fail 消耗代码预算；仅 needs_repair 进入下列实现路由。
# routing.yaml — X2 回流路由表（数据，不是 prompt 里的一段话）
#
# 谁读它：scripts/aidlc_state.py fail --signal <signal>  → 输出路由决定 + 更新分层计数。
# 为什么存在：默认行为是灾难性的——任何失败都塞回实现层再试一次。路由表的意义
# 就是不让世界层的错误在实现层被重试二十次。归因器（把失败分到哪一行）先是启发式：
# 脚本给候选层 + 证据，人只做确认或改判（G3 的输入是失败报告，不是原始日志）。
#
# 来源：Spec Loop v1.2 §7/§9 路由表八行 + done_when Step 6 的 N=3 规则并入（C8 裁决），
#       加两行（隐藏变体集失败 / 合后逃逸缺陷），加指纹终止（同错重复 = 无进展，立即升级）。
# v2（2026-09-05）：收敛检测从"同指纹 ×2"扩到 oscillation / plateau / impossible（arXiv 2607.01641 的三种检测
#       全部编译；Claude Code /goal 的 Impossible 判决有了对应物），加 R14–R16。

version: 3

# 回流的坐标。从内到外：卡 → 方案 → 任务 → 本体 → 世界。越外层越贵、越该交人。
layers: [card, plan, task, ontology, world]

# 预算按轨道分（D10）：PSL 轨的需求形态未定，AC 在实现中被修正是常态，任务级回流放宽到 2。
# world 不设自动上限——它本来就该停下来交人。
budgets:
  psl:  { card_retries: 3, plan_reflows: 2, task_reflows: 2, ontology_reflows: 1, world_reflows: null }
  task: { card_retries: 3, plan_reflows: 2, task_reflows: 1, ontology_reflows: 1, world_reflows: null }

# ---- 收敛检测（v2）----
# 指纹终止：同一层、同一指纹连续出现 N 次 = 无进展 → 立即升级到上一层，不等预算烧完。
fingerprint_repeat_limit: 2
# 每个 key 保留的指纹历史长度（oscillation 检测的窗口）。
fingerprint_history: 6
# 震荡：历史尾部出现周期 p 的重复（A B A B / A B C A B C），且周期内元素不全相同（全相同是 repeat 不是 oscillation）。
oscillation_periods: [2, 3]
# 平台：`fail --score X` 连续 N 次不超过历史最佳 → plateau（ratchet 的 stale_count 提到路由表层面，所有环共享）。
plateau_rounds: 3
# impossible_under_contract 只能由评估者或人报——实现者说"不可能"是自评，不是证据。
impossible_reporters: [acceptance-fleet, meta-judge, fix-verifier, qa-reviewer, spec-gaming-detector, ratchet.master, human]

# 每一行：signal（脚本/引擎报的失败信号）→ layer（候选归因层）→ handler（谁处理）→ action。
# handler = engine：引擎可自动重试；human：必须停机交人；engine_then_human：引擎先做一次，再交人确认。
rules:
  - id: R01
    signal: card_test_fail
    description: 单卡 AC 子集 / 测试未过，且指纹与上次不同
    layer: card
    handler: engine
    action: retry_card
    note: 计入 card_retries；同指纹重复见 fingerprint_repeat_limit

  - id: R02
    signal: same_card_same_fingerprint
    description: 同一张卡、同一失败指纹再次出现
    layer: plan
    handler: engine_then_human
    action: replan_card
    note: 无进展不是"再试一次"的理由；卡切错了或方案错了，先改卡

  - id: R03
    signal: whitelist_overflow
    description: diff 溢出卡的可改文件白名单
    layer: exception
    handler: human
    action: halt_and_review
    note: v1.2 §7 例外行；在 diff 落地前由 verify_commit.py 拦

  - id: R04
    signal: lock_hash_mismatch
    description: 被 G2 锁定的文件出现在 diff / 哈希不匹配，且同一 diff 无变更提案
    layer: task
    handler: human
    action: reject_diff_unless_change_proposal
    note: 附合法变更提案（change-proposal-*.md：改哪条 AC / 为什么 / 归因层）→ 放行并计入 task_reflows

  - id: R05
    signal: pbt_fail_n3_consistent_with_req
    description: PBT / 测试连续 3 次以与 REQ 文本一致的反例失败
    layer: task
    handler: human
    action: narrow_req
    note: done_when §8.4 的 N=3 规则；默认归任务层（改 EARS / AC）

  - id: R06
    signal: counterexample_cites_dos_invariant
    description: 最小反例引用了某条 DOS 不变量
    layer: ontology
    handler: human
    action: reconcile_dos
    note: 本体层回流；dos-extract / invariant-extract 是邻居

  - id: R07
    signal: counterexample_cites_psl_rule
    description: 最小反例与某条 PSL 规律冲突
    layer: world
    handler: human
    action: reopen_g1
    note: 世界层回流；先判"推错了"还是"规律错了"（G1 归因）

  - id: R08
    signal: hidden_variant_fail
    description: 隐藏变体集（冻结 AC 的变体）失败
    layer: task
    handler: human
    action: ac_incomplete
    note: 若隐藏集含 AC 没覆盖的行为，失败是规格缺陷，不是实现缺陷

  - id: R09
    signal: review_thread_strike_limit
    description: PR 某条 review 线程往返达上限仍未收敛
    layer: task
    handler: human
    action: freeze_thread
    note: /review-loop 的 strike 到 31；冻结该线程，其余照常

  - id: R10
    signal: human_ac_pending
    description: "存在 kind: human 的 AC 未裁决"
    layer: g3
    handler: human
    action: request_judge
    note: 产品需求默认触发 G3；judge 角色取值封闭（product | design | tech）

  - id: R11
    signal: b_tier_warning_over_threshold
    description: B 结构档告警超阈值（圈复杂度 / 重复率 / 公共 API 变更 / diff 体量）
    layer: g3
    handler: human
    action: request_review
    note: 有界可进——人决定带告警合入还是回卡

  - id: R12
    signal: escape_defect
    description: 合入后发现的缺陷
    layer: human_attribution
    handler: human
    action: attribute_then_route
    note: >-
      人归因到层后，按该层的行再路由；同时喂 X3 度量。登记入口是 `aidlc_state.py escape --layer <层> --why …`
      （不是 `fail --signal escape_defect`：合入后的 Run 不欠失败报告，欠的是一条归了层的登记；
      escape 计到该层、追加 escape-defects.md、镜像进归档——metrics.py 只读归档）

  - id: R13
    signal: budget_exhausted
    description: 某层预算耗尽
    layer: next_outer
    handler: human
    action: escalate_with_failure_report
    note: 失败报告：当前状态 · 候选归因层 · 证据 · 建议回退目标 · 已排除的可能

  # ---- v2：收敛检测三行 ----
  - id: R14
    signal: oscillation_detected
    description: 同一 key 的失败指纹在周期 2 或 3 内往复（A B A B）——在相似解之间震荡
    layer: plan
    handler: engine_then_human
    action: replan_or_explore
    note: 震荡 = 方案层无法解决一个权衡（agentpatterns convergence-detection）；改卡或换方案，不是再试；fail 命令自动派生此信号

  - id: R15
    signal: plateau
    description: "`fail --score` 连续 plateau_rounds 次不超过历史最佳（收敛到低质量平台）"
    layer: plan
    handler: engine_then_human
    action: explore_once_then_escalate
    note: ratchet 的"收敛前一次探索性重写"提到路由表层面：允许一次大扰动，再不涨就升级；fail 命令自动派生此信号

  - id: R16
    signal: impossible_under_contract
    description: 评估者判定"在当前契约下不可能满足"（对应 /goal 的 Impossible 判决）
    layer: task
    handler: human
    action: change_proposal_required
    note: 只接受 impossible_reporters 里的 --by；实现者报此信号被拒；去向是变更提案 + G2 重签，不是继续实现

  # ---- v3（2026-11-17）：形式化验证的反例分诊（/formal-verify）----
  # 模型报出反例只说明"模型允许坏结果"；分诊结论决定回到哪一层。任何一行都不允许以改弱 fv-contract 收场。
  - id: R17
    signal: fv_requirement_gap
    description: 形式化反例落在需求没有规定的情况（超时 / 取消 / 重复请求……），规则本身有漏项
    layer: task
    handler: human
    action: change_proposal_required
    note: 新合同版本 + G2 重签；fv diff-contract 的结论附在变更提案里
  - id: R18
    signal: fv_model_infidelity
    description: 反例在真实代码中不可能发生（原子边界拆错、漏了数据库约束）——模型失真
    layer: plan
    handler: engine_then_human
    action: fix_model_and_source_map_then_requalify
    note: 修模型与 source-map.yaml 的 atomicity，重跑 fv qualify；不消耗卡预算
  - id: R19
    signal: fv_design_defect
    description: 模型如实反映设计，而设计允许坏结果
    layer: plan
    handler: engine
    action: redesign_keep_old_design_as_mutant
    note: 改设计后 fv qualify；被推翻的设计作为必需 mutant 留在模型里
  - id: R20
    signal: fv_implementation_defect
    description: 反例或不一致轨迹在真实代码中重放成功
    layer: card
    handler: engine
    action: repair_with_counterexample_regression
    note: 修代码；重放向量留作回归，fv conform 通过才算修好
  - id: R21
    signal: fv_contract_weakened
    description: fv diff-contract 判定合同被削弱（删性质 / 放宽表达式 / 新增假设）且没有批准
    layer: task
    handler: human
    action: reject_unless_g2_resign
    note: 一条靠改弱规则变绿的检查不是通过
  - id: R22
    signal: fv_model_stale
    description: 源码映射 STALE / BROKEN 或映射代码在一致性证据之后变了
    layer: plan
    handler: engine_then_human
    action: review_mapping_sync_and_rerun_conformance
    note: 人审映射后 fv source-map sync；重新生成轨迹并 formal conform
  - id: R23
    signal: fv_checker_defect
    description: 检查器 / 外部引擎 / harness / 环境故障，结论无法得出
    layer: exception
    handler: human
    action: repair_checker_or_environment
    note: 不让产品返工；不确定不是通过
