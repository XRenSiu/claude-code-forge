# calibrate 输出:一个标准的校准报告(元闸门 verdict)
# 这是元闸门的主产物。它不判产出,判"判产出的东西"够不够格上线。
# 四不可破判据全过才 verdict: pass;缺一即 fail = 禁止该标准上线。
# 落点:MemoryAsset.calibration(dos.yaml 0.1.15 已落字段);pass 后交签字/激活 seam。

standard_ref: ""                 # 被校准的标准:eval_case 集 id | rubric_version id
kind: ""                         # eval_case | rubric —— 决定走哪面镜子
source_compile_ref: ""           # 产出该标准的 spec-compile manifest(calibration_pending 来源)
calibrated_at: ""                # 由 skill 运行时间戳回填
mode: interactive                # interactive | auto

# —— 镜面①: eval_case → mutation score(kind=eval_case 必填) ——
mutation:
  tool: ""                       # PIT | Stryker | mutmut | cosmic-ray
  total_mutants: 0
  killed: 0
  mutation_score: 0.0            # killed / total —— 必须 ≥ min_mutation(默认 0.7,硬线只许收紧)
  failure_memory_mutants: []     # 纳入的天然 mutant(failure_memory id —— 真实坏样本)
  surviving_mutants:             # 杀不掉的逐个落账(no silent caps),每个 = 一道闸门空隙 + 一条待写 eval_case
    - mutant: ""                 # 注入的故障描述(如 evalcase.ts:31 == → !=)
      slipped_through: ""        # 它溜过了哪些用例 / 哪段行为
      eval_case_to_add: ""       # 该补的 eval_case(棘轮:黄金集只增)
  budget_note: ""                # 若只跑了一部分 mutant,显式记跑了多少/漏了多少(禁止静默截断)

# —— 镜面②: rubric → agreement matrix(kind=rubric 必填) ——
agreement:
  reference_solutions: 0         # 参考解(已知裁决的黄金样本)数,应 ≥ config.evaluator_exam.min_cases
  krippendorff_alpha: 0.0        # 必须 ≥ min_alpha(默认 0.80,硬线只许收紧)
  inconsistent_dimensions: []    # 拉低 α 的维度(退回 spec-compile 重编:多半非二元或证据绑定太松)
  dropped_rubric_sets: []        # CDRRM:与参考解不一致、被丢弃的 rubric 集

# —— 两条非协商项 ——
holdout_ref: ""                  # ☐3:执行者永远看不见的那一块黄金集引用(必填非空,否则 fail)
holdout_unexposed_confirmed: false  # 人确认 holdout 从未进任何 executor 通道(未当 few-shot/未注入 prompt)

# ☐3 的后半截:holdout **存在** ≠ holdout **跑过**。
# dogfood C-05(2026-09-20 vana):报告里 holdout 有 2 条在挂,四判据全绿照样 PASS ——
# 脚本只查了它非空且未泄漏,没查它的结果。一块没跑过(或跑挂了还当没看见)的黄金集证明不了任何事。
holdout_result:
  ran_at: ""
  total: 0
  passed: 0
  failed: 0                      # passed + failed 必须等于 total,否则 fail(数对不上 = 有东西没被数)
  failures:                      # failed > 0 时**逐条落账**,与 surviving_mutants 同一条纪律(no silent caps)
    - case: ""                   # 哪一条挂了
      disposition: ""            # implementation_gap | contract_dispute | holdout_error —— 三选一,必填
      routed_to: ""              # 去处:issue / change-proposal-*.md / 已修的文件。空 = fail
      # implementation_gap:产物没满足黄金集 ⇒ **直接 fail**,标准不得上线
      # contract_dispute:黄金集与实现对判据的读法不同 ⇒ 交人裁(needs_semantic_review),裁决前不要改 holdout
      # holdout_error:黄金集这一条本身写错了 ⇒ 改黄金集,但要写清为什么它是错的
  note: ""

isolation_attested: false        # ☐4:G2 独立进程/只读快照/输入只含产出+rubric;领地开则 cross-vendor
cross_vendor_required: false     # 领地 cross_vendor_review 是否开

# —— 元闸门 verdict(四判据合议) ——
verdict:
  c1_mutation_pass: false        # ☐1 mutation_score ≥ 阈值(kind=rubric 时 n/a→true)
  c2_agreement_pass: false       # ☐2 α ≥ 0.80(kind=eval_case 时 n/a→true)
  c3_holdout_pass: false         # ☐3 holdout_ref 非空 + 未泄漏
  c4_isolation_pass: false       # ☐4 隔离 attested
  result: fail                   # pass(四条全过) | fail(缺任一 = 禁止上线)
  gaps_routed_to:                # fail 时,gap 退回去向
    spec_compile: []             # 待重编的电池/rubric 维
    spec_authors: []             # 待收紧的 done_when / 不变量

# —— 校准顺带查出的**现网**缺陷(不是注入的 mutant) ——
# dogfood C-05:量一把尺子的过程会撞见被量的那段代码本身的洞。它们不进 mutation_score 的分子分母
#(那只统计注入故障),但**必须有地方落**——否则它们只活在对话里,而对话会结束。
# 一条现网缺陷若未修复,它同时是 activation 的阻断项:法已生效而实现不满足,标准上线就是在背书一个谎。
live_defects_found:
  - id: ""                       # C-01 / C-02 …
    title: ""
    detail: ""                   # 复现路径 + 证据(file:line / 实测输出)
    also_violates: ""            # 它同时撞了哪条别的不变量(常有——洞很少只违反一条)
    status: ""                   # fixed | open
    fix: ""                      # status=fixed:改法是什么
    fix_verified_by: ""          # status=fixed:哪条 eval_case / 哪个 mutant 证明它被修好了
    routed_to: ""                # status=open:去处(issue / backlog),空 = fail

# —— 未决项:pass 不等于没有悬着的事 ——
# 元闸门只答「这把尺子够不够格上线」。够格,但仍可能有待人裁的分歧、没解决的基建问题。
# 不写下来,它们就会以「已经 pass 了」的名义消失。
open_items:
  - id: ""                       # OPEN-01 …
    title: ""
    detail: ""
    status: ""                   # open | closed
    blocks_activation: false     # true:元闸门即便四判据全绿也不得放行
    ruling: ""                   # 已裁:裁决内容 + 裁决人 + 日期

# —— 签字/激活(pass 后) ——
activation:
  allowed: false                 # 元闸门 pass 且无阻断项时才 true
  reason: ""
  rubric_sign_required: false    # kind=rubric:必须人签(R002),元闸门 verdict 是签字前置不是替代
  signed_by: ""                  # 人签事件引用(rubric 专用)
