    rationale: "sdlc 九环配件审计需要一个与现状本体可对账的应然本体"
    breaking: false
  - version: "0.2.0"
    date: "2026-09-05"
    author: "psl-derive (targeted re-derivation, n=1, after G1 round 1)"
