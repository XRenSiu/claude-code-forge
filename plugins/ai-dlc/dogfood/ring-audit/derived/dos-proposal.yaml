    summary: "按 g1-record.md 的 E-1…E-12 / P-1…P-6 / D-1…D-8 重推：Finding → Assessment（三维 needed / implemented / naming）；'缺少'移到 Ring.missing；Gap 去存储态、加 source 三来源；Part.kind 去 script、ring 从 Node.role 派生；Gate 加 signer / signer_kind / authorization_ref；Evidence 值类型；Gate ADJUDICATES Assessment 仅 G3；规则 12 → 17；开放问题按 v2 收窄为 4"
    rationale: "G1 第一轮 REJECT，归因 rule_error（PSL 自相矛盾一处、欠定四处、命名一处）；PSL 改至 v2 后按裁决定向重推，见 plugins/sdlc/dogfood/ring-audit/g1-record.md"
