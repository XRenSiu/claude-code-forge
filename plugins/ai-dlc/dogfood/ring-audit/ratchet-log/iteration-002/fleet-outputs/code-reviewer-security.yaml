      needs_codebase_check: false
      suggested_change: >-
        In audited_hits(): `git -c core.quotePath=false diff --name-only --no-renames "$1"` or, better,
        `git diff --name-only -z --no-renames "$1" | tr '\0' '\n' | grep -cE "$AUDITED_RE"`; apply the same to
        verify_commit.py L99/L102 (separate card — it is an audited file). Add an L5 fixture commit with a
