    - finding_id: cr-003
      severity: P1
      file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
      line_range: [130, 131]
      category: scope_bypass_auditor_edits_audited_object
      root_cause: >-
        Both passes derive their window from Card footers. The first pass replays only commits whose body has a
        line matching '^Card:[[:space:]]*CARD-…' (L58, case-sensitive); the second pass (added in iteration-002 to
        make footer-less commits visible) iterates indices 0..oldest_card_idx of the newest-first log (L131), i.e.
        only commits at or after the OLDEST Card commit, and does not run at all when card_commits == 0 (L130).
        A footer-less commit that precedes the first Card commit on the branch, or a commit whose footer is spelled
        'card:' / 'CARD:' / 'Card - ', is in neither pass. audit.yaml's "load-bearing" git_diff_stat has the same
        window (0be2770^..HEAD, L3450), so the three numbers AUDIT.md prints for PSL-003 (touching 0 / non-card
        touching 0 / diff-stat empty) can all be zero while the branch modifies the audited directories.
      reproduction_scenario: >-
