        commit "fix: lowercase footer\n\ncard: CARD-01" editing it again; commit "feat: card one\n\nCard: CARD-01" inside
        CARD-01's whitelist. `git diff --stat main..HEAD -- plugins/sdlc/skills` → 1 file changed, 2 insertions.
        replay_card_commits.sh → card_commits 1, card_commits_touching_audited_dirs 0, non_card_commits_scanned 0,
        non_card_commits_touching_audited_dirs 0, ok: true, exit 0.
        (2) Live branch docs/1-sdlc-ring-audit @ ba7d5e2: `git log main..0be2770^ -- plugins/sdlc/skills plugins/sdlc/agents
        plugins/sdlc/docs` lists four footer-less commits (c729f76, ebe270d, bf3f13e, 587f371 — fixes to
        plugins/sdlc/skills/sdlc/scripts/sdlc_state.py and lock_done_when.py plus a docs report); `git diff --stat
        $(git merge-base main HEAD)..HEAD -- <three dirs>` → 11 files changed, 1199 insertions, 14 deletions; the
        recorded `git diff --stat 0be2770^..HEAD -- <three dirs>` → empty, exactly as audit.yaml L3450-3453 says.
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          lines: [57, 60]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          lines: [82, 88]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          lines: [123, 142]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/audit.yaml
          lines: [3420, 3453]
          observation: "snapshot_note calls git_diff_stat (0be2770^..HEAD) 'the load-bearing number for PSL-003' and says it is '恒为空'; it is computed from the first Card commit, not from the merge base."
        - kind: git_log
          file: plugins/sdlc/skills/sdlc/scripts/sdlc_state.py
          observation: "On the branch, before the first Card commit 0be2770: 587f371 fix(sdlc): verifier and gate defects found by the ring-audit dogfood run; ebe270d fix(sdlc): gate pass clears a stale reject attribution (I-51); c729f76 fix(sdlc): lock check compares landing content hash (I-52); bf3f13e docs(sdlc) report. None carries a Card footer. Whether these are legitimate pre-audit fixes or PSL-003 violations is a G3 question; the finding is that the instrument and AUDIT.md cannot show them at all."
        - kind: read
          file: scratchpad/sec/twin2 (replay run 2026-09-06)
          observation: "{'card_commits': 1, 'card_commits_touching_audited_dirs': 0, 'card_commits_rejected': 0, 'non_card_commits_scanned': 0, 'non_card_commits_touching_audited_dirs': 0, 'ok': True, 'errors': []} while `git diff --stat main..HEAD -- plugins/sdlc/skills` shows 1 file changed. Self-rebuttal: AC-007-a is contract-scoped to Card commits, so exit 0 is in-contract; but the second pass exists precisely to record what the contract scope hides, and it hides the pre-Card window and non-canonical footers."
      needs_codebase_check: false
      suggested_change: >-
