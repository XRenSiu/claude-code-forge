        `git diff --name-only --no-renames <sha>^..<sha>` prints "plugins/sdlc/skills/x/\344\270\255\346\226\207...md"
        (quoted). replay_card_commits.sh output: card_commits_touching_audited_dirs: 0, replays[].touches_audited_dirs:
        false for the Card commit, non_card_commits_touching_audited_dirs: 0 for the footer-less one. The composite exit
        was still 1 only because verify_commit.py (L99, same unquoted `git diff --name-only`) sees the quoted string, fails
        to match it against the card's exact allowed_files and rejects it as "not in allowed_files" — an accidental
