      category: path_matching_bypass
      root_cause: >-
        audited_hits() greps `git diff --name-only --no-renames` output with '^plugins/sdlc/(skills|agents|docs)/'.
        With git's default core.quotePath=true, any path containing non-ASCII bytes (or a quote/backslash/control
        char) is printed C-quoted with a leading '"' — e.g. "plugins/sdlc/skills/x/\344\270\255.md" — so the
        anchored regex never matches and the commit is counted as not touching the audited directories. The same
        blindness applies to the second (footer-less) pass at L135, which has no other backstop.
      reproduction_scenario: >-
        Twin repo (scratchpad/sec/twin_replay.sh): branch feat/twin off main; commit "feat: card one again\n\nCard: CARD-01"
