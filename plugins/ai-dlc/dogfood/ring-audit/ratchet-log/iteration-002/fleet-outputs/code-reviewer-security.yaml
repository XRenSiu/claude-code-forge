    - finding_id: cr-004
      severity: P1
      file: plugins/sdlc/dogfood/ring-audit/check_audit.py
      line_range: [388, 391]
      category: authorization_enum_not_closed
      root_cause: >-
        check_gates() enforces the authorization_ref requirement only when signer_kind is the exact literal
        "delegated_agent" (L388). F-07 (form-draft.md) defines signer_kind as the closed set {human, delegated_agent},
        but no predicate rejects other values, so any non-human signer that writes signer_kind: agent / delegated /
        Delegated_Agent / bot satisfies human_gate_without_signer (non-empty string, L383) and skips
        delegated_without_authorization_ref. A human gate can therefore be recorded as pass by an agent with no
        authorization record and exit 0. Downstream, gates_sentence() (render L731-744) counts only the two literals,
        so the 铁律 line under-reports how the doors were signed.
      reproduction_scenario: >-
        Copy audit.yaml; in run_evidence.gates[G1] set signer_kind: agent and authorization_ref: null (verdict pass,
        signer g1-judge unchanged). check_audit.py <copy> --psl … --required-parts … → exit 0, failed_predicates [].
        render_audit.py → G1 row: `agent` | **未知** | — . The 铁律 sentence becomes "三道门里 1 道代签（delegated）"
        for a document with two non-pending doors. Reproduced in scratchpad/sec/make_variants.py (v3_signer_kind_agent).
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/check_audit.py
          lines: [357, 392]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/derived/form-draft.md
          lines: [22, 22]
          observation: "[F-07] kind=human 的 Gate 记录带 signer / signer_kind ∈ {human, delegated_agent} / authorization_ref（delegated_agent 时必填）— a closed set the checker does not enforce."
        - kind: grep
          query: "signer_kind.*(enum|outside|in \\{|SIGNER_KINDS)  (check_audit.py)"
          matches: 0
          match_files: []
        - kind: read
          file: scratchpad/sec/v3_signer_kind_agent.md
          observation: "check exit=0 ok=True failed=[]; rendered row: | `G1` | **pass** | `g1-judge` | `agent` | **未知** | — | `2026-09-05T14:59:49Z` |. Self-rebuttal: the renderer's **未知** does give a human a signal, and G1 rule 3(b) as worded only names the delegated_agent literal — but the rule's own premise (F-07) is a closed enum, and the checker is the only thing allowed to say the audit is complete (F-13)."
      needs_codebase_check: false
      suggested_change: >-
        Add SIGNER_KINDS = {"human", "delegated_agent"} and a `signer_kind_outside_enum` predicate for every
        non-pending run_evidence.gates[] record; require authorization_ref for every signer_kind other than
        "human" (not only the literal). Mirror it in the L5 mutation config as a new variant family.
      tags: ["F-07", "F-13", "G1-rule-3", "PSL-006", "cwe-184"]

    - finding_id: cr-005
      severity: P2
      file: plugins/sdlc/dogfood/ring-audit/check_audit.py
      line_range: [334, 336]
      category: exemption_not_validated
      root_cause: >-
        check_artifacts() treats any non-empty alternatives_of string as the F-05 exemption (L334) and drops the entry
        from the double-producer count. G1 rule 1 legalises a second producer only under F-05's three conditions
        (same stage.<x> handled_by, a conditional edge, same schema); none is checked even minimally — no format check
        (stage.<x>), no requirement that the value be shared by another producer of the same Artifact, no cross-check
        against the artifact's stage. render_audit.compare_pair() mirrors the same test (L173), so the projection agrees
        with the forged yaml; the only flag it can raise is '登记 ≠ 现算' against suspected_duplicate_pairs[].verdict,
        which the same author controls.
      reproduction_scenario: >-
        Copy audit.yaml; on the done_when.yaml artifact entry produced by donewhen-extract set alternatives_of: nobody;
        set needed.verdict: necessary on both donewhen-extract and acceptance-spec (removing merge_candidate).
        check_audit.py <copy> … → exit 0, failed_predicates [] (neither double_producer nor spurious_merge_candidate).
        render_audit.py → duplicates row: "**alternatives_of**（登记 ≠ 现算：登记为 `merge_candidate`）" — flagged only
        because suspected_duplicate_pairs was left untouched; setting its verdict to alternatives_of removes the flag.
        Reproduced in scratchpad/sec/make_variants.py (v4_alternatives_of_bogus).
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/check_audit.py
          lines: [317, 355]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/render_audit.py
          lines: [166, 180]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/g1-record.md
          observation: "规则 1: 'Artifact 记录带 alternatives_of（F-05 三条件）→ 合法'; F-05 lists (a) same stage handled_by, (b) conditional edge with when guard, (c) same schema — data source graph.yaml, which check_audit does not take as input."
        - kind: read
          file: scratchpad/sec/v4_alternatives_of_bogus.md
          observation: "check exit=0 ok=True failed=[]; the pair renders as alternatives_of. Self-rebuttal: F-13's literal predicate is '无 Artifact 有两个非 alternatives_of 的 producer', which the code implements exactly; this is therefore a gap between G1 rule 1's intent and the compiled predicate rather than a coding slip — hence P2, not P1."
      needs_codebase_check: false
      suggested_change: >-
        Minimal in-contract hardening: require alternatives_of to match ^stage\.[a-z_-]+$ and to be either shared by
        another producer entry of the same Artifact id or equal to a stage named by the shipped convention
        (agent.card-implementer / ratchet → stage.implement); emit `alternatives_of_unverified` otherwise. Longer term,
        give check_audit an optional --graph graph.yaml input and compile F-05 (a)(b) mechanically.
      tags: ["F-05", "F-13", "G1-rule-1", "PSL-001"]

  rationale: null

  caveats:
    adversarial_mode_caveat: >-
      Single vendor, single size: this adversarial pass was run by claude-fable-5-1 over Claude-produced code with no
      Codex / Gemini evaluator available in the runtime; expect a same-vendor blind spot. Mitigation used: every
      candidate was executed (crafted audit.yaml variants through check_audit.py + render_audit.py + cmark-gfm; twin
      git repositories through replay_card_commits.sh) rather than judged by reading. One candidate was refuted by
      execution and dropped: a backslash-pipe sequence in a cell()-escaped value ("\|" → "\\|") does NOT split a GFM
      table cell (cmark-gfm treats it as an escaped pipe). One proven candidate was left out by the 5-finding cap:
      duplicate canonical ring ids (two `id: R6` entries) — check_rings keeps the first (setdefault, L158) while the
      renderer keeps the last (dict comprehension, L120), so `--rings R6 --required-parts <9>` exits 0 and AUDIT.md
      shows an R6 with one Part; `rings` is reported as 11 but no predicate fires (F-13 says a set).
    diff_truncation_caveat: >-
      The Card range 57ebf2b..ba7d5e2 has 1974 hunks over the impl root, above the skill's 500-hunk ceiling; ~1900 are
      test fixtures and ratchet-log artefacts outside the security focus. Reviewed: the three instruments in full at
      HEAD, the incremental 843c3ee..ba7d5e2 hunk-by-hunk, audit.yaml's run_evidence / artifacts / gates blocks, and
      verify_commit.py as a multi-hop dependency. Fixture yaml and ratchet-log hunks were not walked.
    rules_conflict_caveat: null
    cross_vendor_unavailable_caveat: "No Codex CLI or Gemini CLI detected in this environment; ran same-vendor per SKILL.md 'When to refuse / redirect'."
