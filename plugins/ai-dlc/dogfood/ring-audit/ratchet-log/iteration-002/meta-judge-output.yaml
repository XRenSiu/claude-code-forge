  # ====== THE DECISION ======
  state_decision: NEEDS_HUMAN
  decision_reasons:
    - "NEEDS_HUMAN (classifier step A): rule 3 fired. pm-reviewer returned requires_human_verification for REQ-005 (AC-005-a, kind human, judge tech, ui:AUDIT.md#ring-tables) and REQ-006 (AC-006-a, kind human, judge product, ui:AUDIT.md#run-evidence); the contract's own rule 4 forbids auto-passing them and pm-reviewer's block_merge_note says verbatim 'Meta-judge should treat REQ-005/006 as pending G3, not as pass.' qa-reviewer and spec-gaming-detector both state independently that they report evidence, not a verdict, for these two ACs. Two blocking needs_human items (nh-001, nh-002) go to G3."
    - "No BLOCK_MERGE condition (classifier step B): no reviewer reported a P0 — max synthesized severity across 20 merged findings is P1 (rule 0 passed). Rule 1's escalation predicate evaluates to 0 on four independent live runs at ba7d5e2 (qa-reviewer replay 13 Card commits / 0 touching / 0 rejected; pm-reviewer same + git diff --stat 57ebf2b..HEAD and 843c3ee..HEAD over the three dirs = 0 lines; spec-gaming-detector same + diff-stat 0be2770^..HEAD 0 lines; spec-drift-detector verified_no_drift same diff-stat empty). Rule 2's predicate evaluates to 0 on pm-reviewer REQ-002 (dims_without_psl_id 0 / dims_with_unknown_psl_id 0 / dims_without_evidence 0 over 42×3 dims) corroborated by qa-reviewer's check_audit exit 0 on the real audit.yaml and spec-gaming-detector's evidence-ref resolution (415 of 444 resolve, 29 not machine-checkable, 1 glued path). All six threshold rules (4-9) pass on reviewer-reported numbers."
    - "Task-brief blocking test (violation of a locked mechanical AC, or fabricated evidence): no reviewer reports either. Every mechanical AC re-ran green at ba7d5e2 (pm-reviewer: all 20 AC given/expect re-derived from fresh runs; qa-reviewer 34/34 on the l5-locked suite; spec-gaming-detector l5_lock 43/43 sha match). On the evidence-record defects: spec-gaming-detector gd-unc-001 direction_note says 'the wrong value points AGAINST the implementer … sloppiness in an evidence block rather than a faked success'; gd-unc-002 what_is_actually_true says the PSL-003 property holds and only 'the record that is supposed to prove it' does not; pm-reviewer calls it 'a record defect inside a human AC's evidence, not a mechanical AC failure'; spec-drift-detector SD-01 says 'the divergence is in the record, not in the property'. These are AC-006-a evidence → nh-002, not BLOCK."
    - "Six P1 findings survive as NON-blocking (the rules source blocks only P0): mf-001 replay record head/branch/first-row sha 9ad5b9c unreachable from the reviewed branch, disclosed by a disclaimer instead of re-recorded (confidence 0.8, spec-gaming-detector + pm-reviewer; recurrence of the iteration-001 stale-sha class after a fix that claimed to cure it); mf-003 replay script aborts with zero-byte stdout on an empty main..HEAD range — a regression introduced by the iteration-002 fix commit 7cb1f55 (0.4, code-reviewer-logic, executed); mf-004 core.quotePath C-quoting lets a non-ASCII filename under an audited dir evade AUDITED_RE (0.4, code-reviewer-security, twin repo); mf-005 the new footer-less pass starts at the oldest Card commit, so pre-Card commits and non-canonical footers stay invisible (0.4, security; same mechanism class as iteration-001 mf-002, residual after the partial fix); mf-006 residual table-row interpolations (gaps[].atoms and 9 other sites) still bypass cell()/code() and reproduce 已实现 ✓ on a crafted copy (0.4, security; residual of iteration-001 mf-001); mf-007 signer_kind enum not closed by the checker — known gap KG-04 (0.4, security). Every reviewer's live run confirms the delivered content does not exploit mf-004..007; mf-001/002/003 are defects IN the delivered artefacts (record) or the fixed instrument."
    - "Eight P2 and six P3 findings are non-blocking: mf-002 audited_dirs_diff records exit: 1 beside ok: true — a combination the instrument cannot emit (confidence 1.0, the only three-role agreement in this fleet: spec-drift-detector + spec-gaming-detector + pm-reviewer, plus qa-reviewer's non-finding caveat); mf-008 --rings silently disables ring_unexpected and narrows ring_missing, contrary to F-17 (0.8, code-reviewer-logic + spec-drift-detector; new, unregistered); mf-009 F-06 cap — 3 Parts with every artifact checked_by [] recorded compiled, 5 with any (0.8, gaming + drift; recurrence of iteration-001 mf-011, broadened); mf-010 fills[] same-ring over-strict (0.8; recurrence of mf-008); mf-011 proposal.source resolvability KG-02 (0.8; recurrence of mf-014; waived to change-proposal-002); mf-012 renderer never projects the record's exit field (0.4); mf-013 alternatives_of exemption unverified (0.4; recurrence of iteration-001 mf-004, reviewer-downgraded P1→P2); mf-014 gates[].kind enum not enforced (0.4); mf-015..020 six low spec↔code disagreements from spec-drift-detector (0.4 each), five of them born in the same commit as the code (0be2770)."
    - "Recurrence accounting (recurrence_of fields below, same file + same mechanism vs iteration-001 merged findings): 7 of 20 are recurrences (mf-001, mf-005, mf-006, mf-009, mf-010, mf-011, mf-013), 13 are new. Of the new, two were introduced by the iteration-002 fix commits themselves (mf-002 by ba7d5e2, mf-003 by 7cb1f55) — spec-gaming-detector tags both 'fix-pressure-induced'. Iteration-002 reviewers independently re-verified the six named fixes: five as stated (cell escaping + closed signer map, computed counts, checked_by column, --no-renames, additive footer-less pass — spec-gaming-detector reverified block; pm-reviewer REQ-003/006/007 tool traces; qa-reviewer spot-checks) and one NOT as stated ('run_evidence replay re-recorded on the branch' — re-recorded on worktree branch fix/iter-002 @ 9ad5b9c and cherry-picked; gaming reverified.fix_run_evidence_replay_re_recorded_on_the_branch, pm REQ-006, drift SD-01)."
    - "Known gaps: mf-007 (KG-04), mf-011 (KG-02) are Run-disclosed known gaps routed by G2 to change-proposal-002 — per task brief not BLOCK reasons; spec-drift-detector and spec-gaming-detector each re-confirmed KG-01..04 and deliberately did not re-file them (drift dropped_candidates; gaming srg-004). code-reviewer-security filed KG-04 as a P1 finding anyway; it is recorded with the known-gap tag and does not change the state."
    - "Confidence threshold: no merged finding fell below 0.3 (minimum 0.4 — single-source, self-confidence high). All 20 retained."
    - "Informational, NOT rules (not in the rules source; recorded so /acceptance-fleet has them for its own four-state decode): qa-reviewer decision GO with 0 regressions vs baseline; spec-gaming-detector gaming_risk_score 4.0 (six-pattern detected_patterns empty; score is the sum of three unclassified evidence-record-integrity findings), trajectory [3.5, 4.0], trend up (+0.5, below the ≥2 single-step alarm), and its trend_note verbatim: 'A third iteration that answers this with more prose instead of a resolving record should be read as convergence on gaming even if the number stays under 7'; spec-drift-detector 11 signals, 9 of which trace to commit 0be2770 (doc written with code), none older than 3 hours; spec-robustness.md does not exist for this Run (all seven reviewers record it as absent)."
    - "Cross-vendor: all seven reviews are vendor claude (models fable-5-1 ×5, sonnet-5 ×2). Cross-vendor weighting added 0.0 to every merged finding; the 0.8 / 1.0 values owe their boost to cross-ROLE agreement within one vendor. spec-gaming-detector notes a codex binary is present but was not invoked (not authorized). The same-vendor blind-spot caveat applies symmetrically to pass-side evidence (qa GO, pm fully_compliant) and to the findings."

  # ====== M1 — DEDUPE LOG ======
  # 27 raw source records -> 20 merged findings; 6 merges absorbing 7 records. Bucket by file, cluster by line_range overlap, split by root_cause.
  # Severity mapping applied where a source carries no P-level: spec-drift-detector divergence_severity medium -> P2, low -> P3; pm-reviewer
  # partially_compliant on a normal REQ with a recorded waiver -> P2; pm out_of_scope_observations carry no P-level (cluster takes the max of the others).
  # Cluster notes:
  #  - audit.yaml [3412..3440]: SD-01 [3412,3427], gd-unc-001 [3412,3424], pm obs[0] [3414,3415], gd-unc-002 [3416,3440], pm obs[1] [3416,3425] fall in ONE
  #    line-overlap cluster. Root-cause comparison splits it into two mechanisms: exit:1-vs-ok:true (SD-01 primary clause + gd-unc-001 + pm obs[0]) -> mf-002;
  #    branch-foreign head/sha 9ad5b9c (gd-unc-002 + pm obs[1]) -> mf-001. SD-01 also states the 9ad5b9c fact in its code_does (folded there per its own
  #    dropped_candidates); it is counted as a source ONCE (mf-002) and listed under mf-001 as a non-source corroboration to avoid double-counting.
  #  - check_audit.py: eight records on non-overlapping or overlapping ranges with distinct mechanisms — L/cr-002+SD-02 [161,168] merged; L/cr-004+SD-05
  #    [258..278] merged; pm REQ-004+SD-04 [394,402] merged; S/cr-005 [334,336], L/cr-003 [364,374], S/cr-004 [388,391], SD-08 [70,72] kept separate;
  #    SD-06 spans [153..429] (scattered registry reads) and overlaps several, but its root cause (registry presence) is distinct -> separate.
  #  - audit.yaml [1348,1860]: gd-unc-003 + SD-03 (no explicit line range; same file, same Parts, same F-06 mechanism) merged -> mf-009. pm obs[2] states the
  #    same fact at AUDIT.md rows (different file) -> non-source corroboration per the "different file:line is NOT a duplicate" rule.
  #  - replay_card_commits.sh: L/cr-001 [82,84], S/cr-002 [69,69], S/cr-003 [130,131], SD-09 [112,149] — SD-09 overlaps S/cr-003 by line but reports a different
  #    mechanism (two error tokens vs window bound) -> all four separate. gaming srg-005 describes S/cr-003's mechanism but carries no file:line and was
  #    explicitly dropped as a finding by the detector -> non-source corroboration of mf-005.
  #  - render_audit.py: S/cr-001 [259,259] and L/cr-005 [509,533] — different lines, different mechanisms -> separate. L/cr-005 is cross-referenced to mf-002
  #    (record defect) as related_to; not merged (different file).
  #  - Non-finding records NOT counted as sources (consistent with iteration-001 practice): qa-reviewer caveats.other[0]/[1], pm obs[2]/[3], code-reviewer-logic
  #    footer candidates, spec-drift-detector dropped_candidates / CLAIM-022 / CLAIM-025, spec-gaming-detector srg-* and dropped_after_self_refutation.
  deduplicated_findings:
    - merged_finding_id: mf-001
      sources:
        - { role: spec-gaming-detector, finding_id: gd-unc-002, vendor: claude, file: plugins/sdlc/dogfood/ring-audit/audit.yaml, line_range: [3416, 3440], self_confidence: high, severity: P1, pattern: "unclassified → disclaimer_in_place_of_fix", mode: diff }
        - { role: pm-reviewer, finding_id: "out_of_scope_observations[1]", vendor: claude, file: plugins/sdlc/dogfood/ring-audit/audit.yaml, line_range: [3416, 3425], self_confidence: null, severity: null, origin: "out_of_scope_observations (category other) + REQ-006 tag snapshot_head_9ad5b9c_unreachable_from_HEAD_patch_twin_of_7cb1f55; REQ-006 verdict confidence high" }
      synthesized_severity: P1
      synthesized_root_cause: >-
        Iteration-001 recorded replay shas (e5ffbbd / 1f1916e) that did not resolve on the shipped branch. The iteration-002 fix commit says 'Re-ran replay_card_commits.sh here and recorded the branch, HEAD' — 'here' was worktree branch fix/iter-002 @ 9ad5b9c; the commits were then cherry-picked onto docs/1-sdlc-ring-audit as 7cb1f55 / ba7d5e2, so the shipped record's branch, head and first table row again do not exist on the branch under review (`git branch --contains 9ad5b9c` → fix/iter-002 only). Instead of producing a record that resolves, the snapshot_note grew a paragraph telling the reader the shas will not resolve and 'do not copy this table' — the claim was made unfalsifiable rather than correct, and this happened against the g2-judge ruling quoted in pr-body.md L116 ('不 rebase / cherry-pick，否则 run_evidence 与账本引用的 sha 全部失效').
      dedupe_rationale: "Same file, overlapping lines [3416,3440]∩[3416,3425], identical fact (head 9ad5b9c on fix/iter-002, not reachable from ba7d5e2, patch-id twin of 7cb1f55). gd-unc-002's root_cause is the longer text and is used verbatim. The two sources differ in characterization — pm calls the sha_scope: branch-specific disclosure 'the honest framing' and routes it to G3 / a CARD-06 follow-up; gaming calls it 'disclaimer_in_place_of_fix', tags recurrence + process-ruling-violated — but not in fact; both state the load-bearing empty diff-stat IS reproducible at ba7d5e2 by live run. Severity = max(P1, none) = P1."   # extra
      corroborated_by_non_source_records: ["spec-drift-detector SD-01 code_does: '9ad5b9c is not an ancestor of ba7d5e2 (git merge-base --is-ancestor fails; only branch fix/iter-002 contains it), and the reviewed branch has 13 Card-footer commits … not the recorded 12' — folded into SD-01 per its dropped_candidates; counted as a source under mf-002 only", "spec-gaming-detector srg-002 (contract weakness: nothing requires the replay record to resolve in the repository that ships it)"]   # extra
      file: plugins/sdlc/dogfood/ring-audit/audit.yaml
      line_range: [3416, 3440]
      confidence: 0.8
      confidence_boost: 0.3
      weight_terms: { distinct_roles: 2, distinct_vendors: 1, role_bonus: 0.2, vendor_bonus: 0.0, single_source_single_vendor_penalty: 0.0, self_confidence_adj: 0.1 }   # extra
      blocking: false
      rules_triggered: []
      recurrence_of: "iteration-001/mf-012"       # extra — same file (audit.yaml run_evidence.audited_dirs_diff) + same mechanism (replay record shas unreachable from the branch under review); the identifiers changed (e5ffbbd/1f1916e → 9ad5b9c), the mechanism did not
      recurrence_kind: "recurred_after_fix_claimed_to_cure_it"   # extra
      bears_on: [nh-002]                           # extra

    - merged_finding_id: mf-002
      sources:
        - { role: spec-drift-detector, finding_id: SD-01, vendor: claude, file: plugins/sdlc/dogfood/ring-audit/audit.yaml, line_range: [3412, 3427], self_confidence: high, severity: "medium → P2", divergence_type: behavior_mismatch, recommendation: fix_code }
        - { role: spec-gaming-detector, finding_id: gd-unc-001, vendor: claude, file: plugins/sdlc/dogfood/ring-audit/audit.yaml, line_range: [3412, 3424], self_confidence: high, severity: P2, pattern: "unclassified → hand_assembled_run_record", mode: diff }
        - { role: pm-reviewer, finding_id: "out_of_scope_observations[0]", vendor: claude, file: plugins/sdlc/dogfood/ring-audit/audit.yaml, line_range: [3414, 3415], self_confidence: null, severity: null, origin: "out_of_scope_observations (category bug-likely) + REQ-006 tag audited_dirs_diff_exit_1_vs_ok_true_inconsistency; REQ-006 verdict confidence high" }
