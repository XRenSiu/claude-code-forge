    - finding_id: cr-001
      severity: P2
      file: plugins/sdlc/dogfood/ring-audit/render_audit.py
      line_range: [512, 594]
      category: projection_fidelity
      root_cause: "assembly_notes() and the known-gaps lead-in hard-code document counts and content claims (11 已知空隙 at L512/L576, 31 条 Gate at L574, 73 Gap / 58 产物-生产者 / 39 提案 at L580, the four-row dos.yaml R001/R008/R010/R017 登记在 table at L589-592, the R017 sentence at L594) as string literals, so the projection carries numbers the source can move underneath it — the exact failure the same card's commit 5c84a5a says a projection must not have, and which F-12 (yaml wins on disagreement) exists to prevent."
      reproduction_scenario: "Add one gap to gaps[] and to R0.missing, then run render_audit.py: the 规模 header row (computed) says 74 缺口 while the assembly section (literal) still says 73 个 Gap ... 两两不撞. Remove run_evidence.known_gaps and re-render: AUDIT.md still prints 本次的尺子有 11 项已知空隙，列在下面 with no #### 已知空隙 section following it. Both reproduced on copies of the current audit.yaml; check_audit.py stays exit 0 throughout."
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/render_audit.py
          lines: [564, 609]
        - kind: grep
          query: "11 项已知空隙|31 条 Gate|73 个 Gap|R001 一个产物|R008 门的判决|R010 未过|R017 效力|R017 落在"
