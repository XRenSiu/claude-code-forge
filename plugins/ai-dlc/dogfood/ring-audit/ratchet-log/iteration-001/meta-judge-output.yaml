    - "mf-014 (pm-reviewer REQ-004 partially_compliant: check_audit.py:399 checks proposal.source non-empty, not resolvable) is known gap KG-02, waived by g2-judge to change-proposal-002 — per task brief known_gaps KG-01..11 are not BLOCK reasons; recorded non-blocking. Three other reviewers (security, logic, gaming) re-confirmed KG-01..04 and deliberately did not re-report them."
    - "Confidence threshold: no merged finding fell below 0.3 (mf-011 sits exactly at 0.3 — single-source, self-confidence medium — and is retained; the protocol drops strictly < 0.3)."
    - "Informational, NOT rules (not in the rules source, not evaluated as rules — recorded so /acceptance-fleet has them for its own four-state decode): qa-reviewer decision GO; spec-gaming-detector gaming_risk_score 3.5 with six-pattern-only sum 1.0, trend first_iteration, below the advisory yellow ceiling 7; spec-drift-detector is a placeholder (no prior iteration); spec-robustness.md does not exist for this Run (all reviewers recorded it as absent; gaming detector ran in maximum-suspicion mode)."
    - "Cross-vendor: all seven reviews are vendor claude (models fable-5-1 / sonnet-5). Cross-vendor weighting added nothing; the same-vendor blind-spot caveat every reviewer logged applies equally to the pass-side evidence (qa GO, pm fully_compliant) and to the findings."

