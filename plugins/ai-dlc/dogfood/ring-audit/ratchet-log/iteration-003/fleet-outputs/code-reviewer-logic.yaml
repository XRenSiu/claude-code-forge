    - finding_id: cr-001
      severity: P1
      file: plugins/sdlc/dogfood/ring-audit/render_audit.py
      line_range: [533, 535]
      category: projection_misstates_data
      root_cause: "The PSL-003 table row is hard-coded to say the footer-less scan ran 自第一个 Card 提交起, but since CARD-01 (a2deb83) the second pass runs over merge-base(main,HEAD)..HEAD and audit.yaml records non_card_range_spec 4d3057a..HEAD; the renderer prints neither that range nor the non_card_commits_touching[] list (4 shas, 13 files), so AUDIT.md states '4 footer-less commits since the first Card commit touched the audited dirs' 19 lines before stating the diff over those dirs since the first Card commit is empty — both cannot be true, and the reader cannot resolve it from AUDIT.md."
      reproduction_scenario: "git show 4ddb362:plugins/sdlc/dogfood/ring-audit/AUDIT.md | sed -n '976p;995p' -> line 976: '自第一个 Card 提交起扫了 20 个，其中 **4** 个碰了被审目录'; line 995: '自第一个 Card 提交（0be2770）起的 git diff --stat' followed by '0 行输出（空）'. Then: for s in c729f76 ebe270d bf3f13e 587f371; do git merge-base --is-ancestor $s 0be2770 && echo yes; done -> yes x4, i.e. none of the 4 is 'since the first Card commit'. audit.yaml run_evidence.audited_dirs_diff.non_card_range_spec = 4d3057a..HEAD (merge-base), and grep -c 'c729f76\\|587f371\\|non_card_range_spec' AUDIT.md -> 0."
      confidence: high
      evidence:
