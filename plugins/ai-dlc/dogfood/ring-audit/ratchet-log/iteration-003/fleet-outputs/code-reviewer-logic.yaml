          match_files: ["plugins/sdlc/dogfood/ring-audit/AUDIT.md"]
        - kind: git_log
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          observation: "a2deb83 (CARD-01) moved the second pass from 'since the oldest Card commit' to merge-base(main,HEAD)..HEAD and added non_card_range_spec + non_card_commits_touching[] to the JSON; 4ddb362 (CARD-06) copied the new numbers into audit.yaml and touched the same render table (added cmd / exit rows) without updating the 自第一个 Card 提交起 label or rendering the new fields. git merge-base --is-ancestor confirms all 4 touchers predate 0be2770."
      needs_codebase_check: false
      suggested_change: "Render the scan window from data (f\"在 {code(diff.get('non_card_range_spec'))} 内扫了 N 个\") and add a small table for non_card_commits_touching[] (sha · subject · audited_paths · files) directly under the row, so the '4 touched' statement and the empty git_diff_stat are visibly about different windows."
      tags: ["F-12", "F-15", "AC-006-a", "PSL-003"]

    - finding_id: cr-002
      severity: P1
      file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
      line_range: [145, 147]
      category: predicate_mismatch_between_passes
      root_cause: "Pass 1 selects Card commits with a case-SENSITIVE grep (^Card:[[:space:]]*CARD-…, line 61) while pass 2 excludes 'footer-bearing' commits with a case-INSENSITIVE grep (-qiE ^Card:, line 146). A commit whose footer is 'card: CARD-01' therefore matches neither pass: it is not replayed through verify_commit.py, not counted in card_commits, and also skipped by the footer-less scan — it is less visible than a commit with no footer at all, which is the blind spot the second pass exists to close."
      reproduction_scenario: "Twin repo: git init -b main; commit README; git checkout -b feat; mkdir -p plugins/sdlc/skills/foo; echo x > plugins/sdlc/skills/foo/SKILL.md; git commit -am $'feat: touch audited dir\\n\\ncard: CARD-01'; bash <repo>/plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh -> exit 0, {card_commits: 0, card_commits_touching_audited_dirs: 0, non_card_commits_scanned: 0, non_card_commits_touching_audited_dirs: 0, ok: true, replays: [], non_card_commits_touching: []}. Controls on the identical tree: footer 'Card: CARD-01' -> exit 1, card_commits_touching_audited_dirs 1; no footer -> exit 0 but non_card_commits_touching_audited_dirs 1 (recorded). The lowercase variant is the only one that leaves no trace. Scan of 4d3057a..4ddb362 found no lowercase footer on the real branch, so the shipped exit 0 is not currently hiding a violation; the instrument is unsound, not the audit."
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          lines: [60, 63]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          lines: [145, 155]
        - kind: git_log
          file: plugins/sdlc/dogfood/ring-audit/replay_card_commits.sh
          observation: "Twin-repo runs as described in reproduction_scenario (three variants of the same commit). a2deb83's message claims 'case-insensitive footer match' but applied it only to has_card_footer(), not to card_footer_of()."
        - kind: grep
          query: "^card:[[:space:]]*CARD- (case-insensitive) minus ^Card:[[:space:]]*CARD- (case-sensitive) over every commit in 4d3057a..4ddb362"
          matches: 0
          match_files: []
      needs_codebase_check: false
      suggested_change: "Use one footer predicate for both passes: make card_footer_of() case-insensitive (grep -oiE '^Card:[[:space:]]*CARD-[A-Za-z0-9_.-]+' then strip the key case-insensitively with sed -E 's/^[Cc][Aa][Rr][Dd]:[[:space:]]*//'), or define has_card_footer() as '[ -n \"$(card_footer_of \"$1\")\" ]' so pass 2 is exactly the complement of pass 1."
      tags: ["REQ-007", "AC-007-a", "PSL-003", "gate-soundness"]

    - finding_id: cr-003
      severity: P2
      file: plugins/sdlc/dogfood/ring-audit/check_audit.py
      line_range: [265, 278]
      category: predicate_stricter_than_signed_rule
      root_cause: "resolve() applies the same-ring test (line 265) to every fills[] reference (line 278), but G1 签字版解释规则 2(e) requires ring consistency only for missing[] ('missing[] 里的每个键必在 gaps[] 且其 ring 一致；fills[] 里的每个键必在 gaps[]'); the module docstring (lines 28-29) misquotes rule 2 as 'missing[] and parts[].fills[] exists in gaps[] with the same ring'. A Part legitimately filling a Gap owned by another Ring (F-04 allows N:N FILLS and says nothing about rings) is rejected as unknown_gap_ref with the misleading text 'whose ring is …'."
      reproduction_scenario: "Take audit.yaml, move 'R6/unenforced_rule/control/gate-signer-must-be-human' from rings[R6].missing[] into rings[spine].parts[sdlc].fills[] (a spine orchestrator closing an R6 control gap): check_audit.py exits 1 with 'unknown_gap_ref: spine/sdlc.fills references R6/…, whose ring is 'R6'' although the id is in gaps[]. Latent today: all 40 filled gaps in audit.yaml are filled by same-ring Parts (verified programmatically), so no current exit code changes."
      confidence: high
      evidence:
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/check_audit.py
          lines: [248, 305]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/g1-record.md
          lines: [359, 367]
        - kind: grep
          query: "fills|同环|same ring"
          matches: 4
          match_files: ["plugins/sdlc/dogfood/ring-audit/audit.schema.md", "plugins/sdlc/dogfood/ring-audit/tests/ring-audit/test_check_audit.py"]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/audit.yaml
          observation: "programmatic check: for every part, every fills[] gap has gaps[].ring == part's ring (0 cross-ring edges); 73 gaps, 40 filled, 33 in missing[]"
      needs_codebase_check: false
      suggested_change: "Either drop the ring comparison for the fills branch (resolve(gid, None, …) with ring_id None meaning 'any ring') so the predicate matches 2(e) as signed, or have G1 amend 2(e) to say same-ring for fills before change-proposal-002 adds the KG-08 mutant that would lock the stricter reading in. Fix the docstring lines 28-29 either way. Note audit.schema.md line 80 and test_check_audit.py line 257 already assert the stricter reading, so this is a spec-text vs. implementation divergence, not only a code slip."
      tags: ["G1-rule-2e", "F-04", "F-13", "KG-08", "spec-interpretation"]

    - finding_id: cr-004
      severity: P3
      file: plugins/sdlc/dogfood/ring-audit/render_audit.py
      line_range: [624, 637]
      category: report_claim_contradicted_by_data
      root_cause: "assembly_notes() prints '装配时只做了下面这些事，一处不漏' followed by a 5-row table, but the merge added a sixth thing: a top-level unenforced_rules[] (4 entries R001/R008/R010/R017, audit.yaml line 3031) that none of the four fragments carries; the section that consumes it (unenforced_rules_notes) never says it was added at assembly time."
      reproduction_scenario: "python3: load the 4 fragments and audit.yaml; set(keys) of fragments = {schema, feature, psl, check, rings, gaps, artifacts, gates, proposals}; merged adds suspected_duplicate_pairs (row 3 of the table) and unenforced_rules (no row). git show 4ddb362:…/AUDIT.md | sed -n 1052,1062p shows the '一处不漏' claim and the 5 rows."
      confidence: high
      evidence:
