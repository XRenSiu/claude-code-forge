          lines: [620, 640]
        - kind: read
          file: plugins/sdlc/dogfood/ring-audit/audit.yaml
          lines: [3031, 3050]
        - kind: grep
          query: "^unenforced_rules:"
          matches: 1
          match_files: ["plugins/sdlc/dogfood/ring-audit/audit.yaml"]
      needs_codebase_check: false
      suggested_change: "Add row 6 to the assembly table: '新增顶层 unenforced_rules[]（4 条，来自 dos.yaml enforced_by ≠ system）| 片段不写它，装配核对节从它现算 | 只是索引'."
