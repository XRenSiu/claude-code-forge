  caveats:
    adversarial_mode_caveat: >-
      Single-vendor, single-size (claude-fable-5-1 reviewing Claude-authored instruments); expect ~30% blind spot to
      Claude RLHF biases. Probes that were run and REBUTTED in S3 as spec-literal (not reported as findings, listed so
      meta-judge / G3 can see them): (a) rule 1 — `alternatives_of` exempts a double producer on mere presence: marking
      acceptance-spec's done_when.yaml entry `alternatives_of: stage.contract` and flipping both verdicts to `necessary`
      exits 0, although F-05 explicitly rules this pair NOT an alternative; F-13's predicate is written on the field and
      graph.yaml (F-05's data source) is not a checker input, so this is a spec gap; the renderer flags 登记 ≠ 现算 only
      while suspected_duplicate_pairs is left unchanged. (b) rule 2 — a gap that is both filled and listed in its
      ring's missing exits 0; rule 2(e) states no converse of 有边 = 从 missing 移出. (c) `signer_kind: human` on the
      delegated G1 exits 0 and renders 人签 + 1 道人签 in 铁律; F-13 scopes the checker to 只核对 signer 存在，不代签,
      identity is G3's. (d) signer_kind outside enum — already KG-04 in run_evidence.known_gaps. Out of focus, left for
      the logic pass: render_audit.py:533 still says 自第一个 Card 提交起扫了 N 个 although CARD-01 widened the window to
      merge-base(main, HEAD) — the four touching non-card commits are all pre-card.
    diff_truncation_caveat: >-
      The full Card range is 92 files / 1991 hunks (33,234 changed lines), dominated by fixtures, ring fragments and
      ratchet-log. The security surface was read in full: check_audit.py, replay_card_commits.sh, render_audit.py,
      audit.schema.md (4 hunks, +1751), the iteration-003 incremental diff of the two scripts (17 hunks excl.
      ratchet-log) and audit.yaml's run_evidence block. Ring fragments and fixtures were not read line by line. HEAD
      advanced from 4ddb362 to f11f0e2 (docs-only: pr-body.md, skill-issues.md) while this review ran; all
      reproductions were executed at f11f0e2 and the instruments' files are byte-identical to 4ddb362.
    rules_conflict_caveat: null
    cross_vendor_unavailable_caveat: >-
      No Codex / Gemini evaluator was invoked in this fleet slot; findings carry the same-vendor caveat.
