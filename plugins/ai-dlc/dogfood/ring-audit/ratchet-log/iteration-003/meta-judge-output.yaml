        note: "adversarial_mode true; every finding executed on crafted variants / twin repos; tool_calls_used 27 vs self-declared budget 20; four probes run and REBUTTED as spec-literal are listed in caveats.adversarial_mode_caveat (alternatives_of presence-only exemption, filled-and-listed gap, signer_kind human on the delegated G1, signer_kind outside enum = KG-04)" }
