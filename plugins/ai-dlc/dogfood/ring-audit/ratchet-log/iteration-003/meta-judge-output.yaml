        note: "existence 4/4; 34/34 unit+integration (7.05s); fixture mutation 24/24 = 1.0; instrument mirror 23/30 = 0.767 self-consistent; real check_audit.py exit 0 + delete-ring twin exit 1; replay 15/0/0 at the live head; 0 regressions vs the iteration-002 baseline; 4 non-finding caveats.other entries (snapshot drift, documentation-clarity regression, render_audit.py untested, spec-robustness.md absent) — none counted as a finding source, see m1_verification.non_source_records" }
    - { role: pm-reviewer,                    file: pm-reviewer.yaml,            vendor: claude, model: claude-fable-5-1, finding_count: 3, schema_valid: true,
        note: "11 REQs: 8 fully_compliant / 1 partially_compliant (REQ-004) / 2 requires_human_verification (REQ-005, REQ-006); all 3 critical REQs fully_compliant; block_merge false; verdict_changes vs iteration-002: none; 4 out_of_scope_observations, 2 counted as finding sources (obs[0], obs[1]), 2 as non-source corroboration (obs[2], obs[3])" }
    - { role: spec-drift-detector,            file: spec-drift-detector.yaml,    vendor: claude, model: claude-fable-5-1, finding_count: 11, schema_valid: true,
        note: "11 signals (0 timing / 7 behavior / 4 contract; 3 medium, 8 low; 0 high); recommendations update_spec 3 / fix_code 2 / needs_human 6; 17 claims extracted, 9 verified as no-drift. ISOLATION BREACH recorded in caveats.schema_violations: it read ratchet-log/iteration-003/fleet-outputs/qa-reviewer.yaml, which COMMON.md forbids" }
    - { role: spec-gaming-detector,           file: spec-gaming-detector.yaml,   vendor: claude, model: claude-fable-5-1, finding_count: 4, schema_valid: true,
        note: "gaming_risk_score 4.0 (trajectory [3.5, 4.0], trend up, delta +0.5, below the >=7 block threshold and below the >=2 single-step alarm); severity_counts P0 0 / P1 0 / P2 4 / P3 0; 2 classified RHD patterns + 2 unclassified; classified-only subtotal 2.0; 6 spec_robustness_gaps; 5 pattern families walked clean (test_modification, information_leakage, style_manipulation, degenerate_implementation, audit wording)" }
  reviewers_expected_but_absent:                   # extra
    - { role: code-reviewer, focus: perf, reason: "skipped by orchestrator ruling — check_audit.py byte-identical since iteration-001 and the perf slot returned 0 findings in both prior rounds. Its absence is NOT a coverage gap for this synthesis; no rule in the rules source depends on a perf metric." }
    - { artifact: spec-robustness.md, reason: "not produced for this Run (input-manifest spec_robustness_md_sha256 null). All six reviewers record it as absent; spec-gaming-detector ran in maximum-suspicion mode and files it as srg-006. Recorded, not waived." }
  rules_loaded:
    - { rule_index: 0, condition: "any P0 finding blocks merge", severity: blocking, applies_to: any-reviewer,
        parsed_predicate: { field: severity, op: "==", value: P0, action: block }, source: "done_when.yaml rules[0]" }
    - { rule_index: 1, condition: "any card commit touching plugins/sdlc/skills, plugins/sdlc/agents or plugins/sdlc/docs is a P0 (PSL-003)", severity: blocking, applies_to: any-reviewer,
