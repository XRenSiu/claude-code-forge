    - { rule_index: 4, condition: "rings == 10", severity: blocking, applies_to: any-reviewer,
        parsed_predicate: { field: rings, op: "==", value: 10 }, source: "done_when.yaml behavior.thresholds.rings" }
    - { rule_index: 5, condition: "dims_with_psl_id_ratio >= 1.0", severity: blocking, applies_to: any-reviewer,
        parsed_predicate: { field: dims_with_psl_id_ratio, op: ">=", value: 1.0 }, source: "done_when.yaml behavior.thresholds.dims_with_psl_id_ratio" }
    - { rule_index: 6, condition: "card_commits_touching_audited_dirs == 0", severity: blocking, applies_to: any-reviewer,
        parsed_predicate: { field: card_commits_touching_audited_dirs, op: "==", value: 0 }, source: "done_when.yaml behavior.thresholds.card_commits_touching_audited_dirs" }
    - { rule_index: 7, condition: "parts_total == 42", severity: blocking, applies_to: any-reviewer,
        parsed_predicate: { field: parts_total, op: "==", value: 42 }, source: "done_when.yaml behavior.thresholds.parts_total" }
    - { rule_index: 8, condition: "required_parts_by_ring_group: R0-R2+spine 14 names; R3-R5 7; R6 9; R7-R8 7; agents 5 (AC-001-a) — required_parts_missing 0 for every group", severity: blocking, applies_to: pm-reviewer,
        parsed_predicate: { field: required_parts_missing, op: "==", value: 0, per_group: ["R0,R1,R2,spine (14)", "R3,R4,R5 (7)", "R6 (9)", "R7,R8 (7)", "agents (5, AC-001-a)"], heuristic: true },
        source: "done_when.yaml behavior.thresholds.required_parts_by_ring_group (descriptive string; predicate reconstructed from AC-001/008..011-a expect)" }
    - { rule_index: 9, condition: "mutation_kill_rate >= 0.70", severity: blocking, applies_to: qa-reviewer,
        parsed_predicate: { field: mutation_kill_rate, op: ">=", value: 0.70 }, source: "done_when.yaml behavior.thresholds.mutation_kill_rate" }
  waivers_loaded:                                  # extra — per task brief these are NOT block reasons
    - { source: "plugins/sdlc/dogfood/ring-audit/calibration/known_gaps.yaml", items: "KG-01..KG-11", status: "open → change-proposal-002 (G1 interpretation round, then l5-tests, then a NEW holdout)",
        ruled_by: "g2-judge (delegated_agent, authorization recorded in .done_when.lock#authorization)",
        effect: "a merged finding whose whole mechanism is a KG item is recorded with known_gap: <id> and does not block" }
    - { source: "done_when.yaml rules[3] + tests-manifest human_acs", items: "AC-005-a / AC-006-a", status: "route to G3, never auto-passed",
        effect: "forces classifier step A (NEEDS_HUMAN); not a defect signal" }
  context_provided: { feature: sdlc-ring-audit, iteration: 3, is_hotfix: false }
  duration_seconds: 900
  tool_calls_used: 0                               # M3 evidence-verification reads (max 5): none needed — no contradiction survived M3 triage

  # ====== THE DECISION ======
  state_decision: NEEDS_HUMAN
  decision_reasons:
    - >-
      NEEDS_HUMAN (classifier step A, first match wins): rule 3 fired. pm-reviewer returned requires_human_verification
      for REQ-005 (AC-005-a, kind human, judge tech, ui:AUDIT.md#ring-tables) and REQ-006 (AC-006-a, kind human, judge
      product, ui:AUDIT.md#run-evidence). done_when.yaml rules[3] forbids auto-passing them, and pm-reviewer's
      block_merge_note says verbatim "Meta-judge should treat REQ-005/006 as pending G3, not as pass." qa-reviewer and
      spec-drift-detector both state independently that they report evidence, not a verdict, for those two ACs.
      Two blocking needs_human items (nh-001, nh-002) go to G3.
    - >-
      No BLOCK_MERGE condition (classifier step B). No reviewer reported a P0: max synthesized severity across 15
      merged findings is P1 (mf-001, mf-002); spec-gaming-detector's severity_counts are P0 0 / P1 0 / P2 4 / P3 0;
      spec-drift-detector's by_severity is high 0 / medium 3 / low 8; pm-reviewer has 0 not_compliant. Rule 0 passed.
    - >-
      Rule 1 (the PSL-003 escalation, the one rule that could turn this run red) evaluates to 0, and its input was
      verified by a method independent of the instrument mf-001 impugns. Five reviewers ran replay_card_commits.sh live
      on docs/1-sdlc-ring-audit and got card_commits_touching_audited_dirs 0 (qa 15/0/0 at 4ddb362; pm 15/0/0; gaming
      15/0/0; drift 15/0/0; security 15/0/0), and four of them separately enumerated the footer spelling of every Card
      commit on the branch WITHOUT using the defective matcher — security "all 15 Card footers on
      docs/1-sdlc-ring-audit are `Card: CARD-xx`"; logic "grep of case-insensitive-minus-case-sensitive over every
      commit in 4d3057a..4ddb362 → 0 matches"; gaming "branch scan: no commit on docs/1-sdlc-ring-audit has a footer
      matching case-insensitively but not case-sensitively"; drift "verified: all 15 footers print `Card: CARD-xx`".
      So the class of commit mf-001 says the instrument cannot see is empty on this branch, and the measured 0 is not
      an artefact of the hole. Three reviewers additionally reproduced `git diff --stat 0be2770^..HEAD` over the three
      audited dirs as 0 lines, and pm reproduced it for 57ebf2b..HEAD and ba7d5e2..HEAD as well.
    - >-
      Rule 2 evaluates to 0: pm-reviewer REQ-002 fully_compliant with dims_without_psl_id 0, dims_with_unknown_psl_id 0
      and dims_without_evidence 0 over 42x3 dimensions (283 file/gate_json refs resolve), corroborated by qa-reviewer's
      check_audit.py exit 0 on the real audit.yaml, spec-gaming-detector's evidence probe (299 refs, 137 line-anchored,
      0 anchors beyond EOF, 0 missing paths) and spec-drift-detector's CLAIM-013 no-drift record.
    - >-
      Rules 4-9 (the thresholds block) all pass on reviewer-reported numbers, each reproduced by at least three
      reviewers this iteration: rings 10; dims_with_psl_id_ratio 1.0; card_commits_touching_audited_dirs 0;
      parts_total 42; required_parts_missing 0 for every ring group and for the 5 agents; mutation_kill_rate 1.0
      fixture-level (24/24) and 0.767 instrument-level (23/30), both above the 0.70 floor.
    - >-
      Task-brief blocking test (a violation of a locked mechanical AC, or fabricated evidence): neither is reported.
      pm-reviewer re-derived all 20 AC given/expect blocks from fresh runs this session with 0 not_compliant;
      qa-reviewer ran the l5-locked suite 34/34; spec-gaming-detector verified the l5 lock 43/43 by sha256 and found
      tests/** byte-identical to iteration-002. On fabrication specifically, the direction of every surviving record
      defect points AWAY from it: mf-002's stale window label makes AUDIT.md claim four post-Card footer-less commits
      touched the audited dirs when the true count under that window is zero (it over-reports a violation against the
      implementer), and mf-005's skill_issues_count 67-vs-69 is decoration on a clause whose load-bearing half (the
      path) is correct. spec-gaming-detector's information_leakage probe found no fixture-to-audit copying, and
      AUDIT.md is a byte-exact render of audit.yaml on three independent reruns.
    - >-
      Two P1 findings survive as NON-blocking (the rules source blocks only P0). mf-001 (confidence 1.0, three roles):
      replay_card_commits.sh runs two footer matchers that disagree on case, so a `card: CARD-01` commit is replayed by
      neither pass and recorded by neither — it is less visible than a commit with no footer at all, which is the blind
      spot the second pass exists to close. mf-002 (confidence 1.0, four roles — the widest agreement in this fleet):
      the PSL-003 table row is hard-coded to "自第一个 Card 提交起" while the pass now walks merge-base(main,HEAD)..HEAD,
      and the renderer prints neither non_card_range_spec nor the non_card_commits_touching[] list, so AUDIT.md states
      "4 touched the audited dirs" 19 lines before stating the diff over those dirs is empty, with no way for the
      reader to resolve it on the page. Both are defects in instruments and projections, not in the delivered
      property: all four sources of mf-001 state the branch has no exploiting commit, and all four sources of mf-002
      state the yaml (authoritative under F-12) is accurate.
    - >-
      Both P1s are fix_induced — introduced by this iteration's own fix commits. mf-001 by a2deb83 (CARD-01), which
      added the case-insensitive has_card_footer while leaving card_footer_of case-sensitive; mf-002 by a2deb83
      widening the window plus 4ddb362 (CARD-06) re-recording the data and editing the same render table without
      touching L533. spec-gaming-detector tags both fix-pressure-induced and calls mf-001 a regression
      ("the pass that exists to close the footer-less blind spot lost a class of input under fix pressure").
      This is the same 2-of-N fix-induced ratio the iteration-002 fixes produced; the structural cause both drift and
      gaming name is the cross-card seam — the window lives in CARD-01's allowed_files and the sentence in CARD-06's,
      so no single implementer could fix both sides in one commit.
    - >-
      Nine P2/P3 findings are non-blocking and eleven of the fifteen are recurrences of iteration-002 merged findings
      at the same file with the same mechanism (see recurrence_summary): mf-003 proposal.source resolvability (KG-02,
      waived), mf-004 fills[] same-ring over-strict (KG-08), mf-006 gates[].kind enum not enforced, mf-007 six vs eight
      top-level registries, mf-009 F-06 cap on 3 Parts, mf-010 --rings disables ring_unexpected, mf-011 holdout
      attested_by_kind raw fallback, mf-012 die() writes no stdout JSON on exit 2, mf-013 disposition enum three vs
      two members, mf-014 the schema's stale "supersedes" preamble. Four are new this iteration: mf-005 (stale
      skill_issues_count), mf-008 (assembly notes claim completeness while omitting unenforced_rules[]), mf-015
      (three signed rendering literals absent from the renderer, all three paths unexercised), and mf-002.
    - >-
      Known gaps and deferred contract items are not block reasons and were applied as waivers, not as evidence:
      mf-003 carries KG-02 (and generalises KG-01/03/04), mf-004 carries KG-08. Both detectors re-confirmed KG-01..04
      by executing crafted variants and neither treated them as news — spec-gaming-detector holds gd-001 at P2 "rather
      than P1 because the artifact itself lists all four as KG-01..04 (open → change-proposal-002)", and
      spec-drift-detector's DS-06 drift_notes says "the spec already records the gap and its destination, so this
      signal adds a reproduction, not news". code-reviewer-security probed KG-04 and deliberately did NOT file it.
    - >-
      Confidence threshold: no merged finding fell below 0.3, so all 15 are retained. The three at exactly 0.3
      (mf-009, mf-013, mf-015) are single-source with a self-reported medium confidence. mf-009 deserves a note — it
      is unchanged content that scored 0.8 in iteration-002 on two sources (gaming + drift) and scores 0.3 here on one
      (gaming alone), because spec-drift-detector spent its signal budget elsewhere this round. The drop measures
      reviewer attention, not new evidence against the finding.
    - >-
      Informational, NOT rules (recorded so /acceptance-fleet has them for its own four-state decode):
      qa-reviewer decision GO with 0 regressions vs the iteration-002 baseline and identical numbers on every gating
      axis; spec-gaming-detector gaming_risk_score 4.0 with trajectory [3.5, 4.0], trend up, delta +0.5 — below the
      default >=7 block threshold and below the >=2 single-step alarm, and its own score_note says the taxonomy-only
      subtotal is 2.0 because two of the four findings are unclassified patterns the 6-pattern taxonomy has no slot
      for; spec-drift-detector 11 signals with 0 high-severity; spec-robustness.md absent for the third consecutive
      Run. Also for the ratchet's benefit: the iteration-003 fixes closed both iteration-002 record-defect classes
      (see closed_from_previous) — this round answered the previous round's record defects with a resolving record,
      not with prose.
    - >-
      Cross-vendor: all six reviews are vendor claude (models fable-5-1 x5, sonnet-5 x1). Cross-vendor weighting added
      0.0 to every merged finding; the 0.8 and 1.0 values owe their boost entirely to cross-ROLE agreement within one
      vendor. spec-gaming-detector records why no second vendor ran: "codex on PATH is a node shim whose native binary
      is missing (isolation.json); gemini absent". The same-vendor blind-spot caveat applies symmetrically to the
      pass-side evidence (qa GO, pm 8 fully_compliant, five clean pattern families) and to the findings.

  # ====== M1 — DEDUPE VERIFICATION AND LOG ======
  m1_verification:                                 # extra — required by the task brief: verify the inherited dedupe before using it
    inherited_from: "plugins/sdlc/dogfood/ring-audit/ratchet-log/iteration-003/meta-judge-merged.json (written by the interrupted meta-judge session; 15 merged findings)"
    method: >-
      All six fleet outputs were re-read in full and every finding-bearing record was enumerated independently, then
      matched against the inherited merged_finding_id it was assigned to. The check is two-directional: every source
      record must appear in exactly one merged finding, and every merged finding's sources[] must exist in the file it
      cites with the severity and self-confidence recorded.
    source_records_enumerated: 25
    merged_findings: 15
    merge_operations: 5                            # clusters where two or more records collapsed
    records_absorbed_by_merges: 10                 # 25 records - 15 merged findings
    per_reviewer_accounting:
      - { role: code-reviewer, focus: security, records: 3, ids: [cr-001, cr-002, cr-003], mapped_to: [mf-001, mf-006, mf-011], unassigned: 0 }
      - { role: code-reviewer, focus: logic,    records: 4, ids: [cr-001, cr-002, cr-003, cr-004], mapped_to: [mf-002, mf-001, mf-004, mf-008], unassigned: 0 }
      - { role: qa-reviewer,                    records: 0, ids: [], mapped_to: [], unassigned: 0, note: "findings: [] and maintenance_issues: [] and regressions: []; decision GO. Its four caveats.other entries are declared non-findings by the reviewer itself and are recorded below as non_source_records." }
      - { role: pm-reviewer,                    records: 3, ids: ["REQ-004/partially_compliant", "out_of_scope_observations[0]", "out_of_scope_observations[1]"], mapped_to: [mf-003, mf-002, mf-005], unassigned: 0,
          note: "REQ-005 and REQ-006 requires_human_verification are NEEDS_HUMAN items, not findings — they enter at M4 via rule 3, not at M1. out_of_scope_observations[2] and [3] are non_source_records, see below." }
      - { role: spec-drift-detector,            records: 11, ids: [DS-01, DS-02, DS-03, DS-04, DS-05, DS-06, DS-07, DS-08, DS-09, DS-10, DS-11],
          mapped_to: [mf-002, mf-007, mf-001, mf-010, mf-004, mf-003, mf-005, mf-012, mf-013, mf-014, mf-015], unassigned: 0 }
      - { role: spec-gaming-detector,           records: 4, ids: [gd-001, gd-002, "gd-unc-001", "gd-unc-002"], mapped_to: [mf-003, mf-001, mf-002, mf-009], unassigned: 0,
          note: "its 6 spec_robustness_gaps (srg-001..006) are contract-weakness records, not findings; recorded as non_source_records per the same convention iterations 001 and 002 used" }
    result: >-
      VERIFIED with no correction to the merge structure. All 25 source records appear in exactly one merged finding;
      no record is missing, none is double-counted, and every sources[] entry's file, line_range, severity and
      self-confidence match its origin file. The five merges (mf-001 four records, mf-002 four, mf-003 three, mf-004
      two, mf-005 two) each satisfy the Action-1 test — same file, overlapping line_range, semantically equivalent
      root_cause. The ten single-source findings did not cluster with anything, correctly: mf-006 [364,374] and
      mf-003 [394,402] and mf-004 [258,278] and mf-010 [165,168] and mf-012 [70,72] all sit in check_audit.py on
      non-overlapping ranges with distinct mechanisms, and mf-002 [533,555] / mf-008 [624,637] / mf-011 [573,574] /
      mf-015 [243,435] sit in render_audit.py where only mf-015's wide range overlaps the others — split because its
