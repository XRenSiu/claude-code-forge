- clause_ref: AC-005-a
  statement: 每个 Part 行给出 Gap 原子集合、独占 Artifact（或 role gate | orchestrator）、检它的 Gate（script 写"闸"、human 写"门"）与 Loop； needed 判定的 deletion 测试写出撤掉它后流水线会产出的具体错误产物或漏检（不接受"流程会断"一类泛语）
  decidability: judgment
  line: 3
  gate: g2
  judge_program:
    dimensions:
    - name: row_has_gap_artifact_gate_loop
      binary: true
      evidence_ref: AUDIT.md#ring-tables row
      pajama_probe: 每行含 atoms / artifact(or role) / gates(闸|门 标注) / loop
    - name: deletion_sentence_names_concrete_failure
      binary: true
      evidence_ref: assessment.needed.evidence[]
      pajama_probe: deletion_test 不含泛语'流程会断'且提到具体错误产物或漏检
    - name: naming_provenance_before_fit
      binary: true
      evidence_ref: assessment.naming
      pajama_probe: provenance 字段在 fit 前且 misfit ⇒ suggested_name 存在且 rename=false
    - name: duplicate_pairs_adjudicated
      binary: true
      evidence_ref: artifacts[] + assessment.needed.verdict
      pajama_probe: pr-review/code-reviewer 与 donewhen-extract/acceptance-spec 两对各有 distinct_exits|merge_candidate|alternatives_of
    - name: missing_rows_tagged
      binary: true
      evidence_ref: rings[].missing[]
      pajama_probe: 每条 missing 有 source ∈ 3 值、necessity、deletion_test
    free_form: false
    isolation_ok: true
    judge: G3 (delegated g3-judge; contract judge=tech)
  calibration_pending: true
- clause_ref: AC-006-a
  statement: run_evidence 节列出 G1 / G2 / G3 的签字人、signer_kind 与授权引用，signer_kind = delegated_agent 的门不渲染为"人签"； 列出 check-audit 对 audit.yaml 的 exit 0 与对删环变体的 exit 1 两次运行记录（缺变体记录时
  decidability: judgment
  line: 3
  gate: g2
  judge_program:
    dimensions:
    - name: signers_listed_with_kind
      binary: true
      evidence_ref: AUDIT.md#run-evidence
      pajama_probe: G1/G2/G3 三行各有 signer, signer_kind, authorization_ref；delegated 不渲染'人签'
    - name: two_check_runs_recorded
      binary: true
      evidence_ref: run_evidence.check_runs
      pajama_probe: 含 exit 0 完整运行与 --variant delete-ring exit 1 运行；否则标 uncalibrated
    - name: audited_dirs_diff_and_skill_issues
      binary: true
      evidence_ref: run_evidence.audited_dirs_diff / skill_issues
      pajama_probe: git diff --stat 记录为空 + skill-issues.md 路径存在
    - name: substitute_evidence_labelled
      binary: true
      evidence_ref: run_evidence.external_evidence.kind
      pajama_probe: == substitute，未渲染为用户验证
    free_form: false
    isolation_ok: true
    judge: G3 (delegated g3-judge; contract judge=product)
  calibration_pending: true
