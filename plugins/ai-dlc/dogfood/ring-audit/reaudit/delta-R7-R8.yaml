new_gaps:
- id: R7/newly_identified/judgment/solo-a-tier-count-not-from-the-contract
  ring: R7
  atoms: [Judgment]
  source: newly_identified
  necessity: necessary
  deletion_test: >-
    solo 谓词用来替代人类 APPROVE 的六项条件里，"该轮 A 档存活 = 0"是唯一一项关于**内容**的判据，
    而它的取数方式与 /pr-review 的产物契约对不上：pr-poll.sh#L400-L405 先找显式的
    `a_tier_survivors: N`，找不到就 `grep -Eic '(tier|severity):\s*(A|P0)'` 数**行**。
    但 `a_tier_survivors` 不是 /pr-review 输出的字段——findings_template.yaml 里根本没有它，
    模板声明的是 `tier_summary: { A: n, B: n, C: n }`（#L14），而脚本从不读 tier_summary。
    于是真实文件一律落进 fallback，而 fallback 数的是行不是条目：每条 A 档发现同时带
    `tier: A` 与 `severity: P0` 两行，一条算两条。具体错误产物 —— 用本仓库真实的
    pre-review/pr3-round-1.findings.yaml（tier_summary { A: 1 }）实测，脚本报 a_tier=2；
    写进 counters 的 `.self_review.last.a_tier` 与 SKILL.md#L35 承诺向人汇报的"A 档存活数"因此是错的。
    具体漏检 —— 方向上是 fail-closed（不会误判收敛），但它把作者逼回自证：round-1 里已修掉的
    A 档没有任何机械方式表达为"已存活 0"，唯一出路是手写一个契约里不存在的 `a_tier_survivors: 0`
    键——正是这道闸（I-87）想取消的那种自我声明。
  evidence:
  - {kind: file, ref: 'plugins/sdlc/skills/review-loop/scripts/pr-poll.sh#L400-L405'}
  - {kind: file, ref: 'plugins/sdlc/skills/pr-review/assets/findings_template.yaml#L14（tier_summary，无 a_tier_survivors）'}
  - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L71-L73（判据自陈：显式 a_tier_survivors，没有就数 tier/severity 条目）'}
  - {kind: run_record, ref: 'plugins/sdlc/dogfood/ring-audit/pre-review/pr3-round-1.findings.yaml：tier_summary { A: 1 }，脚本 fallback 计数 = 2（#L22 tier: A 与 #L23 severity: P0 各命中一次）'}
  disposition: fix_list
  destination_note: >-
    这条必须写进 R7.missing 才不会被 check_audit.py 判 orphan_gap（规则 4：missing 是环对自己的声明）；
    对应提案建议 destination: skill_fix_list（收件人 review-loop 的 eval/gate.json），
    改法：读 /pr-review 契约里已有的 `tier_summary.A`，或把 `a_tier_survivors` 加进
    findings_template.yaml 成为契约字段；两者择一，别再让脚本去 grep 自由文本。

