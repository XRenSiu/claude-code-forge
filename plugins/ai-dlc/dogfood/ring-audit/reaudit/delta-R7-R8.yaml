# delta-R7-R8.yaml — 重跑审计的增量（R7 交付 / R8 学习）
#
# 底稿：audit.yaml 的 R7（pr / review-loop / agent.pr-reviewer / human_gate.merge / release）与
# R8（retro / tune / human_gate.harness-review）共 8 个 Part，在 ab67052 的源码上逐条复核。
#
# 结论先说：**只有一个 Part 的判定变了**——agent.pr-reviewer 的 implemented declared → compiled，
# 因为它的独占产物 findings.yaml (pre-review) 这一轮第一次有了闸（pr-poll.sh selfreview，六条
# 非零退出路径），F-06 封顶的前提不再成立。其余七个 Part 三维判定一动不动：
#   · pr / review-loop / release 的闸更严了（版本同步、merge 主题豁免、checks 三态、solo 谓词），
#     但 static_only 没有变成行为层记录，仍是 compiled；
#   · retro 的 metrics.py 这一轮改了 120 行（I-84/I-85），**仍然全文没有一处 sys.exit**——
#     逐行读过：只有 argparse，连 docstring 自称的 "2 on IO error" 都没有对应代码。导出器不是闸，
#     retro 停在 declared 未动；
#   · tune / release 的脚本本轮**一个字节都没改**（git diff fbc6a3c..HEAD 为空）；
#   · 两个 human_gate 的独占产物 checked_by 仍是空列表，F-06 把它们永久钉在 declared。
#
# 真正变的是：1 处判定、1 处 checked_by、1 条新缺口、15 处过期证据（大量是行号漂移，
# 但其中五条是**断言本身已经不成立**：merge 跑过了、release 走到并记为 skipped、retro/tune 在
# 真归档上跑过、pr 真的建过 PR、pr-poll done 真的联网跑过）。逐条理由见 notes。

