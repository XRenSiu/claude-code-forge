          15:20，跑在本轮修复之后的代码上）；PR #2 的三条 A 档（cr-001 锁闸 fail-open / cr-002 版本同步 /
          cr-004 修复自身的回归）被找出并修掉，存活的 B/C 档进了 PR 正文 Known issues。
          按 pr/eval/gate.json fix_list 第 3 条的字面要求，这件事已经做了。
          (b) 但**这份记录从未过一次它自己的闸**：.sdlc/pr-watch/ 只有 pr-2.counters.json，内容是
          `{"rounds":1,"empty_watches":0,"strikes":{}}`——没有 self_review 键，说明 selfreview 子命令
          没有在任何一个真 PR 上跑过（PR #2 的 review 阶段是以 waiver 收场的，I-69）。闸只在 fixture 上验过。
          (c) pr/eval/gate.json 仍写 gate_pass=static_only、harness_note 仍称 gh 联网路径未跑——
          按 dos.yaml R017（static_only 的 skill 不得被描述为 verified）不上抬；要抬得先更新 gate.json
          的档位与 provenance，那是被审文件，本次只读不改。
