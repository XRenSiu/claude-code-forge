      caveat: >-
        这道闸是**条件生效**的：只有 solo 模式（SELF_REVIEW=1 / --solo）把它接进终止谓词；默认
        APPROVED 路径下没有任何东西读这份 findings 文件。F-06 只问 checked_by 空不空，所以封顶解除；
        但"这个产物在所有路径上都被挡"并不成立，读的人不要读成后者。
      not_reached:
        verified: >-
          行为层记录这一轮**确实产生了**，但缺的是最后一环，所以不抬到 verified：
          (a) 隔离预审真跑过三轮，产物committed —— pre-review/round-1.findings.yaml、round-2.findings.yaml
