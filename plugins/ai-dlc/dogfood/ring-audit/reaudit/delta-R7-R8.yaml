- id: agent.pr-reviewer
  ring: R7
  changes:
    implemented:
      from: declared
      to: compiled
      why: >-
        F-06 封顶的前提消失了：其独占产物 findings.yaml (pre-review) 现在被 pr-poll.sh selfreview
        校验，且该校验有真正的非零退出路径（不是恒 exit 0 的报告工具）。原判 declared 的唯一理由是
        G3/mf-009 的封顶——"检的是下游 PR 正文的 Known issues 段，不是本 agent 的 findings 文件本身"。
        这一轮（I-87，commit bedc159）把校验加到了**文件本身**上：pr-poll.sh#L365-L368 文件缺失或为空
        exit 1；#L374-L395 的内嵌 python 校验器逐条拒——PyYAML 缺席 exit 1（fail closed）、不是合法
        YAML exit 1、没有 `review:` 块 exit 1、review 块缺 target / mergeable exit 1、没有 findings 键
        exit 1、findings 为空列表又没有 rationale exit 1；#L396-L399 把校验失败转成 exit 1。
        它是承重的：review-loop 的单人仓库终止谓词（done --solo）把"≥1 轮 selfreview 记录"当作
        APPROVED 的替代必要条件（pr-poll.sh#L222-L228、SKILL.md#L60-L73），产不出合格的 findings 文件
        就登记不了那一轮，solo 谓词永远 exit 20。
        原 adjudication（compiled vs declared，pending_G3）因此不再有分歧面：两种读法现在都落在 compiled——
        取 compiled 的一方看下游 verify_pr.py --pre-review 仍成立，取 declared 的一方要的"产物本身有检"
        也成立了。
      evidence:
      - {kind: file, ref: 'plugins/sdlc/skills/review-loop/scripts/pr-poll.sh#L359-L399'}
      - {kind: file, ref: 'plugins/sdlc/skills/review-loop/scripts/pr-poll.sh#L222-L228'}
      - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L67-L73'}
      - {kind: smoke, ref: 'plugins/sdlc/eval/smoke.sh#L897-L903（非 review 记录的文件 → exit 1；真实 /pr-review 记录 → exit 0）'}
      - {kind: smoke, ref: 'plugins/sdlc/eval/smoke.sh#L473-L483（空文件 exit 1；A 档存活阻断 solo；换 sha 后该轮失效）'}
