notes: >-
  形状说明（先说，免得合并时踩到）：我在规定的五个键之外多写了两样东西。一是
  still_open_checked（10 条，记「复核过、仍未填」的 gap，为的是下一轮别重查），二是给部分
  unchanged_but_evidence_stale 条目加了 evidence 列表。两样都是纯增量，合并脚本可以整块丢掉
  不影响其余部分。unchanged_but_evidence_stale 里最后两条的 id 带 `gap:` 前缀，指的是 gap
  注册表条目而不是 Part —— 它们的 evidence/deletion_test 也过期了，但没有对应的 Part 可挂。

  三处我做了判断而不是照搬，写明理由，便于复核时推翻：

  (1) 我没有把 g1-record.md 的 checked_by 从 [sdlc_state.py] 扩成
  [sdlc_state.py, verify_issue.py]。verify_issue.py --g1 确实读它，但对「issue 用了
  G1 明确不做的词」只 flags.append，整份 issue 因此不会退非零；按本轮「闸 = 存在非零退出
  路径」的定义它不是闸。同理我没有给 decisions.md 加 checked_by：verify_dos.py 读它，
  但坏的 decisions.md 只表现为「豁免没生效」，没有以它为对象的拒绝。两处都是有意从严。

  (2) R008（三道门只能人签）我判**未闭合**而不是闭合，尽管本轮加了 signer_kind +
  authorization 三道非零退出。理由是 --signer-kind 的默认值是 "human"：一个代签的 agent
  只要不传这个 flag，就被原样记成人签，整套约束绕开，不触发任何拒绝。这是我这轮最接近
  「可以判成闭合」的一条，如果重审者认为「有记录 + 有授权即算承载」，结论会翻。默认值这件事
  我倾向于算 fail-open 而不是单开一条新 gap，因为它讲的正是同一条宪法为什么仍未编译。

  (3) 我在 HEAD 上跑了 verify_graph.py 与 verify_loop.py（两者都 exit 0、0 rejects），
  并把它写成 run_record 级证据但**没有**据此把 asset.graph.yaml / asset.loops.yaml 抬到
  verified。跑一次 verifier 是 compiled 类证据；verified 按本轮纪律要带 / 不带对比臂，
  两个 Part 都没有。除此之外我没有运行任何东西 —— 特别是没跑 smoke.sh（它会 git init
  临时仓库、写文件），smoke 的 382 这个数是数 `^expect` 行数得来的，与修复轮自报的 378
  差 4，我没有去核对这 4 条差在哪里，引用时按「382 行 expect / 自报 378 通过」两个数
  分开写。

  一件我不确定、没有下判的事：skills/sdlc/eval/gate.json 的 provenance.smoke 与
  provenance.date 停在 178 / 2026-09-05，而 psl / psl-derive / dos-extract /
  invariant-extract 四份 gate.json 都加了 2026-09-06 的修复块；issue / donewhen-extract /
  acceptance-spec / sdlc 四份则完全没更新，尽管它们的脚本本轮都改了
  （verify_issue.py +86 / validate_done_when_v2.py +73 / sdlc_state.py +231 /
  lock_done_when.py +72）。这是「gate.json 与它描述的代码脱同步」这一类问题，可能该开一条
  gap 或一条 skill-issue，但它跨了我这四个环之外的 Part（也影响 R3-R8），我不替别人下判。
