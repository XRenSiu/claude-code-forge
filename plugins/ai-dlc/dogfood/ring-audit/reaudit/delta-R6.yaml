# delta-R6.yaml — R6（验收环）在 ab67052 上的重跑增量
#
# 本轮 R6 只有 acceptance-fleet 一个 Part 的源码被动过：
#   git diff --name-only fbc6a3c..HEAD -- plugins/sdlc/skills/{acceptance-fleet,code-reviewer,qa-reviewer,
#     pm-reviewer,spec-drift-detector,spec-gaming-detector,meta-judge,pr-review} plugins/sdlc/agents
# 只回 acceptance-fleet 的 SKILL.md / 两份 references / 两个新脚本 / 一批 eval fixtures。
# code-reviewer · qa-reviewer · pm-reviewer · spec-drift-detector · spec-gaming-detector · meta-judge ·
# pr-review · agents/{review-triager,fix-verifier}.md 在这个区间里一个字节都没改。
#
# 两个新脚本都真的是闸（有非零退出路径，不是恒 exit 0 的报告工具）——但它们检的东西与
# "ratchet-log 的形状"基本无关，逐条实测见下。R6 登记的 7 个 missing 缺口一个都没被填上。

schema: ring-audit-reaudit-delta/1
scope: R6
reviewed_at_head: ab67052

parts:

# ---------------------------------------------------------------------------
# qa-reviewer：唯一一处判定上移
# ---------------------------------------------------------------------------
- id: qa-reviewer
  ring: R6
  changes:
    implemented:
      from: declared
      to: compiled
      why: >-
        新脚本 acceptance-fleet/scripts/qa_facts.py 会拒绝 qa-reviewer 的产物：#L93-L96 读不到顶层
        `qa_report:` 映射就 die(...,1)，而顶层键 `qa_report:` 正是 qa-reviewer 自己的输出契约声明的根
        （references/finding-schema.yaml#L3「Top-level key is `qa_report:`」、#L7）。这不是"存在一个脚本"，
        是存在一条以该产物内容为条件的非零退出路径——与 compute_score.py / compute_confidence.py
        那种"不拒绝任何输入"的计算原语正好相反（audit.yaml 拒 compiled 的原话就是"也不拒绝任何输入"）。
        实测：非 qa 文档 exit 1，真实 run 产物 exit 0（见 evidence 的两条 run_record）。
      evidence:
      - {kind: file, ref: 'plugins/sdlc/skills/acceptance-fleet/scripts/qa_facts.py#L93-L96'}
      - {kind: file, ref: 'plugins/sdlc/skills/qa-reviewer/references/finding-schema.yaml#L3'}
      - {kind: file, ref: 'plugins/sdlc/skills/acceptance-fleet/SKILL.md#L63'}
      - {kind: file, ref: 'plugins/sdlc/eval/smoke.sh#L1169-L1173'}
      - kind: run_record
        ref: >-
          ab67052 · `python3 plugins/sdlc/skills/acceptance-fleet/scripts/qa_facts.py <非 qa 文档>` → exit 1
          "has no top-level `qa_report:` mapping — this is not a qa-reviewer report"
      - kind: run_record
        ref: >-
          ab67052 · 同脚本跑真实 run 产物 plugins/sdlc/dogfood/ring-audit/ratchet-log/iteration-003/
          fleet-outputs/qa-reviewer.yaml → exit 0，"wrote …（omitted 10 opinion keys）"
      gate_caveat: >-
        与 verify_psl.py 同型：qa_facts.py 是"调度前必须跑"的声明式预门，没有挂 hooks——
        plugins/sdlc/ 下**根本不存在 hooks/ 目录**（ls plugins/sdlc/ = agents docs dogfood eval
        LICENSE README.md skills）。它的阻断力来自流程位置：/spec-drift-detector 轮询的是
        qa-measurements.yaml，qa_facts.py exit 1 就没有这个文件、drift 起不来
        （skill-dispatch-matrix.md#L151 与 SKILL.md#L63）。构成 compiled，不构成不可跳过。
      caveat_thinness: >-
        必须写明这条闸有多薄：它只核对根键在不在，qa-reviewer 的任何实质主张都没被检——
        套件是否真跑过、阈值是否真比过、mutation 是否真做过，一条都没有。而且这个拒绝是
        **顺带**的：qa_facts.py 的本职是投影，它 `--check` 模式真正承重的对象是 qa-measurements.yaml
        （acceptance-fleet 的新产物）有没有漏意见键，不是 qa-review.yaml 本身对不对。
        判 compiled 是按"闸 = 存在非零退出路径且条件落在该产物内容上"这条明写的尺子走的；
        若 G-judge 采更严的"脚本要承载该配件的判据"读法，此条应退回 declared。见文末 notes。
      not_reached:
        verified: >-
          gate.json 仍 gate_pass=static_only / evaluated_layers=[structural] / scripts_run={}，本轮未动。
          更关键的是原判词的第一句仍然成立且一字未变：**没有任何脚本能证明测试套件确实跑过**——
          一个以"真跑"为定义性差异的配件，这一层依然是空的。qa_facts.py 完全不碰这件事。
  artifacts:
  - id: ratchet-log/iteration-NNN/qa-review.yaml
    checked_by_from: []
    checked_by_to: [qa_facts.py]
    why: >-
      qa_facts.py#L93-L96。注意登记 id 与磁盘上的文件名不是一个词：registry 的 id 抄自
      graph.yaml#L180（qa-review.yaml），而真实 run 与脚本用的都是
      fleet-outputs/qa-reviewer.yaml（见 new_gaps N2 与 ratchet-log/iteration-00{1,2,3}/fleet-outputs/）。
      本条按"同一件产物的两种拼法"记，拼法分裂另立缺口，不藏。
      注：check_audit.py 的 check_exclusive_artifacts 以 Part 的 `artifact` 字段配 id + producer 取行，
      本行 id 与 qa-reviewer 的 artifact 字段逐字一致，故此改动会正确解除该 Part 的 F-06 封顶。

