- id: acceptance-fleet
  ring: R6
  changes: {}          # implemented / needed / naming 三维均不变，见下面的 artifacts 与 stale 两节
  artifacts:
  - id: ratchet-log/iteration-NNN/**
    checked_by_from: []
    checked_by_to: [next_iteration.py]
    why: >-
      next_iteration.py#L206-L212：派发第 N 轮时 iteration-(N-1) 目录不存在即 die(...,1)。这是一条
      落在该产物上的非零退出路径（实测 N=9 → exit 1），按 .done_when.lock 那条既有先例记入
      checked_by（sdlc_state.py 对 lock.path 也只做 os.path.isfile，audit.yaml 照样把它算进
      checked_by）。**但只到这里为止**：实测把 iteration-001/ 建成一个完全空的目录，
      next_iteration.py 仍然 exit 0，只打四条 warning——目录里一个文件都没有也照过。
      所以它检的是日志的"连号"，不是任何一份产物的形状。
      此行不解除 acceptance-fleet 的 F-06 封顶：该 Part 的 `artifact` 字段指的是
      final-state.json（下一行），不是本 glob。
  - id: ratchet-log/iteration-NNN/final-state.json
    checked_by_from: []
    checked_by_to: []
    why: >-
      不变，且这是本环最要紧的一条：全仓库没有任何 .py / .sh 读 final-state.json
      （grep -rn "final-state" 命中的全是 .md / .yaml 文档与 fixture 里的字符串）。
      v1.1.0 还给它加了三个必填字段（gaming_band / gaming_thresholds / ratchet_rule，
      ratchet-log-format.md#L125-L127、#L145），同样没有检查处——真实 run 的
      iteration-003/final-state.json 三个字段一个都没有，无人报错。
      故 F-06 依旧把 acceptance-fleet 封顶在 declared。

