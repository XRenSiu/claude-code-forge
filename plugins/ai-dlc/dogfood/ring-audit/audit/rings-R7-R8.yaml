# audit.yaml 片段 — Ring R7 交付 / R8 学习（CARD-05, REQ-011）
#
# 形状见 ../audit.schema.md（CARD-01 产物），按 g1-record.md 签字版解释规则 1-3 读：
#   规则 1  一个 Artifact 两个 producer 只有两条合法路：alternatives_of（同阶段条件替代）或两边都
#           needed.verdict: merge_candidate；merge_candidate 标在单生产者身上是 spurious。
#   规则 2  gaps[] 是唯一注册表；parts[].fills[] 是 FILLS 边；无人填的 Gap 必在其环 missing[]。
#   规则 3  gates[] 里的人门只有 G1/G2/G3；merge 与 harness-review 是 kind: human_gate 的 **Part**，
#           不是 Gate 对象，也不写 exercised / signer。
# 本片段不写 run_evidence —— 装配（CARD-06）时统一填。
#
# 被审对象（只读）：plugins/sdlc/skills/{pr,review-loop,release,retro,tune}/、plugins/sdlc/agents/pr-reviewer.md、
# plugins/sdlc/skills/sdlc/assets/{graph,loops}.yaml、plugins/sdlc/docs/{ARCHITECTURE,lifecycle,design-notes}.md、
# plugins/sdlc/dogfood/ring-audit/dos.yaml。本卡未修改其中任何一个文件。
schema: audit/1
feature: sdlc-ring-audit
psl: PSL-sdlc-ring-audit.md
check: check_audit.py

rings:
- id: R7
  question: 合入与发布——改动怎么进 main，怎么算交付完成？
  parts:

  # ---------------------------------------------------------------- pr
  - id: pr
    kind: skill
    ring: R7
    ring_evidence: 'graph.yaml#L206 (id: pr, role: delivery, writes: [github:pr]); ARCHITECTURE.md#L41 §1 R7 行'
    provenance: authored
    loop: null
    artifact: 'github:pr'
    gates: [verify_pr.py]
    fills: ['R7/newly_identified/judgment+control/pr-body-product-order']
    assessment:
      id: A-pr
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-009]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/pr/SKILL.md#L23-L27'}
        - {kind: file, ref: 'plugins/sdlc/skills/pr/scripts/verify_pr.py#L194'}
        - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L31-L37'}
        deletion_test: >-
          撤掉后引擎走 `gh pr create --fill`：产出的 PR body 是一串 commit 标题。具体错误产物 ——
          一个没有 Scope 段与 AC→证据映射的 PR body；下游 /review-loop 判"越界类"评论失去基准
          （review-loop/SKILL.md 以 PR body 的范围声明为对照），A 档验收拿不到"每条 mechanical AC
          对应哪条可复现证据"；具体漏检 —— 一次 1200 行的 XL diff 不被体量判据拦下就进入 review。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/pr/scripts/verify_pr.py#L194'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/pr/eval/gate.json#gate_pass=static_only'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/pr/eval/gate.json#provenance.scripts_run.verify_pr.py'}
        not_reached:
          verified: >-
            无行为层运行记录 —— gate.json 的 harness_note 明说 gh 联网路径（pr create）未跑，
            fix_list 第 2 条即 "gh pr create path not exercised"；verify_pr.py 只在临时仓库对 fixtures 冒烟。
        calibrated: false
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'github:pr（产物命名）'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L52-L53'}
        - {kind: file, ref: 'plugins/sdlc/skills/pr/SKILL.md#L2'}
        rename_reason: >-
          design-notes.md#L52 把 pr 列在"直接改编"（pdforge 的 rules/git-workflow.md 等约定），但改编的是
          判据不是整个 skill，上游没有一个叫 pr 的 skill 可保留 —— 按 PSL-014 判为新写、按产物（PR）命名。
      disposition: none
      adjudications: []

  # ---------------------------------------------------------------- review-loop
  - id: review-loop
    kind: skill
    ring: R7
    ring_evidence: 'graph.yaml#L212 (id: review-loop, role: delivery, loop: review_loop); ARCHITECTURE.md#L41 §1 R7 行'
    provenance: adopted
    loop: 'loops.yaml#review_loop'
    loop_reason: >-
      是 review_loop 的 loop_back 端点：graph.yaml#L351 agent.fix-verifier → review-loop
      带 signal: iteration_complete / loop: review_loop（一次迭代收口），graph.yaml#L347 stage.review 自环同环。
      它本身不是该环的 generator（agent.comment-fixer）也不是 verifier（human_reviewer，loops.yaml#L75-L76）。
    artifact: .sdlc/pr-watch/pr-N.json
    gates: [pr-poll.sh]
    fills: ['R7/newly_identified/capability+judgment+control/review-convergence-binding']
    assessment:
      id: A-review-loop
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-004, PSL-012]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L3-L11'}
        - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L31-L37'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L71-L87'}
        deletion_test: >-
          撤掉后 PR 发出去只剩两种跟进方式：模型层每轮轮询（每次烧 token）或人工盯。具体错误产物 ——
          一条把 reviewer 评论当指令直接照做的修复 commit（未先验证主张，review-loop/SKILL.md#L108
          的"全部判定完成先于任何修复"没有承载者）；具体漏检 —— 轮次与线程往返没有编译态上限，
          与 bot reviewer 的对喷不会停在 exit 30 / exit 31，预算耗尽这件事永远不会被 /sdlc 的
          fail --signal 读到（PSL-004 预算由脚本强制）。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/review-loop/scripts/pr-poll.sh#L252'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/review-loop/eval/gate.json#gate_pass=static_only'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/review-loop/eval/gate.json#provenance.scripts_run.pr-poll.sh'}
        not_reached:
          verified: >-
            gate.json 自述只跑了离线子命令（round / strike / counters 自愈）；watch / snapshot / threads /
            resolve / done 需要一个活的 PR，未跑。fix_list 第 1 条仍是 "run on one real PR with ≥3 comments"。
        calibrated: false
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: '.sdlc/pr-watch/pr-N.json / R7 的 review 环'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/review-loop/SKILL.md#L12'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L47-L49'}
        rename_reason: >-
          上游 vana-builder 的名字是 pr-review-loop，收编时缩成 review-loop —— 严格说这是 PSL-014
          "收编保留上游名"的一处偏离；但同词干（F-03 同词干或同义即 fits），且本仓库另有 /pr-review
          （reviewer 一侧），保留全名会与它混淆。记录偏离，不改名。
      disposition: none
      adjudications: []

  # ---------------------------------------------------------------- agent.pr-reviewer
  - id: agent.pr-reviewer
    kind: agent
    ring: R7
    ring_evidence: >-
      no_node —— graph.yaml 全文无 pr-reviewer 节点（R7 段 graph.yaml#L219-L238 只声明 agent.review-triager /
      agent.comment-fixer / agent.fix-verifier）。按 ARCHITECTURE.md#L41 §1 R7 行落 R7：pr/SKILL.md#L55 与 #L67
      把它写成 `/pr --pre-review` 建 PR 前的隔离预审执行体；plugins/sdlc/agents/pr-reviewer.md#L1-L11 是它的输入/输出契约。
      同一份 agent 也服务 R6 的 /pr-review（ARCHITECTURE.md#L40 §1 R6 行列 pr-review 与 findings.yaml）——
      §1 与图不冲突（图里根本没有这个节点），故不写 role_conflict，写 no_node。
    provenance: adopted
    loop: null
    artifact: findings.yaml (pre-review)
    gates: [verify_pr.py]
    fills: ['R7/newly_identified/judgment/pre-review-isolated-second-read']
    assessment:
      id: A-agent.pr-reviewer
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-003]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/agents/pr-reviewer.md#L10-L11'}
        - {kind: file, ref: 'plugins/sdlc/skills/pr/SKILL.md#L55-L58'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L80-L81'}
        deletion_test: >-
          撤掉后 `/pr --pre-review` 只能由写这个 PR 的同一上下文自审 —— 自审读不出自己的盲点
          （PSL-003 评估者与被评估者分离）。具体错误产物 —— 一个 `## Known issues` 段没有来源、
          条目无 file:line 锚点的 PR body（verify_pr.py --pre-review 会拒，于是 --pre-review 这条路直接不可用）；
          具体漏检 —— 本可在 push 前修掉的 P0 全部推到 reviewer 侧，review 轮次上移。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/pr/eval/gate.json#provenance.scripts_run.verify_pr.py --pre-review'}
        - {kind: file, ref: 'plugins/sdlc/skills/pr/scripts/verify_pr.py#L194'}
        - {kind: file, ref: 'plugins/sdlc/agents/pr-reviewer.md#L22-L25'}
        not_reached:
          verified: >-
            gate.json fix_list 第 3 条 "L2: run /pr --pre-review once with agents/pr-reviewer.md in a fresh
            context and check survivors land in Known issues" 未做 —— 隔离预审从未真跑过。
        calibrated: false
        note: >-
          判 compiled 有争议、并列记下：被 verify_pr.py --pre-review 挡住的是**下游投影**（PR body 的
          Known issues 段：段存在 / 每条有锚点 / 无 A 档），不是本 agent 自己的 findings.yaml。取 compiled
          的理由是这条闸真的会拒（verify_pr.py#L194 exit 1），产不出合格 findings 就发不出 PR；
          取 declared 的理由是 agents/*.md 没有自己的 eval/gate.json，产物本身无检。留给 G3 的人定。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: 'findings.yaml / /pr-review 的隔离只读执行体'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L56-L57'}
        - {kind: file, ref: 'plugins/sdlc/agents/pr-reviewer.md#L2-L3'}
        rename_reason: >-
          收编自 qanat 的 code-reviewer（design-notes.md#L56-L57「code-reviewer → pr-reviewer，去 persona，
          保留判据」）—— 上游名未保留，是 PSL-014「收编保留上游名」的一处偏离；但本仓库 R6 已有一个
          叫 code-reviewer 的 skill（ARCHITECTURE.md#L40），保留上游名必然撞名。与它服务的 /pr-review 同词干
          → F-03 判 fits。记录偏离，不改名。
      disposition: issue
      adjudications:
      - {question: 'agent.pr-reviewer 的 implemented 该判 compiled 还是 declared？', held: 'compiled（下游投影被 verify_pr.py --pre-review 拒）', dissent: 'declared（agents/*.md 无 gate.json，findings.yaml 本身无检）', resolved_by: pending_G3}

  # ---------------------------------------------------------------- human_gate.merge
  - id: human_gate.merge
    kind: human_gate
    ring: R7
    ring_evidence: 'graph.yaml#L239 (id: human.merge, kind: human, role: gate, writes: [github:merge], authority: {merge: true}); ARCHITECTURE.md#L41 §1 R7 门/闸 列「merge / push tag 是人类动作」'
    provenance: authored
    loop: null
    role: gate
    artifact: 'github:merge'
    gates: []
    fills: ['R7/newly_identified/judgment+control/merge-is-a-human-act']
    assessment:
      id: A-human_gate.merge
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-006, PSL-009]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L239-L245'}
        - {kind: file, ref: 'plugins/sdlc/skills/pr/SKILL.md#L10'}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L41'}
        deletion_test: >-
          撤掉后 review 一绿就由脚本 / agent 直接合入。具体错误产物 —— 一个没有任何人裁决过的
          merge commit 落进 main；G3 的例外复核（human AC 清单 + 假设台账，graph.yaml#L200）结论无处生效，
          因为 g3 → merge 这条 handoff（graph.yaml#L354）交给的就是这个人节点；具体漏检 ——
          "合入是不可逆的对外动作"这一条从此没有承载者，--autopilot 会连合并一起免掉（PSL-006）。
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L239-L245'}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L99-L100'}
        not_reached:
          compiled: >-
            无 verify 脚本、无 gate.json —— github:merge 的 checked_by 是空列表（F-06：生产者停在 declared）。
            sdlc_state.py 的前置条件只检 review.done 与（G3 required 时）gates.g3=pass，检不到"合的是谁、合的是哪个 sha"。
          verified: 无行为层运行记录 —— 本次 dogfood 未走到 merge 阶段。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'github:merge / graph.yaml#L239 的 human.merge 节点'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L239'}
        rename_reason: >-
          审计里的 Part id 写作 human_gate.merge（AC-011 的 required_parts 名单逐字如此），图上的节点 id 是
          human.merge —— 前缀不同、同义同位置，F-03 判 fits。不改名。
      disposition: none
      adjudications: []

  # ---------------------------------------------------------------- release
  - id: release
    kind: skill
    ring: R7
    ring_evidence: 'graph.yaml#L246 (id: release, role: delivery, writes: [CHANGELOG.md, releases/vX.Y.Z.md, git:tag]); ARCHITECTURE.md#L41 §1 R7 行'
    provenance: authored
    loop: null
    artifact: releases/vX.Y.Z.md
    gates: [verify_release.py]
    fills: ['R7/newly_identified/judgment+control/post-merge-delivery-order']
    assessment:
      id: A-release
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-009]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/release/SKILL.md#L21-L25'}
        - {kind: file, ref: 'plugins/sdlc/skills/release/scripts/verify_release.py#L157'}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L101'}
        deletion_test: >-
          撤掉后引擎在 merge 之后就说"完成"。具体错误产物 —— 一次没有 tag、没有 CHANGELOG 条目、
          发布说明缺回滚方案的"交付"，以及一个部署了但没跑 --verify-cmd 就置 release.done=true 的状态；
          具体漏检 —— 发布说明里的 `/issue --escape` 登记入口没了，线上反馈这条世界层唯一的外部校准源断掉，
          R8 的逃逸缺陷统计（retro/SKILL.md#L39 逃逸缺陷率）恒为空，"合入不是终点"这条规律无人承载（PSL-009）。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/release/scripts/verify_release.py#L157'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/release/eval/gate.json#gate_pass=static_only'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/release/eval/gate.json#provenance.scripts_run.verify_release.py'}
        not_reached:
          verified: >-
            无真实发布的运行记录 —— gate.json fix_list 第 1 条 "one real release with a --verify-cmd;
            check release.done stays false on red verification" 未做；脚本只在临时仓库上冒烟。
        calibrated: false
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'releases/vX.Y.Z.md + git:tag（产物命名）'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L67-L69'}
        - {kind: file, ref: 'plugins/sdlc/skills/release/SKILL.md#L2'}
        rename_reason: >-
          design-notes.md#L67-L69 记它是 2026-09-05 第二次整理时新写的四个 skill 之一（L8 交付原本没有承载 skill），
          按产物 / 位置命名 —— 新写路径，PSL-014 不要求保留任何上游名。
      disposition: none
      adjudications: []

  missing:
  - R7/unenforced_rule/control/merge-signer-not-enforced
  - R7/unenforced_rule/judgment/static-only-claim-not-enforced
  - R7/newly_identified/control/merged-sha-vs-approved-head
  - R7/newly_identified/control/reply-resolve-order-unchecked

- id: R8
  question: 流程病在哪层；环的参数该不该调？
  parts:

  # ---------------------------------------------------------------- retro
  - id: retro
    kind: skill
    ring: R8
    ring_evidence: 'graph.yaml#L254 (id: retro, role: learning, loop: lifecycle); ARCHITECTURE.md#L42 §1 R8 行'
    provenance: authored
    loop: 'loops.yaml#lifecycle'
    loop_reason: >-
      是 lifecycle 环的 loop_back 起点：graph.yaml#L359 retro → stage.contract 带 signal: escape_defect /
      loop: lifecycle / carries: [change-proposal-*.md]。它不是该环的 generator（sdlc）也不是 verifier
      （human.g3，loops.yaml#L93-L94）。
    artifact: retro/retro-<date>.md
    gates: [metrics.py]
    fills: ['R8/newly_identified/knowledge+judgment/process-illness-baseline']
    assessment:
      id: A-retro
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-016, PSL-008]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/retro/SKILL.md#L21-L24'}
        - {kind: file, ref: 'plugins/sdlc/skills/retro/SKILL.md#L33-L40'}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L42'}
        deletion_test: >-
          撤掉后引擎产出的是一段"这次沟通不够充分，下次加强测试"。具体错误产物 —— 一份没有基线数字、
          没有归层、每条提案没有 target/change/verify_by 的复盘文档，谁都无法验收它；具体漏检 ——
          回流分布、G1 拦截率、human AC 占比、逃逸缺陷率、豁免数（--force 绕门的次数）从不被读出来，
          于是"病在哪一层"永远回答不了，回到 R0/R1/R2 的变更提案永远长不出来（PSL-008 失败归层）。
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/retro/scripts/metrics.py#L108-L109'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/retro/eval/gate.json#gate_pass=static_only'}
        - {kind: file, ref: 'plugins/sdlc/skills/retro/SKILL.md#L63-L68'}
        not_reached:
          compiled: >-
            metrics.py 是导出器不是验证器 —— 全文没有任何非零退出路径（无 sys.exit(1)，main() 只写文件），
            retro 的产物（retro/retro-<date>.md、metrics.json）既无 verify 脚本可拒、也不被任何 G1/G2/G3
            的门挡住。ARCHITECTURE.md#L42 §1 R8 的「门 / 闸」列却把 metrics.py 列在那里 —— 设计视图与实况
            不一致，这是本卡审出的 skill 源码问题，登记为 R8 的 Gap 与 P-R8-02/P-R8-03，未改被审文件。
          verified: 无真实归档的行为层运行记录 —— gate.json fix_list 第 1 条要求"跑 ≥2 个已归档 feature"，未做。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'retro/retro-<date>.md（产物命名）'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L67-L69'}
        - {kind: file, ref: 'plugins/sdlc/skills/retro/SKILL.md#L2'}
      disposition: issue
      adjudications: []

  # ---------------------------------------------------------------- tune
  - id: tune
    kind: skill
    ring: R8
