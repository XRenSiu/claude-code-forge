# 在图里 writes 的字符串都是 `github:pr`，但它们是两个不同的 PR（特性交付 PR / harness 提案 PR），
# 既非同阶段条件替代（不适用 alternatives_of），也不是在争同一个产物（merge_candidate 会读成
# "把 pr 与 harness-review 合并"，是荒谬的）。故按两个 Artifact 登记，图里的同名登记为源码问题（P-R8-06）。
- {id: 'github:pr (harness 提案)', producer: human_gate.harness-review, checked_by: []}

# ============================================================================ gates
# 设计视图。人门只有 G1/G2/G3；merge 与 harness-review 是 Part，不在这里（规则 3d）。
# R7/R8 两环上没有 kind: human 的 Gate 对象。
gates:
- {id: verify_pr.py, kind: script, label: 闸, ref: plugins/sdlc/skills/pr/scripts/verify_pr.py}
- {id: pr-poll.sh, kind: script, label: 闸, ref: plugins/sdlc/skills/review-loop/scripts/pr-poll.sh}
- {id: verify_release.py, kind: script, label: 闸, ref: plugins/sdlc/skills/release/scripts/verify_release.py}
- {id: metrics.py, kind: script, label: 闸, ref: plugins/sdlc/skills/retro/scripts/metrics.py,
   note: '按 ARCHITECTURE.md#L42 §1 R8「门 / 闸」列登记；实况是导出器 —— 无非零退出路径，不拒任何东西。见 R8/newly_identified/control/retro-output-no-rejecting-gate'}
- {id: tune.py, kind: script, label: 闸, ref: plugins/sdlc/skills/tune/scripts/tune.py,
   note: '同上；tune/SKILL.md#L69 自述 "exit 0 恒成立（报告工具）"，真正的控制在 apply_proposal.py（只出 diff，从不写目标文件）'}

# ============================================================================ proposals
proposals:
- {id: P-R7-01, source: A-agent.pr-reviewer, destination: skill_fix_list,
   text: 'agents/pr-reviewer.md 在 graph.yaml 无节点（R6 的 /pr-review 与 R7 的 /pr --pre-review 都调它），环归属只能靠 ARCHITECTURE §1 与两份 SKILL.md 推；建议在 graph.yaml 补节点并显式标环，否则 §1 与图对不上。另记：收编时上游名 code-reviewer 未保留（撞 R6 同名 skill），是 PSL-014 的一处受迫偏离。'}
- {id: P-R7-02, source: R7/newly_identified/control/merged-sha-vs-approved-head, destination: new_issue,
   text: '合入的 sha 与 review / G3 批准过的 head 无脚本核对；建议在 advance release 的前置条件里加一条 merge.sha 与 review.approved_head 的比对，或由 verify_release.py 检。'}
- {id: P-R7-03, source: R7/newly_identified/control/reply-resolve-order-unchecked, destination: skill_fix_list,
   text: 'pr-poll.sh resolve 不核对该线程上是否已有落地回帖，"回帖先于 resolve"只活在 SKILL.md 的判据里；建议 resolve 子命令先查一次该线程的 comments，无自己的回帖则 exit 22。收件人：review-loop 的 eval/gate.json fix_list。'}
- {id: P-R7-04, source: R7/unenforced_rule/control/merge-signer-not-enforced, destination: new_issue,
   text: 'dos.yaml R008 的 enforced_by 是 user_workflow：没有脚本阻止 agent 记录 merge 这道人门的结论。要么把它编译（记录签字人与 signer_kind），要么把 R008 的 enforced_by 诚实降级并在 §1 写明。'}
- {id: P-R7-05, source: R7/unenforced_rule/judgment/static-only-claim-not-enforced, destination: new_issue,
   text: 'dos.yaml R017 的 enforced_by 是 user_workflow：流水线里没有脚本拒绝一份把 static_only 说成 verified 的报告。本次审计用 check_audit.py 的 boolean_implemented / implemented_outside_enum 编译了这条规则，但只在审计文档内生效 —— 建议推广到验收侧。'}
- {id: P-R8-01, source: A-tune, destination: new_issue,
   text: 'naming misfit: tune → suggested_name harness-tune（产物是 harness-proposals，位置是 hill_climb 环，"调什么"是这个名字唯一没说的东西，而 target 恰是封闭集）；不重命名，另开 G2 变更提案 —— 改名要同时动 graph.yaml / loops.yaml / triggers.yaml / ARCHITECTURE §1 / retro 接线段。'}
- {id: P-R8-02, source: A-retro, destination: skill_fix_list,
   text: 'ARCHITECTURE.md#L42 §1 R8 的「门 / 闸」列把 metrics.py 与 tune.py 渲染成闸，但两者都无非零退出路径（tune/SKILL.md#L69 自述"报告工具"）。建议把该列改写为「导出：metrics.py / tune.py；控制：apply_proposal.py 只出 diff + human.harness-review」，否则设计视图高于实况（R017）。'}
- {id: P-R8-03, source: R8/newly_identified/control/retro-output-no-rejecting-gate, destination: new_issue,
   text: 'retro 的产物无拒绝型闸也无门，PSL-015 在 R8 断掉；建议补一个 verify_retro.py（检基线表存在、每条提案有 target ∈ 封闭集 / change / verify_by、数字来自 metrics.json 而非手抄）。'}
- {id: P-R8-04, source: 'R8/newly_identified/knowledge+judgment/harness-change-effect-unmeasured', destination: new_issue,
   text: 'hill_climb 的 success 谓词只到 merged | rejected，没有"上期 expected_delta 是否兑现"的回读；建议在 loops.yaml#hill_climb 的 goal 里加一条效果谓词，并让 tune.py 下一期先核对上期提案的 verify_by。'}
- {id: P-R8-05, source: R8/unenforced_rule/judgment/uncalibrated-tune-thresholds, destination: skill_fix_list,
   text: 'tune 的 40% / 50% / 0.95 是文献先验、未在本仓库校准（gate.json fix_list 已自述），但产出的提案没有携带"未校准"的标记；建议 tune.py 在每条提案里带 calibrated: false，让人在 review 时看得见（PSL-007）。'}
- {id: P-R8-06, source: A-human_gate.harness-review, destination: skill_fix_list,
   text: 'graph.yaml 两处待修：① L273 human.harness-review 的 writes 与 L210 pr 的 writes 同名 github:pr，但它们是两个不同的 PR，按 R001 一读就成了双生产者；② 该节点没有 loop: 字段，尽管 loops.yaml#L111 把它列为 hill_climb 的 verifier、L362 的边已带 loop: hill_climb。'}
