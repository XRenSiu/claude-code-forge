# audit.yaml 片段 — Ring R0 / R1 / R2 / 脊柱（CARD-02）
#
# 形状见 ../audit.schema.md（CARD-01 产物），判定在 ../check_audit.py。
# 路径约定：本片段的 `psl` / `check` 与 CARD-06 装配后的 audit.yaml 同基准（ring-audit 根目录）；
# 所有 evidence.ref 是仓库相对路径。本片段不写 run_evidence——它是 CARD-06 装配时填的整份文档级证据。
#
# 自检：
#   python3 plugins/sdlc/dogfood/ring-audit/check_audit.py \
#     plugins/sdlc/dogfood/ring-audit/audit/rings-R0-R2-spine.yaml \
#     --psl plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md \
#     --rings R0,R1,R2,spine --required-parts "..."
#
# 本片段采用的两条解释（都在 Assessment 正文里写明，G3 可推翻）：
#   ① F-06 的 declared 封顶按 Part 的**独占** Artifact 判（PSL 领域模型：Part 独占 0..1 Artifact）。
#      共同生产或有争的 Artifact 若 checked_by 为空，仍照 F-06 抬出一条 Control Gap 进该环 missing，
#      但不把一个独占产物有闸的 Part 压回 declared——否则 dos-extract 这种"主产物有闸、审计线无闸"
#      的配件会被判成"只声明了"，比事实更不诚实（DP-1 要的是不高估，不是一律低估）。
#   ② implemented 的 verified 一律未达：PSL State Machine 的"已验证"是"带 / 不带对比的行为层跑过"，
#      本 Run 产出了 R0–R2 多个 skill 的产物，但没有任何一次带 / 不带 skill 的对比运行
#      （各 skill gate.json 的 tier2_status 均为 NOT RUN）。产物存在不等于对比跑过。

schema: audit/1
feature: sdlc-ring-audit
psl: PSL-sdlc-ring-audit.md
check: check_audit.py

rings:

