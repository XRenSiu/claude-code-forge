# audit.yaml 片段 —— Ring R3 标准 / R4 计划 / R5 实现（CARD-03）
#
# 形状见 ../audit.schema.md（CARD-01 产物），判定在 ../check_audit.py。
# 顶层 psl / check 路径按装配后的 audit.yaml（ring-audit 根目录）写；本文件在 audit/ 下单独跑自检时
# 命令行显式给 --psl，与这两个键无关。
# 本片段不写 run_evidence —— 签字三元组与 check_runs 由 CARD-06 装配时填（G1 签字版解释规则 3）。
#
# 自检：
#   python3 plugins/sdlc/dogfood/ring-audit/check_audit.py \
#           plugins/sdlc/dogfood/ring-audit/audit/rings-R3-R5.yaml \
#           --psl plugins/sdlc/dogfood/ring-audit/PSL-sdlc-ring-audit.md --rings R3,R4,R5 \
#           --required-parts "test-suite-generator, spec-compile, calibrate, plan-cards, implement, commit, ratchet"

schema: audit/1
feature: sdlc-ring-audit
psl: PSL-sdlc-ring-audit.md
check: check_audit.py

rings:

# ===========================================================================
- id: R3
  question: 判据怎么被机器执行
  parts:

  - id: test-suite-generator
    kind: skill
    ring: R3
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L110-L115（role: standard → R3）'
    provenance: adopted
    loop: null
    artifact: tests/<f>/**
    gates: [derive_counts.py, gen_existence.py, check_verbatim_names.py, lock_done_when.py]
    fills: [R3/newly_identified/knowledge+capability/contract-to-test-pyramid]
    assessment:
      id: A-test-suite-generator
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/test-suite-generator/SKILL.md}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L37'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/test-suite-generator/eval/gate.json#fix_list'}
        deletion_test: >-
          撤掉后引擎把整份冻结契约一次铺成测试：产出一批只覆盖 happy 路径、没有 based_on REQ-ID 标签、
          没有 mutation 配置的测试文件，tests-manifest 里每条 AC 都对得上一个测试名却对不上一条失败过的断言；
          REQ 与测试的一对一缺口要到 pm-reviewer 逐条比对时才暴露，而那时测试已经被 L5 二次锁冻住。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/test-suite-generator/SKILL.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/test-suite-generator/eval/gate.json#gate_pass'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/test-suite-generator/eval/gate.json#provenance.scripts_run'}
        not_reached:
          verified: >-
            gate_pass=static_only，且 gate.json 的 provenance 自记 NOT a decorrelated read, NOT an L2 run；
            三个脚本只有作者本机冒烟，没有带 / 不带 skill 的行为对比。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: tests/<f>/** + tests-manifest.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/test-suite-generator/eval/gate.json#imported_into_sdlc'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L39-L42'}
        rename_reason: 不重命名；test-suite 与独占产物 tests/<f>/** 同词干（F-03），且收编自 done-when-pipeline v1.1.0，保留上游名。
      disposition: none
      adjudications: []

  - id: spec-compile
    kind: skill
    ring: R3
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L116-L121（role: standard → R3）'
    provenance: adopted
    loop: null
    artifact: compile_manifest.yaml
    gates: [verify_compile.py]
    fills: [R3/newly_identified/judgment/decidability-ladder-routing]
    assessment:
      id: A-spec-compile
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-010]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/spec-compile/SKILL.md}
        - {kind: file, ref: plugins/sdlc/skills/spec-compile/scripts/verify_compile.py}
        deletion_test: >-
          撤掉后每条判据都停在同一档：结构性子句（例如「每个 skill 目录必须有 eval/gate.json」）被写成
          LLM rubric 的一个维度而不是 fitness function，行为子句只留几个 happy example，产出的
          compile_manifest 里 decidability 一栏整列是 judgment。G2 冻结的于是是一把「看起来有判据」的尺子，
          没有一条能被脚本跑；判据上移的方向错误要到 acceptance 全绿而隐藏变体一跑就红时才显形。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/spec-compile/scripts/verify_compile.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/spec-compile/eval/gate.json#gate_pass'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/spec-compile/eval/gate.json#round2.scripts_run.verify_compile.py'}
        not_reached:
          verified: >-
            gate.json 的 tier2_status 自记 NOT RUN —— no held-out spec set + executor available，
            按 effect-gate.md 解到 static_only；行为层的带 / 不带对比未跑。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: compile_manifest.yaml + eval_cases/**
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/spec-compile/eval/gate.json#imported_into_sdlc'}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L36-L38'}
        rename_reason: >-
          不重命名；compile 与独占产物 compile_manifest.yaml 同词干（F-03）。收编自 qanat，正文保留 Territory / Run /
          R001 的上游词，靠术语映射表读成 sdlc 的对象——名字贴合而词表不贴合，词表问题属 R1，不在本环判定。
      disposition: none
      adjudications: []

  - id: calibrate
    kind: skill
    ring: R3
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L122-L128（role: standard → R3）'
    provenance: adopted
    loop: null
    artifact: calibration_report.yaml
    gates: [verify_calibration.py]
    fills: [R3/newly_identified/judgment+capability/ruler-itself-uncertified]
    assessment:
      id: A-calibrate
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-007, PSL-002]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/calibrate/SKILL.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/calibrate/eval/gate.json#round1.blocking'}
        deletion_test: >-
          撤掉后 spec-compile 出的 eval_case 集合与 rubric 直接上线当闸：一套杀不掉任何变异体的测试
          （mutation_score 0.4）与一套评分者互不同意的 rubric（Krippendorff α 0.6）会给出全绿的
          final-verdict.yaml，acceptance 把它写进 ratchet-log 当达标证据，holdout 从来没被隔离过。
          gate.json round1 记下的正是这个洞的一个真实实例——阈值可以被 --min-mutation 0.3 调低到通过。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-007]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/calibrate/scripts/verify_calibration.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/calibrate/eval/gate.json#gate_pass'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/calibrate/eval/gate.json#round2.scripts_run.verify_calibration.py'}
        not_reached:
          verified: >-
            gate.json 的 tier2_status 自记 NOT RUN —— no held-out standard set + executor available；
            本次审计也没有跑过任何一次真实校准。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: calibration_report.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/calibrate/eval/gate.json#imported_into_sdlc'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/calibrate/eval/gate.json#naming_collision_check'}
        rename_reason: >-
          不重命名；calibrate 与独占产物 calibration_report.yaml 同词干（F-03）。gate.json 的
          naming_collision_check 已确认它与运行时 calibration.resolved 事件不是同一个东西。
      disposition: none
      adjudications: []

  missing:
  - R3/lifecycle_blank/control/red-green-evidence-script
  - R3/unenforced_rule/control/uncalibrated-standard-used-as-evidence

# ===========================================================================
- id: R4
  question: 怎么拆成无上下文可做的卡
  parts:

  - id: plan-cards
    kind: skill
    ring: R4
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L131-L136（role: planner → R4）'
    provenance: authored
    loop: null
    artifact: cards/CARD-*.yaml
    gates: [lint_cards.py]
    fills: [R4/newly_identified/knowledge+capability/context-free-card-split]
    assessment:
      id: A-plan-cards
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/plan-cards/SKILL.md}
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L67-L68'}
        - {kind: file, ref: plugins/sdlc/skills/plan-cards/scripts/lint_cards.py}
        deletion_test: >-
          撤掉后拆卡回到 /sdlc 的散文里：产出的卡没有 allowed_files，两张卡同时把同一份路由表列进可改文件，
          写冲突要到第二张卡的 verify_commit.py 白名单检查或 merge 冲突时才炸；某个 REQ 无人认领而没有任何一处报错，
          某个 REQ 被两张卡同时认领而两份实现互相覆盖；context_estimate 超过 40k 的卡被照发，实现者中途丢上下文后
          自行扩大范围，产出一个跨越两张卡边界的 diff。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/plan-cards/scripts/lint_cards.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/plan-cards/eval/gate.json#gate_pass'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/plan-cards/eval/gate.json#provenance.scripts_run.lint_cards.py'}
        not_reached:
          verified: >-
            gate_pass=static_only；fix_list 的 L2（把一份真实冻结契约拆成卡、交给全新会话的 card-implementer，
            看它是否不再要上下文）仍未跑，没有带 / 不带的行为对比。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: cards/CARD-*.yaml
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L67-L69'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/plan-cards/eval/gate.json#provenance.why_it_exists'}
        rename_reason: 不重命名；新写的 skill 按产物命名，cards 与 cards/CARD-*.yaml 同词干（F-03 / PSL-014）。
      disposition: none
      adjudications: []

  missing:
  - R4/newly_identified/control/card-depends-on-unchecked

# ===========================================================================
- id: R5
  question: 按卡做、按卡提交
  parts:

  - id: implement
    kind: skill
    ring: R5
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L139-L146（role: implementer → R5）'
    provenance: authored
    loop: loops.yaml#card_retry
    artifact: card.allowed_files
    gates: [verify_commit.py]
    fills: [R5/newly_identified/control+judgment/implementer-sees-evaluator]
    assessment:
      id: A-implement
      state: evidenced
      needed:
        verdict: merge_candidate
        merge_candidate_with: agent.comment-fixer
        psl_ids: [PSL-001, PSL-002]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L144'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L230'}
        - {kind: file, ref: plugins/sdlc/skills/implement/SKILL.md}
        - {kind: file, ref: 'plugins/sdlc/dogfood/ring-audit/dos.yaml#L677'}
        deletion_test: >-
          撤掉后没有一处规定实现者只看卡：引擎在同一上下文里先读 ratchet-log 的评审发现再改代码，产出的 diff
          精确命中评审者列出的那几行、隐藏变体覆盖的分支留成占位，acceptance 全绿而隐藏集一跑就红；同时改动不再
          被 allowed_files 约束，卡外文件被顺手改掉而不是停在 WHITELIST_OVERFLOW，一张卡的 diff 里混进另一张卡的实现。
        merge_candidate_reason: >-
          card.allowed_files 在 graph.yaml 里有三个 writer：implement（#L144）、agent.card-implementer（#L152）、
          agent.comment-fixer（#L230）。前两者满足 F-05 同阶段条件替代三条件（同在 stage.implement 的 handled_by #L29；
          #L320 有带 when 守卫的 conditional 边选执行者；同 schema 产物），记 alternatives_of 豁免；agent.comment-fixer
          三条件只差得更远——它不在 stage.implement 的 handled_by 里，与 implement 之间也没有 conditional 边（#L349 是
          handoff）——按规则 1 双方都记 merge_candidate，本审计不当场裁掉一个。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/implement/SKILL.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/implement/eval/gate.json#fix_list'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/commit/eval/gate.json#provenance.scripts_run.verify_commit.py'}
        not_reached:
          verified: >-
            gate_pass=static_only；implement 自身无 scripts/（gate.json fix_list 写 no own script by design —— 闸是
            verify_commit.py 与 sdlc_state.py），compiled 靠被闸挡而不是靠自带脚本；fix_list 的 L2（真跑一张卡看它
            是否在白名单溢出时停机而不是扩范围）未跑。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'stage.implement（位置名，graph.yaml#L29）/ card.allowed_files'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L67-L68'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L29'}
        rename_reason: 不重命名；新写的 skill 按位置命名，implement 与 stage.implement 同词干（F-03 / PSL-014）。
      disposition: issue
      adjudications: []

  - id: agent.card-implementer
    kind: agent
    ring: R5
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L147-L154（role: implementer → R5）'
    provenance: authored
    loop: loops.yaml#card_retry
    artifact: card.allowed_files
    gates: [verify_commit.py]
    fills:
    - R5/newly_identified/capability/fresh-context-card-execution
    - R5/newly_identified/control+judgment/implementer-sees-evaluator
    assessment:
      id: A-agent.card-implementer
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-003]
        evidence:
        - {kind: file, ref: plugins/sdlc/agents/card-implementer.md}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L320'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L32'}
        deletion_test: >-
          撤掉后 executor == agent 这条 conditional 分支没有承载者：卡只能在编排者自己的上下文里做，产出的 diff
          带着编排者读过的评审发现、其他卡的实现与隐藏集线索。R005（实现者不读评估者输出）在 graph.yaml 的
          must_not_read 里仍然写着、在实际执行里已经破了，而没有任何产物能显示这一点——隔离从此只是文档。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/agents/card-implementer.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/commit/eval/gate.json#provenance.scripts_run.verify_commit.py'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L147-L154'}
        not_reached:
          verified: >-
            plugins/sdlc/agents/ 下五个 agent 都没有 eval/gate.json，这个 Part 没有任何证据档；compiled 完全来自
            它自己的判据「每个 commit 过 verify_commit.py exit 0 才 git commit」这道被闸挡的约束，没有行为层运行记录。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'card.allowed_files / stage.implement 的执行器位置（graph.yaml#L320）'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L68'}
        - {kind: file, ref: plugins/sdlc/agents/card-implementer.md}
        rename_reason: 不重命名；card-implementer 与它的输入（卡）和位置（stage.implement 的 agent 执行器）同词干（F-03）。
      disposition: none
      adjudications: []

  - id: agent.comment-fixer
    kind: agent
    ring: R5
    ring_evidence: >-
      plugins/sdlc/skills/sdlc/assets/graph.yaml#L225-L231（role: implementer → R5）· role_conflict：
      plugins/sdlc/docs/ARCHITECTURE.md#L41 的 R7 交付行把 review-loop 归 R7，而本 Part 是
      loops.yaml#L71-L84 review_loop 的 generator、graph.yaml#L349 上 stage.review 的下游；§1 表不点名 agent，
      comment-fixer 只经 review-loop 间接归 R7。两源并列，本审计不调和（F-08 / F-24）。
    provenance: authored
    loop: loops.yaml#review_loop
    loop_reason: >-
      graph.yaml#L225-L231 的节点没有 loop 键，但 loops.yaml#L75 把它写成 review_loop 的 generator；
      本 Part 按 loops.yaml 记环归属，graph.yaml 的缺键作为一条源码问题记在 implemented.evidence 里。
    artifact: card.allowed_files
    gates: [verify_commit.py]
    fills: [R5/newly_identified/control+judgment/implementer-sees-evaluator]
    assessment:
      id: A-agent.comment-fixer
      state: evidenced
      needed:
        verdict: merge_candidate
        merge_candidate_with: implement
        psl_ids: [PSL-001, PSL-002]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L230'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L144'}
        - {kind: file, ref: plugins/sdlc/agents/comment-fixer.md}
        deletion_test: >-
          撤掉后 review 环里「一条 ACCEPT 线程一个隔离修复者」没有承载者：修复在 review-loop 自己的上下文里做，
          同一个上下文既持有 triage 的全部线程与评审者判据、又写代码，产出的 commit 一次扫掉多条线程且没有复现测试；
          主张本来就不成立的那一类（UNEXPECTEDLY_PASSING）被静默改掉而不是停下回报，PR 上看到的是「都修了」，
          实际是把评审者的措辞而不是缺陷改掉了。
        merge_candidate_reason: >-
          与 implement 并列生产 card.allowed_files 且不满足 F-05 同阶段条件替代三条件（不在 stage.implement 的
          handled_by graph.yaml#L29 里；#L349 从 review-triager 过来的是 handoff 边而不是带 when 守卫的 conditional 边），
          按规则 1 两个生产者都记 merge_candidate。这与 dos.yaml#L677 记的 R001 现状问题是同一件事的两个位置。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/agents/comment-fixer.md}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/commit/eval/gate.json#provenance.scripts_run.verify_commit.py'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L75'}
        not_reached:
          verified: >-
            无 eval/gate.json、无行为层运行记录；且 graph.yaml#L225-L231 的节点缺 loop 键而 loops.yaml#L75 已把它
            当 review_loop 的 generator，两份数据对同一个 Part 的环归属不一致（源码问题，不在本审计里调和）。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'loops.yaml#review_loop 的 generator（位置名，loops.yaml#L75）'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L56'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L71-L84'}
        rename_reason: >-
          不重命名。fit 按位置名判：comment-fixer 与它在 review_loop 里的位置（修一条 PR 评论线程）同义 → fits。
          注意它改编自 qanat 的 issue-fixer 而没有保留上游名（design-notes.md#L56），provenance 因此按 authored
          的那条路记；provenance 不参与 fit 判定（F-03），只决定 misfit 的去向理由，此处无 misfit。
      disposition: issue
      adjudications: []

  - id: commit
    kind: skill
    ring: R5
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L163-L168（role: implementer → R5）'
    provenance: authored
    loop: null
    artifact: git:commit
    gates: [verify_commit.py]
    fills: [R5/newly_identified/control/atomic-auditable-commit]
    assessment:
      id: A-commit
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-004]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/commit/SKILL.md}
        - {kind: file, ref: plugins/sdlc/skills/commit/scripts/verify_commit.py}
        - {kind: file, ref: 'plugins/sdlc/docs/ARCHITECTURE.md#L39'}
        deletion_test: >-
          撤掉后落地前的三道机械闸不存在，引擎按默认习惯 git add -A && git commit -m "update"：产出一条混了两个
          关注点、把 .env 与一枚 AKIA 开头的 key 一起暂存、消息不带 Card footer 的提交。卡的白名单溢出与
          .done_when.lock 命中都不会被拒——契约被改掉而同一 diff 里没有 change-proposal——之后
          replay_card_commits.sh 无从按卡回放，PSL-003（审计者不改被审对象）这类性质失去机械证明。
      implemented:
        verdict: compiled
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/commit/scripts/verify_commit.py}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/commit/eval/gate.json#gate_pass'}
        - {kind: smoke, ref: 'plugins/sdlc/skills/commit/eval/gate.json#smoke（bash plugins/sdlc/eval/smoke.sh → 101 passed, 0 failed, 2026-09-05）'}
        not_reached:
          verified: >-
            gate_pass=static_only；fix_list 自记两条未跑——L2（拿一份真实的多关注点 diff 看引擎是否真的拆成两条提交）
            与「红-绿证据是手工的，没有脚本」；脚本冒烟在临时仓库里跑过，不等于 skill 的带 / 不带行为对比。
      naming:
        verdict: fits
        provenance: authored
        artifact_or_position: 'git:commit'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: file, ref: 'plugins/sdlc/docs/design-notes.md#L52-L53'}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/commit/eval/gate.json#provenance'}
        rename_reason: >-
          不重命名；commit 与独占产物 git:commit 同词干（F-03）。它改编自 pdforge 的 git-workflow 约定
          （design-notes.md#L52，「直接改编」而非「直接收编」），正文重写成判据 + 预门形态、gate.json 没有
          imported_into_sdlc 块，故 provenance 记 authored。
      disposition: none
      adjudications: []

  - id: ratchet
    kind: skill
    ring: R5
    ring_evidence: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L155-L162（role: implementer → R5）'
    provenance: adopted
    loop: loops.yaml#ratchet
    artifact: experiment_dir/**
    gates: []
    fills: [R5/newly_identified/capability/run-until-criteria-met]
    assessment:
      id: A-ratchet
      state: evidenced
      needed:
        verdict: necessary
        psl_ids: [PSL-002, PSL-012]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/ratchet/SKILL.md}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L37-L52'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/graph.yaml#L321'}
        deletion_test: >-
          撤掉后「跑到达标为止」的那一类卡只能靠引擎在同一会话里自评自改：没有独立评估者、没有杀死重启，产出的是
          一串各自声称有改进的 diff 与一份由生成者本人写的通过结论。results.tsv / learnings.md / dead-ends.md 不存在，
          同一条死路被反复走；plateau 与 oscillation 因为无人计数而永不触发升级，单卡预算 3 在实际上变成无上限。
      implemented:
        verdict: declared
        psl_ids: [PSL-010, PSL-015]
        evidence:
        - {kind: file, ref: plugins/sdlc/skills/ratchet/SKILL.md}
        - {kind: file, ref: plugins/sdlc/skills/ratchet}
        - {kind: gate_json, ref: 'plugins/sdlc/skills/ratchet/eval/gate.json#gate_pass'}
        not_reached:
          compiled: >-
            no_gate —— 无 scripts/，且独占产物 experiment_dir/** 的 checked_by 为空；按 F-06 生产者不得高于 declared，
            审计者不得以「读了 SKILL.md 觉得能跑」抬到 compiled。它的 commit 走 /commit 的闸，但那道闸检的是
            git:commit，不是 experiment_dir/**。
          verified: gate_pass=static_only 且 gate.json 的 provenance.scripts_run 为空对象，没有任何脚本或行为层记录。
      naming:
        verdict: fits
        provenance: adopted
        artifact_or_position: 'loops.yaml#ratchet（位置名）/ experiment_dir/**'
        fit: fits
        rename: false
        psl_ids: [PSL-014]
        evidence:
        - {kind: gate_json, ref: 'plugins/sdlc/skills/ratchet/eval/gate.json#imported_into_sdlc'}
        - {kind: file, ref: 'plugins/sdlc/skills/sdlc/assets/loops.yaml#L37'}
        rename_reason: >-
          不重命名；ratchet 与它拥有的环 loops.yaml#ratchet 同词干（F-03），且收编自 ratchet v1.1.0，保留上游名。
      disposition: issue
      adjudications: []

  missing:
  - R5/newly_identified/control/experiment-dir-unchecked
  - R5/unenforced_rule/control/one-producer-per-artifact-unlinted
  - R5/newly_identified/control/agent-parts-without-gate-json

