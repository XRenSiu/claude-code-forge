# =============================================================================
# Design Ontology Spec — ai-dlc plugin (as-is / 现状本体) — FRESH RUN 2026-09-18 with dos-extract 0.11.0 (--auto)
# Schema: plugins/ai-dlc/skills/dos-extract/assets/dos_template.yaml (13 sections: core model + vocabulary)
# Workspace: .dos-extract/ (01_inventory · 01b_docs_terms · 02_classification · 03_convergence · terms.txt)
# Companion audit trail: decisions.md. This is the dogfood product, compared against ../../dos.yaml 0.4.0 there;
# it does not replace the shipped ontology.
# =============================================================================

meta:
  dos_version: "0.1.0"
  product: "ai-dlc plugin"
  bounded_context: "software delivery lifecycle"
  owner: "XRenSiu"
  status: "draft"
  last_reviewed: "2026-09-18"
  related_docs:
    - "plugins/ai-dlc/README.md"
    - "plugins/ai-dlc/docs/ARCHITECTURE.md"
    - "plugins/ai-dlc/docs/lifecycle.md"
    - "plugins/ai-dlc/docs/routing.md"
    - "plugins/ai-dlc/docs/evaluation.md"
    - "plugins/ai-dlc/skills/ai-dlc/assets/state.schema.json"
    - "plugins/ai-dlc/skills/ai-dlc/assets/graph.yaml"
    - "plugins/ai-dlc/skills/ai-dlc/assets/loops.yaml"
    - "plugins/ai-dlc/skills/ai-dlc/assets/routing.yaml"
    - "plugins/ai-dlc/skills/ai-dlc/assets/sizing.yaml"
    - "plugins/ai-dlc/dogfood/dos-extract-2026-09-18/decisions.md"

scope:
  in_scope: |
    One software delivery lifecycle as the ai-dlc plugin runs it: a Run that moves through
    fifteen stages, its acceptance Contract frozen by human Gates, its work split into
    WorkUnits handed to isolated implementers, every failure routed to a Layer and recorded
    as an append-only Event, and the declared execution graph (Nodes) and loop contracts
    (Loops) that bound the whole thing. Covers R2–R8 (contract → learning), the X2 routing
    and X3/X4 ledger/trace/graph cross-cuts, and the seams to R0/R1.

  out_of_scope: |
    The content of the product world (PSL laws, DOS proposals, invariant cards — R0/R1 own
    them; this DOS only holds their paths and closure). The GitHub object model (issue body,
    PR comments, review threads — referenced, not modelled). The acceptance-line finding /
    verdict schemas (evaluation context). Claude Code plugin packaging (marketplace, versions,
    user-invocable) and the skillwise evaluation tiers of skills. The code being delivered.
    The other eleven plugins in claude-code-forge: this repository is a monorepo and each plugin is its
    own bounded context. This DOS covers plugins/ai-dlc only — which is why it lives there and not at the
    repository root, where it would be claiming a scope it does not have.
  audience:
    - "the plugin author (XRenSiu)"
    - "authors of ai-dlc skills and agents"
    - "AI agents running /ai-dlc, /plan-cards, /implement, card-implementer"
    - "reviewers reconciling the PSL-derived dos-proposal against this as-is ontology (X1)"

  success_criteria: |
    (1) `verify_issue.py --dos` and `lint_cards.py --dos` resolve every domain noun a card or
    issue cites against `objects` / `rules` here. (2) The 应然 dos-proposal derived from the
    ring-audit PSL can be reconciled object-by-object (same / synonym / conflict) against this
    file in a G1 record. (3) A new skill author can draw the Run → Contract → WorkUnit → Event
    data flow and name which Node writes which artifact without reading any SKILL.md.

reuse:
  internal_references:
    - name: "looper v0.2.0 — dos-extract / psl / invariant-extract"
      url: "plugins/ai-dlc/skills/dos-extract/SKILL.md"
      adopted_concepts: ["this 13-section DOS schema (core model + vocabulary layer)", "R00x constitution ids", "□/◊ split (resident invariant vs done_when)"]
    - name: "qanat .claude/skills — donewhen-extract / spec-compile / calibrate"
      url: "plugins/ai-dlc/skills/donewhen-extract/SKILL.md#术语映射"
      adopted_concepts: ["Run (一次执行) as the lifecycle instance", "Contract as the human-signed gate asset", "R001 evaluator/executor isolation", "R002 gate assets only humans sign"]
    - name: "done-when-pipeline v1.1.0 (this repo)"
      url: "plugins/ai-dlc/skills/acceptance-spec/SKILL.md"
      adopted_concepts: ["done_when.yaml (v1, bridged to v2)", "spec-robustness.md", "four-state ratchet", "REQ-ID / EARS types"]
    - name: "vana-builder pr-review-loop v0.4.0"
      url: "plugins/ai-dlc/skills/review-loop/SKILL.md"
      adopted_concepts: ["review_loop memory (watermark, counters, evidence log)", "verdict set ACCEPT/REJECT/REPLY/ESCALATE/SKIPPED"]
  external_references:
    - name: "LangChain four loop levels + Andrew Ng three timescales"
      url: "plugins/ai-dlc/docs/proposals/loop-graph-engineering.md#1.2"
      adopted_concepts: ["Loop.level (agent | verification | event | hill_climbing)", "Loop.timescale (minutes | hours | days)"]
    - name: "Flowtivity typed edges / puppyone graph-engineering failure list"
      url: "plugins/ai-dlc/docs/proposals/loop-graph-engineering.md#1.3"
      adopted_concepts: ["Event.refs closed edge set", "Node boundary identity (reads / must_not_read / writes / authority)", "resume_binding on human Nodes"]
    - name: "EARS requirement syntax; Conventional Commits; SemVer; KAOS goal model"
      url: "plugins/ai-dlc/skills/acceptance-spec/references/ears-syntax.md"
      adopted_concepts: ["Contract.acceptance[].ears_type", "commit message grammar (behavior, not object)", "release bump derivation", "□ vs ◊ altitude"]
  deliberate_divergence:
    - from: "Flowtivity `caused` edge"
      reason: "an append-only log can only point backwards, so the causal edge is `caused_by` (effect → cause); saves a forward event id"
    - from: "LangGraph / ADK runtimes and knowledge-graph 'context graph'"
      reason: "graph.yaml is a declaration, skills are the runtime; trace.jsonl is a decision trace, not a knowledge graph (design-notes 第三次整理)"
    - from: "qanat's G1 / G2 (verify_g1 machine gate / review_g2 review gate)"
      reason: "ai-dlc's G1 (world adjudication) and G2 (criteria freeze) are human Gates, not the same pair — mapped in each imported skill's 术语映射"

# -----------------------------------------------------------------------------
# 3. Objects (8 — the seventh discipline holds, RepoAsset waived; see decisions.md)
# -----------------------------------------------------------------------------
objects:
  Run:
    description: "One delivery from intake to archive; its state.json is the sufficient statistic."
    type: "aggregate_root"
    synonyms: ["slug", "feature (metrics.py / tune.py)", "一次交付", ".aidlc/<slug>/", "Run (qanat 术语映射)"]
    properties:
      slug: { type: "string", required: true, description: "^[a-z0-9][a-z0-9-]{1,63}$; directory name under .aidlc/ and specs/" }
      title: { type: "string", required: true }
      track: { type: "enum", required: true, description: "psl | task | unset — PSL track builds the world first; DOS-closure failure forces psl" }
      stage: { type: "enum", required: true, description: "intake → track → issue → branch → contract → g2 → cards → implement → acceptance → pr → review → g3 → merge → release → archive (ORDER; asserted equal to graph.yaml.stages)" }
      counters: { type: "object", required: true, description: "per-Layer reflow counts card/plan/task/ontology/world + fingerprint_history (window) + scores; owned by aidlc_state.py fail" }
      gates: { type: "object", required: true, description: "g1 / g2 / g3 → Gate" }
      waivers: { type: "array", required: false, description: "{stage, reason, at, unmet} — every --force advance; a process smell retro counts" }
      assumptions: { type: "array", required: false, description: "假设台账: {id, req, risk, signed_by, verify_at, status open|verified|accepted_risk}" }
      artifacts: { type: "object", required: true, description: "name → path of produced artifacts; copied into the Archive" }
      pending: { type: "object", required: false, description: "failure_report: true after an escalation until `report --path` clears it; check-clean refuses to end a session while set" }
      issue: { type: "ref", required: false, description: "GitHub issue {number, url, kind feature|bug|escape} — slim reference to the requirement-intake context" }
      pr: { type: "ref", required: false, description: "GitHub PR {number, url, size_class XS..XL, pre_review_rounds}" }
      merge: { type: "ref", required: false, description: "{sha, merged_at} — merge is a human action" }
      release: { type: "object", required: false, description: "{version, tag, notes, done, skipped_reason}; archive requires done or skipped_reason" }
      world: { type: "object", required: false, description: "paths into the world context: psl, derived_dir, form_draft_sha256, dos, invariants" }
    identity_rule: |
      Identified by slug; one state.json per slug under .aidlc/; the same slug archived under specs/<slug>/.
    lifecycle: |
      init (intake) → advance through the fifteen stages in ORDER (skips only with a recorded Waiver; the
      review → merge skip is legal when gates.g3.required=false) → archive (copies state, ledger, trace,
      artifacts to specs/<slug>/). Resumable from state.json.stage at any time.

  Contract:
    description: "The acceptance criteria a Run must meet — done_when.yaml v2, frozen by G2."
    type: "aggregate_root"
    synonyms: ["契约", "判据契约", "done_when.yaml", "acceptance contract", "Contract (qanat)"]
    properties:
      schema: { type: "integer", required: true, description: "always 2 (v1 shapes enter via convert_v1_to_v2.py)" }
      feature: { type: "string", required: true, description: "the Run's slug" }
      track: { type: "enum", required: true, description: "psl | task" }
      created_by: { type: "enum", required: true, description: "donewhen-extract | acceptance-spec(+convert) | issue-inline" }
      based_on: { type: "array", required: true, description: "REQ-ids the criteria hang from (requirement-intake context)" }
      acceptance: { type: "array", required: true, description: "AC items {id AC-nnn-x, req, kind mechanical|human, ears_type, observe (boundary route:/cli:/ui:/db_field:/event:, never a file path), given, expect, paired_with | statement, judge product|design|tech, evidence checklist|demo}; the minimal unit G2 signs" }
      existence: { type: "array", required: false, description: "observation boundaries only (route / db_field / ui / cli / event); file-level existence lives on WorkUnit.allowed_files" }
      behavior: { type: "object", required: false, description: "tests-manifest seed (test → AC map) filled at L5 by a non-implementer; may be empty at G2" }
      thresholds: { type: "object", required: false, description: "numbers that are themselves criteria (coverage, mutation kill rate, p95 …) with threshold_source" }
      rules: { type: "array", required: false, description: "flat conditions meta-judge reads (e.g. any P0 finding blocks merge)" }
      constraints: { type: "object", required: false, description: "forbidden_paths (tests/**, done_when.yaml, dos.yaml, contract.yaml, .done_when.lock) and mock_allowlist" }
      budgets: { type: "object", required: false, description: "card_retries / plan_reflows / task_reflows override; default from routing.yaml" }
      lock: { type: "value", required: false, description: ".done_when.lock {version, stage g2|l5, signed_by, signed_at, files[{path, sha256}]}; two-stage: g2 signs criteria, l5 re-signs tests + behavior" }
    identity_rule: |
      One Contract per Run (contract.done_when path in state.json). AC ids are stable within the Contract
      and are first-class trace anchors (implements / supersedes edges).
    lifecycle: |
      draft (issue AC → donewhen-extract or acceptance-spec+convert) → validated as v2 (advance g2) →
      frozen by Gate g2 (lock stage g2) → re-signed after tests (lock stage l5) → amended only through a
      change proposal in the same diff (Event AMENDS Contract, task-layer reflow) → archived.

  WorkUnit:
    description: "A self-contained unit of work a context-free agent can finish alone (卡 / CARD-xx)."
    type: "entity"
    synonyms: ["卡", "任务卡", "Card", "CARD-xx", "prompt 载荷"]
    naming_note: "Canonical docs/code name is 卡/Card; renamed here because verify_dos.py rejects any object ending in `Card` (see decisions.md, Q001)."
    properties:
      id: { type: "string", required: true, description: "CARD-nn" }
      title: { type: "string", required: true, description: "one observable behaviour this unit delivers" }
      req_ids: { type: "array", required: true, description: "REQ-ids owned — each REQ belongs to exactly one WorkUnit" }
      ac_ids: { type: "array", required: true, description: "subset of Contract.acceptance ids this unit must turn green" }
      dos_slice: { type: "object", required: true, description: "{objects[], invariants[]} — the DOS nouns this unit uses; lint_cards.py --dos checks closure against this file" }
      allowed_files: { type: "array", required: true, description: "write whitelist globs; the whitelist executor (verify_commit.py --card) refuses anything else" }
      forbidden_files: { type: "array", required: true, description: "default tests/**, done_when.yaml, dos.yaml, contract.yaml, .done_when.lock + Contract.constraints.forbidden_paths" }
      context_estimate_tokens: { type: "integer", required: true, description: "card + sources + AC subset + tests; over the lint limit → split" }
      budget: { type: "object", required: true, description: "{retries} — same fingerprint twice escalates before the budget is spent" }
      depends_on: { type: "array", required: false, description: "other WorkUnit ids; dependency order only" }
      status: { type: "enum", required: true, description: "todo | doing | done | blocked (in Run.cards.items, with retries, last_fingerprint, commits[])" }
    identity_rule: |
      Identified by id within a Run's cards/ directory; registered in Run.cards.items. A REQ has one owner
      WorkUnit; two WorkUnits' allowed_files never overlap.
    lifecycle: |
      split from the frozen Contract (plan-cards) → linted (coverage, no write conflicts, DOS closure,
      context bound, ac_ids exist) → todo → doing (implementer sees only this unit + state summary + AC
      subset + red baseline) → done (commits registered) | blocked; re-split = plan-layer reflow.

  Gate:
    description: "A human-only checkpoint with a recorded verdict: G1 world, G2 criteria, G3 exceptions."
    type: "entity"
    synonyms: ["门", "三道门", "G1 世界裁决", "G2 判据冻结", "G3 例外复核", "human seam", "R002 gate asset (qanat)"]
    properties:
      id: { type: "enum", required: true, description: "g1 | g2 | g3" }
      required: { type: "boolean", required: true, description: "g1 only on the psl track; g3 default true, false must be set explicitly and is recorded" }
      verdict: { type: "enum", required: true, description: "pending | pass | reject | waived" }
      by: { type: "string", required: false, description: "the human signer — a person's name, never a Node of kind skill/agent" }
      at: { type: "timestamp", required: false }
      record: { type: "path", required: false, description: "g1-record.md (三问 + 分歧集回应) / .done_when.lock (g2) / g3-record.md (human AC verdicts, B-tier warnings, failure report, assumptions)" }
      attribution: { type: "enum", required: false, description: "g1 reject only: derivation_error | rule_error (rule_error bumps Run.counters.world)" }
    identity_rule: |
      Identified by id within a Run (Run.gates.g1/g2/g3). Declared once, graph-side, as the human Node that
      holds it (human.g1 / human.g2 / human.g3 with resume_binding).
    lifecycle: |
      pending → pass | reject (+attribution for g1) | waived (only via a recorded Waiver). g2 pass requires
      Contract.lock to exist; g1 pass requires Run.world.derived_dir to exist. A mechanical pre-gate
      (verify_*.py, lint_cards.py) is NOT a Gate — it is an edge guard.

  Event:
    description: "One append-only ledger record with typed edges to what caused or decided it."
    type: "entity"
    synonyms: ["账本记录", "迹事件", "ledger row", "trace event", "ev-nnnn"]
    properties:
      id: { type: "string", required: true, description: "ev-NNNN, sequential per Run" }
      at: { type: "timestamp", required: true }
      stage: { type: "enum", required: true, description: "Run.stage when recorded" }
      kind: { type: "enum", required: true, description: "init | set | advance | waiver | gate | card | fail | reflow | failure_report | archive | escape | <custom via ledger --kind>" }
      signal: { type: "enum", required: false, description: "closed set from routing.yaml (card_test_fail, same_card_same_fingerprint, whitelist_overflow, lock_hash_mismatch, pbt_fail_n3_consistent_with_req, counterexample_cites_dos_invariant, counterexample_cites_psl_rule, hidden_variant_fail, review_thread_strike_limit, human_ac_pending, b_tier_warning_over_threshold, escape_defect, budget_exhausted, oscillation_detected, plateau, impossible_under_contract) or a gate id" }
      layer: { type: "enum", required: false, description: "card ⊂ plan ⊂ task ⊂ ontology ⊂ world — the reflow coordinate (routing also emits pseudo-layers exception / g3 / human_attribution / next_outer)" }
      fingerprint: { type: "string", required: false, description: "stable digest of the failure output (or sha1[:12] of --evidence); repeat / oscillation are computed over the window" }
      convergence: { type: "object", required: false, description: "fail events: {type none|repeat|oscillation|plateau|budget|impossible|handler=human, fingerprint_history, repeat, oscillation_period, score}" }
      note: { type: "string", required: false, description: "evidence text" }
      decision: { type: "string", required: false, description: "action taken or ESCALATE→<layer>" }
      by: { type: "string", required: true, description: "engine | human:<name> | <verifier node>" }
      refs: { type: "array", required: true, description: "typed edges {type ∈ caused_by | decided_by | supersedes | implements | references | depends_on | rejected_alternative, target ∈ ev-id | CARD-* | AC-* | REQ-* | PSL-* | DOS-* | routing.Rnn | human:* | github:* | path}" }
    identity_rule: |
      Identified by id within a Run's trace.jsonl; the same row appears in ledger.md (human projection).
      Never edited, never deleted; a corrupt trace never affects budgets or transitions (evidence, not control state).
    lifecycle: |
      appended by every mutating aidlc_state.py command (init / set / advance / gate / card / fail / report /
      ledger / archive) → queried by trace.py why / impact, metrics.py, tune.py → archived with the Run.

  Node:
    description: "A participant in the declared execution graph with a bounded read/write identity."
    type: "entity"
    synonyms: ["节点", "skill node", "agent node", "human node", "stage node", "graph.yaml nodes[]"]
    properties:
      id: { type: "string", required: true, description: "<skill> | agent.<name> | human.<name> | stage.<stage>" }
      kind: { type: "enum", required: true, description: "skill | agent | human | stage" }
      role: { type: "enum", required: false, description: "orchestrator | world | knowledge | contract | standard | planner | implementer | evaluator | delivery | learning | gate — the docs' 九环 is this field grouped" }
      reads: { type: "array", required: false, description: "what the Node may read" }
      must_not_read: { type: "array", required: false, description: "the compiled isolation: implementers never see ratchet-log/**, spec-robustness.md, evaluator prompts, hidden set, other WorkUnits" }
      writes: { type: "array", required: true, description: "bounded write scope; non-empty for skill/agent kinds; never a bare ** / * (verify_graph lint 1)" }
      authority: { type: "object", required: false, description: "{commit, post, resolve, approve, sign, merge, push_tag} booleans" }
      loop: { type: "ref", required: false, description: "the Loop this Node generates inside (loops.yaml id)" }
      resume_binding: { type: "array", required: false, description: "human Nodes only: the Run state fields a resume must match (verify_graph lint 4)" }
      handled_by: { type: "array", required: false, description: "stage Nodes only: the Nodes that do the stage's work" }
    identity_rule: |
      Identified by id in graph.yaml (52 nodes at v0.6.0: 28 skill, 15 stage, 5 human, 4 agent). Declaration-time
      object: it changes by human PR (verify_graph.py, verify_loop.py, graph check assert it), not per Run.
    lifecycle: |
      declared in graph.yaml → linted (bounded writes, DAG without loop_back, evaluator→implementer carries,
      human resume binding, fan_in merge) → mutually asserted against aidlc_state.py ORDER → rendered (graph render).

  Loop:
    description: "A cycle contract: who generates, who verifies, and the four ways it stops."
    type: "entity"
    synonyms: ["环", "环契约", "loops.yaml entry", "七个环 (card_retry · grill · ratchet · acceptance_ratchet · review_loop · lifecycle · hill_climb)"]
    properties:
      id: { type: "string", required: true }
      level: { type: "enum", required: true, description: "agent | verification | event | hill_climbing (LangChain four layers)" }
      timescale: { type: "enum", required: true, description: "minutes | hours | days" }
      goal: { type: "object", required: true, description: "{predicate, checked_by}" }
      generator: { type: "ref", required: true, description: "Node that produces (implement, ratchet.worker, agent.comment-fixer, ai-dlc, tune)" }
      verifier: { type: "ref", required: true, description: "Node that judges — never the same Node as generator (verify_loop)" }
      stop: { type: "object", required: true, description: "four keys, all explicit (null allowed): success (non-null predicate) · convergence {fingerprint_repeat, oscillation_periods, plateau_rounds, …} · budget {ref routing:<dotted> | literal + numbers} · impossible {signal, reporters}" }
      memory: { type: "array", required: true, description: "on-disk state inside the archive/state layout (.aidlc/, specs/, ratchet-log/, cards/, tests/, tune/, retro/, state.json, ledger.md, trace.jsonl, learnings.md, dead-ends.md, results.tsv)" }
      fresh_context: { type: "boolean", required: true, description: "true = every iteration starts a new context and reads memory from disk" }
      trigger: { type: "enum", required: true, description: "turn_end | event | interval | cron | after | manual; bound to /goal, /loop, Stop hook, /schedule in triggers.yaml" }
      escalate_to: { type: "enum", required: true, description: "card | plan | task | ontology | world | human" }
      signals: { type: "array", required: false, description: "routing signals this Loop can emit" }
    identity_rule: |
      Identified by id in loops.yaml; every loop_back edge in graph.yaml names exactly one Loop (verify_graph lint 2).
      Declaration-time object; its parameters change only through /tune proposals merged by a human.
    lifecycle: |
      declared → linted (generator ≠ verifier, stop four keys, budget.ref resolves, memory in layout) →
      consumed per Run by aidlc_state.py loops (budget consumption) and by tune.py (proposals) → amended by PR.

  RepoAsset:
    description: "A repo-level ontology artifact the team shares: discovered in the project directory, tracked in git."
    type: "aggregate_root"
    synonyms: ["仓库级制品", "X1 制品", "本体制品", "decisions.md", "invariants/", "repo asset"]
    # fresh-run correction #2 (2026-09-18): the file names dos.yaml / agent-map.md belong to the kinds
    # (vocabulary DOS / AgentMap), not to the aggregate — declared on both they were homonyms.
    naming_note: |
      The eighth object, past the ≤7 discipline, waived in decisions.md (`object_count`). Judgment 2 found
      nothing to merge into — a Contract is per-Run and frozen by Gate g2, a RepoAsset outlives every Run and
      changes only through an ontology-layer proposal. Judgment 4 kept it in this context: all three consumers
      (issue closure, WorkUnit.dos_slice, the vocabulary sensor) sit inside R2–R8, not downstream of it.
    properties:
      kind: { type: "enum", required: true, description: "dos | decisions | agent_map | invariants — the closed set repo_assets.py knows" }
      canonical_path: { type: "string", required: true, description: "where it belongs when absent: under Run.world.scope in a monorepo (plugins/ai-dlc/dos.yaml), else the repository root" }
      path: { type: "string", required: false, description: "repo-root-relative path actually found, or null; .aidlc/ resolves but is reported as not shareable" }
      tracked: { type: "boolean", required: false, description: "git ls-files sees it; false is not「有本体」, it is「你有本体」" }
      required_level: { type: "enum", required: true, description: "optional | recommended | required — sizing.yaml.repo_assets by tier and track; required is the only level prereqs(issue) refuses on" }
      produced_by: { type: "enum", required: true, description: "dos-extract | invariant-extract; afterwards amended by an ontology-layer proposal, never by an implementer Node" }
    identity_rule: |
      Identified by kind plus the scope it was discovered under: one ontology per bounded context, never one per Run.
      In a monorepo the bounded context is the package, so plugins/ai-dlc/dos.yaml and a sibling plugin's are two
      RepoAssets, not one — and a repository-root copy claiming to cover both would be a scope lie.
    lifecycle: |
      extracted once per package (dos-extract / invariant-extract) → committed to git → discovered by every later
      Run (repo_assets.py, recorded into Run.world) → amended by an ontology-layer change proposal.
      Never written by a Run, never copied into .aidlc/.

# -----------------------------------------------------------------------------
# 4. Vocabulary — 91 terms: the ubiquitous language (fresh run; 02_classification.md → placement)
# -----------------------------------------------------------------------------
vocabulary:
  # ---- Run's parts (主干与状态) ------------------------------------------------------------------
  Stage:
    kind: "enum"
    of: "Run"
    definition: "Run 所在的十五个阶段之一（ORDER；与 graph.yaml.stages 互相断言相等）"
    synonyms: ["阶段", "十五个阶段", "ORDER"]
    see_also: ["Prereq", "R009"]
  Track:
    kind: "enum"
    of: "Run"
    definition: "PSL 轨 / TASK 轨：形态未定（先建世界）/ 形态已定（直接进契约）；词表闭包失败是客观转轨触发"
    synonyms: ["轨道", "PSL 轨", "TASK 轨", "psl track", "task track", "双轨"]
    source: "docs/ARCHITECTURE.md §16"
  StateFile:
    kind: "artifact"
    definition: "`.aidlc/<slug>/state.json`：这次运行的充分统计量，只留状态不留历史；脚本拥有，不手改"
    synonyms: ["state.json", "状态文件", "充分统计量"]
    see_also: ["Run", "R006"]
  Prereq:
    kind: "concept"
    definition: "advance 进入一个阶段前对着**文件与仓库**检的前置条件（锁、红基线、final-state、merge sha …），不是引擎 set 的 flag"
    synonyms: ["前置条件", "prereqs", "next_allowed"]
    scope_note: "「前置条件是文件，不是 flag」— ARCHITECTURE §3；四个曾被引擎 set 的布尔是本文件 anti_patterns 里的一条"
    see_also: ["EdgeGuard", "Advance", "R019"]
  Advance:
    kind: "command"
    definition: "aidlc_state.py advance <stage>：按 ORDER 推进 Run；前置条件不满足即拒绝并列出缺什么；--force --reason 记一条 Waiver"
    synonyms: ["推进", "advance"]
    see_also: ["Prereq", "Waiver", "R009"]
  Autonomy:
    kind: "value"
    of: "Run"
    definition: "自治阶梯：每步都问 / 到门为止自动 / 到失败为止自动；整个流程只问一次，记进状态、跨会话；三档都不代签门"
    synonyms: ["自治", "自治阶梯", "autonomy", "--autopilot"]
    see_also: ["Gate", "R008"]
  Resume:
    kind: "command"
    definition: "--resume <slug>：从状态文件的阶段继续；人节点靠 resume_binding 对上 Run 状态；评审环靠水位线不重复处理"
    synonyms: ["恢复", "--resume", "resume_binding", "中断与恢复"]
    see_also: ["Node", "Watermark"]
  Doctor:
    kind: "command"
    definition: "aidlc_state.py doctor：装置健康度，建议性，从不阻断，不进 advance 的前置条件"
    synonyms: ["doctor", "装置健康度"]
    scope_note: "「会阻断的 doctor 就是第四道门」— lifecycle.md"
  SizeTier:
    kind: "value"
    of: "Run"
    definition: "体量档 S / M / L（intake.size + size_source ∈ default | derived | derived_early | manual）：决定广度网格、X1 制品与校准要求到哪一级"
    synonyms: ["体量档", "档位", "size tier", "S/M/L", "size_source", "Tier"]
    scope_note: "不是三档 A/B/C（CheckTier）。裸词 Tier 两边都在用，闭包拒绝不带限定的 Tier"
    see_also: ["SizingGrid", "CheckTier", "R019"]
  Assumption:
    kind: "value"
    of: "Run"
    definition: "假设台账的一行：{id, req, risk, signed_by, verify_at, status open | verified | accepted_risk}；G3 逐条处置"
    synonyms: ["假设台账", "假设", "assumption"]
    see_also: ["Gate"]
  Note:
    kind: "value"
    of: "Run"
    definition: "解释日记 notes.md 的一行：规格含糊处当场做了什么选择，四个固定格子——解释 / 偏离 / 权衡 / 待答问题；只增不删，门禁前逐字呈现"
    synonyms: ["解释日记", "日记", "notes.md", "note"]
    scope_note: "账本记「已经错了什么」，日记记「当初为什么往那边走」——两条记忆通道（ARCHITECTURE §10）。不是 Event：日记可晋升为规则，Event 永不"
    see_also: ["Promotion", "Ledger", "R016"]
    source: "docs/ARCHITECTURE.md §10, §16"
  Promotion:
    kind: "process"
    definition: "把日记里的解释 / 偏离 / 权衡晋升为项目规则（.aidlc/learnings/project.md），下一次 init 才编译进来；待答问题不晋升"
    synonyms: ["晋升", "learnings", "learnings/project.md"]
    see_also: ["Note", "R016"]
  Waiver:
    kind: "event"
    of: "Event"
    definition: "一次被记录的前置条件跳过：{stage, reason, at, unmet}；--force 必带 --reason，静默跳过不存在"
    synonyms: ["豁免", "waiver event", "--force --reason"]
    see_also: ["R009", "R019"]

  # ---- three knobs and the sizing grid (旋钮与网格) --------------------------------------------
  Knob:
    kind: "concept"
    definition: "三个正交旋钮让同一条主干伸缩：广度（跑哪些阶段，强制）/ 测试量（验多少，下界）/ 深度（产出多细，声明）；强制力必须如实标注"
    synonyms: ["旋钮", "knob", "三个旋钮"]
    see_also: ["Breadth", "TestVolume", "Depth", "R019"]
    source: "docs/ARCHITECTURE.md §2, §5"
  Breadth:
    kind: "enum"
    of: "Knob"
    definition: "广度旋钮：这次跑哪些阶段；由 next_allowed / prereqs 强制，verify_sizing.py 九条 lint 核验；拧不掉门"
    synonyms: ["广度", "breadth"]
    see_also: ["SizingGrid"]
  TestVolume:
    kind: "enum"
    of: "Knob"
    definition: "测试量旋钮：这次验多少；是地板不是天花板（derive_counts.py --strategy，低于地板 exit 4）"
    synonyms: ["测试量"]
    see_also: ["TestStrategy", "Floor"]
  Depth:
    kind: "enum"
    of: "Knob"
    definition: "深度旋钮：每个阶段产出多细；**只是声明**，没有任何脚本能判一份文档够不够细，不许把声明写成闸"
    synonyms: ["深度", "depth"]
    see_also: ["EdgeGuard"]
  SizingRule:
    kind: "policy"
    of: "SizingGrid"
    definition: "sizing.yaml 的定档规则 SZ-01…06：用四个可数的量（改动文件数、AC 数、人判 AC 数、轨道）命中一档，兜底 M"
    synonyms: ["SZ-01", "SZ-02", "SZ-03", "SZ-04", "SZ-05", "SZ-06", "定档规则"]
    scope_note: "规则的数字是 policy（可调）；「缺省从严、跳过只认推导来的档位」是宪法（R019）"
  SizeExemption:
    kind: "event"
    of: "Event"
    definition: "网格跳过一个阶段时写下的带理由账本行：跳了什么、为什么、依据哪一档；复盘按档分桶数逃逸缺陷"
    synonyms: ["size_exemption", "跳过的阶段"]
    see_also: ["SizingGrid", "EscapeDefect"]

  # ---- Contract's parts (契约线) ---------------------------------------------------------------
  AC:
    kind: "value"
    of: "Contract"
    definition: "验收条目，契约的最小单位；机械档（观察 / 前置 / 期望）或人判档（陈述 / 裁决人 / 证据）"
    synonyms: ["判据", "acceptance criterion", "acceptance criteria", "AC v2", "acceptance item", "AC-nnn"]
    see_also: ["REQ", "ObserveBoundary", "R002", "R010"]
    source: "docs/ARCHITECTURE.md §16"
  ObserveBoundary:
    kind: "value"
    of: "AC"
    definition: "机械 AC 的观察边界：route: / cli: / ui: / db_field: / event:——永远不是文件路径（C2）；文件级存在性在卡的 allowed_files"
    synonyms: ["观察边界", "observe", "observe boundary"]
    see_also: ["AllowedFiles"]
  Lock:
    kind: "value"
    of: "Contract"
    definition: "两段锁：G2 锁判据；测试写完后锁测试与清单（.done_when.lock, stage g2 | l5）；连执行契约的闸脚本一起冻"
    synonyms: ["锁", "两段锁", "二次锁", ".done_when.lock", "two-stage lock", "l5 lock", "g2 lock"]
    see_also: ["Gate", "R004", "ChangeProposal"]
    source: "docs/ARCHITECTURE.md §16"
  Holdout:
    kind: "value"
    of: "Contract"
    definition: "冻结判据的变体，实现者不可读；calibrate 的 holdout"
    synonyms: ["隐藏集", "hidden set", "holdout", "hidden variant"]
    see_also: ["Calibration", "R005"]
    source: "docs/ARCHITECTURE.md §16"
  Threshold:
    kind: "value"
    of: "Contract"
    definition: "本身就是判据的数字（coverage、mutation kill rate、p95 …），带 threshold_source；meets_done_when.py 逐条比对"
    synonyms: ["thresholds", "threshold_source", "阈值"]
    see_also: ["R010"]
  InterfaceContract:
    kind: "concept"
    definition: "接口契约（contract.yaml）：文档承诺、尚无承载的空白；verify_issue.py 只能 flag 观察边界解析不了"
    synonyms: ["接口契约", "contract.yaml"]
    status: "proposed"
    scope_note: "ARCHITECTURE §15 空白清单第一行；记下来不是造出来"

  # ---- WorkUnit's parts and the implementation line (计划与实现) -------------------------------
  AllowedFiles:
    kind: "value"
    of: "WorkUnit"
    definition: "卡的可写文件白名单（glob）；白名单执行器 verify_commit.py --card 拒绝其它任何写入；两张卡的白名单不得重叠"
    synonyms: ["allowed_files", "白名单", "write whitelist"]
  ForbiddenFiles:
    kind: "value"
    of: "WorkUnit"
    definition: "卡的禁改文件：默认 tests/**、done_when.yaml、dos.yaml、contract.yaml、.done_when.lock + Contract.constraints.forbidden_paths"
    synonyms: ["forbidden_files", "禁改"]
    see_also: ["R004"]
  Implementer:
    kind: "role"
    definition: "实现者 Node：只看自己那张卡 + 状态摘要 + AC 子集 + 红基线；从不读评估者输出；不得报 impossible"
    synonyms: ["实现者", "implementer", "card-implementer", "执行者"]
    see_also: ["R005", "R012"]
  RedBaseline:
    kind: "artifact"
    definition: "实现前的红基线（tests/RED_BASELINE.txt，capture_red_baseline.py --verify）：证明测试在干净检出上真的红"
    synonyms: ["红基线", "RED_BASELINE", "red baseline"]
    see_also: ["R004", "RedGreen"]
  RedGreen:
    kind: "artifact"
    definition: "红→绿证据（verify_red_green.py）：曾红的测试现在绿且一个都没失踪；advance pr 读它"
    synonyms: ["红→绿", "红绿证据", "red_green", "verify_red_green"]
    see_also: ["RedBaseline"]

  # ---- standards and tests (标准线) --------------------------------------------------------------
  TestStrategy:
    kind: "enum"
    of: "SizeTier"
    definition: "minimal | standard | comprehensive：每档的测试策略；minimal 的地板从契约算（AC 数 + 观察边界数），standard 翻倍，comprehensive 的下界是五层金字塔每层非空"
    synonyms: ["test_strategy", "测试策略", "minimal", "comprehensive"]
    see_also: ["Floor", "TestVolume"]
  Floor:
    kind: "value"
    of: "TestStrategy"
    definition: "测试量地板：低于它 derive_counts.py 退出 4；与「契约里根本没写测试」的 exit 2 分开——量不够和配置错是两种失败"
    synonyms: ["地板", "floor"]
  Calibration:
    kind: "process"
    definition: "校准：用变异分数、一致性、留出集与隔离证明一把尺子承重，之后它量出来的绿才算证据（sizing.yaml calibration 按档要求）"
    synonyms: ["校准", "calibrate", "calibration", "calibration report"]
    see_also: ["MutationScore", "Holdout", "R010"]
  MutationScore:
    kind: "value"
    of: "Calibration"
    definition: "变异分数：把被测的东西故意改坏，多少比例真的变红；校准报告的硬地板之一"
    synonyms: ["变异分数", "mutation score", "mutation_score", "kill rate"]

  # ---- acceptance line, as seen from here (验收线) ----------------------------------------------
  CheckTier:
    kind: "concept"
    definition: "三档：A 机械（一票否决）/ B 结构（超阈值告警）/ C 判断（请求人，G3）"
    synonyms: ["三档", "A/B/C", "A 档", "B 档", "C 档", "check tier", "Tier"]
    scope_note: "评审上下文的 Finding.tier 取同一套值；不是体量档 S/M/L（SizeTier）"
    see_also: ["SizeTier", "Finding"]
    source: "docs/ARCHITECTURE.md §9, §16"
  Isolation:
    kind: "concept"
    definition: "信息隔离：实现者看不到评审判据、隐藏集、别的卡；评审产物只给人与综合裁决者；编译成 Node.must_not_read"
    synonyms: ["信息隔离", "must_not_read", "隔离"]
    see_also: ["R005", "Node"]
  FixPrompt:
    kind: "value"
    of: "Finding"
    definition: "评估者能交给实现者的唯一东西：修复提示（位置 + 改法），不含评审者身份与置信度"
    synonyms: ["fix_prompt", "修复提示", "accepted_claim"]
    see_also: ["R005"]
  CompletionMarker:
    kind: "value"
    of: "Finding"
    definition: "每份审查产物自带的完成标记（状态 + 发现条数，两个数字产生于不同时刻）；缺标记 = 截断 = 未评估，走严路"
    synonyms: ["完成标记", "verify_review_complete", "completion marker"]
    see_also: ["Unevaluated", "Redispatch", "R018"]
  Redispatch:
    kind: "process"
    definition: "一次审查最多重派一次；重派前把陈旧产物移进 stale/ 而不是删除；第二次仍不完整记 A 档未评估，DONE 不成立"
    synonyms: ["重派", "stale/", "redispatch"]
    see_also: ["R007", "R018"]
  Unevaluated:
    kind: "concept"
    definition: "声明了一条判据但求值者没跑完；不是通过（exit 3、probed=false、unevaluated）；缺标记走严路"
    synonyms: ["未评估", "unevaluated", "exit 3", "probed=false", "未检"]
    see_also: ["R018", "CompletionMarker"]
    source: "docs/ARCHITECTURE.md §16"
  Evaluator:
    kind: "role"
    definition: "评估者 / 验证者 Node：产出裁决与 fix_prompt，与生成者不是同一个 Node；只有它能报 impossible"
    synonyms: ["评估者", "验证者", "evaluator", "verifier", "judge"]
    see_also: ["R005", "R012", "R014"]
  MetaJudge:
    kind: "role"
    definition: "综合裁决者：把六审查的 Finding 与 Verdict 解码成四态，是评审产物回到实现者之前的唯一中转"
    synonyms: ["meta-judge", "综合裁决", "综合裁决者"]
    see_also: ["FourState", "R005"]

  # ---- Gates' parts (门) ---------------------------------------------------------------------------
  HumanSigner:
    kind: "role"
    definition: "在 Gate 上签字的人（human:<name>）；代签只在有明确授权记录时成立，且授权本身要写下来"
    synonyms: ["签字人", "signer", "人签", "human:<name>", "delegated_agent"]
    see_also: ["Gate", "R008"]
  Attribution:
    kind: "value"
    of: "Gate"
    definition: "归因：G1 reject 必须归因（derivation_error 推导错了 / rule_error 规律错了）；逃逸缺陷必须归到一个 Layer——归因决定回流到哪一层"
    synonyms: ["归因", "attribution", "derivation_error", "rule_error"]
    see_also: ["EscapeDefect", "Layer", "R015"]
  GateRecord:
    kind: "artifact"
    definition: "门的记录文件：g1-record.md（三问 + 分歧集回应 + 归因）/ .done_when.lock（g2）/ g3-record.md（人判 AC 裁决、B 档告警、失败报告、假设台账）"
    synonyms: ["g1-record", "g3-record", "g1_record", "g3_record", "门记录"]
    see_also: ["Gate", "Lock"]

  # ---- Event's parts and kinds (事件) -------------------------------------------------------------
  Signal:
    kind: "value"
    of: "Event"
    definition: "失败事件携带的封闭集信号（routing.yaml），路由表据此归层"
    synonyms: ["信号", "routing signal", "signal"]
    see_also: ["Routing", "Layer"]
  Fingerprint:
    kind: "value"
    of: "Event"
    definition: "失败输出的稳定摘要（先抹平行号 / 十六进制 / 时间戳 / 临时路径再取摘要）；同指纹重复 = 无进展"
    synonyms: ["指纹", "fingerprint", "fingerprint_history"]
    see_also: ["Convergence", "R012"]
    source: "docs/ARCHITECTURE.md §6, §16"
  Convergence:
    kind: "value"
    of: "Event"
    definition: "fail 事件上的收敛判定：none | repeat | oscillation | plateau | budget | impossible | handler=human；收敛 ≠ 正确"
    synonyms: ["收敛", "convergence block", "convergence", "repeat"]
    see_also: ["Oscillation", "Plateau", "Impossible", "R012"]
  Oscillation:
    kind: "enum"
    of: "Convergence"
    definition: "三种「再试也没用」之一：指纹在几个相似解间往复（周期 2–3）——方案层的权衡没定，归 plan 层"
    synonyms: ["往复", "oscillation", "oscillation_detected"]
    source: "docs/ARCHITECTURE.md §6"
  Plateau:
    kind: "enum"
    of: "Convergence"
    definition: "三种「再试也没用」之一：分数连续若干轮不超过历史最佳；允许一次探索性重写，再不涨就升级"
    synonyms: ["不涨", "plateau", "平台期"]
  Impossible:
    kind: "enum"
    of: "Convergence"
    definition: "第四种，不是检测出来的而是被报告的：评估者判「在当前契约下不可能」→ task 层，走变更提案；实现者报被拒"
    synonyms: ["impossible_under_contract", "契约下不可能", "不可能"]
    see_also: ["R012", "ChangeProposal"]
  Failure:
    kind: "event"
    of: "Event"
    definition: "kind=fail 的 Event：一次被记账、带信号与指纹、经路由归层的失败"
    synonyms: ["失败", "fail event", "card_test_fail"]
    see_also: ["Reflow", "Routing"]
  Reflow:
    kind: "event"
    of: "Event"
    definition: "kind=reflow 的 Event：预算耗尽或收敛判定成立后向外层升级，带失败报告，从不重试"
    synonyms: ["回流", "reflow event", "回流事件"]
    see_also: ["Escalation", "FailureReport", "R011"]
  EscapeDefect:
    kind: "event"
    of: "Event"
    definition: "合入后才发现的缺陷（kind=escape）：人归到一个 Layer 并写下「门为什么漏了」；校准闭环的起点"
    synonyms: ["逃逸缺陷", "escape defect", "escape", "Escape", "escape-defects.md"]
    see_also: ["Attribution", "Layer", "R015"]
  Budget:
    kind: "value"
    of: ["Loop", "Run"]
    definition: "一层 / 一环允许的回流或重试次数（单卡重试按卡计；世界层不设上限）；只由脚本推进"
    synonyms: ["预算", "budgets", "card_retries", "plan_reflows", "task_reflows", "budget_exhausted"]
    see_also: ["R006", "R011", "Layer"]

  # ---- routing (路由) -----------------------------------------------------------------------------
  Routing:
    kind: "process"
    definition: "失败归层：路由表按信号把每个失败事件归到一个 Layer，再决定重试还是升级；不在实现层重试世界层的错"
    synonyms: ["路由", "归层", "routing", "routing.yaml", "归因启发式"]
    see_also: ["RoutingRule", "Layer", "Signal", "R011"]
  RoutingRule:
    kind: "policy"
    of: "Routing"
    definition: "路由表的十六条规则 R01–R16（信号 → 候选层 / 处理者 / 动作 / 预算）；数字是文献先验，可由 tune 提案调整"
    synonyms: ["路由表", "路由规则", "R01–R16", "routing rule"]
    scope_note: "「路由存在」是宪法（R011）；表的内容是 policy——所以是 vocabulary 不是 rules"
  Escalation:
    kind: "process"
    definition: "一层预算耗尽或收敛判定成立后向下一外层（或人）升级，附失败报告；置上「欠一份失败报告」的标记"
    synonyms: ["升级", "escalate", "escalate_to", "ESCALATE"]
    see_also: ["Reflow", "Layer", "FailureReport", "R011"]

  # ---- graph and loop parts (图与环) ---------------------------------------------------------------
  Edge:
    kind: "value"
    of: "Node"
    definition: "graph.yaml 里两个 Node 之间的一条带类型的边（guard / when / signal / carries / merge）；回边标明属于哪个环"
    synonyms: ["边", "graph edge", "handoff edge"]
    see_also: ["EdgeType", "Loop", "R013"]
  EdgeType:
    kind: "enum"
    of: "Edge"
    definition: "边的封闭类型集：sequential | conditional | fan_out | fan_in | loop_back | interrupt | handoff"
    synonyms: ["扇出", "扇入", "fan_out", "fan_in", "loop_back", "interrupt edge", "sequential edge", "回边"]
  NodeRole:
    kind: "enum"
    of: "Node"
    definition: "Node.role：orchestrator | world | knowledge | contract | standard | planner | implementer | evaluator | delivery | learning | gate；文档的九环是它的分组"
    synonyms: ["role", "脊柱 (orchestrator)"]
    see_also: ["Ring"]
  Skill:
    kind: "enum"
    of: "Node"
    definition: "Node.kind=skill：以 SKILL.md 形式参与执行图的 Node（二十九个）；作为插件制品的 skill 属上游的插件打包上下文"
    synonyms: ["skill"]
    scope_note: "386 次出现里绝大多数指 Node of kind skill；版本 / 打包 / 评估属上游上下文"
  Agent:
    kind: "enum"
    of: "Node"
    definition: "Node.kind=agent：五个隔离子 agent（card-implementer · review-triager · comment-fixer · pr-reviewer · fix-verifier），各自的输入被刻意限死"
    synonyms: ["agent", "子 agent", "subagent", "Subagent", "sub-agent", "隔离子 agent"]
    see_also: ["Isolation"]
  Script:
    kind: "role"
    definition: "机械份额：verify_*.py / lint_*.py 等 Π 原语，作为边守卫与状态写入者，不做语义判断；每个的退出码索引在 reference.md"
    synonyms: ["脚本", "Π 原语", "verifier script", "script"]
    see_also: ["EdgeGuard", "R006"]
  Asset:
    kind: "artifact"
    definition: "skill 的 assets/ 下的模板与数据（graph.yaml、loops.yaml、routing.yaml、sizing.yaml、triggers.yaml、card_template.yaml …）"
    synonyms: ["模板", "assets/", "data asset", "资产"]
  StopKeys:
    kind: "value"
    of: "Loop"
    definition: "环契约的停机四键：success · convergence · budget · impossible，全部显式（值可以是 null 但不能不写）"
    synonyms: ["停机四键", "stop 四键", "stop keys", "四键"]
    see_also: ["Budget", "Convergence", "R013"]
  Trigger:
    kind: "value"
    of: "Loop"
    definition: "环与原生原语的绑定：turn_end | event | interval | cron | after | manual（triggers.yaml；Stop hook 只有模板）"
    synonyms: ["触发", "triggers.yaml", "trigger"]
  Watermark:
    kind: "value"
    of: "Loop"
    definition: "评审环的水位线与计数器（.aidlc/pr-watch/pr-<N>.*）：评论不重复处理、预算跨会话延续"
    synonyms: ["水位线", "watermark", "pr-watch"]
    see_also: ["Resume", "EvidenceLog"]
  EdgeGuard:
    kind: "concept"
    definition: "边上的机械前置检查（verify_*.py、lint_cards.py）：拦得住 advance，但不是 Gate——没有人签，也不能被豁免成门"
    synonyms: ["闸", "预门", "pre-gate", "edge guard", "mechanical pre-gate", "guard:", "机械预门"]
    rejected_names: ["自动门"]
    scope_note: "「自动门」invites reading a script check as a Gate a human could waive；新文本里不要用"
    see_also: ["Gate", "Prereq", "R008"]
  Harness:
    kind: "concept"
    definition: "环与路由的参数集合（routing.yaml、loops.yaml、pr-poll.sh、gate.json）；只能经人合并的提案改动"
    synonyms: ["harness", "harness proposal", "harness_proposals"]
    see_also: ["R016"]
  ClosedLoop:
    kind: "concept"
    definition: "六个闭环：交付 / 失败 / 校准 / 度量 / 标准 / 调参——每个都有起点、终点与闭合手段；第六个是环改环的外环"
    synonyms: ["闭环", "closed loop", "六个闭环"]
    scope_note: "流程视图，不是限界上下文"
    source: "docs/ARCHITECTURE.md §12"

  # ---- ontology line and world (X1 / R0) ------------------------------------------------------------
  DOS:
    kind: "value"
    of: "RepoAsset"
    definition: "RepoAsset.kind=dos：这份文件——现状本体，两层（核心模型 + 词表），闭包的解析源"
    synonyms: ["dos.yaml", "本体", "Design Ontology Spec", "现状本体"]
    see_also: ["DOSProposal"]
  AgentMap:
    kind: "value"
    of: "RepoAsset"
    definition: "RepoAsset.kind=agent_map：仓库地图 agent-map.md（跑起来 / 目录职责 / 禁区 / 已知陷阱），命令逐条实跑，按卡切片进 card_context"
    synonyms: ["agent-map.md", "仓库地图", "agent map"]
  PSL:
    kind: "external"
    context: "world (R0/R1: PSL, DOS proposal + as-is DOS, invariant cards)"
    definition: "问题空间规律（PSL-ID）：先于形态的世界描述，G1 裁决其推导"
    synonyms: ["PSL-ID", "问题空间规律", "PSL 文档"]
    see_also: ["Gate", "Track", "Divergence"]
  Divergence:
    kind: "value"
    of: "PSL"
    definition: "N 次独立推导（或 N 份隔离草案）的分歧集：必须澄清的槽，G1 议程；grill 环先回物料找来路，找不到才交人"
    synonyms: ["分歧", "分歧集", "divergence"]
  DOSProposal:
    kind: "external"
    context: "world (R0/R1: PSL, DOS proposal + as-is DOS, invariant cards)"
    definition: "应然本体 dos-proposal.yaml：从 PSL 推导出的 DOS 提案，与现状本体（本文件）逐条对账（reconcile_dos.py）"
    synonyms: ["dos-proposal.yaml", "应然本体", "to-be DOS", "DOS 提案"]
    see_also: ["RepoAsset", "DOS"]
  Invariant:
    kind: "external"
    context: "world (R0/R1: PSL, DOS proposal + as-is DOS, invariant cards)"
    definition: "□ 常驻不变量：一个限界上下文内从失败中归纳出的、卡的 dos_slice.invariants 引用的规则（invariants/ 卡）"
    synonyms: ["不变量", "invariant card", "□", "invariant"]
    see_also: ["RepoAsset", "WorkUnit"]
  Territory:
    kind: "concept"
    definition: "looper / qanat 的进口词：一个限界上下文 / 模块，即本文件 bounded_contexts.current_context 所指"
    synonyms: ["Territory (qanat)", "territory"]
    status: "deprecated"
    scope_note: "只在收编来的 SKILL.md 正文与术语映射表里出现；新文本写 bounded context"
  MemoryAsset:
    kind: "concept"
    definition: "qanat 的进口词：跨 Run 持久的记忆制品；在本上下文对应 Archive 与 RepoAsset"
    synonyms: ["MemoryAsset (qanat)"]
    status: "deprecated"
    see_also: ["Archive", "RepoAsset"]
  Artifact:
    kind: "concept"
    definition: "一个 Node 写出的任何产物（文件、记录、PR）；每个产物只有一个生产者，归档时复制进 Archive"
    synonyms: ["产物", "artifact", "制品"]
    see_also: ["R001", "Archive"]
  StaticOnly:
    kind: "concept"
    definition: "static_only：结构过审、脚本冒烟，行为层对照未充分跑；不得描述为已验证"
    synonyms: ["static_only", "静态过审"]
    see_also: ["R017"]
    source: "docs/ARCHITECTURE.md §16"

  # ---- neighbouring contexts, referenced here (外部面) --------------------------------------------
  REQ:
    kind: "external"
    context: "requirement intake (GitHub issue + EARS spec.md)"
    definition: "需求 id（REQ-nnn），来自 issue / spec.md；每个 REQ 只归一张卡，Contract.based_on 悬挂其上"
    synonyms: ["需求", "REQ-id", "requirement"]
    see_also: ["AC", "WorkUnit"]
  Issue:
    kind: "external"
    context: "requirement intake (GitHub issue + EARS spec.md)"
    definition: "GitHub issue：可证伪的需求 / bug / 逃逸缺陷登记（Intent / Track / Scope / Acceptance / Assumptions / Depends on DOS）"
    synonyms: ["issue", "GitHub issue", "issue body"]
    see_also: ["Run", "REQ"]
  Spec:
    kind: "external"
    context: "requirement intake (GitHub issue + EARS spec.md)"
    definition: "spec.md：EARS 形态的需求陈述，REQ-id 的出处"
    synonyms: ["spec.md", "EARS spec", "EARS", "规格"]
  Commit:
    kind: "external"
    context: "GitHub delivery surface (PR, review threads, commits, tags)"
    definition: "一次提交；卡完成时登记其 sha（Event IMPLEMENTS WorkUnit）；改过被锁文件的提交必须带变更提案"
    synonyms: ["commit", "提交", "commit sha"]
    see_also: ["Lock", "ChangeProposal"]
  PR:
    kind: "external"
    context: "GitHub delivery surface (PR, review threads, commits, tags)"
    definition: "pull request：Run 的交付面；merge 与 approve 是人类动作，不是 Gate"
    synonyms: ["pull request", "PR body", "pr"]
    see_also: ["Gate", "ReviewThread"]
  ReviewThread:
    kind: "external"
    context: "GitHub delivery surface (PR, review threads, commits, tags)"
    definition: "PR 上的一条评审线程；其评论是待验证的主张，review_loop 记入 EvidenceLog"
    synonyms: ["review thread", "评审线程", "review comment"]
    see_also: ["EvidenceLog", "Watermark"]
  Release:
    kind: "external"
    context: "GitHub delivery surface (PR, review threads, commits, tags)"
    definition: "发布：tag 指着 merge.sha、release.notes 里有 post-deploy 行；合入不是终点，发布后验证绿才算交付"
    synonyms: ["发布", "release", "post-deploy", "tag"]
    see_also: ["R015"]
  Finding:
    kind: "external"
    context: "acceptance evaluation (six review skills + meta-judge + acceptance-fleet; pr-review)"
    definition: "一条评审发现：severity P0–P3、tier A/B/C、confidence、vendor"
    synonyms: ["finding", "评审发现"]
    scope_note: "在本上下文里只以 Event.signal 的形式重新进入；字段不建模（Q009）"
    see_also: ["Verdict", "CheckTier", "FixPrompt"]
  Verdict:
    kind: "external"
    context: "acceptance evaluation (six review skills + meta-judge + acceptance-fleet; pr-review)"
    definition: "评审裁决：PASS / BLOCK_MERGE / NEEDS_HUMAN，经 meta-judge 解码为四态"
    synonyms: ["裁决", "verdict"]
    see_also: ["FourState", "Gate"]
  FourState:
    kind: "external"
    context: "acceptance evaluation (six review skills + meta-judge + acceptance-fleet; pr-review)"
    definition: "四态 DONE / FIX / SPEC_DRIFT / GAMING_RISK：验收结果的解码，各自映射到一个路由信号"
    synonyms: ["四态", "four-state", "SPEC_DRIFT", "GAMING_RISK"]
    see_also: ["Signal", "Routing", "MetaJudge"]

# -----------------------------------------------------------------------------
# 5. Relationships
# -----------------------------------------------------------------------------
relationships:
  - subject: "Run"
    verb: "HAS"
    object: "Contract"
    cardinality: "1:1"
    inverse: "BELONGS_TO"
    description: "state.json contract.done_when; one Contract per Run, v2 the only schema"
  - subject: "Run"
    verb: "IS_SPLIT_INTO"
    object: "WorkUnit"
    cardinality: "1:N"
    inverse: "BELONGS_TO"
    description: "cards/CARD-*.yaml registered in Run.cards.items; unit-level acceptance ≠ Run-level acceptance"
  - subject: "Run"
    verb: "PASSES"
    object: "Gate"
    cardinality: "1:N"
    inverse: "GUARDS"
    description: "g1 (psl track), g2, g3 — the stage machine cannot advance past a Gate stage without its verdict"
  - subject: "Run"
    verb: "APPENDS"
    object: "Event"
    cardinality: "1:N"
    inverse: "RECORDED_IN"
    description: "every mutating command appends one Event to ledger.md and trace.jsonl"
  - subject: "Run"
    verb: "OCCUPIES"
    object: "Node"
    cardinality: "N:1"
    inverse: "HOSTS"
    description: "Run.stage names the stage Node the Run currently occupies; graph next lists its legal successors"
  - subject: "Contract"
    verb: "CONSTRAINS"
    object: "WorkUnit"
    cardinality: "1:N"
    inverse: "DERIVES_FROM"
    description: "ac_ids ⊆ Contract.acceptance ids; forbidden_files ⊇ Contract.constraints.forbidden_paths"
  - subject: "Gate"
    verb: "FREEZES"
    object: "Contract"
    cardinality: "1:1"
    inverse: "FROZEN_BY"
    description: "g2 pass requires Contract.lock; after it, a locked file may change only with a change proposal in the same diff"
  - subject: "Node"
    verb: "HOLDS"
    object: "Gate"
    cardinality: "1:1"
    inverse: "HELD_BY"
    description: "human.g1 / human.g2 / human.g3 hold g1 / g2 / g3; human.merge and human.harness-review hold no Gate (Q004)"
  - subject: "Node"
    verb: "HANDS_OFF_TO"
    object: "Node"
    cardinality: "N:N"
    inverse: "RECEIVES_FROM"
    description: "graph.yaml edges typed sequential | conditional | fan_out | fan_in | loop_back | interrupt | handoff, with guard / when / signal / carries / merge"
  - subject: "Loop"
    verb: "GENERATED_BY"
    object: "Node"
    cardinality: "N:1"
    inverse: "GENERATES"
    description: "loops.yaml generator"
  - subject: "Loop"
    verb: "VERIFIED_BY"
    object: "Node"
    cardinality: "N:1"
    inverse: "VERIFIES"
    description: "loops.yaml verifier; must differ from the generator"
  - subject: "Node"
    verb: "PARTICIPATES_IN"
    object: "Loop"
    cardinality: "N:1"
    inverse: "ENCLOSES"
    description: "node.loop in graph.yaml; loop_back edges out of the Node name the same Loop"
  - subject: "Event"
    verb: "CAUSED_BY"
    object: "Event"
    cardinality: "N:1"
    inverse: "CAUSES"
    description: "effect → cause (reflow → fail; failure_report → reflow; escape → AC change); trace.py why walks it"
  - subject: "Event"
    verb: "IMPLEMENTS"
    object: "WorkUnit"
    cardinality: "N:N"
    inverse: "IMPLEMENTED_BY"
    description: "card events with a commit sha: implements CARD-xx and its AC ids; trace.py impact walks it"
  - subject: "Event"
    verb: "AMENDS"
    object: "Contract"
    cardinality: "N:1"
    inverse: "AMENDED_BY"
    description: "supersedes done_when.yaml#AC-nnn@vK — the change-proposal path; metrics.py counts it as contract rework"
  - subject: "Event"
    verb: "DECIDED_BY"
    object: "Gate"
    cardinality: "N:1"
    inverse: "DECIDES"
    description: "gate events reference the Gate record and human:<signer>; fail events reference routing.Rnn instead"

  - subject: "Run"
    verb: "RESOLVES_AGAINST"
    object: "RepoAsset"
    cardinality: "N:1"
    inverse: "IS_RESOLVED_BY"
    description: "issue closure and WorkUnit.dos_slice resolve their nouns against the RepoAsset of kind dos; a Run never writes one"
  - subject: "WorkUnit"
    verb: "SLICES"
    object: "RepoAsset"
    cardinality: "N:1"
    inverse: "IS_SLICED_FOR"
    description: "slice_agent_map.py cuts the agent_map RepoAsset per WorkUnit into card_context.md — the whole map is noise, zero lines is guessing"

# -----------------------------------------------------------------------------
# 6. Rules (constitution — Judgment 3)
# -----------------------------------------------------------------------------
rules:
  - id: "R001"
    statement: "Within a Run, every artifact is written by exactly one Node."
    rationale: "一个产物只有一个生产者 (ARCHITECTURE §2, §6.1); two writers of one artifact make provenance and rollback ambiguous."
    enforced_by: "user_workflow"
  - id: "R002"
    statement: "A Run has exactly one Contract, and it has the v2 AC-first shape; other shapes enter only through conversion."
    rationale: "契约只有一种 schema (§6.1); three producers and two schemas were the first inconsistency found on 2026-09-05."
    enforced_by: "system"
  - id: "R003"
    statement: "No WorkUnit exists before the Contract is frozen by Gate g2."
    rationale: "判据先于代码 (§6.2); cards need a frozen AC subset to point at."
    enforced_by: "system"
  - id: "R004"
    statement: "Tests are written by a Node that is not the implementer and are locked (stage l5) before implementation; a WorkUnit's forbidden files always include tests/** and the Contract."
    rationale: "测试非实现者写且写完锁 (§6.2, C6); an implementer that can edit the test can make it green. Compiled 2026-09-12: advance implement refuses a lock that is not stage l5 or lists no test, and a RED baseline that carries no clean-checkout evidence."
    enforced_by: "system"
  - id: "R005"
    statement: "An implementer Node never reads evaluator output; the only things an evaluator Node may hand an implementer Node are fix_prompt and accepted_claim."
    rationale: "实现者看不到评估者 (§6.3); information visibility is not execution order — the evaluation collapses if the implementer reads the judge's notes."
    enforced_by: "system"
  - id: "R006"
    statement: "Budgets, counters and termination live in Run.counters and Loop.stop and are advanced only by scripts; no Node keeps its own counter."
    rationale: "预算与终止由脚本强制 (§6.4); a model-maintained counter is a counter that forgets."
    enforced_by: "system"
  - id: "R007"
    statement: "Events are append-only and never rolled back; artifacts (Contract, WorkUnit, code) may be rolled back."
    rationale: "账本只增不删 (§6.5, WikiSkill asymmetric rollback); judgments and failures are paid-for assets."
    enforced_by: "system"
  - id: "R008"
    statement: "A Gate verdict carries a human signer; no Node of kind skill or agent records one, and --autopilot skips confirmations, never Gates."
    rationale: "三道门只能人签 (§6.6); the gates exist precisely where the machine's judgment is not trusted."
    enforced_by: "user_workflow"
  - id: "R009"
    statement: "A Run cannot advance past a Gate stage until that Gate's verdict is recorded, or an explicit Waiver Event is written."
    rationale: "门编译成前置条件 — 不跑就 advance 不了 (§3.2); a silent skip would make the gate decorative. Found 2026-09-12: G2's verdict was checked only by prereqs(cards), and the S tier skips cards — the stage was never skippable, the signature was. Now checked at implement too."
    enforced_by: "system"
  - id: "R010"
    statement: "meets_done_when is computed by a script from the Contract's thresholds, never declared by an evaluator Node; a standard that has not passed calibrate is not evidence."
    rationale: |
      未校准的标准不当证据 (§6.7); an evaluator announcing 'done' is the reward-hacking surface the plugin exists to close.
      Compiled 2026-09-12: acceptance-fleet/scripts/meets_done_when.py compares behavior.thresholds against the qa
      projection (unevaluated ≠ pass), aidlc_state.py `acceptance --meets` is the only writer of acceptance.meets_done_when
      (it is not in SETTABLE and the report's done_when_sha256 must match the Contract), and advance pr refuses a
      Contract with thresholds whose meets_done_when is not `met`. The calibrate half stays user_workflow.
    enforced_by: "system"
  - id: "R011"
    statement: "Every failure Event is routed to a Layer by the routing table before any retry; when a Layer's budget is exhausted the Run escalates to the next outer Layer with a failure report, never a retry."
    rationale: "失败归层再处理 (§6.8, X2); the default of retrying a world-layer error at the implementation layer is the catastrophe routing prevents."
    enforced_by: "system"
  - id: "R012"
    statement: "A repeated fingerprint, an oscillation or a plateau escalates instead of retrying; impossible_under_contract may be reported only by a verifier Node or a human."
    rationale: "收敛 ≠ 正确 (§6.12); an implementer saying 'impossible' is self-assessment, not evidence."
    enforced_by: "system"
  - id: "R013"
    statement: "Every cycle a Run can traverse is a loop_back edge owned by a Loop with a budget and a measurable success predicate; every Node has a bounded write scope; every human Node declares a resume binding."
    rationale: "图与环是数据，不是散文 (§6.11); the first graph.yaml was caught by its own lint with two unowned cycles."
    enforced_by: "system"
  - id: "R014"
    statement: "A Loop's generator Node and verifier Node are different Nodes."
    rationale: "generator ≠ verifier is the self-verification anti-pattern every loop-engineering source names (loops.yaml header)."
    enforced_by: "system"
  - id: "R015"
    statement: "A Run reaches archive only after release verification is green or a skipped_reason is recorded, and every escape defect is attributed to a Layer."
    rationale: "合入不是终点 (§6.9); the escape defect is the world layer's only external calibration source."
    enforced_by: "system"
  - id: "R016"
    statement: "Changes to Loop or routing parameters are proposals that a human Node merges; a script never applies them."
    rationale: "harness 改动经人 (§6.13); an auto-tuning loop that edits its own budgets has no outside."
    enforced_by: "system"
  - id: "R017"
    statement: "A Node's effectiveness claim never exceeds its evidence tier; a static_only skill is never described as verified."
    rationale: "静态过审 ≠ 有效 (§6.10); the plugin's honesty about itself is part of what it is."
    enforced_by: "user_workflow"
  - id: "R018"
    statement: "A check that did not run has not passed: an unevaluated analyzer, probe or review is recorded as unevaluated and never counted green, and a gate posture turns it into a failure."
    rationale: |
      未检 ≠ 通过. exit 3 (verify_vocabulary, verify_compile), probed=false (verify_agent_map) and `unevaluated`
      (the review skills) all read like a pass to anyone scanning for red; --require-ontology / --require-dos are
      the gate posture that turns them back into failures. Lifted 2026-09-10, after X1 was found declared in every
      document and enforced nowhere — three consumers had been degrading silently.
    enforced_by: "system"
  - id: "R019"
    statement: "What you get by omission is the stricter path; every exemption is bought with counted evidence and recorded as a Waiver Event."
    rationale: |
      一个靠遗漏就能打开的门不是门 (ARCHITECTURE.md). intake.size defaults to M with size_source=default,
      a hand-set tier grants no skip, never_skippable holds even when sizing.yaml is wrong. True since v0.10.0;
      the 2026-09-05 pass did not lift it into the constitution — this is a rule recovered, not a rule added.
    enforced_by: "system"
  - id: "R020"
    statement: "A RepoAsset lives in the project directory under its bounded context and is tracked in git; a copy under the runtime directory is not the team's language."
    rationale: |
      本体是团队的共同词表，一份没进版本库的词表不是「有本体」，是「你有本体」. .aidlc/ is per-Run state
      (init itself warns when it is not gitignored), so an ontology parked there is found by neither the next Run
      nor the next person. In a monorepo the context is the package, not the repository root.
    enforced_by: "system"

# -----------------------------------------------------------------------------
# 7. Composition (derived views — not new objects)
# -----------------------------------------------------------------------------
composition:
  Ledger:
    description: "ledger.md — the human-readable, append-only table of a Run's Events"
    synonyms: ["账本", "ledger.md"]
    derived_from: ["Run APPENDS Event", "one row per Event: at | stage | kind | signal / gate | layer | fingerprint | evidence | decision | by"]
    is_persistent: true
  Trace:
    description: "trace.jsonl — the machine-readable sidecar of the same Events with typed refs"
    synonyms: ["迹", "决策迹", "trace.jsonl"]
    derived_from: ["the same Event stream as Ledger", "Event.refs edges; trace.py why / impact / render / lint"]
    is_persistent: true
  Graph:
    description: "graph.yaml — all Nodes plus their HANDS_OFF_TO edges and the stages list"
    synonyms: ["图", "执行图", "graph.yaml"]
    derived_from: ["Node", "Node HANDS_OFF_TO Node", "stages == aidlc_state.py ORDER (graph check)"]
    is_persistent: true
  Ring:
    description: "九环 R0–R8 + 脊柱 — the docs' grouping of skills; graph.yaml carries it as Node.role, not as a field"
    synonyms: ["环", "九环", "R0–R8"]
    derived_from: ["Node grouped by role: world→R0, knowledge→R1, contract→R2, standard→R3, planner→R4, implementer→R5, evaluator→R6, delivery→R7, learning→R8, orchestrator→脊柱, gate→human"]
    is_persistent: false
  Layer:
    description: "the reflow coordinate ladder card ⊂ plan ⊂ task ⊂ ontology ⊂ world"
    synonyms: ["层", "layer"]
    derived_from: ["routing.yaml layers", "Run.counters keys", "Event.layer values", "Loop.escalate_to values (∪ human)"]
    is_persistent: false
  FailureReport:
    description: "failure-report-*.md — the G3 input written after an escalation (candidate layer + evidence + convergence + excluded + suggested rollback)"
    synonyms: ["失败报告", "failure report", "failure-report-*.md"]
    derived_from: ["the reflow Event and its convergence block", "Event CAUSED_BY chain (trace.py why pre-fills 已排除的可能)", "clears Run.pending.failure_report via report --path"]
    is_persistent: true
  ChangeProposal:
    description: "change-proposal-*.md — the only legal path to alter a locked Contract file (in the same diff)"
    synonyms: ["变更提案", "change proposal", "change-proposal-*.md"]
    derived_from: ["Event AMENDS Contract", "Gate g2 re-sign", "counted as one task-layer reflow"]
    is_persistent: true
  Archive:
    description: "specs/<slug>/ — the Run's durable record and the data source of retro and tune"
    synonyms: ["归档", "specs/<slug>/", "archive"]
    derived_from: ["Run state.json", "Ledger + Trace", "Contract + lock", "WorkUnits", "evaluation final-state", "Gate records", "archive-manifest.json"]
    is_persistent: true
  EvidenceLog:
    description: ".aidlc/pr-watch/pr-N.json — review_loop's own append-only verdict log (ACCEPT/REJECT/REPLY/ESCALATE/SKIPPED, sycophancy_suspect)"
    synonyms: ["evidence log", ".aidlc/pr-watch"]
    derived_from: ["review_loop Loop memory", "not (yet) mirrored into the Run's Trace — see Q005"]
    is_persistent: true
  SizingGrid:
    description: "sizing.yaml — 体量档 × 阶段 的网格：每档跳哪些阶段，never_skippable 说哪些任何档都不能跳（三道门在里面）"
    synonyms: ["网格", "广度网格", "sizing.yaml", "never_skippable", "stages 网格"]
    derived_from: ["SizeTier × Stage", "SizingRule SZ-01…06 决定档，stages: 决定跳过", "verify_sizing.py 九条 lint 与 ORDER / prereqs 互相断言"]
    is_persistent: true

# -----------------------------------------------------------------------------
# 8. Behaviors (cause → effects)
# -----------------------------------------------------------------------------
behaviors:
  - trigger: "a human signs the Contract at g2 (lock_done_when.py sign --by <name>; gate g2 --verdict pass)"
    effects:
      - "Contract.lock is written (stage g2) and Gate g2 verdict = pass with by / at / record"
      - "Run may advance to cards; WorkUnits can now be split"
      - "any later change to a locked file without a change proposal in the same diff is refused by verify_commit.py / lock verify (exit 1); with one it passes (exit 2) and counts a task-layer reflow"
    notes: "L5 re-signs with --stage l5 once tests and behavior are written by a non-implementer"
  - trigger: "aidlc_state.py fail --signal <signal> [--card] [--fingerprint|--evidence] [--score] [--by]"
    effects:
      - "an Event of kind fail is appended with layer, fingerprint, convergence and decided_by routing.Rnn"
      - "Run.counters[layer] += 1; fingerprint_history window updated; WorkUnit.retries += 1 for card-layer signals"
      - "repeat (same fingerprint ×limit), oscillation (period 2–3), plateau (score stale) or budget exhaustion → a reflow Event CAUSED_BY the fail, Run.pending.failure_report = true, escalate_to the next outer Layer (or human)"
      - "impossible_under_contract from a --by not in routing.impossible_reporters is refused (exit 1)"
    notes: "check-clean --as-hook blocks ending the session until report --path clears pending.failure_report"
  - trigger: "advance <stage> with unmet prerequisites and --force --reason"
    effects:
      - "a Waiver {stage, reason, at, unmet} is appended to Run.waivers"
      - "a waiver Event (decided_by human:waiver) then an advance Event are appended"
      - "retro counts waivers as a process smell; tune proposes an ai-dlc fix_list entry when ≥50% of features carry waivers"
    notes: "--force without --reason is refused; a silent skip does not exist"
  - trigger: "a WorkUnit is marked done with a commit (card CARD-xx --status done --commit <sha> --ac …)"
    effects:
      - "Run.cards.items[CARD-xx].status = done, commits += sha"
      - "an Event of kind card IMPLEMENTS CARD-xx and each AC id (trace.py impact)"
      - "when every WorkUnit is done and no failure report is pending, advance acceptance becomes legal"
  - trigger: "acceptance-fleet decodes meta-judge into a four-state result"
    effects:
      - "DONE → acceptance.evaluation_result set; advance pr becomes legal"
      - "FIX → fail --signal card_test_fail (card layer; same fingerprint twice escalates to plan)"
      - "SPEC_DRIFT → fail --signal pbt_fail_n3_consistent_with_req (task layer: narrow the REQ, do not patch code)"
      - "GAMING_RISK → task layer with contract hardening; NEEDS_HUMAN → human_ac_pending → Gate g3"
      - "impossible_under_contract may be reported here (--by acceptance-fleet | meta-judge) → change proposal + g2 re-sign"
    notes: "the only edge from the fleet into an implementer Node carries fix_prompt (verify_graph lint 3)"
  - trigger: "an escape defect is registered after merge (/issue --escape)"
    effects:
      - "an escape row is appended to escape-defects.md with a human-attributed Layer and 'why the gate missed'"
      - "an Event of kind escape (signal escape_defect, R12) is appended; routing continues by the attributed Layer"
      - "metrics.py walks its CAUSED_BY chain to the root (escape chain depth / root layer); tune routes a fix_list entry to the Layer's skill"
  - trigger: "Gate g1 is rejected"
    effects:
      - "attribution derivation_error | rule_error is mandatory (refused otherwise)"
      - "Run.counters.world += 1; rule_error means the PSL changes before re-derivation, derivation_error re-derives on the same PSL"
  - trigger: "a Run is archived (advance archive; aidlc_state.py archive --to specs/<slug>)"
    effects:
      - "state.json, ledger.md, trace.jsonl and Run.artifacts are copied into the Archive with archive-manifest.json"
      - "retro (metrics.py) and tune (tune.py) read the Archive; tune emits harness proposals as diffs that a human merges (hill_climb loop_back into ai-dlc)"
  - trigger: "an executor records a choice at an ambiguity (aidlc_state.py note --kind interpretation|deviation|tradeoff|open_question)"
    effects:
      - "a Note row is appended to .aidlc/<slug>/notes.md (only ever appended)"
      - "before the next Gate, notes --for-gate <g> presents every row verbatim to the signer — no rewriting, no filtering"
      - "rows the signer promotes are written to .aidlc/learnings/project.md and compiled in at the NEXT init; open questions are never promoted"
    notes: "the second memory channel (ARCHITECTURE §10): the Ledger says which layer is sick, the diary says why we went that way"
  - trigger: "aidlc_state.py size derives a tier (--base / --from-issue --early)"
    effects:
      - "Run.intake.size + size_source are set; skips are granted only to derived / derived_early, never to default or manual"
      - "every stage the grid skips writes a SizeExemption ledger row with the why"
      - "never_skippable stages (the three Gates among them) stay regardless of tier"
    notes: "early sizing structurally cannot reach S (SZ-05 needs a file count), so it only pushes toward L or stays M"

# -----------------------------------------------------------------------------
# 9. Bounded contexts (Judgment 4)
# -----------------------------------------------------------------------------
bounded_contexts:
  current_context: "software delivery lifecycle (R2–R8 runtime + X2/X3/X4 declarations) — owns Run, Contract, WorkUnit, Gate, Event, Node, Loop"

  upstream_contexts:
    - name: "world (R0/R1: PSL, DOS proposal + as-is DOS, invariant cards)"
      provides: ["PSL-ID laws", "DOS objects and R00x rules", "invariant cards", "form-draft sha256"]
      translation_notes: "Run.world holds paths only; WorkUnit.dos_slice and the issue's Depends-on-DOS close against DOS objects/rules; Gate g1 attribution rule_error is the world-layer reflow; qanat 'Territory' = a DOS bounded context"
    - name: "requirement intake (GitHub issue + EARS spec.md)"
      provides: ["Issue (Intent / Track / Scope / Acceptance / Assumptions / Depends on DOS)", "Requirement REQ-ids", "assumption ledger rows"]
      translation_notes: "Run.issue keeps {number, url, kind}; Contract.based_on and acceptance[].req reference REQ-ids; the issue's Acceptance block is a Contract draft (issue-inline), never the Contract itself"
    - name: "GitHub delivery surface (PR, review threads, commits, tags)"
      provides: ["PR number / url / size class", "review comments as claims", "merge sha", "tags"]
      translation_notes: "Run.pr, Run.merge, Run.release hold slim refs; review_loop keeps its own EvidenceLog under .aidlc/pr-watch (Q005); merge and approve are human actions, not Gates"
    - name: "skill evaluation (skillwise gate.json)"
      provides: ["tier static_only", "fix_list"]
      translation_notes: "feeds R017; tune.py writes fix_list entries as its 'skill' delivery channel; skill-evolve (neighbour) reads them"

  downstream_contexts:
    - name: "acceptance evaluation (six review skills + meta-judge + acceptance-fleet; pr-review)"
      consumes: ["Contract thresholds / rules / constraints", "WorkUnit ac_ids", "spec-robustness.md", "ratchet-log iteration history"]
      translation_notes: "its Finding (severity P0–P3, tier A/B/C, confidence, vendor) and Verdict (PASS / BLOCK_MERGE / NEEDS_HUMAN → DONE / FIX / SPEC_DRIFT / GAMING_RISK) are not modelled here; they re-enter as Event signals (card_test_fail, pbt_fail_n3_consistent_with_req, impossible_under_contract, human_ac_pending) — the mapping lives only in each SKILL.md Wiring section (Q009)"
    - name: "learning (retro + tune)"
      consumes: ["Archive", "Events (escape chains, contract rework)", "EvidenceLog", "Loop / routing parameters"]
      translation_notes: "retro proposes changes to Contract / world (change proposals, PSL Open Questions); tune proposes Loop / routing parameter diffs and fix_list entries — both re-enter only through a human"

# -----------------------------------------------------------------------------
# 10. Agent guidelines
# -----------------------------------------------------------------------------
agent_guidelines:
  must:
    - "Name domain things with this file's words in cards' dos_slice and issues' Depends on DOS: the eight objects (Run, Contract, WorkUnit, Gate, Event, Node, Loop, RepoAsset), the compositions, or a `vocabulary` term (AC, Fingerprint, Finding …); a declared synonym closes, a rejected_names word (自动门) is flagged, a homonym (环, Tier) must be qualified; write 卡/Card only as a synonym in prose"
    - "Write only artifacts listed in your Node's writes; anything else is a whitelist overflow, stop and report"
    - "Record every failure through aidlc_state.py fail so it becomes an Event with a Layer and a fingerprint; never keep a private retry counter"
    - "Freeze the Contract (Gate g2) before splitting WorkUnits; change a locked file only with a change proposal in the same diff"
    - "Declare any new cycle in graph.yaml as a loop_back edge that names a Loop with stop.budget and a non-null stop.success"
    - "Run `aidlc_state.py repo --scope <package>` before the first Run in a repository: absent RepoAssets mean the closure was not checked, not that it passed (R018)"
  should:
    - "Prefer a new Event.kind over a new log file; the Trace is where why / impact are answered"
    - "Keep imported vocabulary (Territory, Run, MemoryAsset, R001/R002) in the 术语映射 tables, not in state or graph declarations"
    - "Use Node.role, not ring numbers, when grouping skills in data; the nine rings are a documentation view"
    - "Report enforced_by honestly: a script that flags is not a script that rejects"
  must_not:
    - "Do not introduce a second Contract schema or a second contract producer without conversion (R002; anti-pattern: three producers, two schemas)"
    - "Do not hand findings, verdicts, confidence or evaluator identity to an implementer Node — only fix_prompt / accepted_claim (R005)"
    - "Do not edit or delete a ledger.md row or a trace.jsonl line (R007)"
    - "Do not record a Gate verdict as a skill or agent, and do not let --autopilot sign one (R008)"
    - "Do not declare meets_done_when from an evaluator; compute it against Contract.thresholds (R010)"
    - "Do not report impossible_under_contract as an implementer (R012)"
    - "Do not add a cycle to graph.yaml without a loop_back edge and an owning Loop (R013; anti-pattern: unowned cycles)"
    - "Do not apply a tune proposal directly to routing.yaml, loops.yaml, pr-poll.sh or gate.json — emit a diff for a human PR (R016)"
    - "Do not describe a static_only skill as verified (R017)"
    - "Do not use 环 or Tier unqualified in new docs or data: say Ring (R0–R8 grouping) or Loop (loops.yaml contract), SizeTier (S/M/L) or CheckTier (A/B/C) — the closure refuses both bare words (anti-pattern: overloaded 环 / 门 / Tier)"
    - "Do not report an unevaluated check as a pass — exit 3, probed=false and unevaluated are recorded as unchecked (R018)"
    - "Do not place a RepoAsset under .aidlc/, leave it untracked, or set its path by hand — it is discovered, and an untracked ontology is yours, not the team's (R020)"

# -----------------------------------------------------------------------------
# 11. Anti-patterns (real history)
# -----------------------------------------------------------------------------
anti_patterns:
  - pattern: "Three producers, two schemas for the Contract (issue-inline AC v2 / donewhen-extract card / acceptance-spec done_when v1)"
    why_bad: "downstream consumers (/issue, /pr, lint_cards.py, spec-gaming-detector) could not agree on the shape; G2 froze different things depending on the path taken"
    correct_approach: "one Contract object with schema v2 as the only shape; v1 enters through convert_v1_to_v2.py; validate_done_when_v2.py compiled into advance g2; two-stage lock g2 / l5"
    historical_context: "2026-09-05 第二次整理 #1 (docs/design-notes.md). Residual: acceptance-spec still emits v1 (its gate.json fix_list 'upgrade done_when.yaml to the AC-first v2 shape') — Q008"
  - pattern: "Lifecycle stages with no owning Node (L4 plan hidden inside /ai-dlc; L6 implement, L8 delivery, X3 learning had no skill)"
    why_bad: "an artifact without a producer Node cannot be given a write scope or an isolation contract; the stage existed in the docs' ASCII but nowhere a lint could see"
    correct_approach: "one Node per stage's work: plan-cards (lint_cards.py moved in), implement (+ card-implementer agent), release (verify_release.py), retro (metrics.py); stage release added to ORDER"
    historical_context: "2026-09-05 第二次整理 #2 (docs/design-notes.md)"
  - pattern: "The execution graph lived in ARCHITECTURE.md ASCII while the stage chain was hard-coded in aidlc_state.py ORDER — two sources that could drift"
    why_bad: "no property of the graph (bounded writes, owned cycles, fix_prompt-only edges, resume bindings, fan-in merge) could be checked; docs and code disagreed silently"
    correct_approach: "graph.yaml as data, verify_graph.py five lints, aidlc_state.py graph check asserting ORDER == graph.yaml.stages; source of truth still to be decided (Q003)"
    historical_context: "docs/proposals/loop-graph-engineering.md §0 last row; implemented v0.6.0 (P1); ai-dlc gate.json fix_list keeps the source-of-truth decision open"
  - pattern: "Cycles without a Loop: the first graph.yaml closed two iterations (acceptance fan-in hand-back; fix-verifier → review-loop) with plain handoff edges"
    why_bad: "an unbounded cycle with an unmeasurable pass condition — exactly the production failure graph engineering names; no budget, no success predicate, no owner"
    correct_approach: "type the closing edge loop_back and name its Loop (acceptance_ratchet, review_loop); verify_graph lint 2 rejects the alternative"
    historical_context: "dogfooding finding, 2026-09-05 第三次整理 (docs/design-notes.md; ARCHITECTURE.md §3.7 '实测')"
  - pattern: "Six loops, six vocabularies (retries · rounds · strikes · iterations · MAX_ROUNDS · stale_count) with no common contract"
    why_bad: "nobody could answer 'which loop is burning budget and how much'; generator ≠ verifier and the stop condition were implicit per skill"
    correct_approach: "one Loop object (loops.yaml) with level / timescale / generator / verifier / stop four keys / memory / trigger; verify_loop.py; aidlc_state.py loops"
    historical_context: "docs/proposals/loop-graph-engineering.md §2.1 last row → 方案 B, v0.6.0"
  - pattern: "A flat ledger: ledger.md rows with no references between them; G1/G3 records, failure reports, change proposals, rejected fixes, review verdicts as isolated files"
    why_bad: "'why did AC-003 change' and 'why did the gate miss' were archaeology, not queries; the edge type IS the knowledge"
    correct_approach: "Event.refs with the closed edge set (caused_by, decided_by, supersedes, implements, references, depends_on, rejected_alternative) mirrored into trace.jsonl; trace.py why / impact; metrics from edges"
    historical_context: "docs/proposals/loop-graph-engineering.md §0 / 方案 F; adopted with `caused_by` instead of `caused` (design-notes 第三次整理)"
  - pattern: "Rules declared as system-enforced that the script only flagged or never checked (dos-extract must_not→anti-pattern trace; invariant-extract 'only guarantee'; calibrate mutation floor absent while alpha floor hard; donewhen-extract paired_with never resolved)"
    why_bad: "a rule with enforced_by: system that the verifier does not reject is a false guarantee — the exact reward-hacking hole (lower the line to pass) the skills forbid"
    correct_approach: "split the mechanical half (reject) from the semantic half (needs_semantic_review) in every verify_*.py and say which is which; add symmetric hard floors; resolve references, do not string-check them"
    historical_context: "eval/gate.json round-1 blockers, 2026-06-24 (dos-extract DE3, invariant-extract, calibrate HARD_MUTATION_FLOOR, donewhen-extract 纪律②); closed in round 2. This DOS keeps R001/R008/R010/R017 honest as user_workflow / not_enforced for the same reason"
  - pattern: "A settable boolean standing in for a verifier's verdict (cards.lint_passed, acceptance.meets_done_when, release.done, acceptance.evaluation_result checked only for non-emptiness)"
    why_bad: "advance is documented as 'checked against the state, not the model's claim' — but a flag the model sets IS the model's claim; only Gate g2 actually ran its verifier (validate_done_when_v2.py), every later stage trusted a string"
    correct_approach: "advance runs the verifier itself and records the outcome: implement runs lint_cards.py, pr reads final-state.json (DONE · no unevaluated review · meets_done_when.py met), archive reads the post-deploy line out of release.notes, implement / acceptance / pr / merge re-run lock_done_when.py verify; the flags leave SETTABLE"
    historical_context: "found 2026-09-12 while checking whether the pipeline is a closed loop; the same pass found the escape wire dead (no producer of escape Events, metrics.py reading only the Archive), card_retries enforced on the global layer counter instead of per WorkUnit, and the M-tier fleet subset granted by omission (R019)"
  - pattern: "Same word, different object across imported skills: qanat's G1/G2 (verify_g1 machine gate / review_g2 review gate) versus ai-dlc's G1/G2 (world adjudication / criteria freeze)"
    why_bad: "an imported SKILL.md read literally sends a reader to the wrong gate; 'R001/R002' and 'Territory/Run/MemoryAsset' likewise mean ai-dlc things under other names"
    correct_approach: "keep imported bodies verbatim but add a 术语映射 table per skill mapping each foreign term to a declared ai-dlc object or rule; never re-use G1/G2 for a machine gate"
    historical_context: "design-notes.md 直接收编 (qanat); 术语映射 tables in donewhen-extract / spec-compile / calibrate SKILL.md, 2026-09-05"
  - pattern: "Overloaded Chinese terms in the docs: 环 means both Ring (九环 R0–R8) and Loop (loops.yaml 七个环); 门 means both the human Gate and the mechanical pre-gate (自动门 / 预门 / 闸)"
    why_bad: "'每个圈必须归属一个环' and '九环与一根脊柱' use the same character for a cycle contract and a phase grouping; '自动门' invites reading a script check as a Gate a human could waive"
    correct_approach: "Ring = composition (Node.role grouping), Loop = object; Gate = human-signed verdict only, mechanical checks = edge guards; qualify 环 / 门 in new text"
    historical_context: "observed during this extraction (2026-09-05) in ARCHITECTURE.md §1/§3.2/§8 and README.md; not yet corrected — Q002"

  - pattern: "X1 declared as a cross-cutting stage in every document and enforced nowhere in code: absent from ORDER, absent from every prereqs() branch, and doctor only ever checked the toolchain"
    why_bad: |
      Three consumers degraded in silence and all three read like a pass: the issue closure fell back to the
      self-assessment it exists to beat («客观触发，不靠自评» became self-assessment), WorkUnit.dos_slice dropped
      to an info line, and verify_vocabulary returned exit 3. A cross-cutting stage nothing asks for is a
      cross-cutting stage nobody runs.
    correct_approach: |
      repo_assets.py discovers the artefacts and checks git tracking; sizing.yaml.repo_assets says how hard each
      tier and track asks for them; prereqs(issue) refuses on the required level and records a Waiver Event when
      forced. Closed v1.3.0 (2026-09-10) — see R018, R020.
  - pattern: "A pre-gate whose reject text points at a waiver the code never reads: verify_dos.py said «exceed only with a human waiver in decisions.md» and nothing parsed one"
    why_bad: |
      The only way past was to ignore a permanently red pre-gate, and a gate you can only pass by ignoring it is
      not a gate — it is training to skim past red. Same shape as R019 read backwards: an exemption that cannot
      be expressed is an exemption taken silently.
    correct_approach: |
      The `## Naming waivers` bullet convention already existed; `object_count` now uses it, and the waiver is
      reported under `waived` and flagged for the judge rather than clearing quietly (2026-09-10).

  - pattern: "A core model shipped as the whole ontology: 45 terms classified on 2026-09-05, 7 objects kept, the other ~38 (AC, 指纹, 层, 三档, 隐藏集, Finding, Verdict, PSL, Territory …) left in decisions.md prose; ARCHITECTURE.md §16 already defined 13 of them as a glossary and none were lifted as terms"
    why_bad: |
      Every downstream consumer (issue closure, WorkUnit.dos_slice, verify_vocabulary) resolves against this file, so a
      term that lives only in decisions.md is indistinguishable from one nobody extracted; the drift sensor dropped 205
      candidate terms as «uncorroborated» on the plugin's own docs because the ontology had no neighbour for them.
      The team's reading — «it extracts a sliver and aligns nothing» — was correct. Segregated-by-deletion, not Highlighted Core.
    correct_approach: |
      Two layers in one file: objects (≤7 + waiver) stay the napkin; every other classified term lands in `vocabulary`
      with kind / of / definition / synonyms / rejected_names, or as a composition synonym; verify_dos.py --terms measures
      coverage against the counted roster and names the unplaced. Closure resolves all three layers (dos-extract v0.11.0).
    historical_context: "found 2026-09-18 when the plugin's owner asked why the extracted DOS was «没什么用»; dos-extract v0.11.0, this DOS v0.4.0. Pattern 11 in references/anti_patterns.md"

# -----------------------------------------------------------------------------
# 12. Open questions
# -----------------------------------------------------------------------------
open_questions:
  - id: "Q001"
    question: "The canonical name of the task unit is 卡 / Card in every doc and in code (CARD-xx), but verify_dos.py rejects any object ending in `Card` as a UI suffix, so this DOS names it WorkUnit. Whitelist whole-word `Card` in the verifier, or adopt WorkUnit in docs and card_template.yaml?"
    raised_at: "2026-09-05"
    raised_by: "dos-extract --auto"
    owner: "XRenSiu"
    deadline: "2026-09-30"
    impact_if_unresolved: "cards' dos_slice and issues written by people will say Card and fail closure, or the DOS will drift from the team's word"
    candidates: ["add a whole-word exemption list to verify_dos.py UI_IMPL_SUFFIXES", "rename 卡 → 任务单元 / WorkUnit across docs + card_template.yaml", "keep both with a synonyms field the closure checks honour"]
  - id: "Q002"
    question: "环 names both the nine Rings (R0–R8 documentation grouping) and the six Loops (loops.yaml). graph.yaml carries Node.role (11 values) and no ring field. Retire Ring in favour of Node.role, add `ring:` to graph.yaml, or keep Ring as a docs-only view?"
    raised_at: "2026-09-05"
    raised_by: "dos-extract --auto"
    owner: "XRenSiu"
    deadline: "2026-09-30"
    impact_if_unresolved: "ARCHITECTURE.md §1 and graph.yaml can drift (they already disagree on gate/orchestrator vs 脊柱); '环契约' and '九环' stay ambiguous in Chinese"
    candidates: ["Ring := Node.role grouping (this DOS's reading), document the mapping in §8 术语", "add ring: R0..R8 to every non-stage node and lint it", "drop the ring numbering from docs"]
  - id: "Q003"
    question: "Which is the source of truth for the stage list — graph.yaml.stages or aidlc_state.py ORDER? P1 asserts equality (graph check); P2 was to decide (lean graph.yaml, advance reads it)."
    raised_at: "2026-09-05"
    raised_by: "ai-dlc gate.json fix_list (carried here)"
    owner: "XRenSiu"
    deadline: "2026-09-30"
    impact_if_unresolved: "two writable sources of the Run lifecycle; a stage added to one and not the other fails smoke instead of being impossible"
    candidates: ["graph.yaml is the source and aidlc_state.py loads ORDER from it", "ORDER stays and graph.yaml.stages is generated", "keep mutual assertion permanently"]
  - id: "Q004"
    question: "Docs say three Gates (G1/G2/G3); graph.yaml declares five human Nodes (human.g1/g2/g3/merge/harness-review) with sign/merge authority. Are merge and harness-review Gates (with a verdict record) or plain human Nodes?"
