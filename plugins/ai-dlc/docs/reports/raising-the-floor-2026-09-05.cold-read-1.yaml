worst_three:
  - n: 1
    why: "全文对「你」说话（按你的两个角度拆 / 你没提的第三个角度 / 你签字 / 你合并），但声明的读者是第一次听说这个插件的人，他没提过任何观察。读到第一句就得先解决「这份东西是写给谁的、我算不算收件人」，这个疑问在后面每个小标题上复发一次。"
  - n: 29
    why: "「还缺什么」这一节的入口段是一串全文从未定义的代号与缩写（L2、G1、meets_done_when、承重空槽），读者在最想跟上的地方掉队。同类问题在第 17 段最硬：那里的代号是句子主语，跳不过去；第 22 段的代号在括号里还能跳过。"
  - n: 37
    why: "标题承诺讲这份报告过了哪些门，实际讲的是另一个插件的内部 bug 修复清单与版本号。对一个在决定要不要上 sdlc 的人，这一整段与决定无关，且它占的是全文倒数第二个位置，本该是结论区。"
