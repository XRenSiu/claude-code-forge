one_sentence: "相信代码质量的人际差异主要来自三件事（动手前有没有可判真假的条件、实现者能看到什么、验收是不是非作者做），sdlc 已经把这三件编译成不跑就走不下去的机械门，但它自己从没被留出任务验证过、也没有结构性质量闸，这五条缺口该按序补。"
decision_at_paragraph: 2
