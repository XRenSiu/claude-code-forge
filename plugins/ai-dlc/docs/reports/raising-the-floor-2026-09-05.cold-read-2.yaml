worst_three:
  - n: 39
    why: "整份文档的最后一段留给了另一个插件的 bug 修复清单——factdiff、围栏、humanlint 指数全无解释，且指向的「文末工艺表」在文档里不存在。要决定上不上流程的读者，最后带走的是一段与决策无关的内部维护记录。"
  - n: 18
    why: "G1 在讲 G2 的段落里被回填出现。上一段讲建产品世界时只字未提 G1，读者读到「一共三道人签的门」会先怀疑自己漏读，再回头翻——而三道人签门恰恰是这套流程最需要人点头的成本项。"
  - n: 3
    why: "第 2 段刚承诺内部名字出现时先解释一句，紧接着的结论段就用「编译了、没验证」下了全文最重的指控，而「编译」在这里指什么始终没说。第 27 段的「TASK 轨」是同一个毛病的第二次发作。"
